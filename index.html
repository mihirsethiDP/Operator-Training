const doneSet = ()=> new Set(state.done);
function chapterProgress(ch){ const d=doneSet(); const n=ch.lessons.filter(l=>d.has(l.id)).length; return {n, total:ch.lessons.length, pct:Math.round(n/ch.lessons.length*100)} }
function langPicker(){ return `<div class="langpick"><span class="hint">${esc(t('choose'))} · ${esc(t('chooseHint'))}</span><div class="langgrid">${LANGS.map(l=>`<button class="btn lang${cur()===l.code?' on':''}" data-lang="${l.code}" lang="${l.code}">${esc(l.native)}</button>`).join('')}</div></div>` }
function goLibrary(){ Speech.stop(); state.phase='library'; state.chapter=-1; state.scene=-1; $('#player').hidden=true; $('#home').hidden=false; try{ history.replaceState(null,'',location.pathname+location.search) }catch(e){} renderLibrary(); window.scrollTo(0,0) }
function renderLibrary(){
 const h=$('#home');
 const hero = `<section class="hero"><div class="heroav">${SV.avatar()}</div><div class="herotxt"><p class="eyebrow">${esc(t('libSub'))}</p><h1>${esc(t('library'))}</h1><p class="lead">${esc(t('welcome'))} ${esc(t('voiceNote'))}</p>${langPicker()}<p class="hint">${esc(t('chooseChapter'))}</p></div></section>`;
 const cards = CHAPTERS.map((ch,i)=>{ const p=chapterProgress(ch); return `<button class="ccard${p.n===p.total?' done':''}" data-i="${i}"><span class="cnum">${esc(t('chapter'))} ${esc(ch.num)}</span><span class="cem em">${ch.em}</span><span class="cttl">${esc(L(ch.title))}</span><span class="csum">${esc(L(ch.summary))}</span><span class="cmeta"><span>${ch.lessons.length} ${esc(t('scenesN'))}</span><span class="cbar"><i style="width:${p.pct}%"></i></span><span>${p.n}/${p.total}</span></span></button>` }).join('');
 h.innerHTML = hero + `<section class="shelf"><h2>${esc(t('chapters'))}</h2><div class="cgrid">${cards}</div></section>`;
 $$('.lang',h).forEach(b=>b.onclick=()=>{ AudioBank.unlock(); setLang(b.dataset.lang); Speech.say(t('welcome'), cur()) });
 $$('.ccard',h).forEach(b=>b.onclick=()=>{ if(!state.lang) setLang('en'); openChapter(+b.dataset.i) });
}
function openChapter(i){ Speech.stop(); state.chapter=i; state.phase='chapter'; state.tab='learn'; renderChrome(); $('#player').hidden=true; $('#home').hidden=false; try{ history.replaceState(null,'','#'+CHAPTERS[i].id) }catch(e){} renderChapter(); window.scrollTo(0,0) }
function renderChapter(){
 const h=$('#home'); const ch=CH(); const d=doneSet(); const p=chapterProgress(ch);
 const head = `<section class="chead"><button class="btn ghost" id="btnLib">‹ ${esc(t('backLib'))}</button><div class="cheadrow"><span class="cem em big">${ch.em}</span><div><p class="eyebrow">${esc(t('chapter'))} ${esc(ch.num)}</p><h1>${esc(L(ch.title))}</h1><p class="lead">${esc(L(ch.summary))}</p></div></div><div class="startrow"><button class="btn primary big" id="btnStartAll">${esc(p.n>0&&p.n<p.total?t('cont'):t('start'))} ›</button><button class="btn ghost" id="btnLang2">🌐 ${esc(langInfo(cur()).native)}</button>${p.n>0?`<button class="btn ghost" id="btnReset">${esc(t('again'))}</button>`:''}</div><div class="prog"><div class="bar"><span style="width:${p.pct}%"></span></div><small>${esc(t('progress'))}: ${p.n} / ${p.total}${state.best[ch.id]!=null?` · ${esc(t('quiz'))}: ${state.best[ch.id]} / ${(ch.lessons[ch.lessons.length-1].questions||[]).length}`:''}</small></div></section>`;
 const group = cat => ch.lessons.map((l,i)=>({l,i})).filter(x=>x.l.cat===cat).map(x=>`<button class="scard${d.has(x.l.id)?' done':''}" data-i="${x.i}"><span class="num">${x.i+1}</span><span class="em">${x.l.em}</span><span class="ttl">${esc(L(x.l.title))}</span><span class="meta">${d.has(x.l.id)?'✓ '+esc(t('finished')):esc(t('dur'))}</span></button>`).join('');
 const sec = (cat)=>{ const g=group(cat); return g ? `<h2><span class="dot ${cat}"></span>${esc(t(cat))}</h2><div class="grid">${g}</div>` : '' };
 h.innerHTML = head + `<section class="map">${sec('field')}${sec('lab')}${sec('quiz')}</section>`;
 $('#btnLib').onclick=goLibrary;
 $('#btnStartAll').onclick=()=>{ const next=ch.lessons.findIndex(l=>!d.has(l.id)); openScene(next<0?0:next) };
 $('#btnLang2').onclick=()=>{ const i=LANGS.findIndex(l=>l.code===cur()); setLang(LANGS[(i+1)%LANGS.length].code) };
 const r=$('#btnReset'); if(r) r.onclick=()=>{ const ids=new Set(ch.lessons.map(l=>l.id)); state.done=state.done.filter(id=>!ids.has(id)); save('wt_done',state.done); delete state.best[ch.id]; save('wt_best',state.best); renderChapter() };
 $$('.scard',h).forEach(b=>b.onclick=()=>openScene(+b.dataset.i));
}
function markDone(id){ if(state.done.indexOf(id)<0){ state.done.push(id); save('wt_done',state.done) } }

/* ============ Player ============ */
function openScene(i){ Speech.stop(); AudioBank.unlock(); state.scene=i; state.line=0; state.phase='narr'; state.tab='learn'; renderChrome(); $('#home').hidden=true; $('#player').hidden=false; renderSceneHeader(); window.scrollTo(0,0);
 const ls=LS()[i]; setVisual(ls.lines[0].v); setCaption('…'); const token=++state.sayId;
 Promise.all([AudioBank.ready(cur(), 2500), Packs.load(cur())]).then(()=>{ if(token!==state.sayId || state.scene!==i) return; noticeVoice(); AudioBank.prefetch(cur(), sceneTexts(ls, cur())); playLine(0) }) }
function renderSceneHeader(){ const ls=LS()[state.scene]; $('#pcat').textContent=t(ls.cat); $('#pcat').className='chip '+ls.cat; $('#ptitle').textContent=`${ls.em} ${L(ls.title)}`; updateProgress() }
function updateProgress(){ const ls=LS()[state.scene]; const n=ls.lines.length; const steps = n + (ls.questions ? ls.questions.length : 1); let at = state.phase==='narr' ? state.line : state.phase==='act' ? n + (ls.questions ? state.q : 0) : steps; const dots = Array.from({length:steps},(_,k)=>`<i class="${k<at?'done':k===at?'now':''}${k>=n?' act':''}"></i>`).join(''); $('#pprog').innerHTML = `<span class="pnum">${esc(t('scene'))} ${state.scene+1} / ${LS().length}</span><span class="dots">${dots}</span>` }
function noticeVoice(){ const nt=$('#notice'); const l=cur(); if(state.sound && !Speech.hasVoice(l) && !state.noticed[l]){ nt.hidden=false; nt.innerHTML = `<div class="ntext"><b>${esc(t('noVoice').replace('{lang}', langInfo(l).name))}</b><span>${esc(t('noVoiceHow').replace(/\{lang\}/g, langInfo(l).name))}</span></div><button class="nclose" aria-label="Close">✕</button>`; $('.nclose',nt).onclick=()=>{ state.noticed[l]=true; nt.hidden=true } } else nt.hidden=true }
function setVisual(spec){ const st=$('#stage'); const fn = spec && SV[spec.k]; let html=''; try{ html = fn ? fn(spec) : '' }catch(e){ html='' } st.innerHTML = html; st.classList.remove('in'); void st.offsetWidth; st.classList.add('in') }
function setCaption(txt){ const c=$('#cap'); c.textContent=txt; c.classList.remove('in'); void c.offsetWidth; c.classList.add('in') }
function playLine(i){ const ls=LS()[state.scene]; const line=ls.lines[i]; state.line=i; state.phase='narr'; state.paused=false;
 $('#act').hidden=true; $('#done').hidden=true; $('#stage').hidden=false; setVisual(line.v || (i>0 ? ls.lines[i-1].v : null)); setCaption(L(line)); updateControls(); updateProgress();
 Speech.say(L(line), cur(), ()=>{ if(state.paused) return; if(i+1<ls.lines.length) playLine(i+1); else startActivity() });
}
function updateControls(){ const narr = state.phase==='narr'; const playing = narr && !state.paused; $('#icPlay').textContent = playing?'⏸':'▶'; $('#lblPlay').textContent = playing?t('pause'):t('play'); $('#btnSkip').hidden = !narr; $('#btnPlay').hidden = !narr; $('#btnReplay').hidden = state.phase==='done'; $('#btnBack').hidden = false }
function bindControls(){
 $('#btnHome').onclick=()=>openChapter(state.chapter);
 $('#btnBack').onclick=()=>{ if(state.phase==='narr' && state.line>0) playLine(state.line-1); else if(state.phase!=='narr'){ playLine(LS()[state.scene].lines.length-1) } else if(state.scene>0) openScene(state.scene-1); else openChapter(state.chapter) };
 $('#btnPlay').onclick=()=>{ if(state.phase!=='narr') return; if(!state.paused){ state.paused=true; Speech.stop(); updateControls() } else playLine(state.line) };
 $('#btnReplay').onclick=()=>{ if(state.phase==='narr') playLine(state.line); else if(state.phase==='act'){ const ls=LS()[state.scene]; const txt = ls.questions ? L(ls.questions[state.q].q) : L(ls.activity.prompt); Speech.say(txt, cur()) } };
 $('#btnSkip').onclick=()=>{ Speech.stop(); startActivity() };
 $('#tabLearn').onclick=()=>setTab('learn'); $('#tabScript').onclick=()=>setTab('script');
 $('#langTog').onclick=()=>{ const i=LANGS.findIndex(l=>l.code===cur()); setLang(LANGS[(i+1)%LANGS.length].code) };
 $('#sndTog').onclick=()=>{ state.sound=!state.sound; renderChrome(); if(!state.sound) Speech.stop(); else if(state.phase==='narr' && !state.paused) playLine(state.line) };
 document.addEventListener('visibilitychange',()=>{ if(document.hidden && state.phase==='narr'){ state.paused=true; Speech.stop(); updateControls() } });
 window.addEventListener('pagehide',()=>Speech.stop());
}

/* ============ Activities ============ */
function optIcon(o){ if(o.kind) return `<span class="ic">${SV.beaker(o.kind,{size:52})}</span>`; if(o.cyl) return `<span class="ic">${SV.cyl(o.cyl,86)}</span>`; return `<span class="ic em">${o.i||'•'}</span>` }
function optBtn(o,i,extra){ return `<button class="opt${extra||''}" data-i="${i}">${optIcon(o)}<span class="lb">${esc(L(o))}</span></button>` }
function feedback(ok, text, say){ const fb=$('#fb'); if(!fb) return; fb.hidden=false; fb.className='fb '+(ok?'good':'bad'); fb.textContent = text || (ok?t('correct'):t('wrong')); const spoken = say || fb.textContent; if(ok){ Speech.say(spoken, cur(), ()=>activityDone()) } else { Speech.say(spoken, cur()); setTimeout(()=>{ if(fb.classList.contains('bad')) fb.hidden=true }, 2500) } }
function singleChoice(act, body, opts){ $$('.opt',body).forEach(b=>b.onclick=()=>{ const o=opts[+b.dataset.i]; if(o.ok){ b.classList.add('right'); $$('.opt',body).forEach(x=>x.disabled=true); feedback(true) } else { b.classList.add('wrong'); b.disabled=true; feedback(false) } }) }
function safeExpr(expr, vars){ if(!/^[\sA-Za-z0-9_+\-*/().]+$/.test(expr)) return NaN; const names=Object.keys(vars); try{ return Function(...names, 'return ('+expr+')')(...names.map(n=>vars[n])) }catch(e){ return NaN } }
const ACT = {
 choice(act, body){ body.innerHTML = `<div class="opts">${act.options.map((o,i)=>optBtn(o,i)).join('')}</div>`; singleChoice(act, body, act.options) },
 multi(act, body){ body.innerHTML = `<p class="hint">${esc(t('tapAll'))}</p><div class="opts">${act.options.map((o,i)=>optBtn(o,i,' sel')).join('')}</div><div class="actbtns"><button class="btn primary" id="btnCheck">${esc(t('check'))}</button></div>`;
  $$('.opt',body).forEach(b=>b.onclick=()=>{ b.classList.toggle('on'); b.setAttribute('aria-pressed', b.classList.contains('on')?'true':'false') });
  $('#btnCheck',body).onclick=()=>{ let allOk=true; $$('.opt',body).forEach(b=>{ const o=act.options[+b.dataset.i]; const on=b.classList.contains('on'); b.classList.remove('right','wrong'); if(on&&o.ok) b.classList.add('right'); else if(on&&!o.ok){ b.classList.add('wrong'); allOk=false } else if(!on&&o.ok) allOk=false }); if(allOk){ $$('.opt',body).forEach(x=>x.disabled=true); $('#btnCheck',body).disabled=true; feedback(true, t('allRight')) } else feedback(false) } },
 classify(act, body){ const ans = act.items.map(()=>null); const isPh = act.items.every(it=>typeof it.val==='number');
  const vis = val => isPh ? SV.gauge({value:+val}) : `<div class="bigval">${esc(String(val))}</div>`;
  body.innerHTML = `<div class="gaugebox" id="gbox">${vis(act.items[0].val)}</div><div class="cls">${act.items.map((it,i)=>`<div class="clsrow" data-i="${i}"><button class="valbtn" data-i="${i}">${isPh?'pH ':''}${esc(String(it.val))}</button><div class="cats">${act.cats.map((c,j)=>`<button class="cat" data-i="${i}" data-j="${j}"><b>${esc(L(c))}</b><small>${esc(L(c.sub))}</small></button>`).join('')}</div></div>`).join('')}</div>`;
  $$('.valbtn',body).forEach(b=>b.onclick=()=>{ $('#gbox',body).innerHTML=vis(act.items[+b.dataset.i].val) });
  $$('.cat',body).forEach(b=>b.onclick=()=>{ const i=+b.dataset.i, j=+b.dataset.j; const it=act.items[i]; $('#gbox',body).innerHTML=vis(it.val); const row=b.closest('.clsrow'); $$('.cat',row).forEach(x=>x.classList.remove('on','right','wrong')); b.classList.add('on'); if(j===it.ans){ b.classList.add('right'); ans[i]=true; $$('.cat',row).forEach(x=>x.disabled=true); if(ans.every(Boolean)) feedback(true, t('allRight')); else Speech.say(t('correct'), cur()) } else { b.classList.add('wrong'); ans[i]=false; feedback(false) } }) },
 order(act, body){ const n=act.items.length; let next=0; const idx=shuffle(act.items.map((_,i)=>i));
  body.innerHTML = `<p class="hint">${esc(t('tapOrder'))}</p><div class="seq">${act.items.map((_,i)=>`<span class="slot" data-s="${i}">${i+1}</span>`).join('')}</div><div class="opts">${idx.map(i=>optBtn(act.items[i],i)).join('')}</div>`;
  $$('.opt',body).forEach(b=>b.onclick=()=>{ const i=+b.dataset.i; if(i===next){ b.classList.add('right'); b.disabled=true; const slot=$(`.slot[data-s="${next}"]`,body); slot.classList.add('filled'); slot.innerHTML=`<span class="em">${act.items[i].i||'✓'}</span>`; next++; if(next===n) feedback(true, t('allRight')); else Speech.say(t('correct'), cur()) } else { b.classList.add('wrong'); setTimeout(()=>b.classList.remove('wrong'),600); feedback(false) } }) },
 match(act, body){ const n=act.pairs.length; const rIdx=shuffle(act.pairs.map((_,i)=>i)); let sel=null, done=0;
  body.innerHTML = `<p class="hint">${esc(t('tapPair'))}</p><div class="matchgrid"><div class="col">${act.pairs.map((p,i)=>`<button class="opt m" data-side="l" data-i="${i}"><span class="ic em">${p.l.i||''}</span><span class="lb">${esc(L(p.l))}</span></button>`).join('')}</div><div class="col">${rIdx.map(i=>`<button class="opt m" data-side="r" data-i="${i}"><span class="ic em">${act.pairs[i].r.i||''}</span><span class="lb">${esc(L(act.pairs[i].r))}</span></button>`).join('')}</div></div>`;
  $$('.opt',body).forEach(b=>b.onclick=()=>{ if(b.dataset.side==='l'){ $$('.opt[data-side="l"]',body).forEach(x=>x.classList.remove('on')); b.classList.add('on'); sel=+b.dataset.i; return } if(sel===null){ Speech.say(t('tapPair'), cur()); return } const i=+b.dataset.i; const lb=$(`.opt[data-side="l"][data-i="${sel}"]`,body); if(i===sel){ b.classList.add('right'); b.disabled=true; lb.classList.remove('on'); lb.classList.add('right'); lb.disabled=true; sel=null; done++; if(done===n) feedback(true, t('allRight')); else Speech.say(t('correct'), cur()) } else { b.classList.add('wrong'); setTimeout(()=>b.classList.remove('wrong'),600); feedback(false) } }) },
 calc(act, body){ const F={ tss:v=>(v.w2-v.w1)*1000/v.vol, bod:v=>(v.do1-v.do2)*v.df };
  body.innerHTML = `<div class="calc">${act.fields.map(f=>`<label class="field"><span>${esc(L(f.label))}</span><input type="number" inputmode="decimal" id="f_${f.id}" value="${f.val}" step="${f.step||'any'}"></label>`).join('')}<div class="actbtns"><button class="btn primary" id="btnCalc">🧮 ${esc(t('calc'))}</button></div><div class="calcout" id="calcout" hidden></div><p class="hint">${esc(t('tryNumbers'))}</p></div>`;
  let first=true;
  $('#btnCalc',body).onclick=()=>{ const v={}; let bad=false; act.fields.forEach(f=>{ const x=parseFloat($('#f_'+f.id,body).value); if(!isFinite(x)) bad=true; v[f.id]=x }); if(bad) return; const r = act.expr ? safeExpr(act.expr, v) : (F[act.fn] ? F[act.fn](v) : NaN); if(!isFinite(r)) return; const val=Math.round(r*10)/10; const out=$('#calcout',body); out.hidden=false; out.innerHTML=`<span class="res">${esc(act.name)} = ${val} ${esc(act.unit||'')}</span>`; if(first){ first=false; feedback(true, `${act.name} = ${val} ${act.unit||''}`, t('correct')) } else Speech.say(t('correct'), cur()) } },
 slider(act, body){ body.innerHTML = `<div class="sliderbox"><div id="tankbox">${SV.tank({value:2.2,range:true})}</div><label class="rng"><span>${esc(t('moveSlider'))}</span><input type="range" id="dorng" min="0" max="5" step="0.1" value="2.2" aria-label="DO"></label></div><div class="opts">${act.options.map((o,i)=>optBtn(o,i)).join('')}</div>`;
  $('#dorng',body).oninput=e=>{ $('#tankbox',body).innerHTML=SV.tank({value:+e.target.value,range:true}) }; singleChoice(act, body, act.options) },
 settle(act, body){ body.innerHTML = `<div class="settlebox"><div class="cylbig" id="cylbig">${SV.cyl({sludge:1,mixed:true},210)}</div><div class="timer" id="stimer">0 ${esc(t('minutes'))}</div><div class="actbtns"><button class="btn primary" id="btnStart">▶ ${esc(t('startTest'))}</button></div></div><div class="opts" id="settleopts" hidden>${act.options.map((o,i)=>optBtn(o,i)).join('')}</div>`;
  $('#btnStart',body).onclick=()=>{ const btn=$('#btnStart',body); btn.disabled=true; Speech.say(t('watching'), cur()); const t0=performance.now(), dur=5000; const box=$('#cylbig',body); const tm=$('#stimer',body);
   const tick=()=>{ const p=Math.min(1,(performance.now()-t0)/dur); const e=1-Math.pow(1-p,2); const sl=1-0.7*e; box.innerHTML=SV.cyl({sludge:sl},210); tm.textContent=`${Math.round(p*30)} ${t('minutes')}`; if(p<1) requestAnimationFrame(tick); else { $('#settleopts',body).hidden=false; btn.parentNode.hidden=true; Speech.say(L(act.prompt), cur()) } };
   requestAnimationFrame(tick) };
  singleChoice(act, $('#settleopts',body), act.options) },
 spot(act, body){ body.innerHTML = `<p class="hint">${esc(t('tapOil'))}</p><div class="spotbox">${SV.oil({spot:true})}</div>`;
  $$('.hot',body).forEach(h=>h.addEventListener('click',()=>{ if(h.dataset.ok==='1'){ h.classList.add('right'); $$('.hot',body).forEach(x=>x.style.pointerEvents='none'); feedback(true) } else { h.classList.add('wrong'); setTimeout(()=>h.classList.remove('wrong'),600); feedback(false) } })) }
};
function startActivity(){ const ls=LS()[state.scene]; state.phase='act'; state.paused=false; if(ls.questions){ startQuiz(); return }
 const act=ls.activity; const box=$('#act'); box.hidden=false; $('#stage').hidden=true; $('#done').hidden=true;
 if(!act || !ACT[act.type]){ activityDone(); return }
 box.innerHTML = `<div class="acthead"><span class="chip turn">✋ ${esc(t('yourTurn'))}</span><h3>${esc(L(act.prompt))}</h3></div><div class="actbody" id="actbody"></div><div class="fb" id="fb" hidden></div>`;
 setCaption(L(act.prompt)); try{ ACT[act.type](act, $('#actbody',box)) }catch(e){ activityDone(); return } updateControls(); updateProgress(); Speech.say(L(act.prompt), cur());
}
function nextLabel(){ return state.scene+1 < LS().length ? t('next') : t('backLib') }
function nextScene(){ if(state.scene+1 < LS().length) openScene(state.scene+1); else openChapter(state.chapter) }
function activityDone(){ const ls=LS()[state.scene]; state.phase='done'; markDone(ls.id); const d=$('#done'); d.hidden=false; $('#act').hidden=true;
 const rem = ls.remember ? L(ls.remember) : '';
 d.innerHTML = `${rem?`<div class="rem"><span class="chip rem">💡 ${esc(t('remember'))}</span><p>${esc(rem)}</p></div>`:''}<div class="donebtns"><span class="chip ok">✓ ${esc(t('sceneDone'))}</span><button class="btn primary big" id="btnNext">${esc(nextLabel())} ›</button></div>`;
 $('#btnNext').onclick=nextScene; if(rem) setCaption(rem); updateControls(); updateProgress(); if(rem) Speech.say(rem, cur());
}
/* ---- quiz ---- */
function startQuiz(){ state.q=0; state.scoreN=0; state.phase='act'; renderQ() }
function renderQ(){ const ls=LS()[state.scene]; const n=ls.questions.length; if(state.q>=n){ quizEnd(); return } const q=ls.questions[state.q]; const box=$('#act'); box.hidden=false; $('#stage').hidden=true; $('#done').hidden=true;
 box.innerHTML = `<div class="acthead"><span class="chip turn">${esc(t('question'))} ${state.q+1} / ${n}</span><h3>${esc(L(q.q))}</h3></div><div class="actbody"><div class="opts">${q.o.map((o,i)=>optBtn(o,i)).join('')}</div></div><div class="fb" id="fb" hidden></div>`;
 let answered=false;
 $$('.opt',box).forEach(b=>b.onclick=()=>{ if(answered) return; answered=true; const o=q.o[+b.dataset.i]; $$('.opt',box).forEach(x=>x.disabled=true); if(o.ok){ b.classList.add('right'); state.scoreN++ } else { b.classList.add('wrong'); const r=q.o.findIndex(x=>x.ok); if(r>=0) $$('.opt',box)[r].classList.add('right') } const fb=$('#fb',box); fb.hidden=false; fb.className='fb '+(o.ok?'good':'bad'); fb.textContent=o.ok?t('correct'):t('wrong'); Speech.say(fb.textContent, cur(), ()=>{ state.q++; renderQ() }) });
 setCaption(L(q.q)); updateControls(); updateProgress(); Speech.say(L(q.q), cur());
}
function quizEnd(){ const ch=CH(); const ls=LS()[state.scene]; const n=ls.questions.length; const s=state.scoreN; const pass = s>=Math.ceil(n*0.7); if(state.best[ch.id]==null || s>state.best[ch.id]){ state.best[ch.id]=s; save('wt_best',state.best) } markDone(ls.id); state.phase='done';
 const d=$('#done'); $('#act').hidden=true; $('#stage').hidden=true; d.hidden=false; let date=''; try{ date=new Date().toLocaleDateString(langInfo(cur()).tts,{day:'2-digit',month:'short',year:'numeric'}) }catch(e){ date=new Date().toDateString() }
 d.innerHTML = `<div class="result ${pass?'pass':'fail'}"><span class="big">${pass?'🏅':'💪'}</span><div class="scoreline">${esc(t('score'))}: <b>${s} / ${n}</b></div><h3>${esc(pass?t('badge'):t('fail'))}</h3><p class="hint">${esc(t('chapter'))} ${esc(ch.num)} · ${esc(L(ch.title))}</p>${pass?`<p class="cert">${esc(t('showSup'))}<br><small>${esc(t('date'))}: ${esc(date)}</small></p>`:''}<div class="donebtns"><button class="btn" id="btnRetry">↻ ${esc(t('retryQuiz'))}</button><button class="btn primary" id="btnHome2">${esc(t('backLib'))} ›</button></div></div>`;
 $('#btnRetry').onclick=startQuiz; $('#btnHome2').onclick=goLibrary; const scoreSay = cur()==='hi' ? `${n} में से ${s}` : `${s} / ${n}`; setCaption(`${pass?t('pass'):t('fail')} ${t('score')}: ${scoreSay}`); updateControls(); updateProgress(); Speech.say(pass?t('pass'):t('fail'), cur());
}

/* ============ Production script tab ============ */
const ACTNAME = {order:'tap the steps in order',multi:'tap all that apply',choice:'tap the right answer',classify:'sort readings into Low / OK / High',slider:'explore the DO slider, then answer',settle:'run the settling animation, then pick a cylinder',match:'match observation to action',calc:'enter numbers and calculate',spot:'tap the oil on the tank image'};
function scriptText(ch, lang){ const out=[]; const X = s => (typeof s==='string') ? s : (s[lang]!==undefined ? s[lang] : (Packs.tr(lang, s.en) || s.en)); out.push(`CHAPTER ${ch.num} — ${X(ch.title)}`); ch.lessons.forEach((l,i)=>{ out.push(`SCENE ${i+1} — ${X(l.title)} [${UI.en[l.cat]}]`); l.lines.forEach((ln,j)=>{ out.push(`  ${i+1}.${j+1}  VISUAL: ${ln.shot||''}`); out.push(`       SAY: ${X(ln)}`) }); if(l.questions){ out.push(`  CHECKPOINT (quiz):`); l.questions.forEach(q=>out.push(`       Q: ${X(q.q)}  →  ${q.o.filter(o=>o.ok).map(o=>X(o)).join(', ')}`)) } else if(l.activity){ out.push(`  CHECKPOINT (${ACTNAME[l.activity.type]||l.activity.type}): ${X(l.activity.prompt)}`) } if(l.remember) out.push(`  REMEMBER CARD: ${X(l.remember)}`); out.push('') }); return out.join('\n') }
function renderScript(){ const s=$('#script'); const ci = Math.max(0, Math.min(CHAPTERS.length-1, state.scriptCh)); const ch=CHAPTERS[ci]; const other = (cur()!=='en' && cur()!=='hi') ? cur() : null;
 const card = (title, icon, items) => `<div class="bcard"><h3><span class="em">${icon}</span>${esc(title)}</h3><ul>${items.map(x=>`<li>${esc(x)}</li>`).join('')}</ul></div>`;
 const pipeline = `<div class="pipeline"><div class="pstep"><span class="em">🧠</span><b>Claude</b><small>Script, visuals, checkpoints, translations, this module</small></div><span class="parrow">›</span><div class="pstep"><span class="em">🗣️</span><b>Voice (Sarvam Bulbul v3, "ritu")</b><small>Every line recorded per language</small></div><span class="parrow">›</span><div class="pstep"><span class="em">🧑‍🔧</span><b>Avatar agent</b><small>Renders Ritu per shot to the recorded track</small></div><span class="parrow">›</span><div class="pstep"><span class="em">📱</span><b>Delivery</b><small>GitHub Pages, LMS, WhatsApp, toolbox talk</small></div></div>`;
 const chsel = `<div class="chsel">${CHAPTERS.map((c,i)=>`<button class="btn${i===ci?' primary':''}" data-i="${i}">${esc(t('chapter'))} ${esc(c.num)}</button>`).join('')}</div>`;
 const tr = (s)=> other ? (Packs.tr(other, s.en) || '') : '';
 const rows = ch.lessons.map((l,i)=>{ const shots=l.lines.map((ln,j)=>`<tr><td class="n">${i+1}.${j+1}</td><td class="shot">${esc(ln.shot||'')}</td><td class="en">${esc(ln.en)}</td><td class="hi">${esc(ln.hi)}</td>${other?`<td class="hi">${esc(tr(ln))}</td>`:''}</tr>`).join('');
  const cp = l.questions ? `<tr class="cp"><td class="n">✋</td><td class="shot">Checkpoint: quiz, ${l.questions.length} questions, 70% to pass</td><td class="en">${l.questions.map(q=>esc(q.q.en)).join('<br>')}</td><td class="hi">${l.questions.map(q=>esc(q.q.hi)).join('<br>')}</td>${other?`<td class="hi">${l.questions.map(q=>esc(tr(q.q))).join('<br>')}</td>`:''}</tr>` : (l.activity ? `<tr class="cp"><td class="n">✋</td><td class="shot">Checkpoint: ${esc(ACTNAME[l.activity.type]||l.activity.type)}</td><td class="en">${esc(l.activity.prompt.en)}</td><td class="hi">${esc(l.activity.prompt.hi)}</td>${other?`<td class="hi">${esc(tr(l.activity.prompt))}</td>`:''}</tr>` : '');
  const rem = l.remember ? `<tr class="rem"><td class="n">💡</td><td class="shot">Remember card, end slate, 3 s</td><td class="en">${esc(l.remember.en)}</td><td class="hi">${esc(l.remember.hi)}</td>${other?`<td class="hi">${esc(tr(l.remember))}</td>`:''}</tr>` : '';
  const words = l.lines.reduce((a,ln)=>a+ln.en.split(/\s+/).length,0); const secs = Math.round(words/110*60);
  return `<details class="sc"${i===0?' open':''}><summary><span class="num">${i+1}</span><span class="em">${l.em}</span><span class="ttl">${esc(l.title.en)} <span class="hiTtl">· ${esc(l.title.hi)}</span></span><span class="tag ${l.cat}">${esc(UI.en[l.cat])}</span><span class="dur">${l.lines.length} shots · ~${secs} s narration</span></summary><div class="tw"><table><thead><tr><th>Shot</th><th>Visual / B-roll for the avatar agent</th><th>Narration · English</th><th>Narration · हिंदी (timing master)</th>${other?`<th>Narration · ${esc(langInfo(other).native)}</th>`:''}</tr></thead><tbody>${shots}${cp}${rem}</tbody></table></div></details>` }).join('');
 s.innerHTML = `<section class="brief"><div class="briefhead"><p class="eyebrow">Production pack</p><h1>Avatar video scripts and localization brief</h1><p class="lead">Every scene below is what the Learn tab plays. Hand the shot list to the avatar agent and reuse the recorded Ritu tracks as the voice. Translations for the other nine languages are in the i18n packs and shown here when that language is selected.</p></div>${pipeline}<div class="bgrid">${card('Avatar agent brief','🧑‍🔧',BRIEF.avatar)}${card('Localization agent brief','🌐',BRIEF.localization)}${card('Running it on site','🏭',BRIEF.onsite)}</div></section><section class="scenes"><div class="scenehead"><h2>${esc(t('scriptFor'))} ${esc(t('chapter'))} ${esc(ch.num)} · ${esc(ch.title.en)}</h2><div class="copybtns"><button class="btn" id="cpEn">⧉ ${esc(UI.en.copyEn)}</button><button class="btn" id="cpHi">⧉ ${esc(UI.en.copyHi)}</button>${other?`<button class="btn" id="cpOther">⧉ Copy ${esc(langInfo(other).name)}</button>`:''}</div></div>${chsel}<div id="cpmsg" class="hint" hidden></div><textarea id="cpfallback" class="cpfallback" hidden readonly></textarea>${rows}</section>`;
 $$('.chsel .btn',s).forEach(b=>b.onclick=()=>{ state.scriptCh=+b.dataset.i; renderScript(); window.scrollTo(0, $('.scenes').offsetTop-80) });
 const doCopy = lang => { const txt=scriptText(ch, lang); const msg=$('#cpmsg'); const fb=$('#cpfallback'); const ok=()=>{ msg.hidden=false; msg.textContent=UI.en.copied; fb.hidden=true; setTimeout(()=>{ msg.hidden=true },2500) }; const fail=()=>{ msg.hidden=false; msg.textContent=UI.en.fallbackCopy; fb.hidden=false; fb.value=txt; fb.focus(); fb.select() }; try{ if(navigator.clipboard && navigator.clipboard.writeText){ navigator.clipboard.writeText(txt).then(ok, fail) } else fail() }catch(e){ fail() } };
 $('#cpEn').onclick=()=>doCopy('en'); $('#cpHi').onclick=()=>doCopy('hi'); const co=$('#cpOther'); if(co) co.onclick=()=>doCopy(other);
}

/* ============ Init ============ */
function init(){ Speech.init(); AudioBank.init(); $$('.avwrap').forEach(a=>{ a.innerHTML=SV.avatar() }); renderChrome(); bindControls();
 ['touchend','click'].forEach(ev=>document.addEventListener(ev, ()=>AudioBank.unlock(), {once:true, capture:true}));
 const start = ()=>{ const h=(location.hash||'').replace('#',''); const ci=CHAPTERS.findIndex(c=>c.id===h); if(ci>=0){ state.chapter=ci; state.phase='chapter'; renderChapter() } else renderLibrary() };
 if(state.lang && !Packs.has(state.lang)){ Packs.load(state.lang).then(start) } else start();
 window.addEventListener('hashchange',()=>{ const h=(location.hash||'').replace('#',''); const ci=CHAPTERS.findIndex(c=>c.id===h); if(ci>=0 && ci!==state.chapter) openChapter(ci); else if(!h && state.phase!=='library') goLibrary() });
}
if(document.readyState==='loading') document.addEventListener('DOMContentLoaded', init); else init();
})();

</script>
</body></html>

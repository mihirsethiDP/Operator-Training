/* 3 ─ Oil and grease chamber and trap */
{id:'ch2-oil',cat:'field',em:'🛢️',title:{en:'Oil and grease trap: clean trap, clean plant',hi:'ऑयल एंड ग्रीस ट्रैप: साफ़ ट्रैप, साफ़ प्लांट'},
 lines:[
  {v:{k:'board',items:[{i:'🛢️',en:'Floating oil',hi:'तैरता तेल'},{i:'🟡',en:'Fat',hi:'फ़ैट'},{i:'🟤',en:'Grease',hi:'ग्रीस'},{i:'🚫',en:'Not into biological tank',hi:'बायोलॉजिकल टैंक में नहीं',bad:true}]},shot:'Oil and grease trap with a yellow floating layer; red cross on the aeration tank behind it.',en:'The oil and grease trap removes floating oil, fat and grease from wastewater. Oil and grease must be removed before they enter the biological tank.',hi:'ऑयल एंड ग्रीस ट्रैप वेस्टवॉटर से तैरता तेल, फ़ैट और ग्रीस हटाता है। तेल और ग्रीस को बायोलॉजिकल टैंक में जाने से पहले हटाना ज़रूरी है।'},
  {v:{k:'board',items:[{i:'🍳',en:'Kitchen',hi:'किचन'},{i:'🍽️',en:'Canteen',hi:'कैंटीन'},{i:'🏨',en:'Hotel',hi:'होटल'},{i:'🍔',en:'Food court',hi:'फ़ूड कोर्ट'},{i:'🏢',en:'Commercial building',hi:'कमर्शियल बिल्डिंग'},{i:'🏥',en:'Hospital kitchen',hi:'हॉस्पिटल किचन'}]},shot:'Six source buildings with drain pipes leading to the trap.',en:'The trap is mainly important where wastewater comes from a kitchen, canteen, hotel, food court, commercial building, or hospital kitchen.',hi:'यह ट्रैप वहाँ ज़्यादा ज़रूरी है जहाँ वेस्टवॉटर किचन, कैंटीन, होटल, फ़ूड कोर्ट, कमर्शियल बिल्डिंग, या हॉस्पिटल किचन से आता है।'},
  {v:{k:'cards',items:[{i:'🛢️',title:{en:'Top: oil and grease',hi:'ऊपर: तेल और ग्रीस'},en:'Floating',hi:'तैरता हुआ',tone:'warn'},{i:'💧',title:{en:'Middle: wastewater',hi:'बीच में: वेस्टवॉटर'},en:'Flows to the outlet',hi:'आउटलेट की ओर बहता है',tone:'ok'},{i:'🟤',title:{en:'Bottom: sludge',hi:'नीचे: स्लज'},en:'Settled',hi:'बैठा हुआ',tone:'warn'}]},shot:'Cutaway of the trap: yellow oil layer on top, grey wastewater in the middle, brown sludge at the bottom, inlet and outlet pipes.',en:'Inside the trap, oil and grease float on top. Wastewater stays in the middle and flows to the outlet. Sludge settles at the bottom.',hi:'ट्रैप के अंदर तेल और ग्रीस ऊपर तैरते हैं। वेस्टवॉटर बीच में रहता है और आउटलेट की ओर जाता है। स्लज नीचे बैठ जाता है।'},
  {v:{k:'board',items:[{i:'🛢️',en:'Floating oil layer',hi:'तैरती तेल की परत'},{i:'🧼',en:'Sticky scum',hi:'चिपचिपा झाग'},{i:'🟤',en:'Grease deposit',hi:'ग्रीस का जमाव'},{i:'👃',en:'Bad smell',hi:'बदबू'},{i:'⚠️',en:'Slippery surface',hi:'फिसलन वाली सतह'},{i:'🧺',en:'Trap cleaning condition',hi:'ट्रैप की सफ़ाई की हालत'}]},shot:'Six check icons; slippery floor sign near the trap.',en:'What to check: floating oil layer, sticky scum, grease deposit, bad smell, slippery surface, and the trap cleaning condition.',hi:'क्या चेक करें: तैरती तेल की परत, चिपचिपा झाग, ग्रीस का जमाव, बदबू, फिसलन वाली सतह, और ट्रैप की सफ़ाई की हालत।'},
  {v:{k:'cards',items:[{i:'🛢️',title:{en:'Oil layer on water',hi:'पानी पर तेल की परत'},en:'Trap not cleaned: remove floating grease',hi:'ट्रैप साफ़ नहीं: तैरता ग्रीस हटाएँ',tone:'bad'},{i:'👃',title:{en:'Bad smell',hi:'बदबू'},en:'Grease decomposition: clean the trap',hi:'ग्रीस सड़ रहा है: ट्रैप साफ़ करें',tone:'warn'}]},shot:'Operator skims floating grease with a scoop; then cleans the trap.',en:'Oil layer on the water? The trap is not cleaned. Remove the floating grease. Bad smell? The grease is decomposing. Clean the trap.',hi:'पानी पर तेल की परत? ट्रैप साफ़ नहीं हुआ। तैरता ग्रीस हटाएँ। बदबू? ग्रीस सड़ रहा है। ट्रैप साफ़ करें।'},
  {v:{k:'cards',items:[{i:'🫧',title:{en:'Biological treatment poor',hi:'बायोलॉजिकल ट्रीटमेंट खराब'},en:'Oil entering aeration tank: check trap and inlet source',hi:'तेल एरेशन टैंक में जा रहा है: ट्रैप और इनलेट सोर्स चेक करें',tone:'bad'},{i:'🔩',title:{en:'Pipe choking',hi:'पाइप चोकिंग'},en:'Grease deposit: clean pipeline and trap',hi:'ग्रीस जमा: पाइपलाइन और ट्रैप साफ़ करें',tone:'bad'}]},shot:'Oil sheen on the aeration tank; magnifier over the trap and inlet pipe; grease-choked pipe being cleaned.',en:'Biological treatment poor? Oil is entering the aeration tank. Check the trap and the inlet source. Pipe choking? Grease has deposited. Clean the pipeline and the trap.',hi:'बायोलॉजिकल ट्रीटमेंट खराब? तेल एरेशन टैंक में जा रहा है। ट्रैप और इनलेट सोर्स चेक करें। पाइप चोक? ग्रीस जम गया है। पाइपलाइन और ट्रैप साफ़ करें।'},
  {v:{k:'cards',items:[{i:'🚫',title:{en:'Operator rule',hi:'ऑपरेटर नियम'},en:'Oil in the biological tank: bad smell, poor treatment, serious problems',hi:'बायोलॉजिकल टैंक में तेल: बदबू, खराब ट्रीटमेंट, गंभीर समस्या',tone:'bad'}]},shot:'Red cross over oil entering the aeration tank; stink lines and cloudy water.',en:'If oil and grease enter the biological tank, it causes bad smell, poor treatment and serious problems in the plant.',hi:'अगर तेल और ग्रीस बायोलॉजिकल टैंक में चले जाएँ, तो बदबू, खराब ट्रीटमेंट और प्लांट में गंभीर समस्या होती है।'},
  {v:{k:'board',items:[{i:'🧺',en:'Keep trap clean and in good condition',hi:'ट्रैप साफ़ और अच्छी हालत में',ok:true},{i:'🔍',en:'Check regularly, act early',hi:'नियमित चेक, जल्दी एक्शन',ok:true}]},shot:'Operator cleans the trap; calendar with regular check marks.',en:'So keep the trap clean and in good condition. Check it regularly and act before problems occur.',hi:'इसलिए ट्रैप साफ़ और अच्छी हालत में रखें। नियमित चेक करें और समस्या से पहले एक्शन लें।'},
  {v:{k:'board',items:[{i:'🧹',en:'Good housekeeping',hi:'अच्छी हाउसकीपिंग',ok:true},{i:'🧺',en:'Proper waste disposal',hi:'सही कचरा निपटान',ok:true}]},shot:'Tidy trap area, waste bin closed, floor clean and dry.',en:'Good housekeeping and proper waste disposal are important.',hi:'अच्छी हाउसकीपिंग और सही कचरा निपटान ज़रूरी है।'}],
 activity:{type:'match',prompt:{en:'Match the problem with the operator action.',hi:'समस्या को सही ऑपरेटर एक्शन से जोड़ें।'},pairs:[{l:{i:'🛢️',en:'Oil layer on water',hi:'पानी पर तेल की परत'},r:{i:'🥄',en:'Remove floating grease',hi:'तैरता ग्रीस हटाएँ'}},{l:{i:'🫧',en:'Biological treatment poor',hi:'बायोलॉजिकल ट्रीटमेंट खराब'},r:{i:'🔍',en:'Check trap and inlet source',hi:'ट्रैप और इनलेट सोर्स चेक करें'}},{l:{i:'🔩',en:'Pipe choking',hi:'पाइप चोकिंग'},r:{i:'🧹',en:'Clean pipeline and trap',hi:'पाइपलाइन और ट्रैप साफ़ करें'}}]},
 remember:{en:'Keep the trap clean. No oil and grease into the biological tank.',hi:'ट्रैप साफ़ रखो। तेल और ग्रीस बायोलॉजिकल टैंक में नहीं जाना चाहिए।'}},

/* 4 ─ Equalisation tank */
{id:'ch2-eq',cat:'field',em:'🔄',title:{en:'Equalisation tank: stable tank, stable plant',hi:'इक्वलाइज़ेशन टैंक: स्थिर टैंक, स्थिर प्लांट'},
 lines:[
  {v:{k:'board',items:[{i:'🫧',en:'Collects wastewater',hi:'वेस्टवॉटर इकट्ठा करता है'},{i:'⚖️',en:'Balanced flow',hi:'बैलेंस फ्लो',ok:true}]},shot:'Wide shot of the EQ tank between the grease chamber and the aeration tank; level steady.',en:'The equalisation tank, also called the collection tank, collects wastewater and balances the flow before the main treatment.',hi:'इक्वलाइज़ेशन टैंक, यानी कलेक्शन टैंक, वेस्टवॉटर इकट्ठा करता है और मेन ट्रीटमेंट से पहले फ्लो को बैलेंस करता है।'},
  {v:{k:'board',items:[{i:'📈',en:'High flow',hi:'ज़्यादा फ्लो'},{i:'📉',en:'Low flow',hi:'कम फ्लो'}]},shot:'Clock runs through the day; inlet flow rises and falls while the tank evens it out.',en:'Wastewater does not come equally through the day. Sometimes flow is high, sometimes low.',hi:'वेस्टवॉटर दिन भर बराबर नहीं आता। कभी फ्लो ज़्यादा, कभी कम।'},
  {v:{k:'board',items:[{i:'🔄',en:'Stable flow',hi:'स्थिर फ्लो',ok:true},{i:'🛡️',en:'Less shock load',hi:'कम शॉक लोड',ok:true},{i:'🚫',en:'No sudden high load',hi:'अचानक ज़्यादा लोड नहीं',ok:true}]},shot:'Spiky inlet flow line becomes a flat line after the EQ tank; shield icon.',en:'The tank makes the flow stable and reduces shock load. It prevents sudden high load to biological treatment.',hi:'यह टैंक फ्लो को स्थिर रखता है और शॉक लोड कम करता है। यह बायोलॉजिकल ट्रीटमेंट पर अचानक ज़्यादा लोड रोकता है।'},
  {v:{k:'board',items:[{i:'🫧',en:'Steady feed to aeration tank',hi:'एरेशन टैंक को एक जैसी फ़ीड',ok:true},{i:'⚙️',en:'No pump dry run or overflow',hi:'पंप ड्राई रन या ओवरफ्लो नहीं',ok:true}]},shot:'Steady arrow from the EQ tank to the aeration tank; pump running with water above the suction.',en:'It gives steady feed to the aeration or reactor tank, and avoids pump dry run or overflow.',hi:'यह एरेशन या रिएक्टर टैंक को एक जैसी फ़ीड देता है, और पंप का ड्राई रन या ओवरफ्लो रोकता है।'},
  {v:{k:'flow',items:[{i:'🛢️',en:'Grease chamber',hi:'ग्रीस चैंबर'},{i:'🫧',en:'EQ tank',hi:'EQ टैंक'},{i:'⚙️',en:'Transfer pump',hi:'ट्रांसफ़र पंप'},{i:'➡️',en:'Next unit',hi:'अगला यूनिट'}]},shot:'Cutaway of the EQ tank: inlet from the oil and grease chamber, diffusers bubbling on the floor, transfer pump at the outlet.',en:'Water comes in from the oil and grease chamber. Diffusers give air to keep the flow mixed and stable. The transfer pump sends water to the next unit.',hi:'पानी ऑयल एंड ग्रीस चैंबर से आता है। डिफ्यूज़र हवा देते हैं ताकि फ्लो मिक्स और स्थिर रहे। ट्रांसफ़र पंप पानी अगले यूनिट में भेजता है।'},
  {v:{k:'board',items:[{i:'📏',en:'Tank level',hi:'टैंक लेवल'},{i:'🔄',en:'Mixing condition',hi:'मिक्सिंग की हालत'},{i:'👃',en:'Bad smell',hi:'बदबू'},{i:'🛢️',en:'Oil layer',hi:'तेल की परत'},{i:'⚙️',en:'Pump operation',hi:'पंप ऑपरेशन'},{i:'🔘',en:'Auto/manual operation',hi:'ऑटो/मैनुअल ऑपरेशन'},{i:'⚠️',en:'High and low level condition',hi:'हाई और लो लेवल की हालत'}]},shot:'Seven check icons; level gauge, mixer, auto/manual switch, level floats.',en:'What to check: tank level, mixing condition, bad smell, and oil layer. Also pump operation, auto or manual operation, and high level and low level condition.',hi:'क्या चेक करें: टैंक लेवल, मिक्सिंग की हालत, बदबू, और तेल की परत। साथ ही पंप ऑपरेशन, ऑटो या मैनुअल ऑपरेशन, और हाई लेवल और लो लेवल की हालत।'},
  {v:{k:'cards',items:[{i:'👃',title:{en:'Bad smell',hi:'बदबू'},en:'No mixing or stagnant sewage: check mixer or air mixing',hi:'मिक्सिंग नहीं या रुका सीवेज: मिक्सर या एयर मिक्सिंग चेक करें',tone:'warn'}]},shot:'Still, smelly tank with a stopped mixer; operator checks the mixer and the air valve.',en:'Bad smell? There is no mixing, or the sewage is stagnant. Check the mixer or air mixing.',hi:'बदबू? मिक्सिंग नहीं हो रही, या सीवेज रुका हुआ है। मिक्सर या एयर मिक्सिंग चेक करें।'},
  {v:{k:'cards',items:[{i:'🌊',title:{en:'Overflow',hi:'ओवरफ्लो'},en:'Pump not working or high flow: check pump and level switch',hi:'पंप बंद या ज़्यादा फ्लो: पंप और लेवल स्विच चेक करें',tone:'bad'}]},shot:'Overflowing tank with a stopped pump; operator checks the pump panel and the level switch.',en:'Overflow? The pump is not working, or the flow is high. Check the pump and the level switch.',hi:'ओवरफ्लो? पंप काम नहीं कर रहा, या फ्लो ज़्यादा है। पंप और लेवल स्विच चेक करें।'},
  {v:{k:'cards',items:[{i:'📉',title:{en:'Low flow to plant',hi:'प्लांट में कम फ्लो'},en:'Aeration not working: check blower',hi:'एरेशन बंद: ब्लोअर चेक करें',tone:'warn'}]},shot:'Thin flow to the plant; operator checks the blower panel.',en:'Low flow to the plant? Aeration is not working. Check the blower.',hi:'प्लांट में फ्लो कम? एरेशन काम नहीं कर रही। ब्लोअर चेक करें।'},
  {v:{k:'cards',items:[{i:'⚠️',title:{en:'High or low level alarm',hi:'हाई या लो लेवल अलार्म'},en:'Level switch fault: inspect and test level switches',hi:'लेवल स्विच खराब: लेवल स्विच जाँचें और टेस्ट करें',tone:'bad'}]},shot:'Alarm lamp flashing; operator lifts and tests the float level switches.',en:'High or low level alarm? The level switch is faulty or improper. Inspect and test the level switches.',hi:'हाई या लो लेवल अलार्म? लेवल स्विच खराब या गलत है। लेवल स्विच जाँचें और टेस्ट करें।'},
  {v:{k:'cards',items:[{i:'🛡️',title:{en:'Operator rule',hi:'ऑपरेटर नियम'},en:'Stable EQ tank means stable plant',hi:'स्थिर EQ टैंक मतलब स्थिर प्लांट',tone:'ok'}]},shot:'Shield card; the whole plant shown calm and steady behind the EQ tank.',en:'The equalisation tank keeps the plant stable. If the EQ tank is disturbed, the full plant can become unstable. So check level, mixing and smell every day.',hi:'इक्वलाइज़ेशन टैंक प्लांट को स्थिर रखता है। अगर EQ टैंक गड़बड़ हो, तो पूरा प्लांट अस्थिर हो सकता है। इसलिए रोज़ लेवल, मिक्सिंग और गंध चेक करें।'}],
 activity:{type:'multi',prompt:{en:'What do you check at the equalisation tank every day? Tap all that apply.',hi:'इक्वलाइज़ेशन टैंक पर रोज़ क्या चेक करते हैं? जो सही हैं सब टैप करें।'},options:[{i:'📏',en:'Tank level',hi:'टैंक लेवल',ok:true},{i:'🧪',en:'MLSS of the sludge',hi:'स्लज का MLSS',ok:false},{i:'🔄',en:'Mixing condition',hi:'मिक्सिंग की हालत',ok:true},{i:'👃',en:'Bad smell',hi:'बदबू',ok:true},{i:'⏳',en:'30-minute settling test',hi:'30 मिनट का सेटलिंग टेस्ट',ok:false},{i:'⚙️',en:'Pump operation',hi:'पंप ऑपरेशन',ok:true}]},
 remember:{en:'Stable EQ tank means stable plant. Check level, mixing and smell.',hi:'स्थिर EQ टैंक मतलब स्थिर प्लांट। लेवल, मिक्सिंग और गंध चेक करो।'}},

/* 5 ─ Transfer pumps */
{id:'ch2-pumps',cat:'field',em:'⚙️',title:{en:'Transfer pumps: healthy pumps, running plant',hi:'ट्रांसफ़र पंप: सेहतमंद पंप, चलता प्लांट'},
 lines:[
  {v:{k:'flow',items:[{i:'🫧',en:'EQ tank',hi:'EQ टैंक'},{i:'⚙️',en:'Transfer pump',hi:'ट्रांसफ़र पंप'},{i:'🏭',en:'Next stage',hi:'अगला स्टेज'}]},shot:'Two blue pumps on a plinth between the EQ tank and the next treatment stage.',en:'Transfer pumps, also called reactor feed pumps, move wastewater from pre-treatment or the equalisation tank to the next treatment stage.',hi:'ट्रांसफ़र पंप, यानी रिएक्टर फ़ीड पंप, वेस्टवॉटर को प्री-ट्रीटमेंट या इक्वलाइज़ेशन टैंक से अगले ट्रीटमेंट स्टेज में भेजते हैं।'},
  {v:{k:'flow',items:[{i:'🔩',en:'Suction',hi:'सक्शन'},{i:'⚙️',en:'Pump',hi:'पंप'},{i:'💧',en:'Discharge',hi:'डिस्चार्ज'}]},shot:'Close-up of one pump: suction pipe from the tank and discharge pipe to the next unit, both labelled.',en:'Water enters at the suction and leaves at the discharge.',hi:'पानी सक्शन से अंदर आता है और डिस्चार्ज से बाहर जाता है।'},
  {v:{k:'cards',items:[{i:'✅',title:{en:'Operating pump',hi:'चालू पंप'},en:'Running now',hi:'अभी चल रहा है',tone:'ok'},{i:'🔧',title:{en:'Standby pump',hi:'स्टैंडबाय पंप'},en:'Check its condition too',hi:'इसकी हालत भी चेक करें',tone:'warn'}]},shot:'Operating pump with green tick; standby pump with grey tick beside it.',en:'Usually one pump is operating and one pump is standby. Check the standby pump condition too.',hi:'आम तौर पर एक पंप चालू रहता है और एक स्टैंडबाय। स्टैंडबाय पंप की हालत भी चेक करें।'},
  {v:{k:'board',items:[{i:'▶️',en:'Pump running status',hi:'पंप चल रहा है या नहीं'},{i:'🔘',en:'Auto/manual operation',hi:'ऑटो/मैनुअल ऑपरेशन'},{i:'🔊',en:'Noise',hi:'आवाज़'},{i:'📳',en:'Vibration',hi:'वाइब्रेशन'},{i:'⚡',en:'Current',hi:'करंट'},{i:'🧱',en:'Pump choking',hi:'पंप चोकिंग'},{i:'🔩',en:'Suction condition',hi:'सक्शन की हालत'},{i:'💧',en:'Discharge flow',hi:'डिस्चार्ज फ्लो'},{i:'🔧',en:'Standby pump condition',hi:'स्टैंडबाय पंप की हालत'}]},shot:'Nine check icons around the pump; ammeter on the panel, hand on the pump casing.',en:'What to check: pump running status, auto or manual operation, noise, vibration, and current. Also pump choking, suction condition, discharge flow, and standby pump condition.',hi:'क्या चेक करें: पंप चल रहा है या नहीं, ऑटो या मैनुअल ऑपरेशन, आवाज़, वाइब्रेशन, और करंट। साथ ही पंप चोकिंग, सक्शन की हालत, डिस्चार्ज फ्लो, और स्टैंडबाय पंप की हालत।'},
  {v:{k:'cards',items:[{i:'❌',title:{en:'Pump not running',hi:'पंप नहीं चल रहा'},en:'Electrical fault or trip: inform supervisor',hi:'इलेक्ट्रिकल फ़ॉल्ट या ट्रिप: सुपरवाइज़र को बताएँ',tone:'bad'}]},shot:'Tripped panel with red lamp; silent pump; avatar phones the supervisor.',en:'Pump not running? It may be an electrical fault or a trip. Inform your supervisor.',hi:'पंप नहीं चल रहा? इलेक्ट्रिकल फ़ॉल्ट या ट्रिप हो सकता है। सुपरवाइज़र को बताएँ।'},
  {v:{k:'cards',items:[{i:'📉',title:{en:'Low discharge',hi:'कम डिस्चार्ज'},en:'Choking or low level: check suction and screen',hi:'चोकिंग या लो लेवल: सक्शन और स्क्रीन चेक करें',tone:'warn'}]},shot:'Weak discharge stream; operator checks the suction pipe and the bar screen.',en:'Low discharge? It may be choking or low level. Check the suction and the screen.',hi:'डिस्चार्ज कम? चोकिंग या लो लेवल हो सकता है। सक्शन और स्क्रीन चेक करें।'},
  {v:{k:'cards',items:[{i:'📳',title:{en:'High vibration',hi:'ज़्यादा वाइब्रेशन'},en:'Mechanical issue: stop and inform supervisor',hi:'मैकेनिकल समस्या: बंद करें और सुपरवाइज़र को बताएँ',tone:'bad'},{i:'⚠️',title:{en:'Frequent trip',hi:'बार-बार ट्रिप'},en:'Overload or choking: check solids and pump condition',hi:'ओवरलोड या चोकिंग: ठोस कचरा और पंप की हालत चेक करें',tone:'warn'}]},shot:'Pump shaking with motion lines; hand presses the stop button; phone to supervisor.',en:'High vibration? It is a mechanical issue. Stop the pump and inform your supervisor. Frequent trip? Overload or choking. Check for solids and the pump condition.',hi:'ज़्यादा वाइब्रेशन? यह मैकेनिकल समस्या है। पंप बंद करें और सुपरवाइज़र को बताएँ। बार-बार ट्रिप? ओवरलोड या चोकिंग। ठोस कचरा और पंप की हालत चेक करें।'},
  {v:{k:'cards',items:[{i:'🛑',title:{en:'Dry run',hi:'ड्राई रन'},en:'Low water level: check level switch',hi:'पानी का लेवल कम: लेवल स्विच चेक करें',tone:'bad'}]},shot:'Empty tank with the pump running dry; operator tests the level switch.',en:'Dry run? The water level is low. Check the level switch.',hi:'ड्राई रन? पानी का लेवल कम है। लेवल स्विच चेक करें।'},
  {v:{k:'cards',items:[{i:'✅',title:{en:'Takeaway',hi:'याद रखें'},en:'Quick checks today prevent problems tomorrow',hi:'आज के छोटे चेक कल की समस्या रोकते हैं',tone:'ok'}]},shot:'Shield card; both pumps clean and running smoothly.',en:'Keep pumps in good condition for reliable operation and a stable plant. Quick checks today prevent problems tomorrow.',hi:'भरोसेमंद ऑपरेशन और स्थिर प्लांट के लिए पंप अच्छी हालत में रखें। आज के छोटे चेक कल की समस्या रोकते हैं।'}],
 activity:{type:'match',prompt:{en:'Match the pump problem with your action.',hi:'पंप की समस्या को आपके एक्शन से जोड़ें।'},pairs:[{l:{i:'📉',en:'Low discharge',hi:'कम डिस्चार्ज'},r:{i:'🔍',en:'Check suction and screen',hi:'सक्शन और स्क्रीन चेक करें'}},{l:{i:'📳',en:'High vibration',hi:'ज़्यादा वाइब्रेशन'},r:{i:'🛑',en:'Stop and inform supervisor',hi:'बंद करें और सुपरवाइज़र को बताएँ'}},{l:{i:'⚠️',en:'Dry run',hi:'ड्राई रन'},r:{i:'🔘',en:'Check level switch',hi:'लेवल स्विच चेक करें'}}]},
 remember:{en:'High vibration: stop the pump and inform your supervisor.',hi:'ज़्यादा वाइब्रेशन: पंप बंद करो और सुपरवाइज़र को बताओ।'}},

/* 6 ─ Daily checklist */
{id:'ch2-daily',cat:'field',em:'📒',title:{en:'Daily pre-treatment checklist',hi:'रोज़ की प्री-ट्रीटमेंट चेकलिस्ट'},
 lines:[
  {v:{k:'flow',items:[{i:'🚰',en:'Inlet chamber',hi:'इनलेट चैंबर'},{i:'🧱',en:'Bar screen',hi:'बार स्क्रीन'},{i:'🪨',en:'Grit chamber',hi:'ग्रिट चैंबर'},{i:'🛢️',en:'Grease trap',hi:'ग्रीस ट्रैप'},{i:'🫧',en:'EQ tank',hi:'EQ टैंक'},{i:'⚙️',en:'Transfer pump',hi:'ट्रांसफ़र पंप'}]},shot:'Avatar walks along the pre-treatment line with a clipboard; each unit lights up in turn.',en:'Daily checks keep the plant healthy. Walk the pre-treatment line every day: inlet chamber, bar screen, grit chamber, oil and grease trap, equalisation tank, transfer pump.',hi:'रोज़ के चेक प्लांट को सेहतमंद रखते हैं। रोज़ प्री-ट्रीटमेंट लाइन पर चलें: इनलेट चैंबर, बार स्क्रीन, ग्रिट चैंबर, ऑयल एंड ग्रीस ट्रैप, इक्वलाइज़ेशन टैंक, ट्रांसफ़र पंप।'},
  {v:{k:'cards',items:[{i:'👀',title:{en:'Check',hi:'चेक'},en:'Flow, colour, smell, floating waste',hi:'फ्लो, रंग, गंध, तैरता कचरा',tone:'warn'},{i:'✅',title:{en:'Normal',hi:'नॉर्मल'},en:'Flow should be normal',hi:'फ्लो नॉर्मल होना चाहिए',tone:'ok'},{i:'📞',title:{en:'If abnormal',hi:'गड़बड़ हो तो'},en:'Inform supervisor: abnormal flow or heavy waste',hi:'सुपरवाइज़र को बताएँ: गड़बड़ फ्लो या भारी कचरा',tone:'bad'}]},shot:'Inlet chamber with flowing water; avatar looks, sniffs, and notes on the clipboard.',en:'Inlet chamber: check flow, colour, smell and floating waste. Flow should be normal. Inform your supervisor if the flow is abnormal or heavy waste is coming.',hi:'इनलेट चैंबर: फ्लो, रंग, गंध और तैरता कचरा चेक करें। फ्लो नॉर्मल होना चाहिए। फ्लो गड़बड़ हो या भारी कचरा आ रहा हो तो सुपरवाइज़र को बताएँ।'},
  {v:{k:'cards',items:[{i:'👀',title:{en:'Check',hi:'चेक'},en:'Choking and waste',hi:'चोकिंग और कचरा',tone:'warn'},{i:'✅',title:{en:'Normal',hi:'नॉर्मल'},en:'Screen should be clean',hi:'स्क्रीन साफ़ होनी चाहिए',tone:'ok'},{i:'🧹',title:{en:'If abnormal',hi:'गड़बड़ हो तो'},en:'Clean immediately',hi:'तुरंत साफ़ करें',tone:'bad'}]},shot:'Bar screen: clean bars with a tick, then choked bars being raked.',en:'Bar screen: check for choking and waste. The screen should be clean. If not, clean it immediately.',hi:'बार स्क्रीन: चोकिंग और कचरा चेक करें। स्क्रीन साफ़ होनी चाहिए। नहीं है तो तुरंत साफ़ करें।'},
  {v:{k:'cards',items:[{i:'👀',title:{en:'Check',hi:'चेक'},en:'Sand and grit',hi:'रेत और ग्रिट',tone:'warn'},{i:'✅',title:{en:'Normal',hi:'नॉर्मल'},en:'No heavy settlement',hi:'भारी जमाव नहीं',tone:'ok'},{i:'🪨',title:{en:'If abnormal',hi:'गड़बड़ हो तो'},en:'Remove grit',hi:'ग्रिट निकालें',tone:'bad'}]},shot:'Grit chamber with a thin sand layer; then a heavy layer being shovelled out.',en:'Grit chamber: check for sand and grit. There should be no heavy settlement. If there is, remove the grit.',hi:'ग्रिट चैंबर: रेत और ग्रिट चेक करें। भारी जमाव नहीं होना चाहिए। है तो ग्रिट निकालें।'},

  {v:{k:'cards',items:[{i:'👃',title:{en:'Bad smell',hi:'बदबू'},en:'Septic wastewater: check upstream treatment',hi:'सेप्टिक वेस्टवॉटर: अपस्ट्रीम ट्रीटमेंट चेक करें',tone:'bad'},{i:'🛢️',title:{en:'Oil layer',hi:'तेल की परत'},en:'Oil entering from source: check oil trap',hi:'सोर्स से तेल आ रहा है: ऑयल ट्रैप चेक करें',tone:'warn'}]},shot:'Stink lines over the inlet; floating oil sheen; Ritu points to the oil trap.',en:'Bad smell? The wastewater is septic. Check the upstream treatment. Oil layer? Oil is entering from the source. Check the oil trap.',hi:'बदबू आ रही है? वेस्टवॉटर सेप्टिक है। अपस्ट्रीम ट्रीटमेंट चेक करें। तेल की परत दिख रही है? सोर्स से तेल आ रहा है। ऑयल ट्रैप चेक करें।'}],

  {v:{k:'cards',items:[{i:'🚫',title:{en:'No recycle flow',hi:'रीसाइकल फ्लो नहीं'},en:'Pump issue or line blockage: check pump and pipeline',hi:'पंप समस्या या लाइन ब्लॉक: पंप और पाइपलाइन चेक',tone:'bad'},{i:'📉',title:{en:'Low flow',hi:'कम फ्लो'},en:'Choking or valve closed: clean line and check valve',hi:'चोकिंग या वाल्व बंद: लाइन साफ़ करें, वाल्व चेक',tone:'warn'}]},shot:'Blocked pipe with red cross; half-closed valve with a low flow gauge.',en:'No recycle flow? Pump issue or line blockage. Check the pump and pipeline. Low flow? Choking or valve closed. Clean the line and check the valve.',hi:'रीसाइकल फ्लो नहीं? पंप की समस्या या लाइन ब्लॉक। पंप और पाइपलाइन चेक करें। फ्लो कम? चोकिंग या वाल्व बंद। लाइन साफ़ करें और वाल्व चेक करें।'},

/* 4 ─ Mixer operation */
{id:'ch31-mixer',cat:'field',em:'⚙️',title:{en:'Mixer: keep the sludge moving',hi:'मिक्सर: स्लज को हिलाते रहें'},
 lines:[
  {v:{k:'board',items:[{i:'⚙️',en:'Top mixer',hi:'ऊपर लगा मिक्सर'},{i:'🌀',en:'Mixing only',hi:'सिर्फ़ मिक्सिंग'},{i:'🚫',en:'No aeration',hi:'एरेशन नहीं'}]},shot:'Top-mounted mixer in the anoxic chamber; curved arrows show the water turning; no bubbles.',en:'The mixer keeps wastewater and sludge properly mixed inside the tank. Remember: no aeration, mixing only. This is the anoxic condition.',hi:'मिक्सर टैंक के अंदर वेस्टवॉटर और स्लज को अच्छी तरह मिलाए रखता है। याद रखें: एरेशन नहीं, सिर्फ़ मिक्सिंग। यही एनॉक्सिक कंडीशन है।'},
  {v:{k:'cards',items:[{i:'✅',title:{en:'Good mixing',hi:'अच्छी मिक्सिंग'},en:'Sludge stays suspended, biological treatment stays stable',hi:'स्लज तैरता रहता है, बायोलॉजिकल ट्रीटमेंट स्थिर रहता है',tone:'ok'}]},shot:'Sludge particles float evenly through the tank; bacteria cartoons active; shield icon.',en:'Good mixing prevents sludge settling and supports biological activity. Proper mixer operation keeps sludge suspended and keeps the biological treatment stable.',hi:'अच्छी मिक्सिंग स्लज को बैठने से रोकती है और बायोलॉजिकल एक्टिविटी में मदद करती है। सही मिक्सर ऑपरेशन स्लज को तैरता हुआ रखता है और बायोलॉजिकल ट्रीटमेंट को स्थिर रखता है।'},
  {v:{k:'board',items:[{i:'⚙️',en:'Mixer running',hi:'मिक्सर चल रहा है'},{i:'🔊',en:'Sound & vibration',hi:'आवाज़ और वाइब्रेशन'}]},shot:'Ritu with clipboard looks at the mixer motor and listens with a hand near it.',en:'What to check: is the mixer running? Listen to the sound and feel the vibration.',hi:'क्या चेक करें: मिक्सर चल रहा है? आवाज़ सुनें और वाइब्रेशन देखें।'},
  {v:{k:'board',items:[{i:'🔄',en:'Mixing pattern',hi:'मिक्सिंग पैटर्न'},{i:'🟤',en:'Sludge settling or suspended',hi:'स्लज बैठा या तैरता'}]},shot:'Curved arrows show the mixing pattern; sludge particles either suspended or settled at the bottom.',en:'Watch the mixing pattern inside the tank. Is sludge settling or in suspension?',hi:'टैंक के अंदर मिक्सिंग पैटर्न देखें। स्लज बैठ रहा है या तैर रहा है?'},
  {v:{k:'board',items:[{i:'🛑',en:'Dead zones',hi:'डेड ज़ोन'}]},shot:'Ritu points to a still corner of the tank where the water is not moving.',en:'Look for dead zones, where water is not moving.',hi:'डेड ज़ोन देखें, जहाँ पानी नहीं हिल रहा।'},
  {v:{k:'cards',items:[{i:'❌',title:{en:'Mixer not running',hi:'मिक्सर बंद'},en:'Power failure or motor fault: inform supervisor',hi:'पावर फ़ेल या मोटर फ़ॉल्ट: सुपरवाइज़र को बताएँ',tone:'bad'},{i:'🟤',title:{en:'Sludge settling',hi:'स्लज बैठ रहा'},en:'Low mixing: check mixer operation',hi:'कम मिक्सिंग: मिक्सर ऑपरेशन चेक',tone:'warn'}]},shot:'Stopped mixer with red cross; brown sludge layer at the tank bottom.',en:'Mixer not running? Power failure or motor fault. Inform your supervisor. Sludge settling at the bottom? Mixing is low. Check the mixer operation.',hi:'मिक्सर नहीं चल रहा? पावर फ़ेल या मोटर फ़ॉल्ट। सुपरवाइज़र को बताएँ। स्लज नीचे बैठ रहा है? मिक्सिंग कम है। मिक्सर का ऑपरेशन चेक करें।'},
  {v:{k:'cards',items:[{i:'🔊',title:{en:'Noise or vibration',hi:'आवाज़ या वाइब्रेशन'},en:'Mechanical issue: inform supervisor',hi:'मैकेनिकल समस्या: सुपरवाइज़र को बताएँ',tone:'bad'},{i:'🛑',title:{en:'Dead zones',hi:'डेड ज़ोन'},en:'Poor mixing pattern: adjust or check mixer',hi:'खराब मिक्सिंग पैटर्न: मिक्सर एडजस्ट या चेक',tone:'warn'}]},shot:'Mixer shaking with sound waves; tank corners marked as still water.',en:'Noise or vibration? Mechanical issue. Inform your supervisor. Dead zones in the tank? Poor mixing pattern. Adjust or check the mixer.',hi:'आवाज़ या वाइब्रेशन? मैकेनिकल समस्या। सुपरवाइज़र को बताएँ। टैंक में डेड ज़ोन? खराब मिक्सिंग पैटर्न। मिक्सर एडजस्ट करें या चेक करें।'}],

/* 5 ─ Biological sludge condition */
{id:'ch31-sludge',cat:'field',em:'🟤',title:{en:'Sludge condition: brown is healthy',hi:'स्लज की हालत: भूरा मतलब सेहतमंद'},
 lines:[
  {v:{k:'board',items:[{i:'🟤',en:'Biological sludge',hi:'बायोलॉजिकल स्लज'},{i:'✅',en:'Healthy sludge needed',hi:'सेहतमंद स्लज ज़रूरी'},{i:'🫧',en:'Effective nitrogen removal',hi:'असरदार नाइट्रोजन रिमूवल'}]},shot:'Ritu points into the anoxic chamber at the brown mixed sludge.',en:'Now look at the biological sludge inside the tank. Healthy sludge is required for effective nitrogen removal.',hi:'अब टैंक के अंदर के बायोलॉजिकल स्लज को देखें। असरदार नाइट्रोजन रिमूवल के लिए सेहतमंद स्लज ज़रूरी है।'},
  {v:{k:'cylinders',list:[{sludge:0.4,en:'Normal brown sludge',hi:'नॉर्मल भूरा स्लज',ok:true},{sludge:0.4,black:true,en:'Septic sludge, settled',hi:'सेप्टिक स्लज, बैठा हुआ',bad:true},{sludge:0.4,floating:true,en:'Floating sludge, scum',hi:'तैरता स्लज, झाग',bad:true}]},shot:'Cross-section of the anoxic chamber: scum on top, brown sludge in the middle, black settled sludge at the bottom.',en:'Normal sludge is brown. Septic sludge is black and settled at the bottom. Floating sludge forms scum on top.',hi:'नॉर्मल स्लज भूरा होता है। सेप्टिक स्लज काला होता है और नीचे बैठा रहता है। तैरता स्लज ऊपर झाग बनाता है।'},

  {v:{k:'board',items:[{i:'📉',en:'Reduce BOD',hi:'BOD कम'},{i:'📉',en:'Reduce COD',hi:'COD कम'},{i:'🚫',en:'Reduce bad smell',hi:'बदबू कम'},{i:'💧',en:'Better treated water',hi:'बेहतर ट्रीटेड पानी'},{i:'🦠',en:'Maintain bio treatment',hi:'बायो ट्रीटमेंट बना रहे'},{i:'⏳',en:'Proper sludge settling',hi:'सही स्लज सेटलिंग'},{i:'🏭',en:'Less pollution load',hi:'कम पॉल्यूशन लोड'}]},shot:'Seven benefit icons pop in one by one.',en:'Why is ASP so important? It reduces BOD, COD and bad smell. It improves treated water quality.',hi:'ASP इतना ज़रूरी क्यों है? यह BOD, COD और बदबू कम करता है। ट्रीटेड पानी की क्वालिटी सुधारता है।'},
  {v:{k:'board',items:[{i:'🦠',en:'Healthy bacteria',hi:'स्वस्थ बैक्टीरिया',ok:true},{i:'🫧',en:'Proper aeration',hi:'सही एरेशन',ok:true},{i:'🔄',en:'Correct sludge circulation',hi:'सही स्लज सर्कुलेशन',ok:true}]},shot:'Three green tiles; avatar gives a thumbs up.',en:'It also maintains biological treatment, supports proper sludge settling, and reduces pollution load before final treatment. Keep the bacteria healthy with proper aeration and correct sludge circulation.',hi:'यह बायोलॉजिकल ट्रीटमेंट बनाए रखता है, स्लज को ठीक से बैठने में मदद करता है, और फ़ाइनल ट्रीटमेंट से पहले पॉल्यूशन लोड कम करता है। सही एरेशन और सही स्लज सर्कुलेशन से बैक्टीरिया को स्वस्थ रखें।'}],

/* 2 ─ Aeration tank and DO (p02 + p09) */
{id:'ch32-aeration',cat:'field',em:'🫧',title:{en:'Aeration tank and DO',hi:'एरेशन टैंक और DO'},
 lines:[
  {v:{k:'flow',items:[{i:'🚰',en:'Wastewater',hi:'वेस्टवॉटर'},{i:'🦠',en:'Bacteria',hi:'बैक्टीरिया'},{i:'💨',en:'Oxygen',hi:'ऑक्सीजन'}]},shot:'Aeration tank cutaway: water level, mixed liquor, diffusers bubbling, blower on top.',en:'The aeration tank is the main biological treatment tank in ASP. Here wastewater, bacteria and oxygen mix together.',hi:'एरेशन टैंक ASP का मुख्य बायोलॉजिकल ट्रीटमेंट टैंक है। यहाँ वेस्टवॉटर, बैक्टीरिया और ऑक्सीजन आपस में मिलते हैं।'},
  {v:{k:'flow',items:[{i:'🦠',en:'Bacteria',hi:'बैक्टीरिया'},{i:'🍽️',en:'Eat pollution',hi:'गंदगी खाते हैं'},{i:'🟤',en:'Stable sludge',hi:'स्थिर स्लज'},{i:'💧',en:'CO2 and water',hi:'CO2 और पानी'}]},shot:'Bacteria cartoon converts dark pollution into sludge, gas bubbles and clear water.',en:'Bacteria consume organic pollution and convert it into stable sludge, carbon dioxide and water.',hi:'बैक्टीरिया ऑर्गेनिक गंदगी खाकर उसे स्थिर स्लज, कार्बन डाइऑक्साइड और पानी में बदल देते हैं।'},
  {v:{k:'board',items:[{i:'📟',en:'DO level',hi:'DO लेवल'},{i:'🫧',en:'Air bubbling pattern',hi:'बुलबुलों का पैटर्न'},{i:'🌀',en:'Blower operation',hi:'ब्लोअर ऑपरेशन'},{i:'🕳️',en:'Diffuser condition',hi:'डिफ्यूज़र की हालत'},{i:'🟤',en:'MLSS level',hi:'MLSS लेवल'},{i:'🎨',en:'Sludge colour',hi:'स्लज का रंग'}]},shot:'Checklist ticks: DO, bubbling, blower, diffuser, MLSS, sludge colour.',en:'What to check at the aeration tank: DO level, air bubbling pattern, blower operation, diffuser condition, MLSS level and sludge colour.',hi:'एरेशन टैंक पर क्या चेक करें: DO लेवल, हवा के बुलबुलों का पैटर्न, ब्लोअर ऑपरेशन, डिफ्यूज़र की हालत, MLSS लेवल और स्लज का रंग।'},
  {v:{k:'board',items:[{i:'🧼',en:'Foam condition',hi:'झाग की हालत'},{i:'👃',en:'Smell',hi:'गंध'},{i:'🔄',en:'Mixing condition',hi:'मिक्सिंग की हालत'},{i:'🛑',en:'Any dead zone',hi:'कोई डेड ज़ोन'},{i:'📏',en:'Water level',hi:'पानी का लेवल'}]},shot:'Avatar walks along the tank edge, points to foam, sniffs, points to a still corner and the water level.',en:'Also check foam condition, smell, mixing condition, any dead zone, and the water level.',hi:'झाग की हालत, गंध, मिक्सिंग की हालत, कोई डेड ज़ोन, और पानी का लेवल भी चेक करें।'},
  {v:{k:'cards',items:[{i:'📉',title:{en:'Low DO',hi:'कम DO'},en:'Check blower, airline, diffuser and valve',hi:'ब्लोअर, एयरलाइन, डिफ्यूज़र, वाल्व चेक',tone:'bad'}]},shot:'DO meter reads low; blower, air line, diffuser and valve icons light up.',en:'Low DO: blower not working, diffuser choking, air leakage or air valve closed. Check blower, airline, diffuser and valve.',hi:'कम DO: ब्लोअर बंद, डिफ्यूज़र चोक, हवा का लीकेज या एयर वाल्व बंद। ब्लोअर, एयरलाइन, डिफ्यूज़र और वाल्व चेक करें।'},
  {v:{k:'cards',items:[{i:'⚫',title:{en:'Black sludge',hi:'काला स्लज'},en:'Check DO and blower operation',hi:'DO और ब्लोअर ऑपरेशन चेक',tone:'bad'}]},shot:'Black sludge sample in a beaker; DO meter and blower icons.',en:'Black sludge: low aeration, septic condition or old sludge. Check DO and blower operation.',hi:'काला स्लज: कम एरेशन, सेप्टिक कंडीशन या पुराना स्लज। DO और ब्लोअर ऑपरेशन चेक करें।'},
  {v:{k:'cards',items:[{i:'🦨',title:{en:'Bad smell',hi:'बदबू'},en:'Check aeration and mixing',hi:'एरेशन और मिक्सिंग चेक',tone:'warn'}]},shot:'Stink lines over a still corner of the tank; avatar sniffs and points to the diffusers.',en:'Bad smell: low oxygen, stagnant zone or high organic load. Check aeration and mixing.',hi:'बदबू: कम ऑक्सीजन, रुका हुआ ज़ोन या ज़्यादा ऑर्गेनिक लोड। एरेशन और मिक्सिंग चेक करें।'},
  {v:{k:'cards',items:[{i:'🧼',title:{en:'Excess foam',hi:'ज़्यादा झाग'},en:'Check MLSS, sludge wasting, inlet',hi:'MLSS, स्लज वेस्टिंग, इनलेट चेक',tone:'warn'}]},shot:'Thick foam on the tank surface; MLSS beaker, wasting pump and inlet pipe icons.',en:'Excess foam: high MLSS, old sludge, filamentous bacteria or detergent load. Check MLSS, sludge wasting and inlet condition.',hi:'ज़्यादा झाग: ज़्यादा MLSS, पुराना स्लज, फ़िलामेंटस बैक्टीरिया या डिटर्जेंट लोड। MLSS, स्लज वेस्टिंग और इनलेट की हालत चेक करें।'},
  {v:{k:'cards',items:[{i:'🫧',title:{en:'Uneven air bubbling',hi:'असमान बुलबुले'},en:'Check diffuser and air header',hi:'डिफ्यूज़र और एयर हेडर चेक',tone:'warn'}]},shot:'Bubbles on one side of the tank only; avatar points to the diffuser and air header.',en:'Uneven air bubbling: diffuser choking or air distribution issue. Check diffuser and air header.',hi:'असमान बुलबुले: डिफ्यूज़र चोक या हवा के बँटवारे की समस्या। डिफ्यूज़र और एयर हेडर चेक करें।'},
  {v:{k:'cards',items:[{i:'⏳',title:{en:'Sludge settling in tank',hi:'टैंक में स्लज बैठना'},en:'Check air supply and mixing pattern',hi:'एयर सप्लाई और मिक्सिंग चेक',tone:'bad'}]},shot:'Sludge resting on the floor of the aeration tank; still water above.',en:'Sludge settling in the tank: low mixing or aeration failure. Check air supply and mixing pattern.',hi:'टैंक में स्लज बैठ रहा है: कम मिक्सिंग या एरेशन फ़ेल। एयर सप्लाई और मिक्सिंग पैटर्न चेक करें।'},
  {v:{k:'board',items:[{i:'🫧',en:'DO = dissolved oxygen',hi:'DO = घुली हुई ऑक्सीजन'},{i:'🦠',en:'Bacteria need oxygen',hi:'बैक्टीरिया को ऑक्सीजन चाहिए'}]},shot:'DO meter probe dips into the aeration tank; bacteria cartoon breathes bubbles.',en:'DO means dissolved oxygen: the oxygen in the aeration tank water for bacteria. Bacteria need oxygen to treat wastewater.',hi:'DO मतलब डिज़ॉल्व्ड ऑक्सीजन: एरेशन टैंक के पानी में बैक्टीरिया के लिए ऑक्सीजन। बैक्टीरिया को वेस्टवॉटर साफ़ करने के लिए ऑक्सीजन चाहिए।'},
  {v:{k:'range',label:'DO',unit:'mg/L',min:0,max:5,value:2.2,zones:[{to:1,c:'bad',en:'Below 1.0',hi:'1.0 से नीचे'},{to:1.5,c:'warn',en:'',hi:''},{to:3,c:'ok',en:'1.5 to 3.0',hi:'1.5 से 3.0'},{to:4,c:'warn',en:'',hi:''},{to:5,c:'bad',en:'Above 4.0',hi:'4.0 से ऊपर'}]},shot:'Avatar holds a DO meter reading 2.0 mg/L; range bar with green band 1.5 to 3.0.',en:'Typical DO in the aeration tank is 1.5 to 3.0 mg/L.',hi:'एरेशन टैंक में DO आमतौर पर 1.5 से 3.0 mg/L होता है।'},
  {v:{k:'cards',items:[{i:'📉',title:{en:'DO below 1.0 mg/L',hi:'DO 1.0 mg/L से नीचे'},en:'Check blower, diffuser and air valve',hi:'ब्लोअर, डिफ्यूज़र, एयर वाल्व चेक',tone:'bad'}]},shot:'DO meter reads 0.8; blower, diffuser and air valve icons light up.',en:'DO below 1.0: low air supply, blower issue, diffuser choking or high load. Check blower, diffuser and air valve.',hi:'DO 1.0 से नीचे: कम एयर सप्लाई, ब्लोअर की समस्या, डिफ्यूज़र चोक या ज़्यादा लोड। ब्लोअर, डिफ्यूज़र और एयर वाल्व चेक करें।'},
  {v:{k:'cards',items:[{i:'✅',title:{en:'DO 1.5 to 3.0 mg/L',hi:'DO 1.5 से 3.0 mg/L'},en:'Normal: continue monitoring',hi:'नॉर्मल: मॉनिटर करते रहें',tone:'ok'},{i:'📈',title:{en:'DO above 4.0 mg/L',hi:'DO 4.0 mg/L से ऊपर'},en:'Inform supervisor, check blower timing',hi:'सुपरवाइज़र को बताएँ, ब्लोअर टाइमिंग चेक',tone:'bad'}]},shot:'DO meter reads 2.2 with a green tick, then 4.6 with the tank foaming.',en:'DO 1.5 to 3.0 is normal: continue monitoring. DO above 4.0 means excess aeration: inform your supervisor and check blower timing.',hi:'DO 1.5 से 3.0 नॉर्मल है: मॉनिटर करते रहें। DO 4.0 से ऊपर मतलब ज़्यादा एरेशन: सुपरवाइज़र को बताएँ और ब्लोअर की टाइमिंग चेक करें।'},
  {v:{k:'cards',items:[{i:'📊',title:{en:'DO fluctuating',hi:'DO ऊपर-नीचे'},en:'Check blower operation and inlet flow',hi:'ब्लोअर ऑपरेशन और इनलेट फ्लो चेक',tone:'warn'}]},shot:'DO meter reading jumps up and down; inlet pipe flow changes.',en:'DO fluctuating: uneven air supply or load variation. Check blower operation and inlet flow.',hi:'DO ऊपर-नीचे हो रहा है: असमान एयर सप्लाई या लोड में बदलाव। ब्लोअर ऑपरेशन और इनलेट फ्लो चेक करें।'},
  {v:{k:'board',items:[{i:'📟',en:'Check DO regularly',hi:'DO नियमित चेक'},{i:'👀',en:'Watch bubbling and colour',hi:'बुलबुले और रंग देखें'},{i:'📞',en:'Report abnormal blower / diffuser',hi:'ब्लोअर / डिफ्यूज़र खराब: बताएँ'},{i:'🫧',en:'Uniform air distribution',hi:'एक जैसा हवा का बँटवारा'}]},shot:'Reminder icons; avatar points to the DO meter and the bubbling tank.',en:'Check DO regularly. Observe bubbling and sludge colour. Report abnormal blower or diffuser condition. Proper aeration, healthy bacteria and uniform air distribution keep ASP treatment stable.',hi:'DO नियमित चेक करें। बुलबुले और स्लज का रंग देखें। ब्लोअर या डिफ्यूज़र में कुछ गड़बड़ हो तो बताएँ। सही एरेशन, स्वस्थ बैक्टीरिया और एक जैसा हवा का बँटवारा ASP ट्रीटमेंट को स्थिर रखते हैं।'}],
 activity:{type:'classify',prompt:{en:'Three DO readings from the aeration tank. Tap Low, OK, or High for each.',hi:'एरेशन टैंक की तीन DO रीडिंग। हर एक के लिए कम, ठीक या ज़्यादा टैप करें।'},items:[{val:'0.8 mg/L',ans:0},{val:'2.2 mg/L',ans:1},{val:'4.5 mg/L',ans:2}],cats:[{en:'Low',hi:'कम',sub:{en:'Below 1.0',hi:'1.0 से नीचे'}},{en:'OK',hi:'ठीक',sub:{en:'1.5 to 3.0',hi:'1.5 से 3.0'}},{en:'High',hi:'ज़्यादा',sub:{en:'Above 4.0',hi:'4.0 से ऊपर'}}]},
 remember:{en:'DO 1.5 to 3.0 mg/L. Below 1.0: check blower, diffuser, air valve.',hi:'DO 1.5 से 3.0 mg/L। 1.0 से नीचे: ब्लोअर, डिफ्यूज़र, एयर वाल्व चेक।'}},

/* 3 ─ Blower (p03) */
{id:'ch32-blower',cat:'field',em:'🌀',title:{en:'Blower: air for the bacteria',hi:'ब्लोअर: बैक्टीरिया के लिए हवा'},
 lines:[
  {v:{k:'flow',items:[{i:'🌀',en:'Blower',hi:'ब्लोअर'},{i:'🔩',en:'Air pipeline',hi:'एयर पाइपलाइन'},{i:'🕳️',en:'Diffusers',hi:'डिफ्यूज़र'},{i:'🫧',en:'Aeration tank',hi:'एरेशन टैंक'}]},shot:'Blower on its base; arrow of air into the pipeline and down to the diffusers in the tank.',en:'The blower supplies air to the aeration tank through air pipelines and diffusers.',hi:'ब्लोअर एयर पाइपलाइन और डिफ्यूज़र के ज़रिए एरेशन टैंक में हवा भेजता है।'},
  {v:{k:'flow',items:[{i:'🌬️',en:'Atmospheric air',hi:'बाहर की हवा'},{i:'🌀',en:'Blower',hi:'ब्लोअर'},{i:'🫧',en:'Aeration tank',hi:'एरेशन टैंक'},{i:'🦠',en:'Oxygen to bacteria',hi:'बैक्टीरिया को ऑक्सीजन'}]},shot:'Air drawn in at the blower inlet, compressed, and bubbling up to cartoon bacteria.',en:'It draws atmospheric air, compresses it, and sends it to the aeration tank to give oxygen to the bacteria.',hi:'यह बाहर की हवा खींचता है, उसे कंप्रेस करता है, और एरेशन टैंक में भेजता है ताकि बैक्टीरिया को ऑक्सीजन मिले।'},
  {v:{k:'board',items:[{i:'✅',en:'Running status',hi:'चल रहा है या नहीं'},{i:'📟',en:'Air pressure and flow',hi:'एयर प्रेशर और फ्लो'},{i:'🔊',en:'Noise and vibration',hi:'आवाज़ और वाइब्रेशन'},{i:'⚡',en:'Motor current',hi:'मोटर करंट'},{i:'🌡️',en:'Temperature',hi:'टेम्परेचर'}]},shot:'First five check icons tick one by one around the blower.',en:'What to check: blower running status, air pressure and flow, noise and vibration, motor current, and temperature.',hi:'क्या चेक करें: ब्लोअर चल रहा है या नहीं, एयर प्रेशर और फ्लो, आवाज़ और वाइब्रेशन, मोटर करंट, और टेम्परेचर।'},
  {v:{k:'board',items:[{i:'🔗',en:'Belt / coupling',hi:'बेल्ट / कपलिंग'},{i:'🧺',en:'Air filter',hi:'एयर फ़िल्टर'},{i:'🛢️',en:'Oil level',hi:'ऑयल लेवल'},{i:'🔄',en:'Standby blower',hi:'स्टैंडबाय ब्लोअर'}]},shot:'Remaining four check icons tick: belt, filter, oil sight glass, standby blower.',en:'Also check belt or coupling condition, air filter condition, oil level, and the standby blower condition.',hi:'बेल्ट या कपलिंग की हालत, एयर फ़िल्टर की हालत, ऑयल लेवल, और स्टैंडबाय ब्लोअर की हालत भी चेक करें।'},

/* 5 ─ Clarifier (p05) */
{id:'ch32-clarifier',cat:'field',em:'🔵',title:{en:'Clarifier: settle the sludge, clear the water',hi:'क्लैरिफ़ायर: स्लज बैठे, पानी साफ़'},
 lines:[

  {v:{k:'steps',items:[{n:1,i:'🫧',en:'Aeration tank mixed liquor',hi:'एरेशन टैंक का मिक्स्ड लिकर'},{n:2,i:'🔵',en:'Clarifier',hi:'क्लैरिफ़ायर'},{n:3,i:'🟤',en:'Sludge settles at bottom',hi:'स्लज नीचे बैठता है'},{n:4,i:'💧',en:'Clear water flows from top',hi:'ऊपर से साफ़ पानी'}]},shot:'Four-step strip: tank, clarifier, settled sludge, clear overflow.',en:'How it works: mixed liquor comes from the aeration tank into the clarifier. Sludge settles at the bottom. Clear water flows from the top.',hi:'यह कैसे काम करता है: एरेशन टैंक से मिक्स्ड लिकर क्लैरिफ़ायर में आता है। स्लज नीचे बैठता है। साफ़ पानी ऊपर से बहता है।'},

 remember:{en:'RAS keeps bacteria in the tank. Wasting keeps MLSS under control.',hi:'RAS बैक्टीरिया को टैंक में रखता है। वेस्टिंग MLSS को कंट्रोल में रखती है।'}},

/* 7 ─ MLSS control and SV30 (p08 + p10) */
{id:'ch32-mlss',cat:'field',em:'🟤',title:{en:'MLSS and SV30: is the sludge right?',hi:'MLSS और SV30: स्लज सही है?'},
 lines:[
  {v:{k:'beakers',list:[{kind:'particles',en:'Low MLSS: less bacteria',hi:'कम MLSS: कम बैक्टीरिया',bad:true},{kind:'brown',en:'High MLSS: excess sludge',hi:'ज़्यादा MLSS: एक्स्ट्रा स्लज',bad:true}]},shot:'Two beakers side by side: thin light sample and thick brown sample.',en:'MLSS shows the amount of suspended biological sludge in the aeration tank. Low MLSS means less bacteria. High MLSS means excess sludge. Proper MLSS keeps treatment stable.',hi:'MLSS बताता है कि एरेशन टैंक में कितना बायोलॉजिकल स्लज तैर रहा है। कम MLSS मतलब कम बैक्टीरिया। ज़्यादा MLSS मतलब एक्स्ट्रा स्लज। सही MLSS ट्रीटमेंट को स्थिर रखता है।'},
  {v:{k:'board',items:[{i:'📟',en:'MLSS value',hi:'MLSS वैल्यू'},{i:'🎨',en:'Sludge colour',hi:'स्लज का रंग'},{i:'⏳',en:'Sludge settling',hi:'स्लज सेटलिंग'},{i:'🧼',en:'Foaming',hi:'झाग'},{i:'🫧',en:'DO level',hi:'DO लेवल'},{i:'📅',en:'Sludge wasting schedule',hi:'स्लज वेस्टिंग शेड्यूल'}]},shot:'Six check icons tick beside a beaker of mixed liquor.',en:'Check MLSS regularly. What to check: MLSS value, sludge colour, sludge settling, foaming, DO level, and the sludge wasting schedule.',hi:'MLSS नियमित चेक करें। क्या चेक करें: MLSS वैल्यू, स्लज का रंग, स्लज सेटलिंग, झाग, DO लेवल, और स्लज वेस्टिंग शेड्यूल।'},
  {v:{k:'board',items:[{i:'🚛',en:'Maintain proper wasting',hi:'सही वेस्टिंग बनाए रखें'},{i:'📞',en:'Report foaming or black sludge',hi:'झाग या काला स्लज: बताएँ'}]},shot:'Wasting pump running on schedule; avatar points to foam and a black sample, then the phone icon.',en:'Maintain proper sludge wasting. Report abnormal foaming or black sludge.',hi:'सही स्लज वेस्टिंग बनाए रखें। ज़्यादा झाग या काला स्लज हो तो बताएँ।'},
  {v:{k:'cards',items:[{i:'📉',title:{en:'Low MLSS',hi:'कम MLSS'},en:'Inform supervisor, check wasting',hi:'सुपरवाइज़र को बताएँ, वेस्टिंग चेक',tone:'bad'},{i:'📈',title:{en:'High MLSS',hi:'ज़्यादा MLSS'},en:'Check sludge wasting',hi:'स्लज वेस्टिंग चेक',tone:'bad'}]},shot:'Thin light beaker and thick brown beaker, both with red marks.',en:'Low MLSS: excess sludge wasting, low load or low biomass. Inform your supervisor and check wasting. High MLSS: sludge wasting not proper or high load. Check sludge wasting.',hi:'कम MLSS: ज़्यादा स्लज वेस्टिंग, कम लोड या कम बायोमास। सुपरवाइज़र को बताएँ और वेस्टिंग चेक करें। ज़्यादा MLSS: स्लज वेस्टिंग ठीक नहीं या ज़्यादा लोड। स्लज वेस्टिंग चेक करें।'},
  {v:{k:'cards',items:[{i:'⏳',title:{en:'Sludge not settling',hi:'स्लज नहीं बैठता'},en:'Check DO, pH, SVI and RAS',hi:'DO, pH, SVI और RAS चेक',tone:'bad'},{i:'⚫',title:{en:'Black sludge',hi:'काला स्लज'},en:'Check blower and diffuser',hi:'ब्लोअर और डिफ्यूज़र चेक',tone:'bad'}]},shot:'Cylinder that stays cloudy after 30 minutes; black sludge sample beside it.',en:'Sludge not settling: bulking, low DO or process imbalance. Check DO, pH, SVI and RAS. Black sludge: septic condition or low aeration. Check the blower and diffuser.',hi:'स्लज नहीं बैठता: बल्किंग, कम DO या प्रोसेस में असंतुलन। DO, pH, SVI और RAS चेक करें। काला स्लज: सेप्टिक कंडीशन या कम एरेशन। ब्लोअर और डिफ्यूज़र चेक करें।'},
  {v:{k:'cards',items:[{i:'🧼',title:{en:'Foaming',hi:'झाग'},en:'Check wasting and DO',hi:'वेस्टिंग और DO चेक',tone:'warn'}]},shot:'Thick foam on the aeration tank surface; avatar points to the wasting pump and DO meter.',en:'Foaming: old sludge, high MLSS or filamentous growth. Check wasting and DO.',hi:'झाग: पुराना स्लज, ज़्यादा MLSS या फ़िलामेंटस ग्रोथ। वेस्टिंग और DO चेक करें।'},
  {v:{k:'board',items:[{i:'🧫',en:'SV30',hi:'SV30'},{i:'⏱️',en:'30 minutes',hi:'30 मिनट'},{i:'⏳',en:'Settling check',hi:'सेटलिंग की जाँच'}]},shot:'Measuring cylinder with a 30-minute clock beside it; sludge layer marked on the scale.',en:'SV30 means the volume of sludge settled in a measuring cylinder after 30 minutes. It checks how well the sludge settles.',hi:'SV30 मतलब मेज़रिंग सिलेंडर में 30 मिनट बाद बैठे हुए स्लज की मात्रा। इससे पता चलता है कि स्लज कितनी अच्छी तरह बैठता है।'},
  {v:{k:'steps',items:[{n:1,i:'🫙',en:'1 litre mixed liquor',hi:'1 लीटर मिक्स्ड लिकर'},{n:2,i:'🧫',en:'Measuring cylinder',hi:'मेज़रिंग सिलेंडर'}]},shot:'Hand dips a jug into the aeration tank and fills a 1-litre measuring cylinder.',en:'Take a 1-litre mixed liquor sample from the aeration tank. Keep it in a measuring cylinder.',hi:'एरेशन टैंक से 1 लीटर मिक्स्ड लिकर का सैंपल लें। उसे मेज़रिंग सिलेंडर में रखें।'},
  {v:{k:'steps',items:[{n:3,i:'⏱️',en:'Settle 30 minutes',hi:'30 मिनट बैठने दें'},{n:4,i:'📏',en:'Note sludge volume in ml',hi:'स्लज की मात्रा ml में लिखें'}]},shot:'30-minute clock runs; hand reads the sludge level on the cylinder scale and writes it down.',en:'Allow it to settle for 30 minutes. Note the settled sludge volume in ml.',hi:'30 मिनट बैठने दें। बैठे हुए स्लज की मात्रा ml में लिखें।'},
  {v:{k:'cylinders',list:[{sludge:0.3,en:'Good settling: clear water above',hi:'अच्छी सेटलिंग: ऊपर साफ़ पानी'}]},shot:'Cylinder with moderate sludge at the bottom and clear water above, green tick.',en:'Good settling: moderate sludge volume with clear supernatant. Clear water above the sludge, and the sludge settles properly.',hi:'अच्छी सेटलिंग: मध्यम स्लज और ऊपर साफ़ पानी। स्लज के ऊपर साफ़ पानी, और स्लज ठीक से बैठता है।'},
  {v:{k:'cylinders',list:[{sludge:0.3,en:'SV30 200 to 400 ml',hi:'SV30 200 से 400 ml'}]},shot:'Same cylinder; the scale between 200 and 400 ml glows green; 30-minute clock.',en:'SV30 is about 200 to 400 ml. Good settling sludge settles properly within 30 minutes.',hi:'SV30 लगभग 200 से 400 ml। अच्छा स्लज 30 मिनट के अंदर ठीक से बैठ जाता है।'},
  {v:{k:'cylinders',list:[{sludge:0.6,en:'Poor settling: more than 500 ml',hi:'खराब सेटलिंग: 500 ml से ज़्यादा'}]},shot:'Cylinder with a high cloudy sludge column; red warning mark.',en:'Poor settling: high sludge volume and cloudy water above. The sludge is not settling properly. SV30 is more than 500 ml.',hi:'खराब सेटलिंग: ज़्यादा स्लज और ऊपर धुंधला पानी। स्लज ठीक से नहीं बैठ रहा। SV30 500 ml से ज़्यादा।'},
  {v:{k:'cylinders',list:[{sludge:0.1,en:'Very fast settling: less than 150 ml',hi:'बहुत जल्दी बैठा: 150 ml से कम'}]},shot:'Cylinder with a tiny sludge layer under very clear water; MLSS beaker looks thin.',en:'Very fast settling: very clear water above and very low sludge volume. SV30 is less than 150 ml. This may indicate low MLSS.',hi:'बहुत जल्दी बैठना: ऊपर बहुत साफ़ पानी और बहुत कम स्लज। SV30 150 ml से कम। यह कम MLSS का संकेत हो सकता है।'},
  {v:{k:'cards',items:[{i:'📈',title:{en:'High SV30',hi:'ज़्यादा SV30'},en:'Check DO, MLSS and sludge wasting',hi:'DO, MLSS और स्लज वेस्टिंग चेक',tone:'bad'},{i:'📉',title:{en:'Low SV30',hi:'कम SV30'},en:'Inform supervisor, check MLSS',hi:'सुपरवाइज़र को बताएँ, MLSS चेक',tone:'warn'}]},shot:'Two SV30 cards: tall sludge column and tiny sludge layer; each flips to show the action.',en:'High SV30: bulking sludge or filamentous growth. Check DO, MLSS and sludge wasting. Low SV30: low MLSS or young sludge. Inform your supervisor and check MLSS.',hi:'ज़्यादा SV30: बल्किंग स्लज या फ़िलामेंटस ग्रोथ। DO, MLSS और स्लज वेस्टिंग चेक करें। कम SV30: कम MLSS या नया स्लज। सुपरवाइज़र को बताएँ और MLSS चेक करें।'},
  {v:{k:'cards',items:[{i:'🥛',title:{en:'Cloudy supernatant',hi:'ऊपर धुंधला पानी'},en:'Check SVI, DO and sludge condition',hi:'SVI, DO और स्लज की हालत चेक',tone:'bad'},{i:'🟤',title:{en:'Floating sludge',hi:'तैरता स्लज'},en:'Check sludge wasting and aeration',hi:'स्लज वेस्टिंग और एरेशन चेक',tone:'warn'}]},shot:'Cylinder with cloudy water above the sludge; another with sludge floating at the top.',en:'Cloudy supernatant: poor settling. Check SVI, DO and sludge condition. Floating sludge: gas formation or old sludge. Check sludge wasting and aeration.',hi:'ऊपर धुंधला पानी: खराब सेटलिंग। SVI, DO और स्लज की हालत चेक करें। तैरता स्लज: गैस बनना या पुराना स्लज। स्लज वेस्टिंग और एरेशन चेक करें।'},
  {v:{k:'board',items:[{i:'📅',en:'Check SV30 regularly',hi:'SV30 नियमित चेक'},{i:'⏳',en:'Good settling',hi:'अच्छी सेटलिंग',ok:true},{i:'✅',en:'Efficient treatment',hi:'अच्छा ट्रीटमेंट',ok:true}]},shot:'Avatar holds up a well-settled cylinder and gives a thumbs up.',en:'Check SV30 regularly for good settling and efficient treatment.',hi:'अच्छी सेटलिंग और अच्छे ट्रीटमेंट के लिए SV30 नियमित चेक करें।'}],
 activity:{type:'choice',prompt:{en:'SV30 is 600 ml and the water above is cloudy. What do you do?',hi:'SV30 600 ml है और ऊपर का पानी धुंधला है। आप क्या करेंगे?'},options:[{i:'📟',en:'Check DO, MLSS and sludge wasting',hi:'DO, MLSS और स्लज वेस्टिंग चेक करें',ok:true},{i:'🛑',en:'Stop the RAS pump',hi:'RAS पंप बंद कर दें',ok:false},{i:'🧺',en:'Clean the blower air filter',hi:'ब्लोअर का एयर फ़िल्टर साफ़ करें',ok:false}]},
 remember:{en:'1 litre, 30 minutes. SV30 200 to 400 ml is good settling.',hi:'1 लीटर, 30 मिनट। SV30 200 से 400 ml मतलब अच्छी सेटलिंग।'}},

/* 8 ─ Daily checklist and troubleshooting (p11 + p12) */
{id:'ch32-checklist',cat:'field',em:'📒',title:{en:'Daily checklist and troubleshooting (part 1)',hi:'रोज़ की चेकलिस्ट और ट्रबलशूटिंग (भाग 1)'},
 lines:[
  {v:{k:'board',items:[{i:'📒',en:'Daily checklist',hi:'रोज़ की चेकलिस्ट'},{i:'🔍',en:'Detect problems early',hi:'समस्या जल्दी पकड़ो'},{i:'✅',en:'Stable ASP treatment',hi:'स्थिर ASP ट्रीटमेंट'}]},shot:'Avatar holds a clipboard headed Daily Checklist.',en:'This is your daily checklist for ASP. Daily checking helps detect problems early and keeps ASP treatment stable.',hi:'यह ASP की आपकी रोज़ की चेकलिस्ट है। रोज़ चेक करने से समस्या जल्दी पकड़ में आती है और ASP ट्रीटमेंट स्थिर रहता है।'},
  {v:{k:'board',items:[{i:'📋',en:'Check point',hi:'चेक पॉइंट'},{i:'✅',en:'Normal condition',hi:'नॉर्मल कंडीशन',ok:true},{i:'⚠️',en:'Action if abnormal',hi:'गड़बड़ हो तो एक्शन',bad:true}]},shot:'The three columns Check point, Normal condition, Action if abnormal appear on the clipboard.',en:'For each check point, know the normal condition and the action if abnormal.',hi:'हर चेक पॉइंट के लिए नॉर्मल कंडीशन और गड़बड़ होने पर एक्शन जानें।'},
  {v:{k:'cards',items:[{i:'🎨',title:{en:'Aeration tank colour',hi:'एरेशन टैंक का रंग'},en:'Normal: brown. Black: check DO, sludge',hi:'नॉर्मल: भूरा। काला: DO, स्लज चेक',tone:'ok'}]},shot:'Checklist row Aeration tank colour highlights; brown sample beside a black one.',en:'Aeration tank colour: normal is brown biological sludge. If black, check DO and sludge condition.',hi:'एरेशन टैंक का रंग: नॉर्मल है भूरा बायोलॉजिकल स्लज। काला हो तो DO और स्लज की हालत चेक करें।'},
  {v:{k:'cards',items:[{i:'🫧',title:{en:'DO level',hi:'DO लेवल'},en:'1.5 to 3.0 mg/L',hi:'1.5 से 3.0 mg/L',tone:'ok'}]},shot:'Checklist row DO level highlights; DO meter reads 2.0 mg/L.',en:'DO level: normal is 1.5 to 3.0 mg/L. If not, check blower, diffuser and air valve.',hi:'DO लेवल: नॉर्मल है 1.5 से 3.0 mg/L। न हो तो ब्लोअर, डिफ्यूज़र और एयर वाल्व चेक करें।'},
  {v:{k:'cards',items:[{i:'💨',title:{en:'Air bubbling',hi:'हवा के बुलबुले'},en:'Uniform bubbling',hi:'एक जैसे बुलबुले',tone:'ok'}]},shot:'Checklist row Air bubbling highlights; even bubbles across the tank.',en:'Air bubbling: normal is uniform bubbling. If not, check diffuser and air distribution.',hi:'हवा के बुलबुले: नॉर्मल है एक जैसे बुलबुले। न हो तो डिफ्यूज़र और हवा का बँटवारा चेक करें।'},
  {v:{k:'cards',items:[{i:'🌀',title:{en:'Blower',hi:'ब्लोअर'},en:'Smooth running',hi:'आराम से चल रहा',tone:'ok'}]},shot:'Checklist row Blower highlights; blower hums smoothly; avatar points to the phone icon.',en:'Blower: normal is smooth running. Inform your supervisor if there is a trip, noise or vibration.',hi:'ब्लोअर: नॉर्मल है आराम से चलना। ट्रिप, आवाज़ या वाइब्रेशन हो तो सुपरवाइज़र को बताएँ।'},
  {v:{k:'cards',items:[{i:'🟤',title:{en:'MLSS',hi:'MLSS'},en:'As per plant design',hi:'प्लांट डिज़ाइन के अनुसार',tone:'ok'}]},shot:'Checklist row MLSS highlights; beaker of mixed liquor beside it.',en:'MLSS: normal is as per plant design. Inform your supervisor if it is very low or very high.',hi:'MLSS: नॉर्मल है प्लांट डिज़ाइन के अनुसार। बहुत कम या बहुत ज़्यादा हो तो सुपरवाइज़र को बताएँ।'},
  {v:{k:'cards',items:[{i:'⏳',title:{en:'Sludge settling',hi:'स्लज सेटलिंग'},en:'Good settling in 30 minutes',hi:'30 मिनट में अच्छी सेटलिंग',tone:'ok'}]},shot:'Checklist row Sludge settling highlights; cylinder with a 30-minute clock.',en:'Sludge settling: normal is good settling in 30 minutes. If not, check SVI, SV30, DO and sludge wasting.',hi:'स्लज सेटलिंग: नॉर्मल है 30 मिनट में अच्छी सेटलिंग। न हो तो SVI, SV30, DO और स्लज वेस्टिंग चेक करें।'},
  {v:{k:'cards',items:[{i:'💧',title:{en:'Clarifier outlet',hi:'क्लैरिफ़ायर आउटलेट'},en:'Clear water',hi:'साफ़ पानी',tone:'ok'},{i:'🔄',title:{en:'RAS pump',hi:'RAS पंप'},en:'Running as per schedule',hi:'शेड्यूल के अनुसार चालू',tone:'ok'}]},shot:'Checklist rows Clarifier outlet and RAS pump highlight; clear overflow and a running pump.',en:'Clarifier outlet: normal is clear water. If not, check MLSS, RAS and sludge blanket. RAS pump: normal is running on schedule. If not, check pump and valve.',hi:'क्लैरिफ़ायर आउटलेट: नॉर्मल है साफ़ पानी। न हो तो MLSS, RAS और स्लज ब्लैंकेट चेक करें। RAS पंप: नॉर्मल है शेड्यूल के अनुसार चलना। न हो तो पंप और वाल्व चेक करें।'},
  {v:{k:'cards',items:[{i:'🚛',title:{en:'Sludge wasting',hi:'स्लज वेस्टिंग'},en:'As per schedule',hi:'शेड्यूल के अनुसार',tone:'ok'},{i:'👃',title:{en:'Smell',hi:'गंध'},en:'No strong septic smell',hi:'तेज़ सेप्टिक गंध नहीं',tone:'ok'}]},shot:'Checklist rows Sludge wasting and Smell highlight; calendar icon and avatar sniffing.',en:'Sludge wasting: normal is as per schedule. Inform your supervisor before any adjustment. Smell: normal is no strong septic smell. If there is, check aeration and sludge condition.',hi:'स्लज वेस्टिंग: नॉर्मल है शेड्यूल के अनुसार। कोई बदलाव करने से पहले सुपरवाइज़र को बताएँ। गंध: नॉर्मल है तेज़ सेप्टिक गंध न होना। हो तो एरेशन और स्लज की हालत चेक करें।'},

  {v:{k:'board',items:[{i:'🧪',en:'Less BOD and COD',hi:'कम BOD और COD'},{i:'💧',en:'Clear treated water',hi:'साफ़ ट्रीटेड पानी'},{i:'⚪',en:'Very low outlet TSS',hi:'बहुत कम आउटलेट TSS'},{i:'🟤',en:'Sludge stays in reactor',hi:'स्लज रिएक्टर में रहता है'}]},shot:'Four benefit icons pop in one by one.',en:'MBR reduces BOD and COD, gives clear water with very low outlet TSS, and keeps the sludge inside the reactor.',hi:'MBR BOD और COD घटाता है, बहुत कम आउटलेट TSS वाला साफ़ पानी देता है, और स्लज को रिएक्टर के अंदर रखता है।'},
  {v:{k:'board',items:[{i:'🚫',en:'Less sludge carryover',hi:'कम स्लज कैरीओवर'},{i:'📈',en:'Higher MLSS',hi:'ज़्यादा MLSS'},{i:'📏',en:'Less clarifier space',hi:'क्लैरिफ़ायर की कम जगह'},{i:'♻️',en:'Better reuse quality',hi:'बेहतर रीयूज़ क्वालिटी'},{i:'✅',en:'Stable treatment',hi:'स्थिर ट्रीटमेंट'}]},shot:'Five more benefit icons pop in; Ritu counts them on her fingers.',en:'It reduces sludge carryover, runs at higher MLSS, needs less space for clarification, improves reuse quality, and gives stable treatment.',hi:'यह स्लज कैरीओवर घटाता है, ज़्यादा MLSS पर चलता है, क्लैरिफ़िकेशन के लिए कम जगह लेता है, रीयूज़ क्वालिटी सुधारता है, और स्थिर ट्रीटमेंट देता है।'}],

/* 2 ─ Aeration tank (page 2) */
{id:'ch33-intro-b',cat:'field',em:'🫧',title:{en:'What is MBR? Start at the aeration tank (part 2)',hi:'MBR क्या है? शुरुआत एरेशन टैंक से (भाग 2)'},
 lines:[
  {v:{k:'board',items:[{i:'💧',en:'Wastewater',hi:'वेस्टवॉटर'},{i:'🦠',en:'Bacteria',hi:'बैक्टीरिया'},{i:'🫧',en:'Oxygen',hi:'ऑक्सीजन'}]},shot:'Aeration tank cut-away: mixed liquor flows in from the anoxic tank; air from the blower rises through the diffusers.',en:'Now the aeration tank. It is the main biological treatment unit. Wastewater, bacteria and oxygen mix inside this tank.',hi:'अब एरेशन टैंक। यह मुख्य बायोलॉजिकल ट्रीटमेंट यूनिट है। इस टैंक में वेस्टवॉटर, बैक्टीरिया और ऑक्सीजन मिलते हैं।'},

  {v:{k:'cards',items:[{i:'📉',title:{en:'Low DO',hi:'कम DO'},en:'Check blower, air valve, air header, diffuser',hi:'ब्लोअर, एयर वाल्व, एयर हेडर, डिफ्यूज़र चेक',tone:'bad'}]},shot:'DO meter reads low; Ritu points to the blower and the air valve.',en:'Common problems. Low DO: blower not working, low airflow, diffuser choking or high load. Check the blower, air valve, air header and diffuser.',hi:'आम समस्याएँ। कम DO: ब्लोअर नहीं चल रहा, कम हवा, डिफ्यूज़र चोक या ज़्यादा लोड। ब्लोअर, एयर वाल्व, एयर हेडर और डिफ्यूज़र चेक करें।'},

  {v:{k:'cards',items:[{i:'🦨',title:{en:'Bad smell',hi:'बदबू'},en:'Check aeration, mixing, inlet condition',hi:'एरेशन, मिक्सिंग, इनलेट चेक',tone:'bad'}]},shot:'Stink lines over the tank; Ritu checks the mixer and the inlet channel.',en:'Bad smell: low oxygen, stagnant sludge or high organic load. Check aeration, mixing and inlet condition.',hi:'बदबू: कम ऑक्सीजन, रुका हुआ स्लज या ज़्यादा ऑर्गेनिक लोड। एरेशन, मिक्सिंग और इनलेट की हालत चेक करें।'},
  {v:{k:'cards',items:[{i:'🧼',title:{en:'Heavy foam',hi:'ज़्यादा झाग'},en:'Check MLSS, DO, sludge wasting',hi:'MLSS, DO, स्लज वेस्टिंग चेक',tone:'warn'}]},shot:'Thick foam on the tank surface.',en:'Heavy foam: high MLSS, old sludge, detergent or filamentous bacteria. Check MLSS, DO and sludge wasting.',hi:'ज़्यादा झाग: ज़्यादा MLSS, पुराना स्लज, डिटर्जेंट या फ़िलामेंटस बैक्टीरिया। MLSS, DO और स्लज वेस्टिंग चेक करें।'},
  {v:{k:'cards',items:[{i:'🫧',title:{en:'Uneven bubbling',hi:'असमान बुलबुले'},en:'Check diffuser, air valve position',hi:'डिफ्यूज़र, एयर वाल्व पोज़िशन चेक',tone:'warn'}]},shot:'Patchy bubbles; Ritu points to the diffuser line and the air valve.',en:'Uneven bubbling: diffuser choking or poor air distribution. Check the diffuser and air valve position.',hi:'असमान बुलबुले: डिफ्यूज़र चोक या हवा का गलत बँटवारा। डिफ्यूज़र और एयर वाल्व की पोज़िशन चेक करें।'},
  {v:{k:'board',items:[{i:'📟',en:'Proper DO',hi:'सही DO'},{i:'🫧',en:'Uniform bubbling',hi:'एक जैसे बुलबुले'},{i:'🔄',en:'Good mixing',hi:'अच्छी मिक्सिंग'}]},shot:'Operator tip card with three icons; Ritu gives a thumbs up.',en:'Your tip: maintain proper DO, uniform bubbling and good mixing for healthy bacteria.',hi:'आपका टिप: स्वस्थ बैक्टीरिया के लिए सही DO, एक जैसे बुलबुले और अच्छी मिक्सिंग बनाए रखें।'}],

{id:'ch33-membrane',cat:'field',em:'🧱',title:{en:'Membrane tank and membrane module (part 1)',hi:'मेम्ब्रेन टैंक और मेम्ब्रेन मॉड्यूल (भाग 1)'},
 lines:[
  {v:{k:'board',items:[{i:'🧱',en:'Modules submerged',hi:'मॉड्यूल डूबे हुए'},{i:'🟤',en:'Mixed liquor',hi:'मिक्स्ड लिकर'}]},shot:'Cut-away of the membrane tank: five modules under brown mixed liquor.',en:'The membrane tank contains membrane modules submerged in mixed liquor. The membrane separates treated water from sludge and suspended solids.',hi:'मेम्ब्रेन टैंक में मेम्ब्रेन मॉड्यूल मिक्स्ड लिकर में डूबे रहते हैं। मेम्ब्रेन ट्रीटेड पानी को स्लज और सस्पेंडेड सॉलिड्स से अलग करती है।'},
  {v:{k:'board',items:[{i:'🫧',en:'Air scouring bubbles',hi:'एयर स्कावरिंग बुलबुले'},{i:'💧',en:'Permeate suction line',hi:'परमिएट सक्शन लाइन'},{i:'🧼',en:'Floating foam on top',hi:'ऊपर तैरता झाग'}]},shot:'Bubbles below the modules, suction pipe on top; panel reads TMP 18 kPa, suction pressure -35 kPa, permeate flow 120 m3/h, MLSS 7,500 mg/L.',en:'Air scouring bubbles rise below the modules. The permeate outlet is a suction line at the top.',hi:'मॉड्यूल के नीचे एयर स्कावरिंग के बुलबुले उठते हैं। परमिएट आउटलेट ऊपर एक सक्शन लाइन है।'},
  {v:{k:'board',items:[{i:'📏',en:'Tank level',hi:'टैंक लेवल'},{i:'🧱',en:'Modules submerged properly',hi:'मॉड्यूल ठीक से डूबे'},{i:'🫧',en:'Air scouring condition',hi:'एयर स्कावरिंग की हालत'},{i:'💧',en:'Permeate flow',hi:'परमिएट फ्लो'},{i:'📟',en:'Suction pressure and TMP',hi:'सक्शन प्रेशर और TMP'}]},shot:'Green ticks appear over the tank level, modules, bubbles and gauges.',en:'What to check: membrane tank level, modules submerged properly, air scouring condition, permeate flow, suction pressure, TMP.',hi:'क्या चेक करें: मेम्ब्रेन टैंक लेवल, मॉड्यूल ठीक से डूबे हैं, एयर स्कावरिंग की हालत, परमिएट फ्लो, सक्शन प्रेशर, TMP।'},
  {v:{k:'board',items:[{i:'🟤',en:'Sludge concentration',hi:'स्लज कंसंट्रेशन'},{i:'🧼',en:'Foam and floating material',hi:'झाग और तैरता मटीरियल'},{i:'🔍',en:'Membrane surface condition',hi:'मेम्ब्रेन सतह की हालत'},{i:'⚠️',en:'Abnormal leakage',hi:'असामान्य लीकेज'}]},shot:'Ticks over the sludge jar, foam, membrane surface, and a pipe joint.',en:'Then sludge concentration, foam and floating material, membrane surface condition, and any abnormal leakage.',hi:'फिर स्लज कंसंट्रेशन, झाग और तैरता मटीरियल, मेम्ब्रेन सतह की हालत, और कोई असामान्य लीकेज।'},
  {v:{k:'cards',items:[{i:'📉',title:{en:'Low permeate flow',hi:'कम परमिएट फ्लो'},en:'Check TMP, membrane, permeate pump',hi:'TMP, मेम्ब्रेन, परमिएट पंप चेक',tone:'bad'}]},shot:'Flow meter low; Ritu checks the TMP gauge and the pump.',en:'Common problems. Low permeate flow: membrane fouling, choking, high TMP or a pump issue. Check TMP, membrane condition and the permeate pump.',hi:'आम समस्याएँ। कम परमिएट फ्लो: मेम्ब्रेन फ़ाउलिंग, चोकिंग, ज़्यादा TMP या पंप की समस्या। TMP, मेम्ब्रेन की हालत और परमिएट पंप चेक करें।'},

  {v:{k:'cards',items:[{i:'🧼',title:{en:'Heavy foam',hi:'ज़्यादा झाग'},en:'Check MLSS, DO, inlet condition',hi:'MLSS, DO, इनलेट चेक',tone:'warn'}]},shot:'Foam layer on the membrane tank.',en:'Heavy foam: high MLSS, detergent load or biological imbalance. Check MLSS, DO and inlet condition.',hi:'ज़्यादा झाग: ज़्यादा MLSS, डिटर्जेंट लोड या बायोलॉजिकल असंतुलन। MLSS, DO और इनलेट की हालत चेक करें।'},
  {v:{k:'cards',items:[{i:'🧺',title:{en:'Floating solids',hi:'तैरते ठोस'},en:'Remove solids, check upstream screen',hi:'ठोस हटाएँ, ऊपर की स्क्रीन चेक',tone:'warn'}]},shot:'Plastic bits floating on the tank; Ritu scoops them out and walks to the screen.',en:'Floating solids: poor screening or abnormal sludge condition. Remove the floating solids and check the upstream screen.',hi:'तैरते ठोस: खराब स्क्रीनिंग या स्लज की असामान्य हालत। तैरते ठोस हटाएँ और ऊपर की स्क्रीन चेक करें।'},
  {v:{k:'cards',items:[{i:'🫧',title:{en:'Uneven air scouring',hi:'असमान एयर स्कावरिंग'},en:'Check membrane air header, valves',hi:'मेम्ब्रेन एयर हेडर, वाल्व चेक',tone:'warn'}]},shot:'Bubbles on one side only; air header valves.',en:'Uneven air scouring: air valve issue, diffuser choking or airline leakage. Check the membrane air header and valves.',hi:'असमान एयर स्कावरिंग: एयर वाल्व की समस्या, डिफ्यूज़र चोक या एयरलाइन लीकेज। मेम्ब्रेन एयर हेडर और वाल्व चेक करें।'},
  {v:{k:'cards',items:[{i:'🛑',title:{en:'Membrane above water',hi:'मेम्ब्रेन पानी के ऊपर'},en:'Stop suction if required, restore level',hi:'ज़रूरत हो तो सक्शन रोकें, लेवल बहाल',tone:'bad'}]},shot:'Tank level drops and the top of a module shows above the water; red warning; level rises back.',en:'Membrane exposed above water: low tank level or level-control fault. Stop suction if required and restore a safe level.',hi:'मेम्ब्रेन पानी के ऊपर दिख रही है: टैंक लेवल कम या लेवल-कंट्रोल में खराबी। ज़रूरत हो तो सक्शन रोकें और सुरक्षित लेवल बहाल करें।'},

/* 4 ─ Membrane module (page 4) */
{id:'ch33-membrane-b',cat:'field',em:'🧵',title:{en:'Membrane tank and membrane module (part 2)',hi:'मेम्ब्रेन टैंक और मेम्ब्रेन मॉड्यूल (भाग 2)'},
 lines:[
  {v:{k:'board',items:[{i:'🧵',en:'Fine fibers or flat sheets',hi:'बारीक फ़ाइबर या फ़्लैट शीट'}]},shot:'One module lifted out: thin fibers in a frame.',en:'Inside the tank is the membrane module. It contains many fine membrane fibers or flat-sheet membranes.',hi:'टैंक के अंदर मेम्ब्रेन मॉड्यूल है। इसमें बहुत सारे बारीक मेम्ब्रेन फ़ाइबर या फ़्लैट-शीट मेम्ब्रेन होते हैं।'},
  {v:{k:'board',items:[{i:'💧',en:'Water passes through pores',hi:'पानी पोर से गुज़रता है',ok:true},{i:'🟤',en:'Solids and sludge stay outside',hi:'ठोस और स्लज बाहर रहते हैं'}]},shot:'Arrows of water passing into the fiber; brown particles staying outside.',en:'Water passes through the membrane pores. Suspended solids and biological sludge remain outside.',hi:'पानी मेम्ब्रेन के पोर से गुज़रता है। सस्पेंडेड सॉलिड्स और बायोलॉजिकल स्लज बाहर रह जाते हैं।'},
  {v:{k:'board',items:[{i:'🔍',en:'Physical condition',hi:'फ़िज़िकल हालत'},{i:'🧵',en:'Fiber breakage, sheet damage',hi:'फ़ाइबर टूटना, शीट डैमेज'},{i:'💧',en:'Permeate clarity',hi:'परमिएट की साफ़ी'},{i:'🧱',en:'Membrane fouling',hi:'मेम्ब्रेन फ़ाउलिंग'},{i:'🫧',en:'Air-scouring pattern',hi:'एयर-स्कावरिंग पैटर्न'},{i:'📟',en:'Pressure variation',hi:'प्रेशर में बदलाव'},{i:'🎨',en:'Abnormal colour in permeate',hi:'परमिएट में असामान्य रंग'},{i:'🔩',en:'Connection leakage',hi:'कनेक्शन लीकेज'}]},shot:'Eight check icons around the module.',en:'Check the module: physical condition, fiber breakage or sheet damage, permeate clarity, membrane fouling, air-scouring pattern, pressure variation, any abnormal colour in the permeate, and module connection leakage.',hi:'मॉड्यूल चेक करें: फ़िज़िकल हालत, फ़ाइबर टूटना या शीट डैमेज, परमिएट की साफ़ी, मेम्ब्रेन फ़ाउलिंग, एयर-स्कावरिंग पैटर्न, प्रेशर में बदलाव, परमिएट में कोई असामान्य रंग, और मॉड्यूल कनेक्शन में लीकेज।'},
  {v:{k:'cards',items:[{i:'🥛',title:{en:'Cloudy permeate',hi:'धुंधला परमिएट'},en:'Stop affected train, inform supervisor',hi:'प्रभावित ट्रेन रोकें, सुपरवाइज़र को बताएँ',tone:'bad'}]},shot:'Cloudy water in a glass; train valve closed with a red tag; phone call.',en:'Module problems. Cloudy permeate: membrane damage, broken fiber, seal leakage or connection problem. Stop the affected train and inform your supervisor.',hi:'मॉड्यूल की समस्याएँ। धुंधला परमिएट: मेम्ब्रेन डैमेज, टूटा फ़ाइबर, सील लीकेज या कनेक्शन की समस्या। प्रभावित ट्रेन रोकें और सुपरवाइज़र को बताएँ।'},
  {v:{k:'cards',items:[{i:'📉',title:{en:'Reduced output',hi:'आउटपुट कम'},en:'Check TMP, start cleaning as instructed',hi:'TMP चेक, निर्देश पर क्लीनिंग शुरू',tone:'warn'}]},shot:'Flow meter dropping; CIP skid being readied.',en:'Reduced membrane output: fouling, scaling or sludge deposition. Check TMP and start cleaning as instructed.',hi:'मेम्ब्रेन आउटपुट कम: फ़ाउलिंग, स्केलिंग या स्लज जमना। TMP चेक करें और निर्देश के अनुसार क्लीनिंग शुरू करें।'},
  {v:{k:'cards',items:[{i:'📈',title:{en:'Rapid pressure rise',hi:'प्रेशर तेज़ी से बढ़ा'},en:'Check air scouring, cleaning need',hi:'एयर स्कावरिंग, क्लीनिंग की ज़रूरत चेक',tone:'bad'}]},shot:'Gauge needle climbing fast; weak bubbles under the module.',en:'Rapid pressure increase: membrane choking or inadequate air scouring. Check air scouring and the cleaning requirement.',hi:'प्रेशर तेज़ी से बढ़ना: मेम्ब्रेन चोक या कम एयर स्कावरिंग। एयर स्कावरिंग और क्लीनिंग की ज़रूरत चेक करें।'},
  {v:{k:'cards',items:[{i:'🧵',title:{en:'Fiber damage',hi:'फ़ाइबर डैमेज'},en:'Isolate module, inform maintenance',hi:'मॉड्यूल अलग करें, मेंटेनेंस को बताएँ',tone:'bad'}]},shot:'Broken fiber close-up; module valve closed.',en:'Membrane fiber damage: excess pressure, rough handling or chemical damage. Isolate the module and inform maintenance.',hi:'मेम्ब्रेन फ़ाइबर डैमेज: ज़्यादा प्रेशर, लापरवाही से हैंडलिंग या केमिकल डैमेज। मॉड्यूल अलग करें और मेंटेनेंस को बताएँ।'},
  {v:{k:'cards',items:[{i:'🟤',title:{en:'Sludge on membrane',hi:'मेम्ब्रेन पर स्लज'},en:'Check membrane blower, sludge condition',hi:'मेम्ब्रेन ब्लोअर, स्लज की हालत चेक',tone:'warn'}]},shot:'Sludge cake on a sheet; blower room.',en:'Sludge deposited on the membrane: low air scouring or very high MLSS. Check the membrane blower and sludge condition.',hi:'मेम्ब्रेन पर स्लज जमा: कम एयर स्कावरिंग या बहुत ज़्यादा MLSS। मेम्ब्रेन ब्लोअर और स्लज की हालत चेक करें।'},
  {v:{k:'cards',items:[{i:'🧪',title:{en:'Chemical smell in permeate',hi:'परमिएट में केमिकल गंध'},en:'Stop supplying, rinse membrane properly',hi:'सप्लाई रोकें, मेम्ब्रेन ठीक से रिंस करें',tone:'bad'}]},shot:'Nose icon over a permeate sample; rinse water running; takeaway card.',en:'Chemical smell in permeate: incomplete rinsing after CIP. Stop supplying and rinse the membrane properly. Keep modules clean, keep air scouring proper, and watch permeate quality.',hi:'परमिएट में केमिकल की गंध: CIP के बाद अधूरी रिंसिंग। सप्लाई रोकें और मेम्ब्रेन ठीक से रिंस करें। मॉड्यूल साफ़ रखें, एयर स्कावरिंग सही रखें, और परमिएट क्वालिटी पर नज़र रखें।'}],
 activity:{type:'choice',prompt:{en:'The tank level dropped. Membrane modules are exposed above the water. What do you do?',hi:'टैंक लेवल गिर गया। मेम्ब्रेन मॉड्यूल पानी के ऊपर दिख रहे हैं। आप क्या करेंगे?'},options:[{i:'🛑',en:'Stop suction if required and restore a safe level',hi:'ज़रूरत हो तो सक्शन रोकें और सुरक्षित लेवल बहाल करें',ok:true},{i:'📈',en:'Run the permeate pump faster',hi:'परमिएट पंप तेज़ चलाएँ',ok:false},{i:'⏳',en:'Wait for the next shift',hi:'अगली शिफ़्ट का इंतज़ार करें',ok:false}]},
 remember:{en:'Modules always under water. Cloudy permeate: stop the train, inform supervisor.',hi:'मॉड्यूल हमेशा पानी के नीचे। धुंधला परमिएट: ट्रेन रोको, सुपरवाइज़र को बताओ।'}},

/* 5 ─ Air scouring (page 5) */
{id:'ch33-air',cat:'field',em:'🫧',title:{en:'Air scouring: bubbles that clean the membrane',hi:'एयर स्कावरिंग: मेम्ब्रेन साफ़ रखने वाले बुलबुले'},
 lines:[
  {v:{k:'flow',items:[{i:'🌀',en:'Membrane blower',hi:'मेम्ब्रेन ब्लोअर'},{i:'🔩',en:'Air header',hi:'एयर हेडर'},{i:'🫧',en:'Coarse bubbles',hi:'मोटे बुलबुले'},{i:'🧱',en:'Membrane modules',hi:'मेम्ब्रेन मॉड्यूल'}]},shot:'Blower outside the tank, air header under the modules, big bubbles rising up along the fibers.',en:'Air scouring provides coarse air bubbles below the membrane modules. The membrane blower sends air through the air header. The bubbles rise along the membrane surface.',hi:'एयर स्कावरिंग मेम्ब्रेन मॉड्यूल के नीचे मोटे हवा के बुलबुले देती है। मेम्ब्रेन ब्लोअर एयर हेडर से हवा भेजता है। बुलबुले मेम्ब्रेन की सतह के साथ ऊपर उठते हैं।'},
  {v:{k:'board',items:[{i:'🫧',en:'Bubbles shake the membrane',hi:'बुलबुले मेम्ब्रेन हिलाते हैं'},{i:'🧼',en:'Clean the surface',hi:'सतह साफ़ करते हैं'},{i:'🟤',en:'Less sludge deposition',hi:'कम स्लज जमाव',ok:true},{i:'🧱',en:'Less membrane fouling',hi:'कम मेम्ब्रेन फ़ाउलिंग',ok:true}]},shot:'Sludge flakes fall off a fiber as bubbles pass; a clean fiber with a green tick.',en:'These bubbles shake and clean the membrane surface. This reduces sludge deposition and membrane fouling. Proper air scouring means clean membranes and stable MBR performance.',hi:'ये बुलबुले मेम्ब्रेन की सतह को हिलाते और साफ़ करते हैं। इससे स्लज का जमना और मेम्ब्रेन फ़ाउलिंग कम होती है। सही एयर स्कावरिंग मतलब साफ़ मेम्ब्रेन और स्थिर MBR परफ़ॉर्मेंस।'},
  {v:{k:'board',items:[{i:'🌀',en:'Membrane blower running',hi:'मेम्ब्रेन ब्लोअर चल रहा'},{i:'📟',en:'Air pressure and flow',hi:'हवा का प्रेशर और फ्लो'},{i:'🫧',en:'Uniform bubbling below modules',hi:'मॉड्यूल के नीचे एक जैसे बुलबुले'},{i:'🔩',en:'Air valve position',hi:'एयर वाल्व पोज़िशन'}]},shot:'Ritu at the blower: running lamp, pressure gauge; then even bubbles in the tank.',en:'What to check: membrane blower running status, air pressure and flow, uniform bubbling below the modules, air valve position.',hi:'क्या चेक करें: मेम्ब्रेन ब्लोअर चल रहा है, हवा का प्रेशर और फ्लो, मॉड्यूल के नीचे एक जैसे बुलबुले, एयर वाल्व की पोज़िशन।'},
  {v:{k:'board',items:[{i:'💨',en:'Air-header leakage',hi:'एयर-हेडर लीकेज'},{i:'🕳️',en:'Diffuser choking',hi:'डिफ्यूज़र चोक'},{i:'🔊',en:'Noise and vibration',hi:'आवाज़ और वाइब्रेशन'},{i:'🔄',en:'Standby blower condition',hi:'स्टैंडबाय ब्लोअर की हालत'}]},shot:'Soap test on the air header; Ritu listens to the blower; standby blower selector.',en:'Then air-header leakage, diffuser choking, abnormal noise and vibration, and the standby blower condition.',hi:'फिर एयर-हेडर लीकेज, डिफ्यूज़र चोक, असामान्य आवाज़ और वाइब्रेशन, और स्टैंडबाय ब्लोअर की हालत।'},
  {v:{k:'cards',items:[{i:'🛑',title:{en:'Weak or no air scouring',hi:'कमज़ोर या कोई स्कावरिंग नहीं'},en:'Check blower, valve position, fix leakage',hi:'ब्लोअर, वाल्व पोज़िशन चेक, लीकेज ठीक करें',tone:'bad'}]},shot:'Tank with no bubbles; blower trip lamp; closed valve.',en:'Common problems. Weak or no air scouring: blower trip, air valve closed or airline leakage. Check the blower, check the valve position, and fix the leakage.',hi:'आम समस्याएँ। कमज़ोर या कोई एयर स्कावरिंग नहीं: ब्लोअर ट्रिप, एयर वाल्व बंद या एयरलाइन लीकेज। ब्लोअर और वाल्व की पोज़िशन चेक करें, और लीकेज ठीक करें।'},
  {v:{k:'cards',items:[{i:'🫧',title:{en:'Uneven bubbling',hi:'असमान बुलबुले'},en:'Clean diffusers, check air header',hi:'डिफ्यूज़र साफ़ करें, एयर हेडर चेक',tone:'warn'}]},shot:'Patchy bubbles; diffuser being cleaned.',en:'Uneven bubbling: diffuser choking or air header blockage. Clean the diffusers and check the air header.',hi:'असमान बुलबुले: डिफ्यूज़र चोक या एयर हेडर ब्लॉक। डिफ्यूज़र साफ़ करें और एयर हेडर चेक करें।'},
  {v:{k:'cards',items:[{i:'📉',title:{en:'Low air pressure or flow',hi:'कम हवा प्रेशर या फ्लो'},en:'Check blower performance, air filter',hi:'ब्लोअर परफ़ॉर्मेंस, एयर फ़िल्टर चेक',tone:'warn'}]},shot:'Pressure gauge low; dirty air filter pulled out.',en:'Low air pressure or flow: blower problem, filter choking or regulator issue. Check blower performance and the air filter.',hi:'हवा का प्रेशर या फ्लो कम: ब्लोअर की समस्या, फ़िल्टर चोक या रेगुलेटर की समस्या। ब्लोअर की परफ़ॉर्मेंस और एयर फ़िल्टर चेक करें।'},
  {v:{k:'cards',items:[{i:'⚡',title:{en:'High energy use',hi:'ज़्यादा बिजली खपत'},en:'Check set pressure, optimise air flow',hi:'सेट प्रेशर चेक, एयर फ्लो सही करें',tone:'warn'}]},shot:'Energy meter spinning fast; set-pressure dial.',en:'High energy consumption: blower overloading or unnecessary high flow. Check the set pressure and optimise the air flow.',hi:'ज़्यादा बिजली खपत: ब्लोअर ओवरलोड या बेवजह ज़्यादा फ्लो। सेट प्रेशर चेक करें और एयर फ्लो सही करें।'},
  {v:{k:'cards',items:[{i:'🔊',title:{en:'Noise and vibration',hi:'आवाज़ और वाइब्रेशन'},en:'Inspect blower, tighten, correct it',hi:'ब्लोअर जाँचें, कसें, ठीक करें',tone:'bad'}]},shot:'Blower shaking on loose bolts; spanner tightening.',en:'Abnormal noise and vibration: blower bearing issue, loose foundation or piping. Inspect the blower, tighten, and take corrective action.',hi:'असामान्य आवाज़ और वाइब्रेशन: ब्लोअर बेयरिंग की समस्या, ढीली फ़ाउंडेशन या पाइपिंग। ब्लोअर जाँचें, कसें, और सुधार करें।'},
  {v:{k:'cards',items:[{i:'🔄',title:{en:'Standby blower not ready',hi:'स्टैंडबाय ब्लोअर तैयार नहीं'},en:'Keep it in auto and ready',hi:'ऑटो और तैयार हालत में रखें',tone:'warn'}]},shot:'Standby blower selector turned to AUTO; valve opened.',en:'Standby blower not ready: not in auto, maintenance pending or valve closed. Keep the standby blower in auto and ready condition.',hi:'स्टैंडबाय ब्लोअर तैयार नहीं: ऑटो में नहीं, मेंटेनेंस बाकी या वाल्व बंद। स्टैंडबाय ब्लोअर को ऑटो और तैयार हालत में रखें।'}],
 activity:{type:'match',prompt:{en:'Match the air scouring problem with your action.',hi:'एयर स्कावरिंग की समस्या को सही एक्शन से जोड़ें।'},pairs:[{l:{i:'🛑',en:'Weak or no air scouring',hi:'कमज़ोर या कोई स्कावरिंग नहीं'},r:{i:'🌀',en:'Check blower, valve, fix leakage',hi:'ब्लोअर, वाल्व चेक, लीकेज ठीक'}},{l:{i:'🫧',en:'Uneven bubbling',hi:'असमान बुलबुले'},r:{i:'🧼',en:'Clean diffusers, check air header',hi:'डिफ्यूज़र साफ़, एयर हेडर चेक'}},{l:{i:'🔄',en:'Standby blower not ready',hi:'स्टैंडबाय ब्लोअर तैयार नहीं'},r:{i:'✅',en:'Keep it in auto and ready',hi:'ऑटो और तैयार रखें'}}]},
 remember:{en:'Uniform bubbles below every module. Standby blower in auto.',hi:'हर मॉड्यूल के नीचे एक जैसे बुलबुले। स्टैंडबाय ब्लोअर ऑटो में।'}},

/* 6 ─ Permeate pump (page 6) */
{id:'ch33-permeate',cat:'field',em:'🔧',title:{en:'Permeate pump, flow and water quality (part 1)',hi:'परमिएट पंप, फ्लो और पानी की क्वालिटी (भाग 1)'},
 lines:[
  {v:{k:'flow',items:[{i:'🧱',en:'Membrane tank',hi:'मेम्ब्रेन टैंक'},{i:'⬅️',en:'Suction',hi:'सक्शन'},{i:'🔧',en:'Permeate pump',hi:'परमिएट पंप'}]},shot:'Pump beside the membrane tank; suction gauge on the inlet pipe.',en:'The permeate pump creates suction and pulls treated water through the membrane. It pulls the water from the membrane tank on the suction side.',hi:'परमिएट पंप सक्शन बनाता है और ट्रीटेड पानी को मेम्ब्रेन से खींचता है। सक्शन साइड पर यह मेम्ब्रेन टैंक से पानी खींचता है।'},
  {v:{k:'flow',items:[{i:'🔧',en:'Permeate pump',hi:'परमिएट पंप'},{i:'➡️',en:'Discharge',hi:'डिस्चार्ज'},{i:'💧',en:'Permeate line',hi:'परमिएट लाइन'}]},shot:'Arrow from the pump outlet to the permeate line.',en:'It pushes the water to the permeate line on the discharge side.',hi:'डिस्चार्ज साइड पर यह पानी को परमिएट लाइन में भेजता है।'},

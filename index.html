{id:'ch33-tmp',cat:'field',em:'📟',title:{en:'TMP and the backwash cycle (part 1)',hi:'TMP और बैकवॉश साइकिल (भाग 1)'},
 lines:[
  {v:{k:'board',items:[{i:'📟',en:'Pressure difference',hi:'प्रेशर का फ़र्क'},{i:'🧱',en:'Across the membrane',hi:'मेम्ब्रेन के आर-पार'}]},shot:'Membrane tank with a TMP gauge between the permeate side (low pressure) and the suction side (high pressure).',en:'TMP means transmembrane pressure. It is the pressure difference across the membrane.',hi:'TMP मतलब ट्रांसमेम्ब्रेन प्रेशर। यह मेम्ब्रेन के आर-पार प्रेशर का फ़र्क है।'},
  {v:{k:'board',items:[{i:'💧',en:'How hard water passes',hi:'पानी कितनी मुश्किल से गुज़रता है'},{i:'📈',en:'Higher TMP, more difficulty',hi:'ज़्यादा TMP, ज़्यादा मुश्किल'}]},shot:'Water squeezing through a clogged membrane; gauge rising.',en:'It tells how difficult it is for water to pass through the membrane. Higher TMP means water is passing with more difficulty.',hi:'यह बताता है कि पानी को मेम्ब्रेन से गुज़रने में कितनी मुश्किल हो रही है। ज़्यादा TMP मतलब पानी ज़्यादा मुश्किल से गुज़र रहा है।'},
  {v:{k:'range',label:'TMP',unit:'bar',min:0,max:1,value:0.3,zones:[{to:0.5,c:'ok',en:'Below 0.5: safe',hi:'0.5 से नीचे: सुरक्षित'},{to:1,c:'bad',en:'Above 0.5: stop, inform',hi:'0.5 से ऊपर: रोको, बताओ'}]},shot:'Gauge 0 to 1.0 bar; green up to 0.5, red beyond; needle at 0.3.',en:'TMP should not cross 0.5 bar. Keep TMP below 0.5 bar for safe operation.',hi:'TMP 0.5 bar से ऊपर नहीं जाना चाहिए। सुरक्षित ऑपरेशन के लिए TMP 0.5 bar से नीचे रखें।'},
  {v:{k:'range',label:'TMP',unit:'bar',min:0,max:1,value:0.3,zones:[{to:0.5,c:'ok',en:'Below 0.5: safe',hi:'0.5 से नीचे: सुरक्षित'},{to:1,c:'bad',en:'Above 0.5: stop, inform',hi:'0.5 से ऊपर: रोको, बताओ'}]},shot:'Ritu reads the panel and writes the value in the logbook.',en:'Read it on the TMP gauge or the panel every day and write it in the logbook.',hi:'इसे रोज़ TMP गेज या पैनल पर पढ़ें और लॉगबुक में लिखें।'},
  {v:{k:'cards',items:[{i:'✅',title:{en:'Low and stable',hi:'कम और स्थिर'},en:'Clean membrane',hi:'साफ़ मेम्ब्रेन',tone:'ok'},{i:'📈',title:{en:'Gradually increasing',hi:'धीरे-धीरे बढ़ रहा'},en:'Membrane fouling',hi:'मेम्ब्रेन फ़ाउलिंग',tone:'warn'}]},shot:'Two trend graphs: flat line, slow rise.',en:'Understand the trend. Low and stable TMP generally means a clean membrane. Gradually increasing TMP means membrane fouling.',hi:'ट्रेंड समझें। कम और स्थिर TMP आम तौर पर साफ़ मेम्ब्रेन बताता है। धीरे-धीरे बढ़ता TMP मेम्ब्रेन फ़ाउलिंग बताता है।'},
  {v:{k:'cards',items:[{i:'⚠️',title:{en:'Sudden change',hi:'अचानक बदलाव'},en:'Blockage, valve, sensor or damage',hi:'ब्लॉकेज, वाल्व, सेंसर या डैमेज',tone:'bad'}]},shot:'Trend graph with a sharp jump; warning icon.',en:'A sudden TMP change may mean blockage, a valve issue, a sensor problem or membrane damage. Monitor the trend and act early.',hi:'अचानक TMP बदले तो ब्लॉकेज, वाल्व की समस्या, सेंसर की खराबी या मेम्ब्रेन डैमेज हो सकता है। ट्रेंड पर नज़र रखें और जल्दी एक्शन लें।'},
  {v:{k:'board',items:[{i:'📟',en:'TMP reading',hi:'TMP रीडिंग'},{i:'📈',en:'TMP trend',hi:'TMP ट्रेंड'},{i:'⬅️',en:'Suction pressure',hi:'सक्शन प्रेशर'},{i:'💧',en:'Permeate flow',hi:'परमिएट फ्लो'},{i:'📒',en:'Cleaning history',hi:'क्लीनिंग हिस्ट्री'},{i:'🔌',en:'Pressure transmitter',hi:'प्रेशर ट्रांसमीटर'},{i:'⚠️',en:'Sudden rise or fall',hi:'अचानक बढ़ना या गिरना'}]},shot:'Logbook page with a TMP column; Ritu taps the pressure transmitter.',en:'What to check: TMP reading, TMP trend, suction pressure, permeate flow, membrane cleaning history, pressure transmitter condition, and any sudden increase or decrease.',hi:'क्या चेक करें: TMP रीडिंग, TMP ट्रेंड, सक्शन प्रेशर, परमिएट फ्लो, मेम्ब्रेन क्लीनिंग हिस्ट्री, प्रेशर ट्रांसमीटर की हालत, और कोई अचानक बढ़ना या गिरना।'},
  {v:{k:'cards',items:[{i:'📈',title:{en:'TMP rising slowly',hi:'TMP धीरे बढ़ रहा'},en:'Monitor trend, plan cleaning',hi:'ट्रेंड देखें, क्लीनिंग प्लान करें',tone:'warn'}]},shot:'Gauge climbing slowly; cleaning date marked on a calendar.',en:'Common problems. TMP increasing slowly: normal fouling or sludge deposition. Monitor the trend and plan cleaning.',hi:'आम समस्याएँ। TMP धीरे बढ़ रहा: सामान्य फ़ाउलिंग या स्लज जमना। ट्रेंड देखें और क्लीनिंग प्लान करें।'},
  {v:{k:'cards',items:[{i:'🚀',title:{en:'TMP rising rapidly',hi:'TMP तेज़ी से बढ़ रहा'},en:'Check air scouring, start cleaning as instructed',hi:'एयर स्कावरिंग चेक, निर्देश पर क्लीनिंग शुरू',tone:'bad'}]},shot:'Gauge climbing fast; bubbles missing under the modules.',en:'TMP increasing rapidly: severe fouling, choking or loss of air scouring. Check air scouring and start cleaning as instructed.',hi:'TMP तेज़ी से बढ़ रहा: गंभीर फ़ाउलिंग, चोकिंग या एयर स्कावरिंग बंद। एयर स्कावरिंग चेक करें और निर्देश के अनुसार क्लीनिंग शुरू करें।'},
  {v:{k:'cards',items:[{i:'🛑',title:{en:'Very high TMP, above 0.5 bar',hi:'बहुत ज़्यादा TMP, 0.5 bar से ऊपर'},en:'Stop excessive suction, inform supervisor',hi:'ज़्यादा सक्शन रोकें, सुपरवाइज़र को बताएँ',tone:'bad'}]},shot:'Needle in red past 0.5; suction reduced; phone call.',en:'Very high TMP, above 0.5 bar: membrane heavily choked. Stop excessive suction and inform your supervisor.',hi:'बहुत ज़्यादा TMP, 0.5 bar से ऊपर: मेम्ब्रेन बुरी तरह चोक। ज़्यादा सक्शन रोकें और सुपरवाइज़र को बताएँ।'}],
 activity:{type:'choice',prompt:{en:'TMP is rising rapidly. What do you do?',hi:'TMP तेज़ी से बढ़ रहा है। आप क्या करेंगे?'},options:[{i:'🫧',en:'Check air scouring and start cleaning as instructed',hi:'एयर स्कावरिंग चेक करें और निर्देश के अनुसार क्लीनिंग शुरू करें',ok:true},{i:'📈',en:'Increase suction to pull more water',hi:'ज़्यादा पानी खींचने के लिए सक्शन बढ़ाएँ',ok:false},{i:'⏳',en:'Wait until it crosses 0.5 bar',hi:'0.5 bar पार होने तक इंतज़ार करें',ok:false}]},

/* 9 ─ Backwash cycle (page 9) */
{id:'ch33-tmp-b',cat:'field',em:'🔄',title:{en:'TMP and the backwash cycle (part 2)',hi:'TMP और बैकवॉश साइकिल (भाग 2)'},
 lines:[
  {v:{k:'board',items:[{i:'⏸️',en:'Permeate pump stops',hi:'परमिएट पंप रुकता है'},{i:'🫧',en:'Air scouring continues',hi:'एयर स्कावरिंग चलती रहती है'}]},shot:'Permeate pump icon switches OFF; bubbles keep rising.',en:'TMP is kept in control by the backwash cycle. During relaxation, the permeate pump stops for a short period while membrane air scouring continues.',hi:'बैकवॉश साइकिल से TMP कंट्रोल में रहता है। रिलैक्सेशन में परमिएट पंप थोड़ी देर रुकता है, जबकि मेम्ब्रेन की एयर स्कावरिंग चलती रहती है।'},
  {v:{k:'board',items:[{i:'💧',en:'Clean permeate',hi:'साफ़ परमिएट'},{i:'🔄',en:'Reverse direction',hi:'उल्टी दिशा'},{i:'🧱',en:'Through the membrane',hi:'मेम्ब्रेन से होकर'}]},shot:'Arrows flip: clean water pushed from inside the fiber to outside.',en:'Backwash sends clean permeate in the reverse direction through the membrane, where applicable.',hi:'बैकवॉश साफ़ परमिएट को उल्टी दिशा में मेम्ब्रेन से भेजता है, जहाँ यह सुविधा हो।'},
  {v:{k:'flow',items:[{i:'💧',en:'Filtration',hi:'फ़िल्ट्रेशन'},{i:'⏸️',en:'Relaxation',hi:'रिलैक्सेशन'},{i:'🔄',en:'Backwash',hi:'बैकवॉश'},{i:'⏸️',en:'Relaxation',hi:'रिलैक्सेशन'},{i:'💧',en:'Filtration',hi:'फ़िल्ट्रेशन'}]},shot:'Five-phase loop animation.',en:'The cycle has five phases: filtration, relaxation, backwash, relaxation again, and return to filtration.',hi:'साइकिल के पाँच फ़ेज़ हैं: फ़िल्ट्रेशन, रिलैक्सेशन, बैकवॉश, फिर रिलैक्सेशन, और वापस फ़िल्ट्रेशन।'},
  {v:{k:'steps',items:[{n:1,i:'💧',en:'Filtration: pump ON, outside to inside',hi:'फ़िल्ट्रेशन: पंप ON, बाहर से अंदर'}]},shot:'Table column 1: pump ON, air ON, arrows outside to inside.',en:'Phase one, filtration: the pump is ON and permeate is drawn from outside to inside. This produces treated water.',hi:'फ़ेज़ एक, फ़िल्ट्रेशन: पंप ON है और परमिएट बाहर से अंदर खिंचता है। इससे ट्रीटेड पानी बनता है।'},
  {v:{k:'steps',items:[{n:2,i:'⏸️',en:'Relaxation: pump OFF, no flow',hi:'रिलैक्सेशन: पंप OFF, फ्लो नहीं'}]},shot:'Column 2: pump OFF, air ON, no flow.',en:'Phase two, relaxation: the pump is OFF, no permeate flow. This reduces TMP and relaxes the membrane.',hi:'फ़ेज़ दो, रिलैक्सेशन: पंप OFF, परमिएट फ्लो नहीं। इससे TMP घटता है और मेम्ब्रेन को आराम मिलता है।'},
  {v:{k:'steps',items:[{n:3,i:'🔄',en:'Backwash: pump ON, inside to outside',hi:'बैकवॉश: पंप ON, अंदर से बाहर'}]},shot:'Column 3: pump ON in backwash mode, arrows inside to outside.',en:'Phase three, backwash: the pump runs in backwash mode and clean permeate flows from inside to outside. This cleans the membrane surface.',hi:'फ़ेज़ तीन, बैकवॉश: पंप बैकवॉश मोड में चलता है और साफ़ परमिएट अंदर से बाहर बहता है। इससे मेम्ब्रेन की सतह साफ़ होती है।'},
  {v:{k:'steps',items:[{n:4,i:'⏸️',en:'Relaxation: pump OFF, settle',hi:'रिलैक्सेशन: पंप OFF, सेटल'},{n:5,i:'💧',en:'Return to filtration, repeats',hi:'वापस फ़िल्ट्रेशन, दोहराता है'}]},shot:'Columns 4 and 5: pump OFF then ON; the air scouring row shows ON across all five columns.',en:'Phase four, a short pause again to stabilize before filtration. Phase five, the cycle returns to filtration automatically. Air scouring stays ON in all five phases.',hi:'फ़ेज़ चार, फ़िल्ट्रेशन से पहले फिर छोटा पॉज़। फ़ेज़ पाँच, साइकिल अपने आप फ़िल्ट्रेशन पर लौट आती है। एयर स्कावरिंग पाँचों फ़ेज़ में ON रहती है।'},
  {v:{k:'board',items:[{i:'⏱️',en:'Filtration and relaxation timing',hi:'फ़िल्ट्रेशन और रिलैक्सेशन टाइमिंग'},{i:'🔧',en:'Backwash pump or valve',hi:'बैकवॉश पंप या वाल्व'},{i:'🫧',en:'Air scouring during relaxation',hi:'रिलैक्सेशन में एयर स्कावरिंग'},{i:'📏',en:'Permeate-tank level',hi:'परमिएट-टैंक लेवल'},{i:'📟',en:'Backwash pressure and flow',hi:'बैकवॉश प्रेशर और फ्लो'}]},shot:'PLC screen showing cycle timers; permeate tank level; backwash gauge.',en:'What to check in the cycle: filtration and relaxation timing, backwash pump or valve operation, air scouring during relaxation, permeate-tank level, and backwash pressure and flow.',hi:'साइकिल में क्या चेक करें: फ़िल्ट्रेशन और रिलैक्सेशन की टाइमिंग, बैकवॉश पंप या वाल्व का ऑपरेशन, रिलैक्सेशन के दौरान एयर स्कावरिंग, परमिएट-टैंक लेवल, और बैकवॉश प्रेशर और फ्लो।'},
  {v:{k:'board',items:[{i:'⏱️',en:'Proper cycle timing',hi:'सही साइकिल टाइमिंग'},{i:'📅',en:'Cleaning by TMP trend',hi:'TMP ट्रेंड से क्लीनिंग'},{i:'📒',en:'Regular monitoring',hi:'नियमित मॉनिटरिंग'}]},shot:'Calendar with cleaning dates next to a TMP trend chart.',en:'Keep the cycle timing proper. Follow the cleaning schedule based on the TMP trend. Regular monitoring gives longer membrane life.',hi:'साइकिल की टाइमिंग सही रखें। TMP ट्रेंड के हिसाब से क्लीनिंग शेड्यूल फ़ॉलो करें। नियमित मॉनिटरिंग से मेम्ब्रेन की उम्र बढ़ती है।'}],
 activity:{type:'classify',prompt:{en:'Three TMP readings. Tap the right box for each.',hi:'तीन TMP रीडिंग। हर एक के लिए सही बॉक्स टैप करें।'},items:[{val:'0.2 bar, steady',ans:0},{val:'0.4 bar, rising fast',ans:1},{val:'0.7 bar',ans:2}],cats:[{en:'Stable',hi:'स्थिर',sub:{en:'Clean membrane',hi:'साफ़ मेम्ब्रेन'}},{en:'Rising',hi:'बढ़ रहा',sub:{en:'Check air, start cleaning',hi:'हवा चेक, क्लीनिंग शुरू'}},{en:'High',hi:'ज़्यादा',sub:{en:'Above 0.5 bar: inform',hi:'0.5 bar से ऊपर: बताएँ'}}]},
 remember:{en:'TMP must not cross 0.5 bar. Air scouring ON in every phase.',hi:'TMP 0.5 bar से ऊपर नहीं। एयर स्कावरिंग हर फ़ेज़ में ON।'}},

/* 10 ─ Membrane cleaning, CIP (page 10) */
{id:'ch33-cip',cat:'lab',em:'🧼',title:{en:'Membrane cleaning: CIP',hi:'मेम्ब्रेन क्लीनिंग: CIP'},
 lines:[
  {v:{k:'board',items:[{i:'🧼',en:'Cleaning in Place',hi:'क्लीनिंग इन प्लेस'},{i:'🟤',en:'Removes deposited sludge',hi:'जमा स्लज हटाता है'},{i:'🦠',en:'Removes organic fouling',hi:'ऑर्गेनिक फ़ाउलिंग हटाता है'},{i:'🧱',en:'Removes scaling',hi:'स्केलिंग हटाता है'}]},shot:'CIP tank, CIP pump and membrane module on a skid; Ritu in gloves and goggles.',en:'CIP means Cleaning in Place. Chemical cleaning removes deposited sludge, organic fouling, scaling and other materials from the membrane. Clean membranes perform better.',hi:'CIP मतलब क्लीनिंग इन प्लेस। केमिकल क्लीनिंग मेम्ब्रेन से जमा स्लज, ऑर्गेनिक फ़ाउलिंग, स्केलिंग और दूसरी चीज़ें हटाती है। साफ़ मेम्ब्रेन बेहतर काम करती है।'},
  {v:{k:'cards',items:[{i:'🧴',title:{en:'Sodium hypochlorite, NaOCl',hi:'सोडियम हाइपोक्लोराइट, NaOCl'},en:'For organic fouling',hi:'ऑर्गेनिक फ़ाउलिंग के लिए',tone:'ok'},{i:'🍋',title:{en:'Citric acid',hi:'सिट्रिक एसिड'},en:'For inorganic fouling',hi:'इनऑर्गेनिक फ़ाउलिंग के लिए',tone:'ok'}]},shot:'Two chemical cans: yellow NaOCl and white citric acid, each labelled.',en:'Two common cleaning chemicals. Sodium hypochlorite, NaOCl, is for organic fouling. Citric acid is for inorganic fouling. Use only the chemical and quantity written in the approved procedure.',hi:'दो आम क्लीनिंग केमिकल। सोडियम हाइपोक्लोराइट, NaOCl, ऑर्गेनिक फ़ाउलिंग के लिए। सिट्रिक एसिड इनऑर्गेनिक फ़ाउलिंग के लिए। सिर्फ़ वही केमिकल और मात्रा इस्तेमाल करें जो अप्रूव्ड प्रोसीजर में लिखी है।'},
  {v:{k:'flow',items:[{i:'🛢️',en:'CIP tank',hi:'CIP टैंक'},{i:'🔧',en:'CIP pump',hi:'CIP पंप'},{i:'🔩',en:'Valve',hi:'वाल्व'},{i:'🧱',en:'Membrane module',hi:'मेम्ब्रेन मॉड्यूल'}]},shot:'Green arrows: solution leaves the CIP tank, through the pump and valve, into the module.',en:'The CIP flow: the solution goes from the CIP tank, through the CIP pump and the valve, into the membrane module.',hi:'CIP फ्लो: घोल CIP टैंक से, CIP पंप और वाल्व से होकर, मेम्ब्रेन मॉड्यूल में जाता है।'},
  {v:{k:'flow',items:[{i:'🧱',en:'Membrane module',hi:'मेम्ब्रेन मॉड्यूल'},{i:'🔄',en:'Return to tank',hi:'टैंक में वापस'},{i:'🚿',en:'Drain',hi:'ड्रेन'}]},shot:'Blue arrow from the module back to the CIP tank, or down to the drain.',en:'Then it returns to the tank or goes to drain.',hi:'फिर यह टैंक में लौटता है या ड्रेन में जाता है।'},
  {v:{k:'board',items:[{i:'🛢️',en:'CIP tank cleanliness',hi:'CIP टैंक की सफ़ाई'},{i:'⚗️',en:'Chemical dosing quantity',hi:'केमिकल डोज़िंग की मात्रा'},{i:'🔧',en:'CIP pump operation',hi:'CIP पंप ऑपरेशन'},{i:'🔩',en:'Valve alignment',hi:'वाल्व अलाइनमेंट'},{i:'⏱️',en:'Cleaning and soaking time',hi:'क्लीनिंग और सोकिंग टाइम'}]},shot:'Checklist ticks over the CIP tank, dosing drum, pump, valves and a timer.',en:'What to check: CIP tank cleanliness, chemical dosing quantity, CIP pump operation, valve alignment, cleaning duration, soaking time.',hi:'क्या चेक करें: CIP टैंक की सफ़ाई, केमिकल डोज़िंग की मात्रा, CIP पंप ऑपरेशन, वाल्व अलाइनमेंट, क्लीनिंग का समय, सोकिंग टाइम।'},
  {v:{k:'board',items:[{i:'🔄',en:'Return flow',hi:'रिटर्न फ्लो'},{i:'🚿',en:'Rinsing condition',hi:'रिंसिंग की हालत'},{i:'🧪',en:'pH after final rinse',hi:'फ़ाइनल रिंस के बाद pH'},{i:'🧤',en:'PPE and chemical safety',hi:'PPE और केमिकल सुरक्षा'}]},shot:'Return line flowing; pH meter dipped in the final rinse water; gloves and goggles.',en:'Then return flow, rinsing condition, pH after the final rinse, and PPE and chemical safety.',hi:'फिर रिटर्न फ्लो, रिंसिंग की हालत, फ़ाइनल रिंस के बाद pH, और PPE और केमिकल सुरक्षा।'},
  {v:{k:'cards',items:[{i:'❌',title:{en:'Cleaning not effective',hi:'क्लीनिंग असरदार नहीं'},en:'Inform supervisor, verify approved procedure',hi:'सुपरवाइज़र को बताएँ, अप्रूव्ड प्रोसीजर जाँचें',tone:'warn'}]},shot:'TMP still high after cleaning; procedure sheet checked.',en:'Common problems. Cleaning not effective: wrong chemical strength, insufficient soaking or severe fouling. Inform your supervisor and verify the approved procedure.',hi:'आम समस्याएँ। क्लीनिंग असरदार नहीं: गलत केमिकल स्ट्रेंथ, कम सोकिंग या गंभीर फ़ाउलिंग। सुपरवाइज़र को बताएँ और अप्रूव्ड प्रोसीजर जाँचें।'},

  {v:{k:'cards',items:[{i:'👃',title:{en:'Bad smell',hi:'बदबू'},en:'Check blower, diffuser, inlet',hi:'ब्लोअर, डिफ्यूज़र, इनलेट चेक',tone:'bad'}]},shot:'Stink lines over the tank; the card flips to show the action.',en:'Bad smell? Reason: low DO, poor mixing or septic wastewater. Check the blower, diffuser and inlet condition.',hi:'बदबू? कारण: कम DO, खराब मिक्सिंग या सेप्टिक वेस्टवॉटर। ब्लोअर, डिफ्यूज़र और इनलेट की हालत चेक करें।'},
  {v:{k:'cards',items:[{i:'⚫',title:{en:'Black water or sludge',hi:'काला पानी या स्लज'},en:'Restore aeration, inform supervisor',hi:'एरेशन चालू करें, सुपरवाइज़र को बताएँ',tone:'bad'}]},shot:'Tank water turns black; blower restarts; phone icon.',en:'Black water or sludge? Aeration failure or septic condition. Restore aeration and inform your supervisor.',hi:'काला पानी या स्लज? एरेशन फ़ेल या सेप्टिक कंडीशन। एरेशन फिर से चालू करें और सुपरवाइज़र को बताएँ।'},
  {v:{k:'cards',items:[{i:'🧼',title:{en:'Heavy foam',hi:'ज़्यादा झाग'},en:'Check inlet, DO, reactor',hi:'इनलेट, DO, रिएक्टर चेक',tone:'warn'}]},shot:'Thick foam on the surface; Ritu checks the inlet and the DO meter.',en:'Heavy foam? High organic load, detergent or biological imbalance. Check the inlet, DO and reactor condition.',hi:'ज़्यादा झाग? ज़्यादा ऑर्गेनिक लोड, डिटर्जेंट या बायोलॉजिकल असंतुलन। इनलेट, DO और रिएक्टर की हालत चेक करें।'},
  {v:{k:'cards',items:[{i:'📏',title:{en:'High tank level',hi:'टैंक लेवल ज़्यादा'},en:'Check outlet screen, downstream flow',hi:'आउटलेट स्क्रीन, डाउनस्ट्रीम फ्लो चेक',tone:'warn'}]},shot:'Water level rises near the top edge; choked outlet screen.',en:'High tank level? Outlet blockage, screen choking or excess inflow. Check the outlet screen and downstream flow.',hi:'टैंक लेवल ज़्यादा? आउटलेट ब्लॉक, स्क्रीन चोक या ज़्यादा इनफ्लो। आउटलेट स्क्रीन और डाउनस्ट्रीम फ्लो चेक करें।'},
  {v:{k:'cards',items:[{i:'⚙️',title:{en:'Media not moving',hi:'मीडिया नहीं घूम रहा'},en:'Check blower, air valve, diffuser',hi:'ब्लोअर, एयर वाल्व, डिफ्यूज़र चेक',tone:'bad'}]},shot:'Media sit still in one corner; hand on the air valve.',en:'Media not moving? Low airflow, diffuser choking or excessive media. Check the blower, air valve and diffuser.',hi:'मीडिया नहीं घूम रहा? कम हवा, डिफ्यूज़र चोक या ज़्यादा मीडिया। ब्लोअर, एयर वाल्व और डिफ्यूज़र चेक करें।'},
  {v:{k:'cards',items:[{i:'🚫',title:{en:'Dead zones',hi:'डेड ज़ोन'},en:'Check bubbling pattern, air header',hi:'बबलिंग पैटर्न, एयर हेडर चेक',tone:'warn'}]},shot:'A corner with no bubbles; air header highlighted.',en:'Dead zones? Poor air distribution. Check the bubbling pattern and air header.',hi:'डेड ज़ोन? हवा का बँटवारा खराब। बबलिंग पैटर्न और एयर हेडर चेक करें।'},
  {v:{k:'cards',items:[{i:'🌊',title:{en:'Overflow',hi:'ओवरफ्लो'},en:'Check inlet flow, screen, outlet line',hi:'इनलेट फ्लो, स्क्रीन, आउटलेट लाइन चेक',tone:'bad'}]},shot:'Water spilling over the tank wall; then a calm, evenly bubbling tank with a tick.',en:'Overflow? High inflow or outlet obstruction. Check the inlet flow, screen and outlet line. Proper media movement, aeration and outlet flow keep the reactor stable.',hi:'ओवरफ्लो? ज़्यादा इनफ्लो या आउटलेट में रुकावट। इनलेट फ्लो, स्क्रीन और आउटलेट लाइन चेक करें। सही मीडिया मूवमेंट, एरेशन और आउटलेट फ्लो से रिएक्टर स्थिर रहता है।'}],
 activity:{type:'match',prompt:{en:'Match the problem with the operator action.',hi:'समस्या को सही एक्शन से जोड़ें।'},pairs:[{l:{i:'⚫',en:'Black water or sludge',hi:'काला पानी या स्लज'},r:{i:'🌀',en:'Restore aeration, inform supervisor',hi:'एरेशन चालू, सुपरवाइज़र को बताएँ'}},{l:{i:'📏',en:'High tank level',hi:'टैंक लेवल ज़्यादा'},r:{i:'🚪',en:'Check outlet screen, downstream flow',hi:'आउटलेट स्क्रीन, डाउनस्ट्रीम फ्लो चेक'}},{l:{i:'🚫',en:'Dead zones',hi:'डेड ज़ोन'},r:{i:'🫧',en:'Check bubbling pattern, air header',hi:'बबलिंग पैटर्न, एयर हेडर चेक'}}]},
 remember:{en:'Media moving, air bubbling, outlet flowing: the reactor is stable.',hi:'मीडिया घूम रहा, हवा बबल रही, आउटलेट बह रहा: रिएक्टर स्थिर।'}},

/* 3 ─ Media & biofilm condition, part 1: the media (pages 3 and 4) */
{id:'ch34-media',cat:'field',em:'🟤',title:{en:'Media and biofilm: healthy or not? (part 1)',hi:'मीडिया और बायोफ़िल्म: स्वस्थ है या नहीं? (भाग 1)'},
 lines:[
  {v:{k:'board',items:[{i:'⚙️',en:'Plastic carriers',hi:'प्लास्टिक कैरियर'},{i:'🦠',en:'Surface area for bacteria',hi:'बैक्टीरिया के लिए सतह'}]},shot:'A handful of plastic media wheels; bacteria icons settle on their surface.',en:'MBBR media are specially designed plastic carriers. They give surface area for bacteria to grow.',hi:'MBBR मीडिया खास तरह के प्लास्टिक कैरियर हैं। ये बैक्टीरिया को बढ़ने के लिए सतह देते हैं।'},
  {v:{k:'board',items:[{i:'🟤',en:'Good biofilm: healthy',hi:'अच्छी बायोफ़िल्म: स्वस्थ',ok:true},{i:'🟫',en:'Light brown: normal',hi:'हल्का भूरा: नॉर्मल',ok:true}]},shot:'Two media wheels with a thin brown layer; green ticks under both.',en:'A thin brown or light brown layer on the media is normal biofilm.',hi:'मीडिया पर पतली भूरी या हल्की भूरी परत नॉर्मल बायोफ़िल्म है।'},
  {v:{k:'board',items:[{i:'🧱',en:'Thick biofilm',hi:'मोटी बायोफ़िल्म',bad:true},{i:'⚫',en:'Black: septic or low DO',hi:'काली: सेप्टिक या कम DO',bad:true},{i:'🛢️',en:'Grease or solids coated',hi:'ग्रीस या ठोस की परत',bad:true},{i:'💔',en:'Broken or damaged media',hi:'टूटा या खराब मीडिया',bad:true}]},shot:'Four media wheels: thick, black, grease-coated, broken; red warning under each.',en:'Thick biofilm, black biofilm, grease or solids coating, or broken media mean poor condition. Take action.',hi:'मोटी बायोफ़िल्म, काली बायोफ़िल्म, ग्रीस या ठोस की परत, या टूटा मीडिया मतलब खराब हालत। एक्शन लें।'},
  {v:{k:'board',items:[{i:'🔄',en:'Media moving freely',hi:'मीडिया खुलकर घूम रहा'},{i:'📏',en:'Media quantity, fill %',hi:'मीडिया की मात्रा, फ़िल %'},{i:'🎨',en:'Biofilm colour',hi:'बायोफ़िल्म का रंग'},{i:'🧱',en:'Biofilm thickness',hi:'बायोफ़िल्म की मोटाई'},{i:'💔',en:'Broken or damaged media',hi:'टूटा या खराब मीडिया'},{i:'📍',en:'Media collecting in one area',hi:'मीडिया एक जगह जमा'}]},shot:'Ritu lifts a few media from the tank in a sieve and looks closely.',en:'What to check: media moving freely, media quantity or fill percentage, biofilm colour, biofilm thickness, broken or damaged media, media collecting in one area.',hi:'क्या चेक करें: मीडिया खुलकर घूम रहा है, मीडिया की मात्रा या फ़िल प्रतिशत, बायोफ़िल्म का रंग, बायोफ़िल्म की मोटाई, टूटा या खराब मीडिया, मीडिया एक जगह जमा।'},
  {v:{k:'board',items:[{i:'🚪',en:'Media escaping from tank',hi:'मीडिया टैंक से बाहर'},{i:'🛢️',en:'Grease or solids coating',hi:'ग्रीस या ठोस की परत'},{i:'📉',en:'Excessive media loss',hi:'बहुत ज़्यादा मीडिया का नुकसान'},{i:'🌊',en:'Tank overflow',hi:'टैंक ओवरफ्लो'},{i:'🚪',en:'Outlet flow',hi:'आउटलेट फ्लो'}]},shot:'Retention screen at the outlet; a few media slipping past; tank rim and outlet pipe.',en:'Also check: media escaping from the tank, grease or solids coating the media, excessive media loss, tank overflow, and outlet flow.',hi:'यह भी चेक करें: मीडिया टैंक से बाहर जाना, मीडिया पर ग्रीस या ठोस की परत, बहुत ज़्यादा मीडिया का नुकसान, टैंक ओवरफ्लो, और आउटलेट फ्लो।'},
  {v:{k:'cards',items:[{i:'⚙️',title:{en:'Media not moving',hi:'मीडिया नहीं घूम रहा'},en:'Check blower, valves, diffusers',hi:'ब्लोअर, वाल्व, डिफ्यूज़र चेक',tone:'bad'}]},shot:'Still media; Ritu checks the blower and the valves.',en:'Media not moving? Low airflow or poor air distribution. Check the blower, valves and diffusers.',hi:'मीडिया नहीं घूम रहा? कम हवा या हवा का बँटवारा खराब। ब्लोअर, वाल्व और डिफ्यूज़र चेक करें।'},
  {v:{k:'cards',items:[{i:'📍',title:{en:'Media in one corner',hi:'मीडिया एक कोने में'},en:'Check air-distribution pattern',hi:'हवा का बँटवारा चेक',tone:'warn'}]},shot:'Media piled in one corner; uneven bubbles.',en:'Media collecting in one corner? Dead zone or uneven aeration. Check the air distribution pattern.',hi:'मीडिया एक कोने में जमा? डेड ज़ोन या असमान एरेशन। हवा के बँटवारे का पैटर्न चेक करें।'},
  {v:{k:'cards',items:[{i:'🚪',title:{en:'Media escaping',hi:'मीडिया बाहर जा रहा'},en:'Limit flow if needed, inform supervisor',hi:'ज़रूरत हो तो फ्लो कम, सुपरवाइज़र को बताएँ',tone:'bad'}]},shot:'A few media slip past a torn retention screen; hand closes the inlet valve; phone icon.',en:'Media escaping? The retention screen is damaged or missing. Stop or limit the flow if required, and inform your supervisor.',hi:'मीडिया बाहर जा रहा? रिटेंशन स्क्रीन खराब या गायब है। ज़रूरत हो तो फ्लो रोकें या कम करें, और सुपरवाइज़र को बताएँ।'},
  {v:{k:'cards',items:[{i:'⚫',title:{en:'Media surface black',hi:'मीडिया की सतह काली'},en:'Check aeration and DO',hi:'एरेशन और DO चेक',tone:'bad'}]},shot:'Close-up of one black media wheel; DO meter.',en:'Media surface black? Septic condition or low DO. Check aeration and DO.',hi:'मीडिया की सतह काली? सेप्टिक कंडीशन या कम DO। एरेशन और DO चेक करें।'},
  {v:{k:'cards',items:[{i:'🟤',title:{en:'Thick sludge coating',hi:'मोटी स्लज की परत'},en:'Check aeration, screening, reactor',hi:'एरेशन, स्क्रीनिंग, रिएक्टर चेक',tone:'warn'}]},shot:'One wheel caked in thick sludge; inlet screen in the background.',en:'Thick sludge coating? High load, excess suspended solids or poor movement. Check aeration, screening and reactor condition.',hi:'मोटी स्लज की परत? ज़्यादा लोड, ज़्यादा सस्पेंडेड सॉलिड्स या कम मूवमेंट। एरेशन, स्क्रीनिंग और रिएक्टर की हालत चेक करें।'},
  {v:{k:'cards',items:[{i:'📉',title:{en:'Media quantity low',hi:'मीडिया की मात्रा कम'},en:'Inform supervisor, inspect retention screen',hi:'सुपरवाइज़र को बताएँ, रिटेंशन स्क्रीन देखें',tone:'warn'}]},shot:'Half-empty tank of media; Ritu inspects the retention screen.',en:'Media quantity low? Media loss or incorrect initial filling. Inform your supervisor and inspect the retention screen.',hi:'मीडिया की मात्रा कम? मीडिया का नुकसान या शुरू में गलत भराई। सुपरवाइज़र को बताएँ और रिटेंशन स्क्रीन जाँचें।'},
  {v:{k:'cards',items:[{i:'💔',title:{en:'Broken media',hi:'टूटा मीडिया'},en:'Remove damaged pieces, inform supervisor',hi:'टूटे टुकड़े हटाएँ, सुपरवाइज़र को बताएँ',tone:'bad'}]},shot:'Gloved hand picks out broken pieces into a bucket.',en:'Broken media? Age, chemical attack or mechanical damage. Remove the damaged pieces and inform your supervisor.',hi:'टूटा मीडिया? पुराना होना, केमिकल का असर या मशीनी नुकसान। टूटे टुकड़े हटाएँ और सुपरवाइज़र को बताएँ।'}],
 activity:{type:'choice',prompt:{en:'Media are escaping past the retention screen. What do you do?',hi:'मीडिया रिटेंशन स्क्रीन से बाहर जा रहा है। आप क्या करेंगे?'},options:[{i:'⏳',en:'Wait and watch',hi:'रुको और देखो',ok:false},{i:'🛑',en:'Stop or limit flow if required. Inform supervisor',hi:'ज़रूरत हो तो फ्लो रोकें या कम करें। सुपरवाइज़र को बताएँ',ok:true},{i:'🌀',en:'Increase the air',hi:'हवा बढ़ाएँ',ok:false}]},
 remember:{en:'Media must move freely. Media escaping: limit flow and inform your supervisor.',hi:'मीडिया खुलकर घूमना चाहिए। मीडिया बाहर जाए: फ्लो कम करो और सुपरवाइज़र को बताओ।'}},

/* 3b ─ Media & biofilm condition, part 2: the biofilm (page 4) */
{id:'ch34-media-b',cat:'field',em:'🟤',title:{en:'Media and biofilm: healthy or not? (part 2)',hi:'मीडिया और बायोफ़िल्म: स्वस्थ है या नहीं? (भाग 2)'},
 lines:[
  {v:{k:'cards',items:[{i:'⚪',title:{en:'Very little biofilm',hi:'बहुत कम बायोफ़िल्म'},en:'Inform supervisor, check inlet',hi:'सुपरवाइज़र को बताएँ, इनलेट चेक',tone:'warn'}]},shot:'Close-up of an almost bare media wheel; Ritu at the inlet.',en:'Now the biofilm itself. Very little biofilm? Low organic load, new plant or toxic shock. Inform your supervisor and check the inlet condition.',hi:'अब बायोफ़िल्म की बात। बहुत कम बायोफ़िल्म? कम ऑर्गेनिक लोड, नया प्लांट या टॉक्सिक शॉक। सुपरवाइज़र को बताएँ और इनलेट की हालत चेक करें।'},
  {v:{k:'cards',items:[{i:'🧱',title:{en:'Thick biofilm',hi:'मोटी बायोफ़िल्म'},en:'Check aeration, media movement',hi:'एरेशन, मीडिया मूवमेंट चेक',tone:'warn'}]},shot:'Thickly coated media wheel; bubbles and tumbling media.',en:'Thick biofilm? High load, old growth or poor media movement. Check aeration and media movement.',hi:'मोटी बायोफ़िल्म? ज़्यादा लोड, पुरानी ग्रोथ या कम मीडिया मूवमेंट। एरेशन और मीडिया मूवमेंट चेक करें।'},
  {v:{k:'cards',items:[{i:'⚫',title:{en:'Black biofilm',hi:'काली बायोफ़िल्म'},en:'Check blower, diffuser, DO',hi:'ब्लोअर, डिफ्यूज़र, DO चेक',tone:'bad'}]},shot:'Black media wheel; blower, diffuser and DO meter icons.',en:'Black biofilm? Low DO or septic condition. Check the blower, diffuser and DO.',hi:'काली बायोफ़िल्म? कम DO या सेप्टिक कंडीशन। ब्लोअर, डिफ्यूज़र और DO चेक करें।'},
  {v:{k:'cards',items:[{i:'📉',title:{en:'Biofilm falling off',hi:'बायोफ़िल्म झड़ रही'},en:'Check pH, inlet quality, aeration',hi:'pH, इनलेट क्वालिटी, एरेशन चेक',tone:'bad'}]},shot:'Flakes of biofilm drift off a media wheel; pH meter at the inlet.',en:'Biofilm suddenly falling off? Shock load, pH change, toxicity or airflow change. Check pH, inlet quality and aeration.',hi:'बायोफ़िल्म अचानक झड़ रही? शॉक लोड, pH बदलाव, टॉक्सिसिटी या हवा में बदलाव। pH, इनलेट क्वालिटी और एरेशन चेक करें।'},
  {v:{k:'cards',items:[{i:'👃',title:{en:'Bad smell from media',hi:'मीडिया से बदबू'},en:'Restore proper aeration',hi:'सही एरेशन चालू करें',tone:'bad'}]},shot:'Stink lines over the media; blower restarts, bubbles return.',en:'Bad smell from the media? Anaerobic condition. Restore proper aeration.',hi:'मीडिया से बदबू? एनएरोबिक कंडीशन। सही एरेशन फिर से चालू करें।'},
  {v:{k:'cards',items:[{i:'💧',title:{en:'Poor treatment despite biofilm',hi:'बायोफ़िल्म है फिर भी खराब ट्रीटमेंट'},en:'Check DO, pH, flow, inlet load',hi:'DO, pH, फ्लो, इनलेट लोड चेक',tone:'warn'}]},shot:'Healthy-looking media but cloudy outlet; DO and pH meters.',en:'Poor treatment even with biofilm? Not enough oxygen, high load or unsuitable pH. Check DO, pH, flow and inlet load.',hi:'बायोफ़िल्म है फिर भी ट्रीटमेंट खराब? ऑक्सीजन कम, लोड ज़्यादा या pH गलत। DO, pH, फ्लो और इनलेट लोड चेक करें।'},
  {v:{k:'board',items:[{i:'🌀',en:'Proper air supply',hi:'सही हवा की सप्लाई'},{i:'🟤',en:'Healthy brown biofilm',hi:'स्वस्थ भूरी बायोफ़िल्म'},{i:'🚫',en:'No dead zones, no piling',hi:'डेड ज़ोन नहीं, जमाव नहीं'}]},shot:'Operator-tip icons; healthy tumbling media.',en:'Operator tips: keep the media moving with proper air supply. Maintain healthy brown biofilm for best treatment. Avoid dead zones and media accumulation.',hi:'ऑपरेटर टिप्स: सही हवा की सप्लाई से मीडिया को घुमाते रहें। बेहतरीन ट्रीटमेंट के लिए स्वस्थ भूरी बायोफ़िल्म बनाए रखें। डेड ज़ोन और मीडिया के जमाव से बचें।'},
  {v:{k:'board',items:[{i:'📟',en:'Correct DO level',hi:'सही DO लेवल'},{i:'🔍',en:'Inspect regularly',hi:'नियमित जाँच'},{i:'✅',en:'Early action',hi:'जल्दी एक्शन'}]},shot:'DO meter in the green; Ritu gives a thumbs up with a magnifier over the media.',en:'Maintain the correct DO level. Inspect the media and biofilm regularly. Early action prevents performance loss.',hi:'सही DO लेवल रखें। मीडिया और बायोफ़िल्म की नियमित जाँच करें। जल्दी एक्शन लेने से परफ़ॉर्मेंस का नुकसान नहीं होता।'}],

{id:'ch34-blower',cat:'field',em:'🌀',title:{en:'Blower: the air supply',hi:'ब्लोअर: हवा की सप्लाई'},
 lines:[
  {v:{k:'flow',items:[{i:'🌀',en:'Blower',hi:'ब्लोअर'},{i:'🔩',en:'Air pipeline',hi:'एयर पाइपलाइन'},{i:'🫧',en:'Diffuser',hi:'डिफ्यूज़र'},{i:'⚙️',en:'MBBR reactor',hi:'MBBR रिएक्टर'}]},shot:'Blower outside the tank, air pipeline into the reactor, diffusers bubbling under the media.',en:'The blower supplies air to the MBBR reactor through pipelines and diffusers. Air keeps the bacteria active and moves the media continuously. So check the blower every day.',hi:'ब्लोअर पाइपलाइन और डिफ्यूज़र से MBBR रिएक्टर को हवा देता है। हवा बैक्टीरिया को एक्टिव रखती है और मीडिया को लगातार घुमाती है। इसलिए ब्लोअर रोज़ चेक करें।'},
  {v:{k:'board',items:[{i:'🟢',en:'Running status',hi:'चल रहा है या नहीं'},{i:'📈',en:'Air pressure and airflow',hi:'हवा का प्रेशर और फ्लो'},{i:'🔊',en:'Noise and vibration',hi:'आवाज़ और वाइब्रेशन'},{i:'⚡',en:'Motor current',hi:'मोटर करंट'},{i:'🌡️',en:'Motor, bearing temperature',hi:'मोटर, बेयरिंग टेम्परेचर'}]},shot:'Ritu at the blower with a hand on the casing, looks at the pressure gauge and panel ammeter.',en:'Is the blower running? Check air pressure and airflow. Listen for noise and feel for vibration. Check motor current. Check motor and bearing temperature.',hi:'ब्लोअर चल रहा है? हवा का प्रेशर और फ्लो देखें। आवाज़ सुनें और वाइब्रेशन महसूस करें। मोटर करंट देखें। मोटर और बेयरिंग का टेम्परेचर देखें।'},
  {v:{k:'board',items:[{i:'🔗',en:'Belt or coupling',hi:'बेल्ट या कपलिंग'},{i:'🧺',en:'Air filter',hi:'एयर फ़िल्टर'},{i:'🛢️',en:'Oil level, where applicable',hi:'ऑयल लेवल, जहाँ लागू हो'},{i:'💨',en:'Air leakage',hi:'हवा का लीकेज'},{i:'🔄',en:'Standby blower',hi:'स्टैंडबाय ब्लोअर'}]},shot:'Belt guard, air filter, oil sight glass, pipe joint, second blower.',en:'Also check: belt or coupling condition, air filter condition, oil level where applicable, air leakage, and the condition of the standby blower.',hi:'यह भी चेक करें: बेल्ट या कपलिंग की हालत, एयर फ़िल्टर की हालत, ऑयल लेवल जहाँ लागू हो, हवा का लीकेज, और स्टैंडबाय ब्लोअर की हालत।'},

/* 6 ─ DO control (page 7) */
{id:'ch34-do',cat:'field',em:'📟',title:{en:'DO control: 2 to 4 mg/L',hi:'DO कंट्रोल: 2 से 4 mg/L'},
 lines:[
  {v:{k:'board',items:[{i:'🫧',en:'Dissolved oxygen',hi:'घुली हुई ऑक्सीजन'},{i:'🦠',en:'Bacteria eat pollution',hi:'बैक्टीरिया गंदगी खाते हैं'},{i:'🟤',en:'Healthy biofilm',hi:'स्वस्थ बायोफ़िल्म'}]},shot:'Oxygen bubble icon over the reactor; bacteria on media look happy.',en:'DO means dissolved oxygen in the reactor water, available for the bacteria. MBBR bacteria need proper oxygen to eat organic pollution and to keep a healthy biofilm.',hi:'DO मतलब रिएक्टर के पानी में घुली हुई ऑक्सीजन, जो बैक्टीरिया को मिलती है। MBBR के बैक्टीरिया को ऑर्गेनिक गंदगी खाने और स्वस्थ बायोफ़िल्म रखने के लिए सही ऑक्सीजन चाहिए।'},
  {v:{k:'range',label:'DO',unit:'mg/L',min:0,max:6,value:2.5,zones:[{to:2,c:'bad',en:'Low',hi:'कम'},{to:4,c:'ok',en:'Good',hi:'ठीक'},{to:6,c:'warn',en:'High',hi:'ज़्यादा'}]},shot:'DO meter in the tank reads 2.5 mg/L; dial shows red below 2, green 2 to 4, orange above 4.',en:'Keep DO around 2 to 4 mg/L in MBBR. Below 2 is low. 2 to 4 is good. Above 4 is high. Target: 2 to 4 mg/L.',hi:'MBBR में DO लगभग 2 से 4 mg/L रखें। 2 से नीचे मतलब कम। 2 से 4 ठीक। 4 से ऊपर मतलब ज़्यादा। टारगेट: 2 से 4 mg/L।'},
  {v:{k:'board',items:[{i:'📟',en:'DO reading',hi:'DO रीडिंग'},{i:'📍',en:'DO at different spots',hi:'अलग-अलग जगह DO'},{i:'🌀',en:'Blower operation',hi:'ब्लोअर ऑपरेशन'},{i:'🫧',en:'Air bubbling',hi:'बबलिंग'},{i:'🔄',en:'Media movement',hi:'मीडिया मूवमेंट'},{i:'🕳️',en:'Diffuser condition',hi:'डिफ्यूज़र की हालत'},{i:'🟤',en:'Sludge, biofilm colour',hi:'स्लज, बायोफ़िल्म का रंग'},{i:'👃',en:'Smell',hi:'गंध'},{i:'🚰',en:'Inlet load',hi:'इनलेट लोड'}]},shot:'Ritu dips the DO probe at three points along the tank.',en:'What to check: the DO reading, and DO at different tank locations. Blower operation, air bubbling, media movement, diffuser condition. Sludge and biofilm colour, smell, and inlet load.',hi:'क्या चेक करें: DO रीडिंग, और टैंक में अलग-अलग जगह का DO। ब्लोअर ऑपरेशन, बबलिंग, मीडिया मूवमेंट, डिफ्यूज़र की हालत। स्लज और बायोफ़िल्म का रंग, गंध, और इनलेट लोड।'},
  {v:{k:'cards',items:[{i:'📉',title:{en:'Low DO',hi:'कम DO'},en:'Check blower, valve, diffuser, inlet load',hi:'ब्लोअर, वाल्व, डिफ्यूज़र, इनलेट लोड चेक',tone:'bad'}]},shot:'Meter reads 1.2 mg/L; blower, valve and diffuser icons.',en:'Low DO? Low airflow, blower issue, diffuser choking or high load. Check the blower, valve, diffuser and inlet load.',hi:'कम DO? कम हवा, ब्लोअर की समस्या, डिफ्यूज़र चोक या ज़्यादा लोड। ब्लोअर, वाल्व, डिफ्यूज़र और इनलेट लोड चेक करें।'},
  {v:{k:'cards',items:[{i:'📈',title:{en:'Very high DO',hi:'बहुत ज़्यादा DO'},en:'Inform supervisor, check blower',hi:'सुपरवाइज़र को बताएँ, ब्लोअर चेक',tone:'warn'}]},shot:'Meter reads 5.5 mg/L; tank foams with bubbles; phone icon.',en:'Very high DO? Excess aeration. Inform your supervisor and check blower operation.',hi:'बहुत ज़्यादा DO? ज़्यादा एरेशन। सुपरवाइज़र को बताएँ और ब्लोअर ऑपरेशन चेक करें।'},
  {v:{k:'cards',items:[{i:'📊',title:{en:'DO fluctuating',hi:'DO ऊपर-नीचे'},en:'Check flow, blower, valve',hi:'फ्लो, ब्लोअर, वाल्व चेक',tone:'warn'}]},shot:'Meter reading swings up and down.',en:'DO fluctuating? Variable load or unstable air supply. Check flow, blower and valve operation.',hi:'DO ऊपर-नीचे हो रहा? बदलता लोड या अस्थिर हवा की सप्लाई। फ्लो, ब्लोअर और वाल्व ऑपरेशन चेक करें।'},
  {v:{k:'cards',items:[{i:'📍',title:{en:'Low DO in one area',hi:'एक जगह DO कम'},en:'Check local bubbling, diffuser',hi:'उस जगह बबलिंग, डिफ्यूज़र चेक',tone:'warn'}]},shot:'One corner of the tank reads low; the diffuser below it highlighted.',en:'Low DO in one area? Dead zone or poor air distribution. Check local bubbling and the diffuser.',hi:'एक जगह DO कम? डेड ज़ोन या हवा का बँटवारा खराब। उस जगह की बबलिंग और डिफ्यूज़र चेक करें।'},
  {v:{k:'cards',items:[{i:'👃',title:{en:'Bad smell with low DO',hi:'कम DO के साथ बदबू'},en:'Restore aeration, inform supervisor',hi:'एरेशन चालू करें, सुपरवाइज़र को बताएँ',tone:'bad'}]},shot:'Stink lines over the tank; blower restarts; phone icon.',en:'Bad smell with low DO? Septic condition is developing. Restore aeration and inform your supervisor.',hi:'कम DO के साथ बदबू? सेप्टिक कंडीशन बन रही है। एरेशन चालू करें और सुपरवाइज़र को बताएँ।'},
  {v:{k:'cards',items:[{i:'⚫',title:{en:'Black media or biofilm',hi:'काला मीडिया या बायोफ़िल्म'},en:'Check DO and aeration immediately',hi:'तुरंत DO और एरेशन चेक',tone:'bad'}]},shot:'Black media close-up; then the DO meter settles in the green.',en:'Black media or biofilm? Long oxygen shortage. Check DO and aeration immediately. Monitor DO regularly and act early. Stable DO gives stable results.',hi:'काला मीडिया या बायोफ़िल्म? लंबे समय से ऑक्सीजन की कमी। तुरंत DO और एरेशन चेक करें। DO नियमित मॉनिटर करें और जल्दी एक्शन लें। स्थिर DO से स्थिर नतीजे मिलते हैं।'}],
 activity:{type:'classify',prompt:{en:'Three DO readings from the MBBR tank. Tap Low, OK, or High for each.',hi:'MBBR टैंक की तीन DO रीडिंग। हर एक के लिए कम, ठीक या ज़्यादा टैप करें।'},items:[{val:'1.2 mg/L',ans:0},{val:'3.0 mg/L',ans:1},{val:'5.5 mg/L',ans:2}],cats:[{en:'Low',hi:'कम',sub:{en:'Below 2 mg/L',hi:'2 mg/L से कम'}},{en:'OK',hi:'ठीक',sub:{en:'2 to 4 mg/L',hi:'2 से 4 mg/L'}},{en:'High',hi:'ज़्यादा',sub:{en:'Above 4 mg/L',hi:'4 mg/L से ज़्यादा'}}]},
 remember:{en:'DO 2 to 4 mg/L. Low DO: check blower, valve, diffuser and inlet load.',hi:'DO 2 से 4 mg/L। DO कम: ब्लोअर, वाल्व, डिफ्यूज़र और इनलेट लोड चेक करो।'}},

/* 7 ─ Secondary clarifier (page 8) */
{id:'ch34-clarifier',cat:'field',em:'🔵',title:{en:'Secondary clarifier: clear water over the weir',hi:'सेकेंडरी क्लैरिफ़ायर: वियर के ऊपर साफ़ पानी'},
 lines:[
  {v:{k:'flow',items:[{i:'⚙️',en:'From MBBR',hi:'MBBR से'},{i:'🔵',en:'Clarifier',hi:'क्लैरिफ़ायर'},{i:'🟤',en:'Sludge settles',hi:'स्लज बैठता है'}]},shot:'Cutaway of the round clarifier: settling zone and sludge blanket.',en:'The secondary clarifier separates biological solids from treated water after the MBBR reactor. Sludge settles at the bottom.',hi:'सेकेंडरी क्लैरिफ़ायर MBBR रिएक्टर के बाद ट्रीटेड पानी से बायोलॉजिकल ठोस अलग करता है। स्लज नीचे बैठता है।'},
  {v:{k:'flow',items:[{i:'💧',en:'Clear water over weir',hi:'वियर के ऊपर साफ़ पानी'},{i:'🚛',en:'Sludge withdrawal',hi:'स्लज निकासी'}]},shot:'Clear water over the outlet weir; sludge withdrawal pipe at the bottom.',en:'Clear water flows over the outlet weir. Settled sludge is withdrawn from the bottom.',hi:'साफ़ पानी आउटलेट वियर के ऊपर से बहता है। बैठा हुआ स्लज नीचे से निकाला जाता है।'},
  {v:{k:'board',items:[{i:'💧',en:'Outlet water clarity',hi:'आउटलेट पानी की सफ़ाई'},{i:'⏳',en:'Sludge settling',hi:'स्लज सेटलिंग'},{i:'📏',en:'Sludge blanket level',hi:'स्लज ब्लैंकेट लेवल'},{i:'🟤',en:'Floating sludge',hi:'तैरता स्लज'},{i:'🧼',en:'Scum layer',hi:'स्कम की परत'}]},shot:'Ritu at the clarifier rail looks at the outlet water and the surface.',en:'Check: outlet water clarity, sludge settling, sludge blanket level, floating sludge, and scum layer.',hi:'चेक करें: आउटलेट पानी की सफ़ाई, स्लज सेटलिंग, स्लज ब्लैंकेट लेवल, तैरता स्लज, और स्कम की परत।'},
  {v:{k:'board',items:[{i:'🌊',en:'Weir overflow condition',hi:'वियर ओवरफ्लो की हालत'},{i:'🔧',en:'Sludge scraper, if available',hi:'स्लज स्क्रेपर, अगर हो'},{i:'⚙️',en:'Sludge pump operation',hi:'स्लज पंप ऑपरेशन'},{i:'🚛',en:'Sludge withdrawal',hi:'स्लज निकासी'},{i:'⚪',en:'High TSS in outlet',hi:'आउटलेट में ज़्यादा TSS'}]},shot:'Weir edge, scraper drive, sludge pump, outlet sample held to light.',en:'Also check: weir overflow condition, the sludge scraper if available, sludge pump operation, sludge withdrawal, and high TSS in the outlet.',hi:'यह भी चेक करें: वियर ओवरफ्लो की हालत, स्लज स्क्रेपर अगर हो, स्लज पंप ऑपरेशन, स्लज निकासी, और आउटलेट में ज़्यादा TSS।'},
  {v:{k:'cards',items:[{i:'🥛',title:{en:'Cloudy outlet',hi:'धुंधला आउटलेट'},en:'Check clarifier, flow, sludge withdrawal',hi:'क्लैरिफ़ायर, फ्लो, स्लज निकासी चेक',tone:'bad'}]},shot:'Cloudy water over the weir.',en:'Cloudy outlet? Poor settling, high flow or solids carryover. Check the clarifier, flow and sludge withdrawal.',hi:'धुंधला आउटलेट? खराब सेटलिंग, ज़्यादा फ्लो या ठोस का कैरीओवर। क्लैरिफ़ायर, फ्लो और स्लज निकासी चेक करें।'},
  {v:{k:'cards',items:[{i:'🟤',title:{en:'Floating sludge',hi:'तैरता स्लज'},en:'Check sludge removal',hi:'स्लज निकालना चेक',tone:'warn'}]},shot:'Brown clumps floating on the surface.',en:'Floating sludge? Gas formation, old sludge or stagnation. Check sludge removal.',hi:'तैरता स्लज? गैस बनना, पुराना स्लज या पानी का रुकना। स्लज निकालना चेक करें।'},
  {v:{k:'cards',items:[{i:'📈',title:{en:'Sludge carryover',hi:'स्लज कैरीओवर'},en:'Check sludge level, inlet flow',hi:'स्लज लेवल, इनलेट फ्लो चेक',tone:'bad'}]},shot:'Sludge blanket high, sludge spilling over the weir.',en:'Sludge carryover? High sludge blanket or hydraulic overload. Check the sludge level and inlet flow.',hi:'स्लज कैरीओवर? स्लज ब्लैंकेट ऊँचा या हाइड्रोलिक ओवरलोड। स्लज लेवल और इनलेट फ्लो चेक करें।'},
  {v:{k:'cards',items:[{i:'👃',title:{en:'Bad smell',hi:'बदबू'},en:'Increase approved sludge removal',hi:'मंज़ूर मात्रा में स्लज निकासी बढ़ाएँ',tone:'bad'},{i:'🌊',title:{en:'Uneven overflow',hi:'असमान ओवरफ्लो'},en:'Clean weir, inform supervisor',hi:'वियर साफ़ करें, सुपरवाइज़र को बताएँ',tone:'warn'}]},shot:'Stink lines over the clarifier; water pouring over only one side of the weir.',en:'Bad smell? Sludge stored too long in the clarifier. Increase sludge removal as approved. Uneven overflow? Weir choking or poor levelling. Clean the weir and inform your supervisor.',hi:'बदबू? स्लज क्लैरिफ़ायर में बहुत देर से पड़ा है। मंज़ूरी के अनुसार स्लज निकासी बढ़ाएँ। असमान ओवरफ्लो? वियर चोक या लेवल ठीक नहीं। वियर साफ़ करें और सुपरवाइज़र को बताएँ।'},
  {v:{k:'cards',items:[{i:'🧼',title:{en:'Scum formation',hi:'स्कम बनना'},en:'Remove scum, check upstream process',hi:'स्कम हटाएँ, अपस्ट्रीम प्रोसेस चेक',tone:'warn'}]},shot:'Scum skimmed off the surface.',en:'Scum formation? Floating biological solids or grease. Remove the scum and check the upstream process.',hi:'स्कम बन रहा? तैरते बायोलॉजिकल ठोस या ग्रीस। स्कम हटाएँ और अपस्ट्रीम प्रोसेस चेक करें।'},
  {v:{k:'cards',items:[{i:'🛑',title:{en:'Scrapers not running',hi:'स्क्रेपर नहीं चल रहा'},en:'Inform supervisor and maintenance',hi:'सुपरवाइज़र और मेंटेनेंस को बताएँ',tone:'bad'}]},shot:'Scraper drive motor stopped with a warning sign.',en:'Scrapers not running? Electrical or mechanical fault. Inform your supervisor and maintenance.',hi:'स्क्रेपर नहीं चल रहा? इलेक्ट्रिकल या मैकेनिकल फ़ॉल्ट। सुपरवाइज़र और मेंटेनेंस को बताएँ।'},
  {v:{k:'board',items:[{i:'💧',en:'Clear outlet water',hi:'साफ़ आउटलेट पानी'},{i:'✅',en:'Better solids separation',hi:'ठोस का बेहतर अलगाव'}]},shot:'Clear water over the weir; Ritu gives a thumbs up.',en:'Good clarifier operation means clear outlet water and better solids separation.',hi:'क्लैरिफ़ायर अच्छा चले तो आउटलेट पानी साफ़ और ठोस का अलगाव बेहतर।'}],
 activity:{type:'multi',prompt:{en:'Tap every sign of a clarifier problem.',hi:'क्लैरिफ़ायर की समस्या का हर संकेत टैप करें।'},options:[{i:'💧',en:'Clear outlet water',hi:'साफ़ आउटलेट पानी',ok:false},{i:'🥛',en:'Cloudy outlet',hi:'धुंधला आउटलेट',ok:true},{i:'🟤',en:'Floating sludge',hi:'तैरता स्लज',ok:true},{i:'⏳',en:'Sludge settling well',hi:'स्लज अच्छा बैठ रहा',ok:false},{i:'🧼',en:'Scum layer on top',hi:'ऊपर स्कम की परत',ok:true},{i:'🌊',en:'Uneven overflow',hi:'असमान ओवरफ्लो',ok:true}]},
 remember:{en:'Clear water over the weir. Withdraw sludge on schedule.',hi:'वियर के ऊपर साफ़ पानी। स्लज समय पर निकालो।'}},

/* 8 ─ Daily checklist, part 1: points 1 to 3 (page 9) */
{id:'ch34-daily',cat:'field',em:'📒',title:{en:'Daily checklist: 15 points (part 1)',hi:'रोज़ की चेकलिस्ट: 15 पॉइंट (भाग 1)'},
 lines:[
  {v:{k:'board',items:[{i:'📒',en:'Daily checklist',hi:'डेली चेकलिस्ट'}]},shot:'Ritu holds a clipboard marked Daily Checklist and walks along the tanks.',en:'Every day, walk the plant with the daily checklist.',hi:'रोज़ डेली चेकलिस्ट लेकर प्लांट का चक्कर लगाएँ।'},
  {v:{k:'board',items:[{i:'🌊',en:'Flow: inlet and outlet',hi:'फ्लो: इनलेट और आउटलेट'},{i:'🧪',en:'pH level',hi:'pH लेवल'},{i:'🔄',en:'Media movement',hi:'मीडिया मूवमेंट'},{i:'📟',en:'DO level',hi:'DO लेवल'},{i:'🌀',en:'Blower operation',hi:'ब्लोअर ऑपरेशन'},{i:'💧',en:'Clarifier outlet clear',hi:'क्लैरिफ़ायर आउटलेट साफ़'},{i:'🚛',en:'Sludge withdrawal schedule',hi:'स्लज निकासी शेड्यूल'}]},shot:'Seven what-to-check-daily icons light up.',en:'Check flow at inlet and outlet, pH level, media movement, DO level, blower operation, clarifier outlet, and sludge withdrawal.',hi:'इनलेट और आउटलेट का फ्लो, pH लेवल, मीडिया मूवमेंट, DO लेवल, ब्लोअर ऑपरेशन, क्लैरिफ़ायर आउटलेट, और स्लज निकासी चेक करें।'},
  {v:{k:'board',items:[{i:'📒',en:'15 check points',hi:'15 चेक पॉइंट'},{i:'✅',en:'Normal condition',hi:'नॉर्मल हालत'},{i:'⚠️',en:'Action if abnormal',hi:'असामान्य हो तो एक्शन'}]},shot:'Checklist table header: Check point, Normal condition, Action if abnormal.',en:'Fifteen check points. For each one, know the normal condition and the action if abnormal.',hi:'पंद्रह चेक पॉइंट हैं। हर एक की नॉर्मल हालत और असामान्य होने पर एक्शन जानें।'},
  {v:{k:'cards',items:[{i:'🚰',title:{en:'Inlet flow: stable',hi:'इनलेट फ्लो: स्थिर'},en:'Else check feed pump, valve, upstream',hi:'नहीं तो फ़ीड पंप, वाल्व, अपस्ट्रीम चेक',tone:'ok'}]},shot:'Row 1 ticks off; feed pump and valve.',en:'One: inlet flow should be stable. If not, check the feed pump, valve and upstream condition.',hi:'एक: इनलेट फ्लो स्थिर होना चाहिए। नहीं तो फ़ीड पंप, वाल्व और अपस्ट्रीम की हालत चेक करें।'},

{id:'ch35-reject',cat:'field',em:'🔄',title:{en:'Reject line and recovery control',hi:'रिजेक्ट लाइन और रिकवरी कंट्रोल'},

  {v:{k:'cards',items:[{i:'🛢️',title:{en:'Reject tank overflow',hi:'रिजेक्ट टैंक ओवरफ्लो'},en:'Disposal pump issue or high reject flow: check reject tank and pump',hi:'डिस्पोज़ल पंप समस्या या ज़्यादा रिजेक्ट फ्लो: रिजेक्ट टैंक और पंप चेक',tone:'warn'}]},shot:'Reject tank overflowing at the top; disposal pump beside it.',en:'Reject tank overflow means a disposal pump issue or high reject flow. Check the reject tank and pump.',hi:'रिजेक्ट टैंक ओवरफ्लो मतलब डिस्पोज़ल पंप की समस्या या ज़्यादा रिजेक्ट फ्लो। रिजेक्ट टैंक और पंप चेक करें।'},

 activity:{type:'choice',prompt:{en:'Reject flow is high. What do you do?',hi:'रिजेक्ट फ्लो ज़्यादा है। आप क्या करेंगे?'},options:[{i:'🔧',en:'Close the reject valve yourself',hi:'खुद रिजेक्ट वाल्व बंद कर दें',ok:false},{i:'📞',en:'Inform supervisor before any adjustment',hi:'एडजस्ट करने से पहले सुपरवाइज़र को बताएँ',ok:true},{i:'📈',en:'Increase recovery to maximum',hi:'रिकवरी सबसे ज़्यादा कर दें',ok:false}]},

/* 7 ─ CIP */
{id:'ch35-cip',cat:'lab',em:'🧼',title:{en:'CIP: cleaning the membrane in place',hi:'CIP: मेम्ब्रेन की जगह पर सफ़ाई'},

  {v:{k:'board',items:[{i:'🧼',en:'CIP: Cleaning in Place',hi:'CIP: क्लीनिंग इन प्लेस'},{i:'📉',en:'Performance drop: fouling or scaling',hi:'परफ़ॉर्मेंस गिरना: फ़ाउलिंग या स्केलिंग'}]},shot:'CIP tank beside a membrane skid; performance chart dropping, labelled fouling and scaling.',en:'CIP means Cleaning in Place. It cleans RO membranes when performance drops due to fouling or scaling.',hi:'CIP मतलब क्लीनिंग इन प्लेस। जब फ़ाउलिंग या स्केलिंग से परफ़ॉर्मेंस गिरता है, तब यह RO मेम्ब्रेन साफ़ करता है।'},

  {v:{k:'cards',items:[{i:'🧪',title:{en:'Acid cleaning',hi:'एसिड क्लीनिंग'},en:'For inorganic scaling',hi:'इनऑर्गेनिक स्केलिंग के लिए',tone:'ok'},{i:'🧴',title:{en:'Alkaline cleaning',hi:'अल्कलाइन क्लीनिंग'},en:'For organic fouling',hi:'ऑर्गेनिक फ़ाउलिंग के लिए',tone:'ok'}]},shot:'Green flask labelled acid, blue flask labelled alkaline.',en:'Two common cleaning chemicals. Acid cleaning is for inorganic scaling. Alkaline cleaning is for organic fouling.',hi:'दो आम क्लीनिंग केमिकल। एसिड क्लीनिंग इनऑर्गेनिक स्केलिंग के लिए। अल्कलाइन क्लीनिंग ऑर्गेनिक फ़ाउलिंग के लिए।'},
  {v:{k:'board',items:[{i:'🛢️',en:'CIP tank cleanliness',hi:'CIP टैंक की सफ़ाई'},{i:'🔩',en:'CIP pump operation',hi:'CIP पंप ऑपरेशन'},{i:'🧪',en:'Chemical type',hi:'केमिकल का प्रकार'},{i:'📏',en:'Chemical concentration',hi:'केमिकल कंसंट्रेशन'},{i:'🧫',en:'Cleaning pH',hi:'क्लीनिंग pH'},{i:'🚿',en:'Cleaning flow',hi:'क्लीनिंग फ्लो'},{i:'📟',en:'Cleaning pressure',hi:'क्लीनिंग प्रेशर'},{i:'⏱️',en:'Cleaning duration',hi:'क्लीनिंग समय'}]},shot:'"What to check" list with eight icons.',en:'Check eight things: CIP tank cleanliness, CIP pump operation, chemical type, concentration, cleaning pH, flow, pressure, and duration.',hi:'आठ चीज़ें चेक करें: CIP टैंक की सफ़ाई, CIP पंप ऑपरेशन, केमिकल का प्रकार, केमिकल कंसंट्रेशन, क्लीनिंग pH, क्लीनिंग फ्लो, क्लीनिंग प्रेशर, और क्लीनिंग का समय।'},
  {v:{k:'cards',items:[{i:'❌',title:{en:'CIP not effective',hi:'CIP असरदार नहीं'},en:'Wrong chemical, poor concentration or short soaking: inform supervisor, follow approved SOP',hi:'गलत केमिकल, कम कंसंट्रेशन या कम सोकिंग: सुपरवाइज़र को बताएँ, मंज़ूर SOP मानें',tone:'bad'}]},shot:'Performance chart still low after CIP; SOP sheet and phone icon.',en:'CIP not effective means wrong chemical, poor concentration or insufficient soaking. Inform your supervisor and follow the approved SOP.',hi:'CIP असरदार न हो तो गलत केमिकल, कम कंसंट्रेशन या कम सोकिंग हो सकती है। सुपरवाइज़र को बताएँ और मंज़ूर SOP मानें।'},

  {v:{k:'cards',items:[{i:'🧫',title:{en:'Wrong pH',hi:'गलत pH'},en:'Incorrect chemical preparation: do not start CIP, inform supervisor',hi:'गलत केमिकल तैयारी: CIP शुरू न करें, सुपरवाइज़र को बताएँ',tone:'bad'},{i:'🥛',title:{en:'Chemical carryover',hi:'केमिकल कैरीओवर'},en:'Poor rinsing after CIP: flush until water quality is acceptable',hi:'CIP के बाद कम रिंसिंग: पानी ठीक होने तक फ्लश करें',tone:'warn'}]},shot:'pH meter showing wrong value with a stop hand; rinse water flushing through the membrane.',en:'Wrong pH means incorrect chemical preparation. Do not start CIP. Inform your supervisor. Chemical carryover means poor rinsing after CIP. Flush until the water quality is acceptable.',hi:'गलत pH मतलब केमिकल गलत बना है। CIP शुरू न करें। सुपरवाइज़र को बताएँ। केमिकल कैरीओवर मतलब CIP के बाद रिंसिंग कम हुई। पानी की क्वालिटी ठीक होने तक फ्लश करें।'},
  {v:{k:'board',items:[{i:'🧪',en:'Chemical as per membrane supplier',hi:'मेम्ब्रेन सप्लायर के अनुसार केमिकल',ok:true},{i:'📏',en:'Correct concentration',hi:'सही कंसंट्रेशन',ok:true}]},shot:'Membrane supplier chemical sheet; measuring cylinder with the correct concentration.',en:'Operator reminders: use the correct chemical as per the membrane supplier. Prepare it at the correct concentration.',hi:'ऑपरेटर रिमाइंडर: मेम्ब्रेन सप्लायर के अनुसार सही केमिकल लें। सही कंसंट्रेशन पर बनाएँ।'},
  {v:{k:'board',items:[{i:'🧫',en:'Correct pH',hi:'सही pH',ok:true},{i:'📟',en:'Proper flow and pressure',hi:'सही फ्लो और प्रेशर',ok:true}]},shot:'pH meter in the cleaning tank; flow and pressure gauges on the CIP line.',en:'Keep the correct pH during cleaning. Keep proper flow and pressure.',hi:'सफ़ाई के समय सही pH रखें। सही फ्लो और प्रेशर रखें।'},
  {v:{k:'board',items:[{i:'⏱️',en:'Recommended duration and soaking',hi:'बताया गया समय और सोकिंग',ok:true},{i:'🚿',en:'Rinse thoroughly after CIP',hi:'CIP के बाद अच्छे से रिंस',ok:true},{i:'🧤',en:'Always wear PPE',hi:'PPE हमेशा पहनें',ok:true}]},shot:'Timer for soaking; rinse water flushing the membrane; goggles and gloves.',en:'Follow the recommended cleaning duration and soaking time. Rinse the membranes thoroughly after CIP. Always wear PPE while handling chemicals.',hi:'बताया गया क्लीनिंग समय और सोकिंग समय मानें। CIP के बाद मेम्ब्रेन अच्छी तरह रिंस करें। केमिकल संभालते समय हमेशा PPE पहनें।'},
  {v:{k:'board',items:[{i:'🥽',en:'Goggles, gloves, apron',hi:'चश्मा, दस्ताने, एप्रन'},{i:'⚠️',en:'Handle chemicals carefully',hi:'केमिकल सावधानी से'},{i:'📋',en:'Follow MSDS',hi:'MSDS मानें'}]},shot:'Safety first panel: goggles, gloves, apron; MSDS sheet.',en:'Safety first: wear goggles, gloves and apron. Handle chemicals carefully. Follow MSDS and safety instructions.',hi:'सुरक्षा पहले: चश्मा, दस्ताने और एप्रन पहनें। केमिकल सावधानी से संभालें। MSDS और सुरक्षा निर्देश मानें।'},
  {v:{k:'board',items:[{i:'📈',en:'Monitor performance regularly',hi:'परफ़ॉर्मेंस नियमित देखें'},{i:'⏱️',en:'Clean at the right time',hi:'सही समय पर सफ़ाई'},{i:'📒',en:'Maintain records',hi:'रिकॉर्ड रखें'}]},shot:'CIP best practice icons: performance chart, clock, records; water drop Remember card.',en:'Monitor performance regularly, clean at the right time, and maintain records. Regular and proper CIP keeps the membrane clean and increases membrane life.',hi:'परफ़ॉर्मेंस नियमित देखें, सही समय पर सफ़ाई करें, और रिकॉर्ड रखें। नियमित और सही CIP से मेम्ब्रेन साफ़ रहती है और उसकी उम्र बढ़ती है।'}],
 activity:{type:'order',prompt:{en:'Tap the CIP flow in the correct order.',hi:'CIP फ्लो सही क्रम में टैप करें।'},items:[{i:'🛢️',en:'CIP tank',hi:'CIP टैंक'},{i:'🔩',en:'CIP pump',hi:'CIP पंप'},{i:'🧫',en:'RO membrane',hi:'RO मेम्ब्रेन'},{i:'🚿',en:'Cleaning return or drain',hi:'क्लीनिंग रिटर्न या ड्रेन'}]},
 remember:{en:'Acid for scaling, alkaline for fouling. Wrong pH: do not start, inform supervisor.',hi:'स्केलिंग के लिए एसिड, फ़ाउलिंग के लिए अल्कलाइन। गलत pH: शुरू न करें, सुपरवाइज़र को बताएँ।'}},

/* 8 ─ Daily checklist */
{id:'ch35-daily',cat:'field',em:'📒',title:{en:'Daily checklist: RO membrane system',hi:'डेली चेकलिस्ट: RO मेम्ब्रेन सिस्टम'},
 lines:[
  {v:{k:'board',items:[{i:'📒',en:'Daily checklist',hi:'डेली चेकलिस्ट'},{i:'✅',en:'Safe, stable RO',hi:'सुरक्षित, स्थिर RO'},{i:'📞',en:'Report abnormal at once',hi:'असामान्य हो तो तुरंत बताएँ'}]},shot:'Operator holds a clipboard "Daily Checklist"; shield "Safety first".',en:'Daily checks help you keep RO performance safe and stable. Report any abnormal condition immediately to your supervisor.',hi:'रोज़ के चेक से RO सुरक्षित और स्थिर चलता है। कोई भी असामान्य हालत तुरंत सुपरवाइज़र को बताएँ।'},
  {v:{k:'cards',items:[{i:'🛢️',title:{en:'RO feed tank level',hi:'RO फ़ीड टैंक लेवल'},en:'Normal: stable. Abnormal: check upstream flow and level switch',hi:'नॉर्मल: स्थिर। असामान्य: अपस्ट्रीम फ्लो और लेवल स्विच चेक',tone:'ok'}]},shot:'Checklist row 1: feed tank with a stable level mark and level switch.',en:'RO feed tank level should be stable. If not, check upstream flow and the level switch.',hi:'RO फ़ीड टैंक का लेवल स्थिर होना चाहिए। न हो तो अपस्ट्रीम फ्लो और लेवल स्विच चेक करें।'},
  {v:{k:'cards',items:[{i:'🥛',title:{en:'Feed water colour',hi:'फ़ीड वॉटर का रंग'},en:'Normal: clear, no visible solids. Abnormal: check pretreatment',hi:'नॉर्मल: साफ़, कण नहीं। असामान्य: प्रीट्रीटमेंट चेक',tone:'ok'}]},shot:'Checklist row 2: clear feed water sample held to the light.',en:'Feed water should be clear without visible solids. If not, check pretreatment.',hi:'फ़ीड वॉटर साफ़ होना चाहिए, दिखने वाले कण नहीं। न हो तो प्रीट्रीटमेंट चेक करें।'},
  {v:{k:'cards',items:[{i:'🧱',title:{en:'Cartridge filter DP',hi:'कार्ट्रिज फ़िल्टर DP'},en:'Normal: low, within limit. Abnormal: replace cartridge if DP is high',hi:'नॉर्मल: कम, लिमिट में। असामान्य: DP ज़्यादा हो तो कार्ट्रिज बदलें',tone:'ok'}]},shot:'Checklist row 3: cartridge filter DP gauge within limit.',en:'Cartridge filter DP should be low, within limit. If DP is high, replace the cartridge.',hi:'कार्ट्रिज फ़िल्टर का DP कम, लिमिट में होना चाहिए। DP ज़्यादा हो तो कार्ट्रिज बदलें।'},
  {v:{k:'cards',items:[{i:'⚗️',title:{en:'Antiscalant dosing',hi:'एंटीस्केलेंट डोज़िंग'},en:'Normal: dosing pump running. Abnormal: check chemical level and pump',hi:'नॉर्मल: डोज़िंग पंप चालू। असामान्य: केमिकल लेवल और पंप चेक',tone:'ok'}]},shot:'Checklist row 4: antiscalant dosing pump running, tank level visible.',en:'The antiscalant dosing pump should be running. If not, check chemical level and the pump.',hi:'एंटीस्केलेंट डोज़िंग पंप चलता रहना चाहिए। न चले तो केमिकल लेवल और पंप चेक करें।'},
  {v:{k:'cards',items:[{i:'📟',title:{en:'Feed pressure',hi:'फ़ीड प्रेशर'},en:'Normal: stable as per design. Abnormal: check feed pump and valves',hi:'नॉर्मल: डिज़ाइन के अनुसार स्थिर। असामान्य: फ़ीड पंप और वाल्व चेक',tone:'ok'}]},shot:'Checklist row 5: feed pressure gauge steady at the design mark.',en:'Feed pressure should be stable as per design. If not, check the feed pump and valves.',hi:'फ़ीड प्रेशर डिज़ाइन के अनुसार स्थिर होना चाहिए। न हो तो फ़ीड पंप और वाल्व चेक करें।'},
  {v:{k:'cards',items:[{i:'⚙️',title:{en:'High pressure pump',hi:'हाई प्रेशर पंप'},en:'Normal: smooth running. Abnormal: check current, vibration and pressure',hi:'नॉर्मल: स्मूद चल रहा। असामान्य: करंट, वाइब्रेशन, प्रेशर चेक',tone:'ok'}]},shot:'Checklist row 6: high pressure pump running smoothly.',en:'The high pressure pump should run smoothly. If not, check current, vibration and pressure.',hi:'हाई प्रेशर पंप स्मूद चलना चाहिए। न चले तो करंट, वाइब्रेशन और प्रेशर चेक करें।'},
  {v:{k:'cards',items:[{i:'📟',title:{en:'RO inlet and reject pressure',hi:'RO इनलेट और रिजेक्ट प्रेशर'},en:'Normal: within design range. Abnormal: inform supervisor if too high or low',hi:'नॉर्मल: डिज़ाइन रेंज में। असामान्य: बहुत ज़्यादा या कम हो तो सुपरवाइज़र को बताएँ',tone:'ok'}]},shot:'Checklist row 7: RO inlet and reject pressure gauges within the design range.',en:'RO inlet pressure and reject pressure should be within design range. Inform your supervisor if they are too high or too low.',hi:'RO इनलेट प्रेशर और रिजेक्ट प्रेशर डिज़ाइन रेंज में होने चाहिए। बहुत ज़्यादा या बहुत कम हों तो सुपरवाइज़र को बताएँ।'},
  {v:{k:'cards',items:[{i:'💧',title:{en:'Permeate flow',hi:'परमिएट फ्लो'},en:'Normal: stable. Abnormal: check membrane fouling and pressure',hi:'नॉर्मल: स्थिर। असामान्य: मेम्ब्रेन फ़ाउलिंग और प्रेशर चेक',tone:'ok'}]},shot:'Checklist row 8: permeate flow meter reading steady.',en:'Permeate flow should be stable. If not, check membrane fouling and pressure.',hi:'परमिएट फ्लो स्थिर होना चाहिए। न हो तो मेम्ब्रेन फ़ाउलिंग और प्रेशर चेक करें।'},
  {v:{k:'cards',items:[{i:'🟤',title:{en:'Reject flow',hi:'रिजेक्ट फ्लो'},en:'Normal: available as per design. Abnormal: check reject valve and blockage',hi:'नॉर्मल: डिज़ाइन के अनुसार। असामान्य: रिजेक्ट वाल्व और ब्लॉकेज चेक',tone:'ok'}]},shot:'Checklist row 9: reject flow meter and reject valve.',en:'Reject flow should be available as per design. If not, check the reject valve and blockage.',hi:'रिजेक्ट फ्लो डिज़ाइन के अनुसार होना चाहिए। न हो तो रिजेक्ट वाल्व और ब्लॉकेज चेक करें।'},
  {v:{k:'cards',items:[{i:'🔄',title:{en:'Recovery',hi:'रिकवरी'},en:'Normal: as per plant design. Abnormal: do not adjust without approval',hi:'नॉर्मल: प्लांट डिज़ाइन के अनुसार। असामान्य: मंज़ूरी के बिना न बदलें',tone:'warn'}]},shot:'Checklist row 10: recovery percentage display with a lock icon.',en:'Recovery should be as per plant design. Do not adjust it without approval.',hi:'रिकवरी प्लांट डिज़ाइन के अनुसार होनी चाहिए। मंज़ूरी के बिना इसे न बदलें।'},
  {v:{k:'cards',items:[{i:'🧂',title:{en:'Permeate TDS',hi:'परमिएट TDS'},en:'Normal: within required limit. Abnormal: inform supervisor if high',hi:'नॉर्मल: तय लिमिट में। असामान्य: ज़्यादा हो तो सुपरवाइज़र को बताएँ',tone:'ok'}]},shot:'Checklist row 11: permeate TDS meter within limit.',en:'Permeate TDS should be within the required limit. Inform your supervisor if it is high.',hi:'परमिएट TDS तय लिमिट में होना चाहिए। ज़्यादा हो तो सुपरवाइज़र को बताएँ।'},
  {v:{k:'cards',items:[{i:'🛑',title:{en:'Chlorine / ORP',hi:'क्लोरीन / ORP'},en:'Normal: no chlorine before RO membrane. Abnormal: stop RO if chlorine is detected',hi:'नॉर्मल: RO मेम्ब्रेन से पहले क्लोरीन नहीं। असामान्य: क्लोरीन मिले तो RO रोकें',tone:'bad'}]},shot:'Checklist row 12: chlorine test before the membrane; red stop sign.',en:'There must be no chlorine before the RO membrane. Stop RO if chlorine is detected.',hi:'RO मेम्ब्रेन से पहले क्लोरीन बिल्कुल नहीं होना चाहिए। क्लोरीन मिले तो RO रोक दें।'},
  {v:{k:'cards',items:[{i:'💦',title:{en:'Leakage',hi:'लीकेज'},en:'Normal: no leakage. Abnormal: inform maintenance',hi:'नॉर्मल: कोई लीकेज नहीं। असामान्य: मेंटेनेंस को बताएँ',tone:'ok'},{i:'👂',title:{en:'Abnormal noise or vibration',hi:'असामान्य आवाज़ या वाइब्रेशन'},en:'Normal: not present. Abnormal: stop if severe and inform supervisor',hi:'नॉर्मल: नहीं है। असामान्य: ज़्यादा हो तो रोकें, सुपरवाइज़र को बताएँ',tone:'ok'}]},shot:'Checklist rows 13 and 14: dry pipe joints, no leakage; operator listens at the pump, no vibration lines.',en:'There should be no leakage. If there is, inform maintenance. Abnormal noise or vibration should not be present. Stop if severe and inform your supervisor.',hi:'कोई लीकेज नहीं होनी चाहिए। हो तो मेंटेनेंस को बताएँ। असामान्य आवाज़ या वाइब्रेशन नहीं होनी चाहिए। ज़्यादा हो तो रोकें और सुपरवाइज़र को बताएँ।'},
  {v:{k:'cards',items:[{i:'🚿',title:{en:'Flushing',hi:'फ्लशिंग'},en:'Normal: working properly. Abnormal: check flush valve and sequence',hi:'नॉर्मल: ठीक चल रही। असामान्य: फ्लश वाल्व और सीक्वेंस चेक',tone:'ok'}]},shot:'Checklist row 15: flush valve and flushing sequence running.',en:'Flushing should work properly. If not, check the flush valve and sequence.',hi:'फ्लशिंग ठीक चलनी चाहिए। न चले तो फ्लश वाल्व और सीक्वेंस चेक करें।'},
  {v:{k:'board',items:[{i:'📟',en:'Monitor pressure and flows',hi:'प्रेशर और फ्लो देखें',ok:true},{i:'🧫',en:'Keep membranes clean and protected',hi:'मेम्ब्रेन साफ़ और सुरक्षित',ok:true},{i:'⚗️',en:'Proper chemical dosing',hi:'सही केमिकल डोज़िंग',ok:true},{i:'📞',en:'Report early, prevent downtime',hi:'जल्दी बताएँ, डाउनटाइम बचाएँ',ok:true}]},shot:'Operator takeaway strip with four icons; water drop mascot gives thumbs up.',en:'Operator takeaway: monitor pressure and flows. Keep membranes clean and protected. Ensure proper chemical dosing. Report issues early and prevent downtime.',hi:'ऑपरेटर टेकअवे: प्रेशर और फ्लो देखते रहें। मेम्ब्रेन साफ़ और सुरक्षित रखें। सही केमिकल डोज़िंग रखें। समस्या जल्दी बताएँ और डाउनटाइम बचाएँ।'}],
 activity:{type:'multi',prompt:{en:'Tap every check where you must inform your supervisor.',hi:'हर वह चेक टैप करें जहाँ सुपरवाइज़र को बताना ज़रूरी है।'},options:[{i:'📟',en:'Inlet or reject pressure too high or low',hi:'इनलेट या रिजेक्ट प्रेशर बहुत ज़्यादा या कम',ok:true},{i:'🧱',en:'Cartridge filter DP high',hi:'कार्ट्रिज फ़िल्टर DP ज़्यादा',ok:false},{i:'🧂',en:'Permeate TDS high',hi:'परमिएट TDS ज़्यादा',ok:true},{i:'🥛',en:'Feed water not clear',hi:'फ़ीड वॉटर साफ़ नहीं',ok:false},{i:'👂',en:'Severe noise or vibration',hi:'तेज़ आवाज़ या वाइब्रेशन',ok:true}]},
 remember:{en:'No chlorine before the membrane. Report anything abnormal immediately.',hi:'मेम्ब्रेन से पहले क्लोरीन नहीं। असामान्य कुछ भी हो, तुरंत बताएँ।'}},

/* 9 ─ Quiz */
{id:'ch35-quiz',cat:'quiz',em:'🏆',title:{en:'Final quiz',hi:'फ़ाइनल क्विज़'},
 lines:[
  {v:{k:'trophy'},shot:'Trophy and badge; presenter gives thumbs up.',en:'Eight quick questions. Tap the right answer. Let us see what you remember!',hi:'आठ छोटे सवाल। सही जवाब टैप करें। देखें आपको क्या याद है!'}],
 questions:[
  {q:{en:'What does RO mean?',hi:'RO का मतलब क्या है?'},o:[{i:'💧',en:'Reverse Osmosis',hi:'रिवर्स ऑस्मोसिस',ok:true},{i:'🔥',en:'Rapid Oxidation',hi:'रैपिड ऑक्सीडेशन'},{i:'🟤',en:'Reject Outlet',hi:'रिजेक्ट आउटलेट'}]},
  {q:{en:'Cartridge filter pressure drop is high. What do you do?',hi:'कार्ट्रिज फ़िल्टर का प्रेशर ड्रॉप ज़्यादा है। आप क्या करेंगे?'},o:[{i:'🔄',en:'Replace the cartridge',hi:'कार्ट्रिज बदलें',ok:true},{i:'📈',en:'Increase pump pressure',hi:'पंप प्रेशर बढ़ाएँ'},{i:'🛑',en:'Stop antiscalant dosing',hi:'एंटीस्केलेंट डोज़िंग बंद करें'}]},
  {q:{en:'Antiscalant dosing prevents what?',hi:'एंटीस्केलेंट डोज़िंग किससे बचाती है?'},o:[{i:'🪨',en:'Scale on the membrane',hi:'मेम्ब्रेन पर स्केल',ok:true},{i:'👂',en:'Noise in the pump',hi:'पंप की आवाज़'},{i:'💧',en:'Leakage in the housing',hi:'हाउसिंग में लीकेज'}]},
  {q:{en:'Where is antiscalant injected?',hi:'एंटीस्केलेंट कहाँ डोज़ होता है?'},o:[{i:'🚰',en:'RO feed line, before the membrane',hi:'RO फ़ीड लाइन में, मेम्ब्रेन से पहले',ok:true},{i:'💧',en:'Permeate tank',hi:'परमिएट टैंक में'},{i:'🛢️',en:'Reject tank',hi:'रिजेक्ट टैंक में'}]},
  {q:{en:'High pressure pump seal is leaking badly. What do you do?',hi:'हाई प्रेशर पंप की सील से ज़्यादा लीक हो रहा है। आप क्या करेंगे?'},o:[{i:'🛑',en:'Stop the pump, inform maintenance',hi:'पंप रोकें, मेंटेनेंस को बताएँ',ok:true},{i:'😴',en:'Keep running, it is normal',hi:'चलने दें, यह नॉर्मल है'},{i:'⚗️',en:'Add more antiscalant',hi:'और एंटीस्केलेंट डालें'}]},

/* 4 ─ Commissioning and start-up (part 2) */
{id:'ch4-startup-b',cat:'field',em:'🔩',title:{en:'Commissioning and start-up (part 2)',hi:'कमीशनिंग और स्टार्ट-अप (भाग 2)'},
 lines:[
  {v:{k:'steps',items:[{n:1,i:'📋',en:'Pre-start checks',hi:'प्री-स्टार्ट चेक'}]},shot:'Speech bubble "Start gradually. Monitor continuously."; step 1 checklist with a tick on feed quality.',en:'Now the start-up procedure. Start gradually and monitor continuously. Step 1, pre-start checks: confirm feed quality within design limits.',hi:'अब स्टार्ट-अप प्रोसीजर। धीरे-धीरे शुरू करें और लगातार मॉनिटर करें। स्टेप 1, प्री-स्टार्ट चेक: फ़ीड क्वालिटी डिज़ाइन लिमिट में है यह कन्फ़र्म करें।'},
  {v:{k:'board',items:[{i:'🔍',en:'Leaks, flushed pipework, strainers',hi:'लीक, फ्लश पाइपवर्क, स्ट्रेनर'},{i:'📟',en:'PLC valve sequence, interlocks',hi:'PLC वाल्व सीक्वेंस, इंटरलॉक'}]},shot:'Checklist ticks: no leaks, pipework flushed, strainer clean; PLC screen showing the valve sequence.',en:'Check for leaks, flushed pipework and strainers. Verify the PLC valve sequence and interlocks.',hi:'लीक, फ्लश किया पाइपवर्क और स्ट्रेनर देखें। PLC वाल्व सीक्वेंस और इंटरलॉक जाँचें।'},
  {v:{k:'steps',items:[{n:2,i:'🔩',en:'Prepare the system',hi:'सिस्टम तैयार करें'}]},shot:'Feed tank level visible, suction valve opened, pump primed.',en:'Step 2, prepare the system: ensure feed level, open suction and prime the pump.',hi:'स्टेप 2, सिस्टम तैयार करें: फ़ीड लेवल देखें, सक्शन खोलें और पंप प्राइम करें।'},
  {v:{k:'board',items:[{i:'⚗️',en:'Chemicals and dosing ready',hi:'केमिकल और डोज़िंग तैयार'},{i:'🫧',en:'Vent trapped air',hi:'फँसी हवा निकालें'},{i:'📈',en:'Ramp pumps up gradually',hi:'पंप धीरे-धीरे बढ़ाएँ'}]},shot:'Dosing tanks checked, vent valve releases air, pump speed rises slowly.',en:'Check correct chemicals and dosing readiness. Vent trapped air and ramp the pumps up gradually.',hi:'सही केमिकल और डोज़िंग की तैयारी देखें। फँसी हवा निकालें और पंप धीरे-धीरे बढ़ाएँ।'},

  {v:{k:'steps',items:[{n:6,i:'📈',en:'Normal operation: trend TMP',hi:'नॉर्मल ऑपरेशन: TMP ट्रेंड'}]},shot:'Step 6: screen with TMP, flow and turbidity trend lines; operator writes readings; alarm icon investigated.',en:'Step 6, normal operation: run the programmed filtration and cleaning cycles. Trend TMP, flow and filtrate turbidity. Record readings and investigate alarms promptly.',hi:'स्टेप 6, नॉर्मल ऑपरेशन: प्रोग्राम किए फ़िल्ट्रेशन और क्लीनिंग साइकल चलाएँ। TMP, फ्लो और फ़िल्ट्रेट टर्बिडिटी का ट्रेंड देखें। रीडिंग लिखें और अलार्म की तुरंत जाँच करें।'},

  {v:{k:'board',items:[{i:'🔄',en:'Backwash',hi:'बैकवॉश'},{i:'🌀',en:'Air scour',hi:'एयर स्कोर'},{i:'⚗️',en:'CEB',hi:'CEB'},{i:'🧼',en:'CIP',hi:'CIP'}]},shot:'Gear icon "Cleaning: backwash / air scour / CEB / CIP, as applicable".',en:'Cleaning means backwash, air scour, CEB or CIP, as applicable.',hi:'सफ़ाई मतलब बैकवॉश, एयर स्कोर, CEB या CIP, जैसा लागू हो।'},

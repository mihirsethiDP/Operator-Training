<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#0B5CAD"><link rel="icon" href="data:,"><style>:root{padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}body{margin:0;font:14px system-ui;background:#fafafa}img{max-width:100%}[hidden]{display:none!important}</style></head><body><title>Water Plant Operator Training</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Baloo+2:wght@500;600;700;800&family=Mukta:wght@400;500;600;700&family=Baloo+Thambi+2:wght@700&family=Baloo+Tamma+2:wght@700&family=Baloo+Paaji+2:wght@700&family=Baloo+Bhai+2:wght@700&family=Baloo+Tammudu+2:wght@700&family=Baloo+Da+2:wght@700&family=Baloo+Chettan+2:wght@700&family=Baloo+Bhaina+2:wght@700&display=swap">
<style>
/* Layout: phone-first video "player" card (stage → avatar+caption → controls); home is a scene map; one header holds tabs, language and sound. */
:root{
  --bg:#EDF3F8; --card:#FFFFFF; --ink:#102A43; --muted:#5B6E82; --line:#D3DEE8; --soft:#E4F1FA; --soft2:#F4F8FB;
  --blue:#0B5CAD; --blue-ink:#083F78; --cyan:#1AA3D9; --cyan-soft:#D9F1FB;
  --ok:#1E9E5A; --ok-soft:#DCF4E6; --warn:#D9890A; --warn-soft:#FFF0D2; --bad:#D63B3B; --bad-soft:#FBE3E3;
  --glass:#F4FAFD; --wall:#DCE6EE; --ground:#9FC77A; --sky1:#DDF1FB; --sky2:#F3FAFE; --lcd:#DFF5E0; --lcd-ink:#15391D;
  --display:'Baloo 2','Baloo Thambi 2','Baloo Tamma 2','Baloo Paaji 2','Baloo Bhai 2','Baloo Tammudu 2','Baloo Da 2','Baloo Chettan 2','Baloo Bhaina 2','Mukta','Nirmala UI',system-ui,sans-serif; --body:'Mukta','Nirmala UI','Noto Sans',system-ui,sans-serif;
  --r:20px; --shadow:0 8px 28px rgba(16,42,67,.10);
}
@media (prefers-color-scheme: dark){ :root:not([data-theme="light"]){
  --bg:#0B1727; --card:#132238; --ink:#EAF2FB; --muted:#A9B8CA; --line:#27405C; --soft:#17304B; --soft2:#0F1E33;
  --blue:#5AABFF; --blue-ink:#A9D0FF; --cyan:#3CC4F0; --cyan-soft:#11364A;
  --ok:#3BC97A; --ok-soft:#153A2A; --warn:#F2B544; --warn-soft:#3E2E12; --bad:#F26B6B; --bad-soft:#44201F;
  --glass:#1C3049; --wall:#2A3F5A; --ground:#3E6B3A; --sky1:#162B44; --sky2:#1A3354; --lcd:#1E3A24; --lcd-ink:#C8F5CF;
  --shadow:0 8px 28px rgba(0,0,0,.35); color-scheme:dark } }
:root[data-theme="dark"]{
  --bg:#0B1727; --card:#132238; --ink:#EAF2FB; --muted:#A9B8CA; --line:#27405C; --soft:#17304B; --soft2:#0F1E33;
  --blue:#5AABFF; --blue-ink:#A9D0FF; --cyan:#3CC4F0; --cyan-soft:#11364A;
  --ok:#3BC97A; --ok-soft:#153A2A; --warn:#F2B544; --warn-soft:#3E2E12; --bad:#F26B6B; --bad-soft:#44201F;
  --glass:#1C3049; --wall:#2A3F5A; --ground:#3E6B3A; --sky1:#162B44; --sky2:#1A3354; --lcd:#1E3A24; --lcd-ink:#C8F5CF;
  --shadow:0 8px 28px rgba(0,0,0,.35); color-scheme:dark }

*,*::before,*::after{box-sizing:border-box}
html,body{height:100%}
body{margin:0;background:var(--bg);color:var(--ink);font-family:var(--body);font-size:17px;line-height:1.5;-webkit-text-size-adjust:100%}
h1,h2,h3,.brand,.chip,.chip5,.opt .lb,.scard .ttl,.btn,.ctl,.valbtn,.cat b,.pstep b,.ftitle,.res,.lcd .val{font-family:var(--display)}
h1,h2,h3{text-wrap:balance;margin:0;line-height:1.15}
button{font:inherit;color:inherit;cursor:pointer}
button:focus-visible,input:focus-visible,summary:focus-visible{outline:3px solid var(--cyan);outline-offset:2px}
[hidden]{display:none!important}
.em{font-family:'Segoe UI Emoji','Apple Color Emoji','Noto Color Emoji',sans-serif}

/* ---------- header ---------- */
.top{position:sticky;top:env(safe-area-inset-top,0px);z-index:10;background:var(--card);border-bottom:1px solid var(--line);display:flex;align-items:center;gap:12px;padding:8px 16px;flex-wrap:wrap}
.brandrow{display:flex;align-items:center;gap:10px;min-width:0;flex:1}
.logo{font-size:26px;width:44px;height:44px;border-radius:14px;background:var(--cyan-soft);display:grid;place-items:center;flex:none}
.brand{font-weight:800;font-size:19px;line-height:1.1}
.sub{font-size:12.5px;color:var(--muted);line-height:1.2}
.tabs{display:flex;gap:4px;background:var(--soft2);border:1px solid var(--line);border-radius:999px;padding:3px;order:3;width:100%}
.tab{flex:1;border:0;background:transparent;border-radius:999px;padding:9px 14px;font-weight:700;font-size:15px;color:var(--muted)}
.tab.on{background:var(--blue);color:#fff}
.tools{display:flex;gap:8px}
.tool{min-width:46px;height:46px;padding:0 12px;border-radius:14px;border:1px solid var(--line);background:var(--soft2);font-weight:800;font-size:16px;font-family:var(--display);white-space:nowrap}
@media (min-width:720px){ .tabs{order:0;width:auto;min-width:300px} }

main{max-width:980px;margin:0 auto;padding-block:16px 40px;padding-inline:16px}

/* ---------- buttons & chips ---------- */
.btn{border:2px solid var(--line);background:var(--card);border-radius:16px;padding:12px 18px;font-weight:700;font-size:16px;min-height:52px;display:inline-flex;align-items:center;justify-content:center;gap:8px;transition:transform .08s,background .15s}
.btn:active{transform:scale(.97)}
.btn.primary{background:var(--blue);border-color:var(--blue);color:#fff}
.btn.big{font-size:19px;min-height:62px;padding:14px 26px;border-radius:20px}
.btn.ghost{background:transparent}
.btn.lang{font-size:19px;min-height:60px;padding:12px 22px}
.btn.lang.on{border-color:var(--blue);background:var(--soft);color:var(--blue-ink)}
.btn:disabled{opacity:.55;cursor:default}
.chip{display:inline-flex;align-items:center;gap:6px;border-radius:999px;padding:4px 12px;font-size:13.5px;font-weight:700;letter-spacing:.02em;background:var(--soft);color:var(--blue-ink)}
.chip.field{background:var(--cyan-soft);color:var(--blue-ink)}
.chip.lab{background:var(--warn-soft);color:var(--warn)}
.chip.quiz{background:var(--ok-soft);color:var(--ok)}
.chip.turn{background:var(--warn-soft);color:var(--warn);font-size:15px}
.chip.rem{background:var(--ok-soft);color:var(--ok);font-size:15px}
.chip.ok{background:var(--ok-soft);color:var(--ok)}
.hint{color:var(--muted);font-size:15px;margin:0}
.eyebrow{text-transform:uppercase;letter-spacing:.12em;font-size:12.5px;font-weight:700;color:var(--muted);margin:0 0 4px}

/* ---------- home ---------- */
.hero{display:grid;grid-template-columns:1fr;gap:16px;background:var(--card);border-radius:var(--r);box-shadow:var(--shadow);padding:20px;margin-bottom:22px;position:relative;overflow:hidden}
.hero::before{content:"";position:absolute;inset:auto -60px -80px auto;width:260px;height:260px;border-radius:50%;background:var(--cyan-soft);opacity:.7}
.heroav{width:150px;margin:0 auto;position:relative}
.herotxt{position:relative;min-width:0}
.hero h1{font-size:34px;font-weight:800;color:var(--blue-ink)}
.lead{font-size:18px;margin:8px 0 14px;max-width:60ch}
.langpick{display:flex;flex-direction:column;gap:8px;margin-bottom:14px}
.langbtns{display:flex;gap:10px;flex-wrap:wrap}
.startrow{display:flex;gap:10px;flex-wrap:wrap;align-items:center}
.prog{margin-top:14px}
.bar{height:10px;border-radius:999px;background:var(--soft2);border:1px solid var(--line);overflow:hidden}
.bar span{display:block;height:100%;background:linear-gradient(90deg,var(--cyan),var(--blue));transition:width .4s}
.prog small{color:var(--muted);font-size:13.5px}
@media (min-width:640px){ .hero{grid-template-columns:170px 1fr;align-items:center} .heroav{width:170px} }
.map h2{font-size:18px;display:flex;align-items:center;gap:8px;margin:18px 0 10px;color:var(--muted);text-transform:uppercase;letter-spacing:.06em}
.dot{width:12px;height:12px;border-radius:50%;display:inline-block}
.dot.field{background:var(--cyan)} .dot.lab{background:var(--warn)} .dot.quiz{background:var(--ok)}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:10px}
.scard{text-align:left;border:2px solid var(--line);background:var(--card);border-radius:18px;padding:12px;display:grid;grid-template-columns:auto 1fr;grid-template-rows:auto auto;gap:4px 10px;align-items:center;min-height:92px;transition:transform .08s}
.scard:active{transform:scale(.98)}
.scard .num{grid-row:1/3;width:36px;height:36px;border-radius:12px;background:var(--soft);display:grid;place-items:center;font-weight:800;font-family:var(--display);color:var(--blue-ink)}
.scard .em{font-size:24px;line-height:1}
.scard .ttl{font-weight:700;font-size:15.5px;line-height:1.2}
.scard .meta{grid-column:2;font-size:12.5px;color:var(--muted)}
.scard.done{border-color:var(--ok)} .scard.done .num{background:var(--ok-soft);color:var(--ok)} .scard.done .meta{color:var(--ok);font-weight:700}

/* ---------- player ---------- */
.pbar{display:flex;align-items:center;gap:10px;flex-wrap:wrap;margin-bottom:10px}
.ptitle{flex:1;min-width:0;display:flex;flex-direction:column;gap:2px}
.ptitle h2{font-size:21px;font-weight:800;white-space:normal}
.pprog{display:flex;flex-direction:column;align-items:flex-end;gap:4px;font-variant-numeric:tabular-nums}
.pnum{font-size:12.5px;color:var(--muted);font-weight:700}
.dots{display:flex;gap:4px}
.dots i{width:10px;height:10px;border-radius:50%;background:var(--line);display:inline-block}
.dots i.done{background:var(--blue)} .dots i.now{background:var(--cyan);box-shadow:0 0 0 3px var(--cyan-soft)} .dots i.act{border-radius:3px}
.card{background:var(--card);border-radius:var(--r);box-shadow:var(--shadow)}
.stagecard{padding:14px;display:flex;flex-direction:column;gap:12px}
.stage{min-height:230px;border-radius:16px;background:var(--soft2);border:1px solid var(--line);display:grid;place-items:center;padding:14px;color:var(--ink);opacity:0;transform:translateY(6px)}
.stage.in{opacity:1;transform:none;transition:opacity .35s,transform .35s}
.talk{display:grid;grid-template-columns:76px 1fr;gap:10px;align-items:end}
.avwrap{width:76px}
.avatar{width:100%;height:auto;display:block}
.avatar .eye{transform-box:fill-box;transform-origin:center;animation:blink 4.6s infinite}
.avatar .mouth{opacity:0;transform-box:fill-box;transform-origin:center}
.avatar.talking .smile{opacity:0}
.avatar.talking .mouth{opacity:1;animation:talk .22s infinite alternate ease-in-out}
@keyframes blink{0%,93%,100%{transform:scaleY(1)}96%{transform:scaleY(.08)}}
@keyframes talk{from{transform:scaleY(.25)}to{transform:scaleY(1)}}
.bubble{position:relative;background:var(--soft);border-radius:18px 18px 18px 4px;padding:12px 16px;min-height:64px;display:flex;align-items:center}
.bubble::before{content:"";position:absolute;left:-8px;bottom:14px;border:8px solid transparent;border-right-color:var(--soft);border-left:0}
.cap{margin:0;font-size:19px;line-height:1.45;font-weight:500;max-width:62ch;opacity:0}
.cap.in{opacity:1;transition:opacity .3s}
.controls{display:grid;grid-template-columns:repeat(4,1fr);gap:8px}
.ctl{border:2px solid var(--line);background:var(--card);border-radius:14px;min-height:60px;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:2px;font-weight:700;font-size:13px;padding:6px 4px}
.ctl .ic{font-size:22px;line-height:1}
.ctl:active{transform:scale(.97)}
.notice{margin-top:10px;background:var(--warn-soft);color:var(--warn);border-radius:12px;padding:12px 14px;font-size:14.5px;display:flex;gap:10px;align-items:flex-start}
.ntext{display:flex;flex-direction:column;gap:4px;min-width:0;flex:1;line-height:1.4}
.ntext b{font-weight:800}
.nclose{border:0;background:transparent;font-size:18px;font-weight:800;color:inherit;padding:0 4px;line-height:1}
@media (min-width:640px){ .talk{grid-template-columns:96px 1fr} .avwrap{width:96px} .cap{font-size:21px} .stage{min-height:280px} }

/* ---------- visuals ---------- */
.row{display:flex;flex-wrap:wrap;gap:14px 18px;justify-content:center;align-items:flex-end;width:100%}
.fig{margin:0;display:flex;flex-direction:column;align-items:center;gap:6px;max-width:150px}
.fig figcaption{font-size:14.5px;font-weight:600;text-align:center;line-height:1.25}
.fig figcaption small{display:block;color:var(--muted);font-weight:500}
.bk{display:block}
.board{display:grid;gap:8px;width:100%;grid-template-columns:repeat(2,1fr)}
.board.n1,.board.n2{grid-template-columns:repeat(2,1fr)}
.board.n3{grid-template-columns:repeat(3,1fr)}
.board.n5,.board.n6,.board.n7,.board.n8,.board.n9{grid-template-columns:repeat(3,1fr)}
@media (min-width:560px){ .board.n4,.board.n8{grid-template-columns:repeat(4,1fr)} .board.n5{grid-template-columns:repeat(5,1fr)} .board.n6,.board.n9{grid-template-columns:repeat(3,1fr)} .board.n7{grid-template-columns:repeat(4,1fr)} }
.tile{background:var(--card);border:2px solid var(--line);border-radius:14px;padding:10px 8px;display:flex;flex-direction:column;align-items:center;gap:6px;text-align:center;min-height:86px;justify-content:center;animation:pop .35s both;animation-delay:var(--d,0ms)}
.tile .em{font-size:30px;line-height:1}
.tile .lb{font-size:14px;font-weight:600;line-height:1.2}
.tile.bad{border-color:var(--bad);background:var(--bad-soft)} .tile.ok{border-color:var(--ok);background:var(--ok-soft)}
@keyframes pop{from{opacity:0;transform:scale(.9)}to{opacity:1;transform:none}}
.steps{display:flex;flex-wrap:wrap;gap:10px;justify-content:center;width:100%}
.step{flex:1 1 130px;max-width:190px;background:var(--card);border:2px solid var(--line);border-radius:14px;padding:12px 10px;display:flex;flex-direction:column;align-items:center;gap:6px;text-align:center;animation:pop .35s both;animation-delay:var(--d,0ms)}
.step .n{width:30px;height:30px;border-radius:50%;background:var(--blue);color:#fff;display:grid;place-items:center;font-weight:800;font-family:var(--display)}
.step .em{font-size:32px;line-height:1}
.step .lb{font-size:14.5px;font-weight:600;line-height:1.25}
.five{display:flex;flex-wrap:wrap;gap:8px;align-items:center;justify-content:center}
.chip5{background:var(--blue);color:#fff;border-radius:999px;padding:10px 18px;font-weight:800;font-size:18px;display:inline-flex;align-items:center;gap:8px;animation:pop .4s both;animation-delay:var(--d,0ms)}
.five .arrow{font-size:26px;color:var(--muted);font-weight:800}
.scene{width:100%;max-width:520px;height:auto}
.bub{animation:rise 2.2s infinite ease-in;animation-delay:var(--d,0s);transform-box:fill-box}
@keyframes rise{0%{transform:translateY(0);opacity:.9}100%{transform:translateY(-46px);opacity:0}}
.gauge{width:100%;max-width:340px;height:auto}
.tankwrap{display:grid;grid-template-columns:1fr auto;gap:12px;align-items:center;width:100%;max-width:520px}
.tanksvg{width:100%;height:auto}
.meter{background:#2B3340;border-radius:16px;padding:10px 12px 8px;color:#fff;width:118px;border:3px solid var(--c,var(--line));text-align:center}
.lcd{background:var(--lcd);color:var(--lcd-ink);border-radius:8px;padding:6px 8px;display:flex;flex-direction:column;align-items:center;font-variant-numeric:tabular-nums}
.lcd .val{font-size:28px;font-weight:800;line-height:1}
.lcd .unit{font-size:12px;font-weight:700}
.mlabel{font-size:12px;font-weight:800;letter-spacing:.1em;margin-top:6px;color:#CBD5E1}
.dorange{grid-column:1/-1;display:flex;gap:3px;width:100%}
.seg{flex:1;text-align:center;font-size:12px;font-weight:700;padding:5px 2px;border-radius:8px;font-variant-numeric:tabular-nums}
.seg.bad{background:var(--bad-soft);color:var(--bad)} .seg.warn{background:var(--warn-soft);color:var(--warn)} .seg.ok{background:var(--ok-soft);color:var(--ok);flex:1.6}
.cylsvg{display:block}
.formula{background:var(--card);border:2px solid var(--line);border-radius:18px;padding:16px 20px;text-align:center;max-width:460px;width:100%}
.ftitle{font-weight:800;font-size:22px;color:var(--blue-ink);margin-bottom:8px}
.frac{display:inline-flex;flex-direction:column;align-items:center;gap:4px;font-variant-numeric:tabular-nums}
.frac .num{font-size:24px;font-weight:800;padding:0 10px;border-bottom:3px solid var(--ink)}
.frac .den{font-size:17px;font-weight:600;color:var(--muted)}
.fnote{margin-top:10px;font-size:14px;color:var(--muted)}
.trophy{display:flex;flex-direction:column;align-items:center;gap:12px}
.trophy .big{font-size:84px;line-height:1}

/* ---------- activities ---------- */
.act{border-radius:16px;background:var(--soft2);border:1px solid var(--line);padding:14px}
.acthead{display:flex;flex-direction:column;gap:8px;align-items:flex-start;margin-bottom:12px}
.acthead h3{font-size:20px;font-weight:800}
.actbody{display:flex;flex-direction:column;gap:12px}
.actbtns{display:flex;gap:10px;flex-wrap:wrap}
.opts{display:grid;grid-template-columns:repeat(auto-fit,minmax(126px,1fr));gap:10px}
.opt{border:2px solid var(--line);background:var(--card);border-radius:16px;padding:12px 10px;min-height:76px;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:6px;text-align:center;transition:transform .08s,border-color .15s,background .15s}
.opt:active{transform:scale(.97)}
.opt .ic{display:grid;place-items:center;line-height:1}
.opt .ic.em{font-size:32px}
.opt .lb{font-weight:700;font-size:15.5px;line-height:1.2}
.opt.on{border-color:var(--blue);background:var(--soft);box-shadow:inset 0 0 0 2px var(--blue)}
.opt.right{border-color:var(--ok);background:var(--ok-soft)}
.opt.wrong{border-color:var(--bad);background:var(--bad-soft);animation:shake .45s}
.opt:disabled{cursor:default}
.opt:disabled:not(.right):not(.wrong){opacity:.55}
@keyframes shake{0%,100%{transform:translateX(0)}25%{transform:translateX(-6px)}75%{transform:translateX(6px)}}
.fb{margin-top:12px;border-radius:14px;padding:12px 16px;font-weight:800;font-size:18px;font-family:var(--display);animation:pop .3s both}
.fb.good{background:var(--ok-soft);color:var(--ok)} .fb.bad{background:var(--bad-soft);color:var(--bad)}
.gaugebox{display:grid;place-items:center}
.cls{display:flex;flex-direction:column;gap:10px}
.clsrow{display:grid;grid-template-columns:96px 1fr;gap:8px;align-items:stretch}
.valbtn{border:2px solid var(--line);background:var(--card);border-radius:14px;font-weight:800;font-size:17px;font-variant-numeric:tabular-nums}
.cats{display:grid;grid-template-columns:repeat(3,1fr);gap:6px}
.cat{border:2px solid var(--line);background:var(--card);border-radius:14px;padding:8px 4px;display:flex;flex-direction:column;align-items:center;gap:2px;min-height:60px;justify-content:center}
.cat b{font-size:16px} .cat small{font-size:12px;color:var(--muted);line-height:1.1}
.cat.on{border-color:var(--blue)} .cat.right{border-color:var(--ok);background:var(--ok-soft)} .cat.wrong{border-color:var(--bad);background:var(--bad-soft);animation:shake .45s}
.cat:disabled{cursor:default}
.seq{display:flex;gap:8px;justify-content:center;flex-wrap:wrap}
.slot{width:52px;height:52px;border-radius:14px;border:2px dashed var(--line);display:grid;place-items:center;font-weight:800;font-family:var(--display);color:var(--muted);background:var(--card)}
.slot.filled{border:2px solid var(--ok);background:var(--ok-soft);font-size:26px}
.matchgrid{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.matchgrid .col{display:flex;flex-direction:column;gap:10px}
.opt.m{min-height:84px}
.calc{display:grid;grid-template-columns:repeat(auto-fit,minmax(140px,1fr));gap:10px;align-items:end}
.field{display:flex;flex-direction:column;gap:4px;font-weight:700;font-size:14px}
.field input{border:2px solid var(--line);border-radius:12px;padding:10px 12px;font-size:19px;font-weight:700;width:100%;min-width:0;background:var(--card);color:var(--ink);font-variant-numeric:tabular-nums}
.calc .actbtns,.calc .calcout,.calc .hint{grid-column:1/-1}
.calcout{background:var(--ok-soft);border-radius:14px;padding:12px 16px;text-align:center}
.res{font-size:26px;font-weight:800;color:var(--ok);font-variant-numeric:tabular-nums}
.sliderbox{display:flex;flex-direction:column;gap:10px;align-items:center}
.rng{display:flex;flex-direction:column;gap:6px;width:100%;max-width:520px;font-weight:700;font-size:14.5px;color:var(--muted)}
.rng input{width:100%;accent-color:var(--blue);height:40px}
.settlebox{display:flex;flex-direction:column;align-items:center;gap:10px}

  {v:{k:'board',items:[{i:'🫧',en:'Low aeration',hi:'कम एरेशन'},{i:'🦨',en:'Septic sewage',hi:'सेप्टिक सीवेज'},{i:'🦠',en:'Poor bio treatment',hi:'कमज़ोर बायो ट्रीटमेंट'},{i:'🪣',en:'Sludge carryover',hi:'स्लज कैरीओवर'},{i:'🧱',en:'Filter problem',hi:'फ़िल्टर समस्या'}]},shot:'Possible reasons as icons.',en:'Possible reasons: low aeration, septic sewage, poor biological treatment, sludge carryover, or a filter problem.',hi:'संभावित कारण: कम एरेशन, सेप्टिक सीवेज, कमज़ोर बायोलॉजिकल ट्रीटमेंट, स्लज कैरीओवर, या फ़िल्टर की समस्या।'},
  {v:{k:'board',items:[{i:'📟',en:'Check DO',hi:'DO चेक करें'},{i:'🌀',en:'Check blower',hi:'ब्लोअर चेक करें'},{i:'⏳',en:'Check sludge settling',hi:'स्लज सेटलिंग देखें'},{i:'🚿',en:'Check backwash',hi:'बैकवॉश चेक करें'},{i:'📞',en:'Inform supervisor',hi:'सुपरवाइज़र को बताएँ'}]},shot:'Action icons; avatar points to each.',en:'Your actions: check DO in the aeration tank, check the blower, check sludge settling, check filter backwash. If colour stays abnormal, inform your supervisor.',hi:'आपके एक्शन: एरेशन टैंक में DO चेक करें, ब्लोअर चेक करें, स्लज का बैठना देखें, फ़िल्टर बैकवॉश चेक करें। रंग ठीक न हो तो सुपरवाइज़र को बताएँ।'}],

/* 3 ─ Smell */
{id:'smell',cat:'field',em:'👃',title:{en:'Smell: your free instrument',hi:'गंध: आपका मुफ़्त इंस्ट्रूमेंट'},
 lines:[
  {v:{k:'board',items:[{i:'👃',en:'Nose',hi:'नाक'},{i:'🆓',en:'Free instrument',hi:'मुफ़्त इंस्ट्रूमेंट'}]},shot:'Avatar sniffs near the tank, waves hand over sample.',en:'Smell is a very important field check. Your nose is a free instrument.',hi:'गंध बहुत ज़रूरी फ़ील्ड चेक है। आपकी नाक एक मुफ़्त इंस्ट्रूमेंट है।'},
  {v:{k:'board',items:[{i:'🚰',en:'Inlet: mild smell is normal',hi:'इनलेट: हल्की गंध नॉर्मल',ok:true},{i:'💧',en:'Treated: no strong bad smell',hi:'ट्रीटेड: तेज़ बदबू नहीं',ok:true}]},shot:'Inlet pipe with light stink lines (tick), clear beaker with no lines (tick).',en:'Inlet sewage may have a mild smell. Treated water should not have a strong bad smell.',hi:'इनलेट सीवेज में हल्की गंध हो सकती है। ट्रीटेड पानी में तेज़ बदबू नहीं होनी चाहिए।'},
  {v:{k:'board',items:[{i:'🥚',en:'Rotten egg smell',hi:'सड़े अंडे की गंध',bad:true},{i:'🏚️',en:'Septic smell',hi:'सेप्टिक गंध',bad:true},{i:'🧪',en:'Strong chemical smell',hi:'तेज़ केमिकल गंध',bad:true},{i:'🫧',en:'Bad smell from aeration tank',hi:'एरेशन टैंक से बदबू',bad:true},{i:'💧',en:'Bad smell from final water',hi:'फ़ाइनल पानी से बदबू',bad:true}]},shot:'Warning icons for each abnormal smell.',en:'Rotten egg smell, septic smell, strong chemical smell, or bad smell from the aeration tank or final water: these are warning signs.',hi:'सड़े अंडे जैसी गंध, सेप्टिक गंध, तेज़ केमिकल गंध, या एरेशन टैंक या फ़ाइनल पानी से बदबू: ये चेतावनी के संकेत हैं।'},
  {v:{k:'board',items:[{i:'📉',en:'Low DO',hi:'कम DO'},{i:'🌀',en:'Blower not running',hi:'ब्लोअर बंद'},{i:'🕳️',en:'Diffuser choking',hi:'डिफ्यूज़र चोक'},{i:'🛑',en:'Sewage stagnation',hi:'सीवेज रुका हुआ'},{i:'🟫',en:'Old sludge',hi:'पुराना स्लज'},{i:'🦠',en:'Anaerobic condition',hi:'एनएरोबिक कंडीशन'}]},shot:'Reason icons.',en:'Reasons: low DO, blower not running, diffuser choking, sewage stagnation, old sludge, or anaerobic condition.',hi:'कारण: कम DO, ब्लोअर बंद, डिफ्यूज़र चोक, सीवेज का रुका रहना, पुराना स्लज, या एनएरोबिक कंडीशन।'},
  {v:{k:'board',items:[{i:'📟',en:'Check DO reading',hi:'DO रीडिंग चेक'},{i:'🌀',en:'Check blower & air',hi:'ब्लोअर और हवा चेक'},{i:'🔄',en:'Check EQT mixing',hi:'EQT मिक्सिंग चेक'},{i:'🚛',en:'Check sludge wasting',hi:'स्लज वेस्टिंग चेक'},{i:'📣',en:'Strong smell: inform now',hi:'तेज़ गंध: तुरंत बताएँ'}]},shot:'Action icons; megaphone highlighted on "inform immediately".',en:'Actions: check the DO reading, check the blower and air supply, check equalisation tank mixing, check sludge wasting. If the smell is strong, inform your supervisor immediately.',hi:'एक्शन: DO रीडिंग चेक करें, ब्लोअर और हवा की सप्लाई देखें, EQT की मिक्सिंग देखें, स्लज वेस्टिंग चेक करें। गंध तेज़ हो तो तुरंत सुपरवाइज़र को बताएँ।'}],
 activity:{type:'choice',prompt:{en:'Strong rotten egg smell from the aeration tank. What do you do?',hi:'एरेशन टैंक से तेज़ सड़े अंडे की गंध आ रही है। आप क्या करेंगे?'},options:[{i:'⏳',en:'Wait, it will go away',hi:'रुको, अपने आप ठीक होगा',ok:false},{i:'📟',en:'Check DO and blower. Inform supervisor now',hi:'DO और ब्लोअर चेक करो। तुरंत सुपरवाइज़र को बताओ',ok:true},{i:'🚰',en:'Add more water to the tank',hi:'टैंक में और पानी डालो',ok:false}]},

/* 4 ─ pH */
{id:'ph',cat:'field',em:'🧪',title:{en:'pH: acidic or alkaline?',hi:'pH: एसिडिक या अल्कलाइन?'},
 lines:[
  {v:{k:'gauge',value:7.2},shot:'pH gauge 0 to 14, needle at 7.2, green zone 6.5 to 8.5.',en:'pH tells if water is acidic, neutral, or alkaline. Bacteria work well only in the right pH range.',hi:'pH बताता है कि पानी एसिडिक है, न्यूट्रल है या अल्कलाइन। बैक्टीरिया सही pH रेंज में ही अच्छा काम करते हैं।'},
  {v:{k:'gauge',value:7.2,zones:true},shot:'Zones light up: red below 6.5, green 6.5 to 8.5, blue above 8.5.',en:'Normal range is 6.5 to 8.5. Below 6.5 is acidic. Above 8.5 is alkaline.',hi:'नॉर्मल रेंज 6.5 से 8.5 है। 6.5 से नीचे मतलब एसिडिक। 8.5 से ऊपर मतलब अल्कलाइन।'},
  {v:{k:'steps',items:[{n:1,i:'🫙',en:'Clean container',hi:'साफ़ कंटेनर'},{n:2,i:'🔄',en:'Rinse with sample',hi:'सैंपल से धोएँ'}]},shot:'Hands take a sample in a clean jar, rinse it with the same water.',en:'How to test: take the sample in a clean container. Rinse the container with the same sample.',hi:'टेस्ट कैसे करें: साफ़ कंटेनर में सैंपल लें। उसी सैंपल से कंटेनर को धो लें।'},
  {v:{k:'steps',items:[{n:3,i:'🧪',en:'Dip probe or strip',hi:'प्रोब या स्ट्रिप डुबोएँ'},{n:4,i:'⏱️',en:'Wait for stable reading',hi:'रीडिंग स्थिर होने दें'},{n:5,i:'📒',en:'Write in logbook',hi:'लॉगबुक में लिखें'},{n:6,i:'🚿',en:'Clean the probe',hi:'प्रोब साफ़ करें'}]},shot:'pH meter probe in the beaker, display settles on 7.2, hand writes in logbook, probe rinsed.',en:'Dip the pH probe or pH strip. Wait for a stable reading. Note it in the logbook. Clean the probe after testing.',hi:'pH प्रोब या pH स्ट्रिप डुबोएँ। रीडिंग स्थिर होने तक रुकें। लॉगबुक में लिखें। टेस्ट के बाद प्रोब साफ़ करें।'},
  {v:{k:'board',items:[{i:'🚰',en:'Check inlet',hi:'इनलेट चेक'},{i:'🚪',en:'Check outlet source',hi:'आउटलेट सोर्स चेक'},{i:'⚗️',en:'Check chemical dosing',hi:'केमिकल डोज़िंग चेक'}]},shot:'Avatar points to inlet, outlet, and dosing tank.',en:'If pH is out of range, the problem may be the source water or wastewater discharge. Check the inlet, outlet source, and chemical dosing.',hi:'pH रेंज से बाहर हो तो समस्या सोर्स वॉटर या वेस्टवॉटर डिस्चार्ज से हो सकती है। इनलेट, आउटलेट सोर्स और केमिकल डोज़िंग चेक करें।'}],
 activity:{type:'classify',prompt:{en:'Three pH readings. Tap Low, OK, or High for each.',hi:'तीन pH रीडिंग। हर एक के लिए कम, ठीक या ज़्यादा टैप करें।'},items:[{val:5.8,ans:0},{val:7.2,ans:1},{val:9.1,ans:2}],cats:[{en:'Low',hi:'कम',sub:{en:'Acidic',hi:'एसिडिक'}},{en:'OK',hi:'ठीक',sub:{en:'6.5 to 8.5',hi:'6.5 से 8.5'}},{en:'High',hi:'ज़्यादा',sub:{en:'Alkaline',hi:'अल्कलाइन'}}]},
 remember:{en:'pH 6.5 to 8.5 is OK.',hi:'pH 6.5 से 8.5 ठीक है।'}},

/* 5 ─ DO */
{id:'do',cat:'field',em:'🫧',title:{en:'DO: oxygen for bacteria',hi:'DO: बैक्टीरिया की ऑक्सीजन'},
 lines:[
  {v:{k:'tank',value:2.2},shot:'Aeration tank with bubbles; bacteria cartoon "eating" pollution.',en:'DO means dissolved oxygen in the water. Bacteria need oxygen to break down pollution.',hi:'DO मतलब पानी में घुली हुई ऑक्सीजन। बैक्टीरिया को गंदगी तोड़ने के लिए ऑक्सीजन चाहिए।'},
  {v:{k:'tank',value:2.2,range:true},shot:'DO meter reads 2.2 mg/L; green band 1.5 to 3.0.',en:'Check DO in the aeration tank. Normal range: 1.5 to 3.0 mg/L.',hi:'DO एरेशन टैंक में चेक करें। नॉर्मल रेंज: 1.5 से 3.0 mg/L।'},
  {v:{k:'steps',items:[{n:1,i:'📟',en:'Take DO meter',hi:'DO मीटर लें'},{n:2,i:'🫧',en:'Dip probe in tank sample',hi:'प्रोब सैंपल में डुबोएँ'},{n:3,i:'⏱️',en:'Wait for stable reading',hi:'रीडिंग स्थिर होने दें'},{n:4,i:'📒',en:'Note the reading',hi:'रीडिंग लिखें'},{n:5,i:'🚿',en:'Clean the probe',hi:'प्रोब साफ़ करें'}]},shot:'Five-step procedure strip.',en:'How to test: take the DO meter. Dip the probe in the aeration tank sample. Wait for a stable reading. Note it. Clean the probe.',hi:'टेस्ट कैसे करें: DO मीटर लें। प्रोब को एरेशन टैंक के सैंपल में डुबोएँ। रीडिंग स्थिर होने तक रुकें। लिखें। प्रोब साफ़ करें।'},
  {v:{k:'tank',value:0.8,range:true},shot:'Meter reads 0.8; tank goes dark, stink lines, sad face.',en:'Below 1.0 means low oxygen. This causes bad smell, poor treatment, and black sludge.',hi:'1.0 से नीचे मतलब कम ऑक्सीजन। इससे बदबू, कमज़ोर ट्रीटमेंट और काला स्लज होता है।'},
  {v:{k:'tank',value:4.6,range:true},shot:'Meter reads 4.6; tank foams with too many bubbles.',en:'Above 4 means excess aeration is possible.',hi:'4 से ऊपर मतलब ज़्यादा एरेशन हो सकता है।'},
  {v:{k:'board',items:[{i:'🌀',en:'Low: check blower',hi:'कम: ब्लोअर चेक'},{i:'🕳️',en:'Low: check diffuser',hi:'कम: डिफ्यूज़र चेक'},{i:'🔩',en:'Low: air valve & leakage',hi:'कम: एयर वाल्व और लीकेज'},{i:'⏲️',en:'High: blower timing',hi:'ज़्यादा: ब्लोअर टाइमिंग'},{i:'📞',en:'High: inform supervisor',hi:'ज़्यादा: सुपरवाइज़र को बताएँ'}]},shot:'Action icons split into Low DO and High DO.',en:'Low DO? Check the blower, diffuser, air valve, and leakage. High DO? Check blower timing and inform your supervisor.',hi:'DO कम है? ब्लोअर, डिफ्यूज़र, एयर वाल्व और लीकेज चेक करें। DO ज़्यादा है? ब्लोअर की टाइमिंग देखें और सुपरवाइज़र को बताएँ।'}],
 activity:{type:'slider',prompt:{en:'Move the DO slider. Then answer: DO reads 0.8. What is your first check?',hi:'DO स्लाइडर हिलाएँ। फिर जवाब दें: DO 0.8 है। पहला चेक क्या?'},options:[{i:'🌀',en:'Blower, diffuser, air valve',hi:'ब्लोअर, डिफ्यूज़र, एयर वाल्व',ok:true},{i:'🚿',en:'Filter backwash',hi:'फ़िल्टर बैकवॉश',ok:false},{i:'🛢️',en:'Oil and grease trap',hi:'ऑयल ग्रीस ट्रैप',ok:false}]},
 remember:{en:'Keep DO between 1.5 and 3.0 mg/L.',hi:'DO 1.5 से 3.0 mg/L के बीच रखें।'}},

/* 6 ─ Turbidity & TSS */
{id:'clarity',cat:'field',em:'🥛',title:{en:'Turbidity and TSS: is it clear?',hi:'टर्बिडिटी और TSS: पानी साफ़ है?'},
 lines:[
  {v:{k:'beakers',list:[{kind:'clear',en:'Clear',hi:'साफ़',ok:true},{kind:'muddy',en:'Muddy with particles',hi:'गंदला, कणों के साथ',bad:true}]},shot:'Two beakers side by side: clear vs muddy with particles.',en:'Turbidity means how clear the water is. TSS means solid particles in the water. Both tell us about clarity.',hi:'टर्बिडिटी मतलब पानी कितना साफ़ है। TSS मतलब पानी में ठोस कण। दोनों पानी की सफ़ाई बताते हैं।'},
  {v:{k:'compare'},shot:'Three sampling points: clarifier outlet, filter outlet, final treated water.',en:'Check at three places: clarifier outlet, filter outlet, and final treated water.',hi:'तीन जगह चेक करें: क्लैरिफ़ायर आउटलेट, फ़िल्टर आउटलेट, और फ़ाइनल ट्रीटेड पानी।'},
  {v:{k:'compare',marks:true},shot:'Same three beakers: slightly cloudy, slightly hazy, clear with sparkle.',en:'Clarifier outlet may be slightly cloudy. Filter outlet slightly hazy. Final treated water must be clear and clean.',hi:'क्लैरिफ़ायर आउटलेट थोड़ा धुंधला हो सकता है। फ़िल्टर आउटलेट हल्का धुंधला। फ़ाइनल ट्रीटेड पानी साफ़ और स्वच्छ होना चाहिए।'},
  {v:{k:'steps',items:[{n:1,i:'🫙',en:'Clean transparent container',hi:'साफ़ पारदर्शी कंटेनर'},{n:2,i:'☀️',en:'Hold against light',hi:'रोशनी के सामने देखें'},{n:3,i:'👁️',en:'Look for cloudiness & particles',hi:'धुंधलापन और कण देखें'},{n:4,i:'📟',en:'Turbidity meter if available',hi:'मीटर हो तो इस्तेमाल करें'},{n:5,i:'🔍',en:'Compare the three samples',hi:'तीनों की तुलना करें'}]},shot:'Avatar holds sample to the sun, then compares three bottles.',en:'How to check: take the sample in a clean transparent container. Hold it against light. Look for cloudiness and particles. Use a turbidity meter if available. Compare the three samples.',hi:'कैसे चेक करें: साफ़ पारदर्शी कंटेनर में सैंपल लें। रोशनी के सामने देखें। धुंधलापन और कण देखें। टर्बिडिटी मीटर हो तो इस्तेमाल करें। तीनों सैंपल की तुलना करें।'},
  {v:{k:'beakers',list:[{kind:'muddy',en:'Muddy',hi:'गंदला',bad:true},{kind:'particles',en:'Visible particles',hi:'दिखने वाले कण',bad:true},{kind:'sludgeout',en:'Sludge in outlet',hi:'आउटलेट में स्लज',bad:true}]},shot:'Abnormal beakers with red crosses.',en:'Muddy water, visible particles, or sludge particles in the outlet are abnormal.',hi:'गंदला पानी, दिखने वाले कण, या आउटलेट में स्लज के कण: ये असामान्य हैं।'},
  {v:{k:'board',items:[{i:'⏳',en:'Poor settling',hi:'खराब सेटलिंग'},{i:'🟤',en:'High MLSS',hi:'ज़्यादा MLSS'},{i:'🧱',en:'Filter choking',hi:'फ़िल्टर चोक'},{i:'🚿',en:'Backwash not done',hi:'बैकवॉश नहीं हुआ'},{i:'🌊',en:'Excess flow',hi:'ज़्यादा फ्लो'},{i:'🚛',en:'Improper sludge wasting',hi:'गलत स्लज वेस्टिंग'}]},shot:'Reason icons.',en:'Reasons: poor settling, high MLSS, filter choking, backwash not done properly, excess flow, or improper sludge wasting.',hi:'कारण: खराब सेटलिंग, ज़्यादा MLSS, फ़िल्टर चोक, बैकवॉश ठीक से न होना, ज़्यादा फ्लो, या गलत स्लज वेस्टिंग।'},
  {v:{k:'board',items:[{i:'🔵',en:'Check clarifier settling',hi:'क्लैरिफ़ायर सेटलिंग देखें'},{i:'🟤',en:'Check sludge condition',hi:'स्लज की हालत देखें'},{i:'🧱',en:'Check filter',hi:'फ़िल्टर चेक करें'},{i:'🚿',en:'Backwash if required',hi:'ज़रूरत हो तो बैकवॉश'},{i:'📞',en:'Inform supervisor',hi:'सुपरवाइज़र को बताएँ'}]},shot:'Action icons.',en:'Actions: check clarifier settling, check sludge condition, check the filter, do backwash if required, and inform your supervisor.',hi:'एक्शन: क्लैरिफ़ायर की सेटलिंग देखें, स्लज की हालत देखें, फ़िल्टर चेक करें, ज़रूरत हो तो बैकवॉश करें, और सुपरवाइज़र को बताएँ।'}],
 activity:{type:'choice',prompt:{en:'Which sample must be the clearest?',hi:'कौन सा सैंपल सबसे साफ़ होना चाहिए?'},options:[{kind:'cloudy',en:'Clarifier outlet',hi:'क्लैरिफ़ायर आउटलेट',ok:false},{kind:'hazy',en:'Filter outlet',hi:'फ़िल्टर आउटलेट',ok:false},{kind:'clear',en:'Final treated water',hi:'फ़ाइनल ट्रीटेड पानी',ok:true}]},
 remember:{en:'Clear water means good treatment.',hi:'साफ़ पानी मतलब अच्छा ट्रीटमेंट।'}},

/* 7 ─ SVI */
{id:'svi',cat:'field',em:'⏳',title:{en:'SVI: the 30-minute settling test',hi:'SVI: 30 मिनट का सेटलिंग टेस्ट'},
 lines:[
  {v:{k:'cylinder',sludge:0.3,top:'clear'},shot:'Measuring cylinder with settled sludge and clear water on top.',en:'SVI tells us how well the sludge settles in the aeration tank.',hi:'SVI बताता है कि एरेशन टैंक का स्लज कितनी अच्छी तरह बैठता है।'},
  {v:{k:'steps',items:[{n:1,i:'🧫',en:'1 litre in cylinder',hi:'सिलेंडर में 1 लीटर'},{n:2,i:'⏱️',en:'30 minutes, do not disturb',hi:'30 मिनट, हिलाएँ नहीं'}]},shot:'Hand dips cylinder into aeration tank; 30-minute clock.',en:'Take 1 litre of aeration tank sample in a measuring cylinder. Keep it undisturbed for 30 minutes.',hi:'मेज़रिंग सिलेंडर में एरेशन टैंक का 1 लीटर सैंपल लें। 30 मिनट तक बिना हिलाए रखें।'},
  {v:{k:'steps',items:[{n:3,i:'👁️',en:'Watch it settle',hi:'बैठते हुए देखें'},{n:4,i:'💧',en:'Clear layer on top',hi:'ऊपर साफ़ परत'},{n:5,i:'📏',en:'Sludge volume at bottom',hi:'नीचे स्लज की मात्रा'},{n:6,i:'📒',en:'Record it',hi:'रिकॉर्ड करें'}]},shot:'Cylinder settles: clear top, sludge bottom; hand records mL/L.',en:'Watch how the sludge settles. Check the clear water layer on top. Check the sludge volume at the bottom. Record it.',hi:'देखें स्लज कैसे बैठता है। ऊपर साफ़ पानी की परत देखें। नीचे स्लज की मात्रा देखें। रिकॉर्ड करें।'},
  {v:{k:'cylinders',list:[{sludge:0.08,en:'Very low: low biomass',hi:'बहुत कम: कम बायोमास'},{sludge:0.85,en:'Very high: excess sludge',hi:'बहुत ज़्यादा: एक्स्ट्रा स्लज'}]},shot:'Two cylinders: almost no sludge vs almost full.',en:'Very low sludge means low biomass: inform your supervisor. Very high sludge means excess sludge: check sludge wasting.',hi:'बहुत कम स्लज मतलब कम बायोमास: सुपरवाइज़र को बताएँ। बहुत ज़्यादा स्लज मतलब एक्स्ट्रा स्लज: स्लज वेस्टिंग चेक करें।'},
  {v:{k:'cylinders',list:[{sludge:0.95,mixed:true,en:'Not settling: bulking',hi:'नहीं बैठता: बल्किंग'},{sludge:0.3,black:true,en:'Black: septic',hi:'काला: सेप्टिक'},{sludge:0.3,floating:true,en:'Floating: old sludge or gas',hi:'तैरता: पुराना स्लज या गैस'}]},shot:'Three cylinders: not settling, black, floating sludge.',en:'Sludge not settling means bulking or a process issue: check pH, DO, and sludge return. Black sludge means septic condition: check aeration. Floating sludge means old sludge or gas: check wasting and DO.',hi:'स्लज न बैठे तो बल्किंग या प्रोसेस की समस्या: pH, DO और स्लज रिटर्न चेक करें। काला स्लज मतलब सेप्टिक: एरेशन चेक करें। तैरता स्लज मतलब पुराना स्लज या गैस: वेस्टिंग और DO चेक करें।'}],
 activity:{type:'settle',prompt:{en:'Run the settling test. Then tap the cylinder that shows a septic condition.',hi:'सेटलिंग टेस्ट चलाएँ। फिर वह सिलेंडर टैप करें जो सेप्टिक कंडीशन दिखाता है।'},options:[{cyl:{sludge:0.3},en:'Good settling',hi:'अच्छी सेटलिंग',ok:false},{cyl:{sludge:0.3,black:true},en:'Black sludge',hi:'काला स्लज',ok:true},{cyl:{sludge:0.3,floating:true},en:'Floating sludge',hi:'तैरता स्लज',ok:false}]},
 remember:{en:'1 litre, 30 minutes, record the sludge volume.',hi:'1 लीटर, 30 मिनट, स्लज की मात्रा रिकॉर्ड करो।'}},

/* 8 ─ MLSS */
{id:'mlss',cat:'field',em:'🟤',title:{en:'MLSS: how much working sludge?',hi:'MLSS: कितना काम करने वाला स्लज?'},
 lines:[
  {v:{k:'cylinder',sludge:0.45,mixed:true},shot:'Aeration tank sample, brown mixed liquor; cartoon bacteria inside.',en:'MLSS means mixed liquor suspended solids. In simple words: how much active bacteria sludge is in the aeration tank.',hi:'MLSS मतलब मिक्स्ड लिकर सस्पेंडेड सॉलिड्स। आसान भाषा में: एरेशन टैंक में कितना एक्टिव बैक्टीरिया स्लज है।'},
  {v:{k:'cylinders',list:[{sludge:0.08,en:'Low MLSS: weak treatment',hi:'कम MLSS: कमज़ोर ट्रीटमेंट',bad:true}]},shot:'Thin sludge, few bacteria, weak treatment icon.',en:'Low MLSS means fewer bacteria and weak treatment.',hi:'कम MLSS मतलब कम बैक्टीरिया और कमज़ोर ट्रीटमेंट।'},
  {v:{k:'cylinders',list:[{sludge:0.85,en:'High MLSS: poor settling, carryover, more oxygen',hi:'ज़्यादा MLSS: खराब सेटलिंग, कैरीओवर, ज़्यादा ऑक्सीजन',bad:true}]},shot:'Thick sludge; clarifier overflowing with sludge; oxygen demand arrow up.',en:'High MLSS means excess sludge, poor settling, sludge carryover, and higher oxygen demand.',hi:'ज़्यादा MLSS मतलब एक्स्ट्रा स्लज, खराब सेटलिंग, स्लज कैरीओवर, और ज़्यादा ऑक्सीजन की ज़रूरत।'},
  {v:{k:'board',items:[{i:'📉',en:'Very low or very high sludge',hi:'बहुत कम या बहुत ज़्यादा स्लज'},{i:'⏳',en:'Not settling',hi:'नहीं बैठता'},{i:'⚫',en:'Black sludge',hi:'काला स्लज'},{i:'🫧',en:'Floating sludge',hi:'तैरता स्लज'},{i:'🚰',en:'High TSS in outlet',hi:'आउटलेट में ज़्यादा TSS'},{i:'🧼',en:'Foaming in tank',hi:'टैंक में झाग'}]},shot:'Six abnormal observation icons.',en:'Watch for: very low or very high sludge, sludge not settling, black sludge, floating sludge, high TSS in the outlet, and foaming in the aeration tank.',hi:'ध्यान दें: बहुत कम या बहुत ज़्यादा स्लज, स्लज न बैठना, काला स्लज, तैरता स्लज, आउटलेट में ज़्यादा TSS, और एरेशन टैंक में झाग।'},
  {v:{k:'board',items:[{i:'📟',en:'DO & pH',hi:'DO और pH'},{i:'🚛',en:'Sludge wasting',hi:'स्लज वेस्टिंग'},{i:'🌀',en:'Aeration, blower, diffuser',hi:'एरेशन, ब्लोअर, डिफ्यूज़र'},{i:'🔵',en:'Clarifier & return sludge',hi:'क्लैरिफ़ायर और रिटर्न स्लज'},{i:'📞',en:'Inform supervisor',hi:'सुपरवाइज़र को बताएँ'}]},shot:'Action icons.',en:'Most actions are the same: check DO, pH, sludge wasting, aeration, blower and diffuser, clarifier and return sludge. And always inform your supervisor.',hi:'ज़्यादातर एक्शन एक जैसे हैं: DO, pH, स्लज वेस्टिंग, एरेशन, ब्लोअर और डिफ्यूज़र, क्लैरिफ़ायर और रिटर्न स्लज चेक करें। और हमेशा सुपरवाइज़र को बताएँ।'}],
 activity:{type:'match',prompt:{en:'Match what you see with what you check.',hi:'जो दिखता है उसे सही चेक से जोड़ें।'},pairs:[{l:{i:'📈',en:'Very high sludge',hi:'बहुत ज़्यादा स्लज'},r:{i:'🚛',en:'Check sludge wasting',hi:'स्लज वेस्टिंग चेक'}},{l:{i:'⚫',en:'Black sludge',hi:'काला स्लज'},r:{i:'🌀',en:'Check aeration & blower',hi:'एरेशन और ब्लोअर चेक'}},{l:{i:'⏳',en:'Sludge not settling',hi:'स्लज नहीं बैठता'},r:{i:'📟',en:'Check DO, pH, return sludge',hi:'DO, pH, रिटर्न स्लज चेक'}}]},
 remember:{en:'Low MLSS: weak treatment. High MLSS: poor settling.',hi:'कम MLSS: कमज़ोर ट्रीटमेंट। ज़्यादा MLSS: खराब सेटलिंग।'}},

/* 9 ─ COD / BOD signs */
{id:'codbod',cat:'field',em:'📈',title:{en:'COD and BOD: signs of high load',hi:'COD और BOD: ज़्यादा लोड के संकेत'},
 lines:[
  {v:{k:'board',items:[{i:'🏭',en:'Organic load',hi:'ऑर्गेनिक लोड'},{i:'👀',en:'Watch the signs',hi:'संकेत देखें'}]},shot:'Dark inlet pipe; "organic pollution load" label.',en:'COD and BOD show the organic pollution load in wastewater. On-site, we watch for the signs.',hi:'COD और BOD वेस्टवॉटर में ऑर्गेनिक गंदगी का लोड बताते हैं। साइट पर हम इसके संकेत देखते हैं।'},
  {v:{k:'steps',items:[{n:1,i:'🎨',en:'Inlet colour',hi:'इनलेट का रंग'},{n:2,i:'👃',en:'Smell',hi:'गंध'},{n:3,i:'🧼',en:'Foam',hi:'झाग'},{n:4,i:'🫧',en:'Aeration tank',hi:'एरेशन टैंक'},{n:5,i:'⏳',en:'Settling',hi:'सेटलिंग'}]},shot:'Five observation icons in a row with arrows.',en:'Observe five things: inlet colour, smell, foam, the aeration tank, and settling.',hi:'पाँच चीज़ें देखें: इनलेट का रंग, गंध, झाग, एरेशन टैंक, और सेटलिंग।'},
  {v:{k:'board',items:[{i:'🦨',en:'Strong bad smell',hi:'तेज़ बदबू',bad:true},{i:'🟫',en:'Dark inlet',hi:'गहरा इनलेट',bad:true},{i:'📉',en:'Low DO',hi:'कम DO',bad:true},{i:'🧼',en:'High foam',hi:'ज़्यादा झाग',bad:true},{i:'⏳',en:'Poor settling',hi:'खराब सेटलिंग',bad:true},{i:'🦠',en:'Septic condition',hi:'सेप्टिक कंडीशन',bad:true},{i:'🥛',en:'High turbidity',hi:'ज़्यादा टर्बिडिटी',bad:true},{i:'📈',en:'Sudden change',hi:'अचानक बदलाव',bad:true}]},shot:'Eight warning icons.',en:'Warning signs: strong bad smell, dark inlet, low DO, high foam, poor settling, septic condition, high turbidity, or a sudden change in water quality.',hi:'चेतावनी के संकेत: तेज़ बदबू, गहरा इनलेट, कम DO, ज़्यादा झाग, खराब सेटलिंग, सेप्टिक कंडीशन, ज़्यादा टर्बिडिटी, या पानी की क्वालिटी में अचानक बदलाव।'},
  {v:{k:'board',items:[{i:'🚰',en:'Check inlet',hi:'इनलेट चेक'},{i:'📟',en:'Check DO',hi:'DO चेक'},{i:'🫧',en:'Check aeration tank',hi:'एरेशन टैंक चेक'},{i:'⏳',en:'Check settling',hi:'सेटलिंग चेक'},{i:'📞',en:'Sudden load: inform',hi:'अचानक लोड: बताएँ'}]},shot:'Action icons.',en:'Actions: check inlet condition, check DO, check the aeration tank, check sludge settling. Inform your supervisor if a sudden load is observed.',hi:'एक्शन: इनलेट की हालत देखें, DO चेक करें, एरेशन टैंक देखें, स्लज सेटलिंग देखें। अचानक लोड दिखे तो सुपरवाइज़र को बताएँ।'}],
 activity:{type:'multi',prompt:{en:'Which of these are warning signs of high organic load?',hi:'इनमें से कौन से ज़्यादा ऑर्गेनिक लोड के चेतावनी संकेत हैं?'},options:[{i:'🦨',en:'Strong bad smell',hi:'तेज़ बदबू',ok:true},{i:'💧',en:'Clear final water',hi:'साफ़ फ़ाइनल पानी',ok:false},{i:'🧼',en:'High foam',hi:'ज़्यादा झाग',ok:true},{i:'📉',en:'Low DO',hi:'कम DO',ok:true},{i:'🚰',en:'Mild inlet smell',hi:'इनलेट की हल्की गंध',ok:false}]},
 remember:{en:'Sudden change in smell, colour, foam, DO or settling means high load.',hi:'गंध, रंग, झाग, DO या सेटलिंग में अचानक बदलाव मतलब ज़्यादा लोड।'}},

/* 10 ─ Oil & grease */
{id:'oil',cat:'field',em:'🛢️',title:{en:'Oil and grease: check the trap',hi:'तेल और ग्रीस: ट्रैप चेक करें'},
 lines:[
  {v:{k:'board',items:[{i:'🍳',en:'Kitchen',hi:'किचन'},{i:'🍽️',en:'Canteen',hi:'कैंटीन'},{i:'🏨',en:'Hotel',hi:'होटल'},{i:'🏢',en:'Commercial',hi:'कमर्शियल'}]},shot:'Kitchen sink draining into the plant inlet.',en:'Oil and grease come mainly from kitchens, canteens, hotels, and commercial wastewater.',hi:'तेल और ग्रीस ज़्यादातर किचन, कैंटीन, होटल और कमर्शियल वेस्टवॉटर से आते हैं।'},
  {v:{k:'oil'},shot:'Tank top view with floating yellow oil layer and sticky scum; slippery floor sign.',en:'Look for: floating oil layers, grease deposits, sticky scum, bad smell, and slippery surfaces.',hi:'देखें: तैरती तेल की परत, ग्रीस के जमाव, चिपचिपा झाग, बदबू, और फिसलन वाली सतह।'},
  {v:{k:'board',items:[{i:'🧺',en:'Trap not cleaned',hi:'ट्रैप साफ़ नहीं'},{i:'🍳',en:'Kitchen water enters directly',hi:'किचन का पानी सीधे अंदर'}]},shot:'Dirty grease trap; kitchen pipe bypassing the trap.',en:'Reasons: the oil and grease trap is not cleaned, or kitchen wastewater is entering the plant directly.',hi:'कारण: ऑयल एंड ग्रीस ट्रैप साफ़ नहीं हुआ, या किचन का पानी सीधे प्लांट में आ रहा है।'},
  {v:{k:'board',items:[{i:'🧺',en:'Check the trap',hi:'ट्रैप चेक करें'},{i:'🥄',en:'Remove floating grease',hi:'तैरता ग्रीस हटाएँ'},{i:'📅',en:'Clean trap on schedule',hi:'शेड्यूल पर ट्रैप साफ़'},{i:'📞',en:'Heavy load: inform',hi:'भारी लोड: बताएँ'}]},shot:'Action icons; calendar with cleaning schedule.',en:'Actions: check the oil and grease trap, remove floating grease, clean the trap as per schedule. Inform your supervisor if a heavy load is coming.',hi:'एक्शन: ऑयल एंड ग्रीस ट्रैप चेक करें, तैरता ग्रीस हटाएँ, शेड्यूल के अनुसार ट्रैप साफ़ करें। भारी लोड आ रहा हो तो सुपरवाइज़र को बताएँ।'}],
 activity:{type:'spot',prompt:{en:'Look at the tank. Tap where you see oil.',hi:'टैंक देखें। जहाँ तेल दिखे वहाँ टैप करें।'}},
 remember:{en:'Clean the trap on schedule. Stop kitchen water entering directly.',hi:'ट्रैप शेड्यूल पर साफ़ करो। किचन का पानी सीधे अंदर न आने दो।'}},

/* 11 ─ TSS lab */
{id:'tsslab',cat:'lab',em:'⚖️',title:{en:'Lab: how to measure TSS',hi:'लैब: TSS कैसे नापें'},
 lines:[
  {v:{k:'board',items:[{i:'🫙',en:'Sample bottle',hi:'सैंपल बोतल'},{i:'🧫',en:'Measuring cylinder',hi:'मेज़रिंग सिलेंडर'},{i:'⚪',en:'Filter paper',hi:'फ़िल्टर पेपर'},{i:'⚖️',en:'Weighing balance',hi:'वेइंग बैलेंस'},{i:'⏳',en:'Filtration setup',hi:'फ़िल्ट्रेशन सेटअप'},{i:'🔥',en:'Oven',hi:'ओवन'},{i:'🫧',en:'Desiccator',hi:'डेसिकेटर'}]},shot:'Lab bench with the seven items labelled.',en:'TSS test in the lab. Items: sample bottle, measuring cylinder, filter paper, weighing balance, filtration setup, oven, desiccator.',hi:'लैब में TSS टेस्ट। सामान: सैंपल बोतल, मेज़रिंग सिलेंडर, फ़िल्टर पेपर, वेइंग बैलेंस, फ़िल्ट्रेशन सेटअप, ओवन, डेसिकेटर।'},
  {v:{k:'steps',items:[{n:1,i:'🫙',en:'Treated water in clean bottle',hi:'साफ़ बोतल में ट्रीटेड पानी'},{n:2,i:'🧫',en:'Fixed volume: less if dirty, more if clear',hi:'तय मात्रा: गंदा तो कम, साफ़ तो ज़्यादा'}]},shot:'Two cylinders: small volume of dirty water, large volume of clear water.',en:'Take treated water in a clean bottle. Measure a fixed volume: less for dirty water, more for clear water.',hi:'साफ़ बोतल में ट्रीटेड पानी लें। तय मात्रा नापें: गंदे पानी के लिए कम, साफ़ पानी के लिए ज़्यादा।'},
  {v:{k:'steps',items:[{n:3,i:'⚖️',en:'Dry filter paper, weigh: W1',hi:'सूखा फ़िल्टर पेपर तौलें: W1'}]},shot:'Balance reads W1 = 0.567 g.',en:'Dry the filter paper and weigh it. This is W1.',hi:'फ़िल्टर पेपर सुखाकर तौलें। यह W1 है।'},
  {v:{k:'steps',items:[{n:4,i:'⏳',en:'Filter the sample',hi:'सैंपल छानें'}]},shot:'Water poured through filter funnel; solids stay on paper.',en:'Pass the sample through the filter paper. Solids stay on the paper.',hi:'सैंपल को फ़िल्टर पेपर से छानें। ठोस कण पेपर पर रह जाते हैं।'},
  {v:{k:'steps',items:[{n:5,i:'🔥',en:'Oven 103 to 105 °C',hi:'ओवन 103 से 105 °C'},{n:6,i:'🫧',en:'Cool in desiccator, weigh: W2',hi:'डेसिकेटर में ठंडा, तौलें: W2'}]},shot:'Oven at 104 °C; desiccator; balance reads W2 = 0.789 g.',en:'Dry the paper in an oven at 103 to 105 °C. Cool it in a desiccator. Weigh again. This is W2.',hi:'पेपर को ओवन में 103 से 105 °C पर सुखाएँ। डेसिकेटर में ठंडा करें। फिर तौलें। यह W2 है।'},
  {v:{k:'formula',title:'TSS (mg/L)',num:'(W2 − W1) × 1000',den:{en:'Sample volume (litres)',hi:'सैंपल की मात्रा (लीटर)'}},shot:'Formula card: TSS = (W2 − W1) × 1000 ÷ sample volume in litres.',en:'TSS in mg/L equals W2 minus W1, times 1000, divided by sample volume in litres.',hi:'TSS mg/L = W2 माइनस W1, गुणा 1000, भाग सैंपल की मात्रा लीटर में।'}],
 activity:{type:'calc',prompt:{en:'Calculate TSS with these lab numbers.',hi:'इन लैब नंबरों से TSS का हिसाब करें।'},fields:[{id:'w1',label:'W1 (g)',val:0.567,step:0.001},{id:'w2',label:'W2 (g)',val:0.789,step:0.001},{id:'vol',label:{en:'Volume (L)',hi:'मात्रा (L)'},val:0.5,step:0.05}],fn:'tss',unit:'mg/L',name:'TSS'},
 remember:{en:'TSS = (W2 − W1) × 1000 ÷ litres.',hi:'TSS = (W2 − W1) × 1000 ÷ लीटर।'}},

/* 12 ─ MLSS lab */
{id:'mlsslab',cat:'lab',em:'🧫',title:{en:'Lab: how to measure MLSS',hi:'लैब: MLSS कैसे नापें'},
 lines:[
  {v:{k:'cylinder',sludge:0.45,mixed:true},shot:'Well-mixed brown sample from the aeration tank.',en:'MLSS test is the same method, but with a well-mixed sample from the aeration tank.',hi:'MLSS टेस्ट वही तरीका है, लेकिन एरेशन टैंक का अच्छी तरह मिला हुआ सैंपल लेते हैं।'},
  {v:{k:'steps',items:[{n:2,i:'🧫',en:'50, 100 or 250 mL',hi:'50, 100 या 250 mL'}]},shot:'Three cylinders: 50, 100, 250 mL.',en:'Measure 50, 100, or 250 millilitres, depending on sludge concentration.',hi:'स्लज की मात्रा के अनुसार 50, 100 या 250 मिलीलीटर नापें।'},
  {v:{k:'steps',items:[{n:3,i:'⚖️',en:'Weigh dry paper: W1',hi:'सूखा पेपर तौलें: W1'},{n:4,i:'⏳',en:'Filter',hi:'छानें'},{n:5,i:'🔥',en:'Dry 103 to 105 °C',hi:'103 से 105 °C सुखाएँ'},{n:6,i:'🫧',en:'Cool, weigh: W2',hi:'ठंडा करें, तौलें: W2'}]},shot:'Balance W1 = 1.234 g, filtration, oven, desiccator, balance W2 = 1.567 g.',en:'Weigh dry filter paper: W1. Filter the sample. Dry at 103 to 105 °C. Cool in desiccator. Weigh again: W2.',hi:'सूखा फ़िल्टर पेपर तौलें: W1। सैंपल छानें। 103 से 105 °C पर सुखाएँ। डेसिकेटर में ठंडा करें। फिर तौलें: W2।'},
  {v:{k:'formula',title:'MLSS (mg/L)',num:'(W2 − W1) × 1000',den:{en:'Sample volume (litres)',hi:'सैंपल की मात्रा (लीटर)'}},shot:'Formula card on a chalkboard.',en:'MLSS in mg/L equals W2 minus W1, times 1000, divided by sample volume in litres.',hi:'MLSS mg/L = W2 माइनस W1, गुणा 1000, भाग सैंपल की मात्रा लीटर में।'}],
 activity:{type:'order',prompt:{en:'Tap the MLSS test steps in the correct order.',hi:'MLSS टेस्ट के स्टेप सही क्रम में टैप करें।'},items:[{i:'🫙',en:'Take well-mixed sample',hi:'अच्छी तरह मिला सैंपल लें'},{i:'🧫',en:'Measure volume',hi:'मात्रा नापें'},{i:'⚖️',en:'Weigh dry paper (W1)',hi:'सूखा पेपर तौलें (W1)'},{i:'⏳',en:'Filter the sample',hi:'सैंपल छानें'},{i:'🔥',en:'Dry and cool',hi:'सुखाएँ और ठंडा करें'},{i:'🧮',en:'Weigh (W2) and calculate',hi:'तौलें (W2) और हिसाब करें'}]},
 remember:{en:'Same formula as TSS. Sample from the aeration tank.',hi:'TSS वाला ही फ़ॉर्मूला। सैंपल एरेशन टैंक से।'}},

/* 13 ─ COD lab */
{id:'codlab',cat:'lab',em:'🔬',title:{en:'Lab: COD open reflux method',hi:'लैब: COD ओपन रिफ्लक्स तरीका'},
 lines:[
  {v:{k:'board',items:[{i:'🔬',en:'Chemical oxygen demand',hi:'केमिकल ऑक्सीजन डिमांड'},{i:'🧪',en:'Lab test',hi:'लैब टेस्ट'}]},shot:'Lab bench with COD digestion flask and condenser.',en:'COD means chemical oxygen demand: the oxygen needed to chemically oxidise organic matter. This is a lab test.',hi:'COD मतलब केमिकल ऑक्सीजन डिमांड: ऑर्गेनिक पदार्थ को केमिकल से ऑक्सीडाइज़ करने के लिए ज़रूरी ऑक्सीजन। यह लैब टेस्ट है।'},
  {v:{k:'steps',items:[{n:1,i:'🫙',en:'Well-mixed sample',hi:'अच्छी तरह मिला सैंपल'},{n:2,i:'🧫',en:'50 mL into digestion flask',hi:'50 mL डाइजेशन फ्लास्क में'}]},shot:'50 mL measured into COD flask.',en:'Take a well-mixed sample. Measure 50 millilitres into a COD digestion flask.',hi:'अच्छी तरह मिला सैंपल लें। COD डाइजेशन फ्लास्क में 50 मिलीलीटर नापें।'},
  {v:{k:'steps',items:[{n:3,i:'🟠',en:'1.5 g potassium dichromate',hi:'1.5 g पोटैशियम डाइक्रोमेट'},{n:4,i:'⚠️',en:'20 mL sulfuric acid, slowly',hi:'20 mL सल्फ्यूरिक एसिड, धीरे'},{n:5,i:'🪨',en:'2 to 3 boiling chips',hi:'2 से 3 बॉइलिंग चिप्स'}]},shot:'Reagent added; acid poured slowly with "HOT" warning; boiling chips.',en:'Add 1.5 grams of potassium dichromate reagent. Add 20 millilitres of sulfuric acid reagent slowly. It becomes hot. Add 2 to 3 boiling chips.',hi:'1.5 ग्राम पोटैशियम डाइक्रोमेट रीएजेंट डालें। 20 मिलीलीटर सल्फ्यूरिक एसिड रीएजेंट धीरे-धीरे डालें। यह गरम हो जाता है। 2 से 3 बॉइलिंग चिप्स डालें।'},
  {v:{k:'steps',items:[{n:6,i:'🧊',en:'Attach reflux condenser',hi:'रिफ्लक्स कंडेंसर लगाएँ'},{n:7,i:'🔥',en:'Reflux 2 hours, gentle boil',hi:'2 घंटे रिफ्लक्स, धीमी उबाल'},{n:8,i:'🌡️',en:'Cool to room temperature',hi:'कमरे के तापमान तक ठंडा'}]},shot:'Condenser on flask; 2-hour clock; flask cooling.',en:'Attach the reflux condenser. Heat and reflux for 2 hours with gentle boiling. Then cool to room temperature.',hi:'रिफ्लक्स कंडेंसर लगाएँ। 2 घंटे धीमी उबाल पर रिफ्लक्स करें। फिर कमरे के तापमान तक ठंडा करें।'},
  {v:{k:'steps',items:[{n:9,i:'💧',en:'Dilute to about 150 mL',hi:'लगभग 150 mL तक पतला करें'},{n:10,i:'🧪',en:'Titrate with FAS, 2 to 3 drops ferroin',hi:'FAS से टाइट्रेट, 2 से 3 बूंद फ़ेरोइन'}]},shot:'Distilled water added; burette titration with ferroin indicator.',en:'Dilute with distilled water to about 150 millilitres. Titrate with ferrous ammonium sulfate using 2 to 3 drops of ferroin indicator.',hi:'डिस्टिल्ड पानी से लगभग 150 मिलीलीटर तक पतला करें। 2 से 3 बूंद फ़ेरोइन इंडिकेटर डालकर फ़ेरस अमोनियम सल्फ़ेट से टाइट्रेट करें।'},
  {v:{k:'formula',title:'COD (mg/L)',num:'(A − B) × N × 8000',den:{en:'Sample volume (mL)',hi:'सैंपल की मात्रा (mL)'},note:{en:'A = mL FAS for sample · B = mL FAS for blank · N = normality of FAS',hi:'A = सैंपल के लिए FAS mL · B = ब्लैंक के लिए FAS mL · N = FAS की नॉर्मैलिटी'}},shot:'Colour change green to reddish brown; formula card.',en:'End point: colour changes from green to reddish brown. COD equals A minus B, times N, times 8000, divided by sample volume in millilitres.',hi:'एंड पॉइंट: रंग हरे से लाल-भूरा हो जाता है। COD = A माइनस B, गुणा एन, गुणा 8000, भाग सैंपल की मात्रा मिलीलीटर में।'},
  {v:{k:'board',items:[{i:'🧤',en:'Gloves',hi:'दस्ताने'},{i:'🥽',en:'Goggles',hi:'चश्मा'},{i:'🥼',en:'Apron',hi:'एप्रन'},{i:'🐢',en:'Acid slowly',hi:'एसिड धीरे'},{i:'🌬️',en:'Ventilated area',hi:'हवादार जगह'},{i:'🧼',en:'Clean glassware',hi:'साफ़ ग्लासवेयर'}]},shot:'Safety icons: gloves, goggles, apron, ventilation.',en:'Safety first: wear gloves, goggles, and apron. Add acid slowly. Work in a well-ventilated area. Keep glassware clean.',hi:'सुरक्षा पहले: दस्ताने, चश्मा और एप्रन पहनें। एसिड धीरे डालें। हवादार जगह पर काम करें। ग्लासवेयर साफ़ रखें।'}],
 activity:{type:'multi',prompt:{en:'Before starting the COD test, tap everything you must do.',hi:'COD टेस्ट शुरू करने से पहले जो ज़रूरी है सब टैप करें।'},options:[{i:'🧤',en:'Wear gloves',hi:'दस्ताने पहनें',ok:true},{i:'🥽',en:'Wear goggles',hi:'चश्मा पहनें',ok:true},{i:'⚡',en:'Add acid quickly',hi:'एसिड जल्दी डालें',ok:false},{i:'🥼',en:'Wear apron',hi:'एप्रन पहनें',ok:true},{i:'🚪',en:'Close all windows',hi:'सारी खिड़कियाँ बंद करें',ok:false},{i:'🌬️',en:'Work in ventilated area',hi:'हवादार जगह पर काम',ok:true}]},
 remember:{en:'Acid slowly. Reflux 2 hours. Green to reddish brown.',hi:'एसिड धीरे। 2 घंटे रिफ्लक्स। हरे से लाल-भूरा।'}},

/* 14 ─ BOD5 lab */
{id:'bodlab',cat:'lab',em:'📅',title:{en:'Lab: BOD 5-day method',hi:'लैब: BOD 5 दिन का तरीका'},
 lines:[
  {v:{k:'board',items:[{i:'🦠',en:'Microorganisms use oxygen',hi:'सूक्ष्मजीव ऑक्सीजन लेते हैं'},{i:'📅',en:'5 days',hi:'5 दिन'},{i:'🌡️',en:'20 °C',hi:'20 °C'}]},shot:'Incubator at 20 °C with two bottles; 5-day calendar.',en:'BOD5 means biochemical oxygen demand for 5 days: the oxygen microorganisms use to break down organic matter in 5 days at 20 °C.',hi:'BOD5 मतलब 5 दिन की बायोकेमिकल ऑक्सीजन डिमांड: 20 °C पर 5 दिन में सूक्ष्मजीव ऑर्गेनिक पदार्थ तोड़ने के लिए जितनी ऑक्सीजन लेते हैं।'},
  {v:{k:'steps',items:[{n:1,i:'🫙',en:'Well-mixed sample',hi:'अच्छी तरह मिला सैंपल'},{n:2,i:'💧',en:'Prepare dilutions',hi:'डाइल्यूशन बनाएँ'},{n:3,i:'🍶',en:'Sample bottle + blank bottle',hi:'सैंपल बोतल + ब्लैंक बोतल'}]},shot:'Two DO bottles labelled Sample and Blank.',en:'Take a well-mixed sample. Prepare dilutions if required. Take two DO bottles: a sample bottle and a blank bottle with dilution water.',hi:'अच्छी तरह मिला सैंपल लें। ज़रूरत हो तो डाइल्यूशन बनाएँ। दो DO बोतल लें: एक सैंपल बोतल और एक ब्लैंक बोतल डाइल्यूशन पानी के साथ।'},
  {v:{k:'steps',items:[{n:4,i:'🚫',en:'Fill fully, no air bubbles',hi:'पूरा भरें, बुलबुला नहीं'},{n:5,i:'📟',en:'Measure DO now: DO1',hi:'अभी DO नापें: DO1'},{n:6,i:'🌡️',en:'Dark, 20 °C, 5 days',hi:'अंधेरा, 20 °C, 5 दिन'}]},shot:'Bottles overflow 2 to 3 times and seal; DO meter reads 8.25; incubator door closes.',en:'Fill both bottles completely with no air bubbles. Overflow 2 to 3 times and seal. Measure DO immediately in both bottles. Record as DO1. Incubate both in the dark at 20 °C for 5 days.',hi:'दोनों बोतलें पूरी भरें, हवा का बुलबुला न रहे। 2 से 3 बार ओवरफ्लो करके सील करें। दोनों बोतलों में तुरंत DO नापें। इसे DO1 लिखें। दोनों को अंधेरे में 20 °C पर 5 दिन इनक्यूबेट करें।'},
  {v:{k:'formula',title:'BOD5 (mg/L)',num:'(DO1 − DO2) × DF',den:'',note:{en:'DO1 = initial DO · DO2 = DO after 5 days · DF = dilution factor',hi:'DO1 = शुरू का DO · DO2 = 5 दिन बाद DO · DF = डाइल्यूशन फ़ैक्टर'}},shot:'5-day calendar flips; DO meter reads 2.45; formula card.',en:'After 5 days, measure DO again. Record as DO2. BOD5 equals DO1 minus DO2, times the dilution factor.',hi:'5 दिन बाद फिर DO नापें। इसे DO2 लिखें। BOD5 = DO1 माइनस DO2, गुणा डाइल्यूशन फ़ैक्टर।'},
  {v:{k:'board',items:[{i:'✅',en:'Blank DO change ≤ 0.2',hi:'ब्लैंक DO बदलाव ≤ 0.2'},{i:'💧',en:'DO after 5 days > 1',hi:'5 दिन बाद DO > 1'},{i:'🚫',en:'No air bubbles',hi:'हवा का बुलबुला नहीं'},{i:'🧼',en:'Clean bottles and probe',hi:'बोतलें और प्रोब साफ़'}]},shot:'Quality check icons; cleaning bottles and probe.',en:'Quality check: the blank bottle DO must not change by more than 0.2. Choose dilution so DO after 5 days stays above 1. Clean bottles, caps and probe after testing.',hi:'क्वालिटी चेक: ब्लैंक बोतल का DO 0.2 से ज़्यादा नहीं बदलना चाहिए। डाइल्यूशन ऐसा चुनें कि 5 दिन बाद DO 1 से ऊपर रहे। टेस्ट के बाद बोतलें, ढक्कन और प्रोब साफ़ करें।'}],
 activity:{type:'calc',prompt:{en:'Calculate BOD5 with these readings.',hi:'इन रीडिंग से BOD5 का हिसाब करें।'},fields:[{id:'do1',label:'DO1 (mg/L)',val:8.25,step:0.01},{id:'do2',label:'DO2 (mg/L)',val:2.45,step:0.01},{id:'df',label:{en:'Dilution factor',hi:'डाइल्यूशन फ़ैक्टर'},val:10,step:1}],fn:'bod',unit:'mg/L',name:'BOD5'},
 remember:{en:'No air bubbles. 5 days, 20 °C, in the dark.',hi:'हवा का बुलबुला नहीं। 5 दिन, 20 °C, अंधेरे में।'}},

  {v:{k:'cards',items:[{i:'👃',title:{en:'Bad smell',hi:'बदबू'},en:'Septic wastewater: check upstream treatment',hi:'सेप्टिक वेस्टवॉटर: अपस्ट्रीम ट्रीटमेंट चेक करें',tone:'bad'},{i:'🛢️',title:{en:'Oil layer',hi:'तेल की परत'},en:'Oil entering from source: check oil trap',hi:'सोर्स से तेल आ रहा है: ऑयल ट्रैप चेक करें',tone:'warn'}]},shot:'Stink lines over the inlet; floating oil sheen; Ritu points to the oil trap.',en:'Bad smell? The wastewater is septic. Check the upstream treatment. Oil layer? Oil is entering from the source. Check the oil trap.',hi:'बदबू आ रही है? वेस्टवॉटर सेप्टिक है। अपस्ट्रीम ट्रीटमेंट चेक करें। तेल की परत दिख रही है? सोर्स से तेल आ रहा है। ऑयल ट्रैप चेक करें।'}],

/* 3 ─ Internal recycle flow */
{id:'ch31-recycle',cat:'field',em:'🔄',title:{en:'Internal recycle: nitrate comes back',hi:'इंटरनल रीसाइकल: नाइट्रेट वापस आता है'},
 lines:[
  {v:{k:'flow',items:[{i:'🫧',en:'Aeration tank',hi:'एरेशन टैंक'},{i:'🔩',en:'Recycle pump',hi:'रीसाइकल पंप'},{i:'🌀',en:'Anoxic chamber',hi:'एनॉक्सिक चैंबर'}]},shot:'Blue aeration tank, recycle pump, pipe carrying nitrate-rich water back to the green anoxic chamber.',en:'The internal recycle brings nitrate-rich water from the aeration tank back to the anoxic chamber. A recycle pump does this work.',hi:'इंटरनल रीसाइकल एरेशन टैंक का नाइट्रेट वाला पानी वापस एनॉक्सिक चैंबर में लाता है। यह काम रीसाइकल पंप करता है।'},
  {v:{k:'flow',items:[{i:'🧪',en:'Nitrate',hi:'नाइट्रेट'},{i:'🦠',en:'Bacteria',hi:'बैक्टीरिया'},{i:'🫧',en:'Nitrogen gas',hi:'नाइट्रोजन गैस'}]},shot:'Bacteria in the anoxic chamber take nitrate; nitrogen gas bubbles rise and escape to the air.',en:'Bacteria in the anoxic chamber use this nitrate as oxygen. They convert it into nitrogen gas, which escapes to the air. This recycle flow is essential for nitrogen removal.',hi:'एनॉक्सिक चैंबर के बैक्टीरिया इस नाइट्रेट को ऑक्सीजन की तरह इस्तेमाल करते हैं। वे इसे नाइट्रोजन गैस में बदलते हैं, जो हवा में निकल जाती है। यह रीसाइकल फ्लो नाइट्रोजन हटाने के लिए ज़रूरी है।'},
  {v:{k:'cards',items:[{i:'✅',title:{en:'Proper recycle flow',hi:'सही रीसाइकल फ्लो'},en:'Better nitrogen removal',hi:'बेहतर नाइट्रोजन रिमूवल',tone:'ok'},{i:'❌',title:{en:'No recycle flow',hi:'रीसाइकल फ्लो नहीं'},en:'Poor denitrification',hi:'खराब डीनाइट्रिफ़िकेशन',tone:'bad'}]},shot:'Two cards: green tick with a strong flow arrow; red cross with a broken arrow.',en:'Key point: proper recycle flow means better nitrogen removal. No recycle flow means poor denitrification.',hi:'ख़ास बात: सही रीसाइकल फ्लो मतलब बेहतर नाइट्रोजन रिमूवल। रीसाइकल फ्लो नहीं मतलब खराब डीनाइट्रिफ़िकेशन।'},
  {v:{k:'board',items:[{i:'🔩',en:'Pump running status',hi:'पंप चल रहा है?'},{i:'🌊',en:'Flow from aeration tank',hi:'एरेशन टैंक से फ्लो'},{i:'🔊',en:'Pump noise & vibration',hi:'पंप की आवाज़ और वाइब्रेशन'},{i:'🔧',en:'Valve open or closed',hi:'वाल्व खुला या बंद'},{i:'💧',en:'Pipeline choking or leakage',hi:'पाइपलाइन चोक या लीकेज'},{i:'📟',en:'Electrical panel indication',hi:'इलेक्ट्रिकल पैनल इंडिकेशन'}]},shot:'Ritu with clipboard walks past the pump, valve, pipeline and electrical panel.',en:'What to check: is the recycle pump running? Is flow coming from the aeration tank? Listen for pump noise and vibration. Check the valve position, open or closed. Check the pipeline for choking or leakage. Check the electrical panel indication.',hi:'क्या चेक करें: रीसाइकल पंप चल रहा है? एरेशन टैंक से फ्लो आ रहा है? पंप की आवाज़ और वाइब्रेशन सुनें। वाल्व की पोज़िशन देखें, खुला है या बंद। पाइपलाइन में चोक या लीकेज देखें। इलेक्ट्रिकल पैनल का इंडिकेशन देखें।'},
  {v:{k:'cards',items:[{i:'🚫',title:{en:'No recycle flow',hi:'रीसाइकल फ्लो नहीं'},en:'Pump issue or line blockage: check pump and pipeline',hi:'पंप समस्या या लाइन ब्लॉक: पंप और पाइपलाइन चेक',tone:'bad'},{i:'📉',title:{en:'Low flow',hi:'कम फ्लो'},en:'Choking or valve closed: clean line and check valve',hi:'चोकिंग या वाल्व बंद: लाइन साफ़ करें, वाल्व चेक',tone:'warn'}]},shot:'Blocked pipe with red cross; half-closed valve with a low flow gauge.',en:'No recycle flow? Pump issue or line blockage. Check the pump and pipeline. Low flow? Choking or valve closed. Clean the line and check the valve.',hi:'रीसाइकल फ्लो नहीं? पंप की समस्या या लाइन ब्लॉक। पंप और पाइपलाइन चेक करें। फ्लो कम? चोकिंग या वाल्व बंद। लाइन साफ़ करें और वाल्व चेक करें।'},
  {v:{k:'cards',items:[{i:'🔊',title:{en:'Pump vibration',hi:'पंप वाइब्रेशन'},en:'Mechanical issue: inform supervisor',hi:'मैकेनिकल समस्या: सुपरवाइज़र को बताएँ',tone:'bad'},{i:'⚡',title:{en:'Pump trip',hi:'पंप ट्रिप'},en:'Electrical fault: inform supervisor',hi:'इलेक्ट्रिकल फ़ॉल्ट: सुपरवाइज़र को बताएँ',tone:'bad'}]},shot:'Shaking pump; panel with red trip light; Ritu on the walkie-talkie.',en:'Pump vibration? It is a mechanical issue. Inform your supervisor. Pump trip? It is an electrical fault. Inform your supervisor.',hi:'पंप में वाइब्रेशन? यह मैकेनिकल समस्या है। सुपरवाइज़र को बताएँ। पंप ट्रिप? यह इलेक्ट्रिकल फ़ॉल्ट है। सुपरवाइज़र को बताएँ।'}],
 activity:{type:'match',prompt:{en:'Match the recycle problem with your action.',hi:'रीसाइकल की समस्या को सही एक्शन से जोड़ें।'},pairs:[{l:{i:'🚫',en:'No recycle flow',hi:'रीसाइकल फ्लो नहीं'},r:{i:'🔩',en:'Check pump and pipeline',hi:'पंप और पाइपलाइन चेक'}},{l:{i:'📉',en:'Low flow',hi:'कम फ्लो'},r:{i:'🔧',en:'Clean line, check valve',hi:'लाइन साफ़, वाल्व चेक'}},{l:{i:'⚡',en:'Pump trip',hi:'पंप ट्रिप'},r:{i:'📞',en:'Inform supervisor',hi:'सुपरवाइज़र को बताएँ'}}]},

/* 4 ─ Mixer operation */
{id:'ch31-mixer',cat:'field',em:'⚙️',title:{en:'Mixer: keep the sludge moving',hi:'मिक्सर: स्लज को हिलाते रहें'},
 lines:[
  {v:{k:'board',items:[{i:'⚙️',en:'Top mixer',hi:'ऊपर लगा मिक्सर'},{i:'🌀',en:'Mixing only',hi:'सिर्फ़ मिक्सिंग'},{i:'🚫',en:'No aeration',hi:'एरेशन नहीं'}]},shot:'Top-mounted mixer in the anoxic chamber; curved arrows show the water turning; no bubbles.',en:'The mixer keeps wastewater and sludge properly mixed inside the tank. Remember: no aeration, mixing only. This is the anoxic condition.',hi:'मिक्सर टैंक के अंदर वेस्टवॉटर और स्लज को अच्छी तरह मिलाए रखता है। याद रखें: एरेशन नहीं, सिर्फ़ मिक्सिंग। यही एनॉक्सिक कंडीशन है।'},
  {v:{k:'cards',items:[{i:'✅',title:{en:'Good mixing',hi:'अच्छी मिक्सिंग'},en:'Sludge stays suspended, biological treatment stays stable',hi:'स्लज तैरता रहता है, बायोलॉजिकल ट्रीटमेंट स्थिर रहता है',tone:'ok'}]},shot:'Sludge particles float evenly through the tank; bacteria cartoons active; shield icon.',en:'Good mixing prevents sludge settling and supports biological activity. Proper mixer operation keeps sludge suspended and keeps the biological treatment stable.',hi:'अच्छी मिक्सिंग स्लज को बैठने से रोकती है और बायोलॉजिकल एक्टिविटी में मदद करती है। सही मिक्सर ऑपरेशन स्लज को तैरता हुआ रखता है और बायोलॉजिकल ट्रीटमेंट को स्थिर रखता है।'},
  {v:{k:'board',items:[{i:'⚙️',en:'Mixer running',hi:'मिक्सर चल रहा है'},{i:'🔊',en:'Sound & vibration',hi:'आवाज़ और वाइब्रेशन'},{i:'🔄',en:'Mixing pattern',hi:'मिक्सिंग पैटर्न'},{i:'🟤',en:'Sludge settling or suspended',hi:'स्लज बैठा या तैरता'},{i:'🛑',en:'Dead zones',hi:'डेड ज़ोन'}]},shot:'Ritu with clipboard looks at the mixer, listens, and points to a still corner of the tank.',en:'What to check: is the mixer running? Listen to the sound and feel the vibration. Watch the mixing pattern inside the tank. Is sludge settling or in suspension? Look for dead zones, where water is not moving.',hi:'क्या चेक करें: मिक्सर चल रहा है? आवाज़ सुनें और वाइब्रेशन देखें। टैंक के अंदर मिक्सिंग पैटर्न देखें। स्लज बैठ रहा है या तैर रहा है? डेड ज़ोन देखें, जहाँ पानी नहीं हिल रहा।'},
  {v:{k:'cards',items:[{i:'❌',title:{en:'Mixer not running',hi:'मिक्सर बंद'},en:'Power failure or motor fault: inform supervisor',hi:'पावर फ़ेल या मोटर फ़ॉल्ट: सुपरवाइज़र को बताएँ',tone:'bad'},{i:'🟤',title:{en:'Sludge settling',hi:'स्लज बैठ रहा'},en:'Low mixing: check mixer operation',hi:'कम मिक्सिंग: मिक्सर ऑपरेशन चेक',tone:'warn'}]},shot:'Stopped mixer with red cross; brown sludge layer at the tank bottom.',en:'Mixer not running? Power failure or motor fault. Inform your supervisor. Sludge settling at the bottom? Mixing is low. Check the mixer operation.',hi:'मिक्सर नहीं चल रहा? पावर फ़ेल या मोटर फ़ॉल्ट। सुपरवाइज़र को बताएँ। स्लज नीचे बैठ रहा है? मिक्सिंग कम है। मिक्सर का ऑपरेशन चेक करें।'},
  {v:{k:'cards',items:[{i:'🔊',title:{en:'Noise or vibration',hi:'आवाज़ या वाइब्रेशन'},en:'Mechanical issue: inform supervisor',hi:'मैकेनिकल समस्या: सुपरवाइज़र को बताएँ',tone:'bad'},{i:'🛑',title:{en:'Dead zones',hi:'डेड ज़ोन'},en:'Poor mixing pattern: adjust or check mixer',hi:'खराब मिक्सिंग पैटर्न: मिक्सर एडजस्ट या चेक',tone:'warn'}]},shot:'Mixer shaking with sound waves; tank corners marked as still water.',en:'Noise or vibration? Mechanical issue. Inform your supervisor. Dead zones in the tank? Poor mixing pattern. Adjust or check the mixer.',hi:'आवाज़ या वाइब्रेशन? मैकेनिकल समस्या। सुपरवाइज़र को बताएँ। टैंक में डेड ज़ोन? खराब मिक्सिंग पैटर्न। मिक्सर एडजस्ट करें या चेक करें।'}],
 activity:{type:'choice',prompt:{en:'The mixer has stopped. What do you do?',hi:'मिक्सर बंद हो गया है। आप क्या करेंगे?'},options:[{i:'📞',en:'Inform supervisor',hi:'सुपरवाइज़र को बताएँ',ok:true},{i:'🫧',en:'Start aeration in the anoxic chamber',hi:'एनॉक्सिक चैंबर में एरेशन शुरू करें',ok:false},{i:'⏳',en:'Wait, the sludge will settle',hi:'रुकें, स्लज बैठ जाएगा',ok:false}]},

/* 5 ─ Biological sludge condition */
{id:'ch31-sludge',cat:'field',em:'🟤',title:{en:'Sludge condition: brown is healthy',hi:'स्लज की हालत: भूरा मतलब सेहतमंद'},
 lines:[
  {v:{k:'board',items:[{i:'🟤',en:'Biological sludge',hi:'बायोलॉजिकल स्लज'},{i:'✅',en:'Healthy sludge needed',hi:'सेहतमंद स्लज ज़रूरी'},{i:'🫧',en:'Effective nitrogen removal',hi:'असरदार नाइट्रोजन रिमूवल'}]},shot:'Ritu points into the anoxic chamber at the brown mixed sludge.',en:'Now look at the biological sludge inside the tank. Healthy sludge is required for effective nitrogen removal.',hi:'अब टैंक के अंदर के बायोलॉजिकल स्लज को देखें। असरदार नाइट्रोजन रिमूवल के लिए सेहतमंद स्लज ज़रूरी है।'},
  {v:{k:'cylinders',list:[{sludge:0.4,en:'Normal brown sludge',hi:'नॉर्मल भूरा स्लज',ok:true},{sludge:0.4,black:true,en:'Septic sludge, settled',hi:'सेप्टिक स्लज, बैठा हुआ',bad:true},{sludge:0.4,floating:true,en:'Floating sludge, scum',hi:'तैरता स्लज, झाग',bad:true}]},shot:'Cross-section of the anoxic chamber: scum on top, brown sludge in the middle, black settled sludge at the bottom.',en:'Normal sludge is brown. Septic sludge is black and settled at the bottom. Floating sludge forms scum on top.',hi:'नॉर्मल स्लज भूरा होता है। सेप्टिक स्लज काला होता है और नीचे बैठा रहता है। तैरता स्लज ऊपर झाग बनाता है।'},

<script>
(function(){
'use strict';
const $ = (s,r)=> (r||document).querySelector(s);
const $$ = (s,r)=> Array.from((r||document).querySelectorAll(s));
const esc = s => String(s==null?'':s).replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
function load(k,d){ try{ const v=localStorage.getItem(k); return v===null?d:JSON.parse(v) }catch(e){ return d } }
function save(k,v){ try{ localStorage.setItem(k,JSON.stringify(v)) }catch(e){} }
function shuffle(a){ const b=a.slice(); for(let i=b.length-1;i>0;i--){ const j=Math.floor(Math.random()*(i+1)); [b[i],b[j]]=[b[j],b[i]] } if(b.length>2 && b.every((x,i)=>x===a[i])){ b.push(b.shift()) } return b }
const LANG_OK = new Set(LANGS.map(l=>l.code));
const langInfo = code => LANGS.find(l=>l.code===code) || LANGS[0];

const state = { lang: (()=>{ const v=load('wt_lang', null); return LANG_OK.has(v)?v:null })(), sound:true, tab:'learn', chapter:-1, scene:-1, line:0, phase:'library', done: load('wt_done',[]), best: load('wt_best',{}), timer:null, utter:null, sayId:0, paused:false, q:0, scoreN:0, noticed:{}, scriptCh:0 };
if(state.best===null || typeof state.best!=='object') state.best={};
const cur = ()=> state.lang || 'en';

/* ============ Translation packs (i18n/<lang>.json keyed by the English text) ============ */
const Packs = {
 data:{}, loading:{},
 has(lang){ return lang==='en' || lang==='hi' || !!this.data[lang] },
 load(lang){ if(lang==='en'||lang==='hi') return Promise.resolve(true); if(this.data[lang]) return Promise.resolve(true); if(this.loading[lang]) return this.loading[lang];
  this.loading[lang] = fetch(`i18n/${lang}.json`,{cache:'no-cache'}).then(r=>r.ok?r.json():null).then(j=>{ if(j){ this.data[lang]=j; return true } return false }).catch(()=>false).finally(()=>{ delete this.loading[lang] }); return this.loading[lang] },
 tr(lang, en){ const p=this.data[lang]; return (p && en!=null && p[en]) ? p[en] : null }
};
const t = k => { const l=cur(); const en = UI.en[k]!==undefined ? UI.en[k] : k; if(l==='en') return en; if(UI[l] && UI[l][k]!==undefined) return UI[l][k]; return Packs.tr(l, en) || en };
const L = s => { if(s==null) return ''; if(typeof s==='string') return s; const l=cur(); if(s[l]!==undefined) return s[l]; const en = s.en!==undefined ? s.en : ''; if(l==='en') return en; return Packs.tr(l, en) || en };
const CH = ()=> CHAPTERS[state.chapter]; const LS = ()=> CH() ? CH().lessons : [];

/* ============ Visual builders ============ */
let uid=0;
const BEAKER_PATH = 'M30 18 h40 v84 a10 10 0 0 1 -10 10 h-20 a10 10 0 0 1 -10 -10 z';
const SV = {
 beaker(kind, opts){ opts=opts||{}; const id='cp'+(++uid);
  const K = {clear:{fill:'#CDEBFA',hl:true},grey:{fill:'#8E9AA6'},mixed:{fill:'#8C6A45'},black:{fill:'#1E2328'},brown:{fill:'#3E2410'},yellow:{fill:'#E6C23A'},muddy:{fill:'#9A7247',dots:'#5A3E1F'},particles:{fill:'#B9D9E8',dots:'#5A6B7A'},sludgeout:{fill:'#B8CFDC',dots:'#6B4A2B',big:true},scum:{fill:'#9FC9DD',scum:true},cloudy:{fill:'#B8C7CF'},hazy:{fill:'#C9DCE6'}}[kind] || {fill:'#CDEBFA'};
  const w = opts.size||110;
  const dots = K.dots ? [[42,60],[58,70],[50,84],[38,95],[62,96],[46,105],[56,52],[64,110]].map(p=>`<circle cx="${p[0]}" cy="${p[1]}" r="${K.big?3.2:2}" fill="${K.dots}"/>`).join('') : '';
  const scum = K.scum ? `<ellipse cx="42" cy="42" rx="9" ry="4" fill="#5B4028"/><ellipse cx="58" cy="41" rx="7" ry="3.5" fill="#6B4A2B"/><ellipse cx="50" cy="45" rx="6" ry="3" fill="#4E3620"/>` : '';
  const hl = K.hl ? `<path d="M36 50 v45" stroke="#fff" stroke-width="3" stroke-linecap="round" opacity=".8"/><path d="M60 30 l3 6 l6 3 l-6 3 l-3 6 l-3 -6 l-6 -3 l6 -3z" fill="#fff" opacity=".9"/>` : '';
  const mark = opts.ok ? `<circle cx="84" cy="22" r="12" fill="var(--ok)"/><path d="M78 22 l4 4 l8 -8" stroke="#fff" stroke-width="3" fill="none" stroke-linecap="round" stroke-linejoin="round"/>` : opts.bad ? `<circle cx="84" cy="22" r="12" fill="var(--bad)"/><path d="M79 17 l10 10 M89 17 l-10 10" stroke="#fff" stroke-width="3" stroke-linecap="round"/>` : '';
  return `<svg viewBox="0 0 100 124" width="${w}" height="${Math.round(w*1.24)}" class="bk" aria-hidden="true"><defs><clipPath id="${id}"><path d="${BEAKER_PATH}"/></clipPath></defs><path d="${BEAKER_PATH}" fill="var(--glass)"/><g clip-path="url(#${id})"><rect x="30" y="40" width="40" height="80" fill="${K.fill}"/>${dots}${scum}${hl}</g><path d="${BEAKER_PATH}" fill="none" stroke="currentColor" stroke-width="3"/><path d="M24 18 h52" stroke="currentColor" stroke-width="3" stroke-linecap="round"/>${mark}</svg>`;
 },
 beakers(spec){ const sz = spec.list.length>3 ? 84 : 110; return `<div class="row">${spec.list.map(b=>`<figure class="fig"><div class="figsvg">${SV.beaker(b.kind,{ok:b.ok,bad:b.bad,size:sz})}</div><figcaption>${esc(L(b))}</figcaption></figure>`).join('')}</div>` },
 board(spec){ const n=spec.items.length; return `<div class="board n${Math.min(n,9)}">${spec.items.map((it,i)=>`<div class="tile${it.bad?' bad':''}${it.ok?' ok':''}" style="--d:${i*70}ms"><span class="em">${it.i||''}</span><span class="lb">${esc(L(it))}</span></div>`).join('')}</div>` },

/* ============ Recorded clips (Sarvam Bulbul v3, voice "ritu") ============ */
const AudioBank = {
 manifests:{}, loading:{}, blobs:{}, pending:{}, player:null, unlocked:false,
 init(){ try{ this.player = new Audio(); this.player.preload='auto' }catch(e){ this.player=null } this.load(cur()); if(cur()!=='en') this.load('en') },
 load(lang){ if(this.loading[lang]) return this.loading[lang]; this.loading[lang] = fetch(`audio/${lang}/manifest.json`,{cache:'no-cache'}).then(r=>r.ok?r.json():null).then(m=>{ this.manifests[lang]=m||{}; return this.manifests[lang] }).catch(()=>{ this.manifests[lang]={}; return this.manifests[lang] }); return this.loading[lang] },
 ready(lang, ms){ return Promise.race([this.load(lang), new Promise(res=>setTimeout(()=>res(null), ms||2500))]) },
 has(lang, text){ const m=this.manifests[lang]; return !!(m && m[text]) },
 count(lang){ const m=this.manifests[lang]; return m ? Object.keys(m).length : 0 },
 url(lang, text){ const m=this.manifests[lang]; const rel=m && m[text]; if(!rel) return Promise.resolve(null); if(this.blobs[rel]) return Promise.resolve(this.blobs[rel]); if(!this.pending[rel]){ this.pending[rel] = fetch(rel).then(r=>{ if(!r.ok) throw 0; return r.blob() }).then(b=>{ const u=URL.createObjectURL(b.type?b:new Blob([b],{type:'audio/mpeg'})); this.blobs[rel]=u; return u }).catch(()=>null).finally(()=>{ delete this.pending[rel] }) } return this.pending[rel] },
 prefetch(lang, texts){ (texts||[]).forEach(t=>{ if(this.has(lang,t)) this.url(lang,t) }) },
 unlock(){ if(this.unlocked || !this.player) return; this.unlocked=true; try{ this.player.src='data:audio/wav;base64,UklGRiQAAABXQVZFZm10IBAAAAABAAEAIlYAAESsAAACABAAZGF0YQAAAAA='; const p=this.player.play(); if(p&&p.catch) p.catch(()=>{}) }catch(e){} },
 stop(){ if(!this.player) return; try{ this.player.onended=null; this.player.onerror=null; this.player.pause() }catch(e){} }
};
function sceneTexts(ls, lang){ const out=[]; ls.lines.forEach(l=>out.push(L(l))); if(ls.activity) out.push(L(ls.activity.prompt)); if(ls.remember) out.push(L(ls.remember)); (ls.questions||[]).forEach(q=>out.push(L(q.q))); return out }

/* ============ Speech ============ */
const Speech = {
 ok: (typeof window!=='undefined') && ('speechSynthesis' in window) && ('SpeechSynthesisUtterance' in window),
 voices: [],
 init(){ if(!this.ok) return; const upd=()=>{ try{ this.voices = speechSynthesis.getVoices()||[] }catch(e){ this.voices=[] } }; upd(); try{ speechSynthesis.addEventListener('voiceschanged', upd) }catch(e){ try{ speechSynthesis.onvoiceschanged = upd }catch(e2){} } },
 voiceFor(lang){ if(!this.ok) return null; if(!this.voices.length){ try{ this.voices = speechSynthesis.getVoices()||[] }catch(e){} } const code=langInfo(lang).tts.toLowerCase(); const base=code.split('-')[0]; const pref = lang==='en' ? ['en-in','en-gb','en-us','en-au','en'] : [code, base]; const vs=this.voices.map(v=>({v,l:String(v.lang||'').toLowerCase().replace('_','-')})); for(const p of pref){ const hit = vs.find(x=>x.l===p || x.l.indexOf(p+'-')===0); if(hit) return hit.v } if(lang==='en'){ const any=vs.find(x=>x.l.indexOf('en')===0); if(any) return any.v } return null },
 has(lang){ return !!this.voiceFor(lang) },
 hasVoice(lang){ return AudioBank.count(lang)>1 || this.has(lang) },
 say(text, lang, onend){
  this.stop(); const id = ++state.sayId; let ended=false;
  const fin=()=>{ if(ended || id!==state.sayId) return; ended=true; clearTimeout(state.timer); avatarTalk(false); if(onend) onend() };
  if(!state.sound){ avatarTalk(false); state.timer=setTimeout(fin, 1400 + 60*text.length); return }
  if(AudioBank.player && AudioBank.has(lang, text)){
   avatarTalk(true);
   AudioBank.url(lang, text).then(u=>{ if(id!==state.sayId) return; if(!u){ this.sayTTS(text, lang, fin, id); return }
    const p=AudioBank.player; p.onended=fin; p.onerror=()=>{ if(id===state.sayId) this.sayTTS(text, lang, fin, id) }; p.src=u;
    const pr=p.play(); if(pr&&pr.catch) pr.catch(()=>{ if(id===state.sayId) this.sayTTS(text, lang, fin, id) });
    state.timer=setTimeout(fin, 8000 + 160*text.length); });
   return;
  }
  this.sayTTS(text, lang, fin, id);
 },
 sayTTS(text, lang, fin, id){
  if(id!==state.sayId) return; clearTimeout(state.timer);
  if(!this.has(lang)){ avatarTalk(true); state.timer=setTimeout(fin, 1400 + 60*text.length); return }
  const u = new SpeechSynthesisUtterance(pron(text, lang)); const v=this.voiceFor(lang); u.voice=v; u.lang=v.lang; u.rate = lang==='en'?0.95:0.9; u.pitch=1; u.onend=fin; u.onerror=fin; state.utter=u; avatarTalk(true);
  try{ speechSynthesis.speak(u) }catch(e){ fin(); return }
  state.timer=setTimeout(fin, 4000 + 110*text.length);
 },

};
function pron(text, lang){ let s=text; const map = PRON[lang] || PRON.en; for(const pair of map){ const re=new RegExp('(^|[^A-Za-z0-9])'+pair[0].replace(/[.*+?^${}()|[\]\\\/]/g,'\\$&')+'(?![A-Za-z0-9])','g'); s=s.replace(re,(m,p)=>p+pair[1]) } return s }

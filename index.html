/* 5 ─ Operating sequence */
{id:'ch4-cycle',cat:'field',em:'🔄',title:{en:'Operating sequence and cleaning steps',hi:'ऑपरेटिंग सीक्वेंस और क्लीनिंग स्टेप'},
 lines:[
  {v:{k:'steps',items:[{n:1,i:'🚿',en:'Forward flush 10–30 s',hi:'फ़ॉरवर्ड फ्लश 10–30 s'},{n:2,i:'💧',en:'Filtration 1200–2400 s',hi:'फ़िल्ट्रेशन 1200–2400 s'}]},shot:'Service cycle table: rows 1 and 2 highlight, forward flush and filtration.',en:'The UF runs in a repeating service cycle. Forward flush, 10 to 30 seconds. Filtration or service, 1200 to 2400 seconds.',hi:'UF एक दोहराने वाले सर्विस साइकल में चलता है। फ़ॉरवर्ड फ्लश, 10 से 30 सेकंड। फ़िल्ट्रेशन या सर्विस, 1200 से 2400 सेकंड।'},
  {v:{k:'steps',items:[{n:3,i:'🌀',en:'Air cleaning 30–60 s',hi:'एयर क्लीनिंग 30–60 s'},{n:4,i:'🚿',en:'Water drain 30–60 s',hi:'वॉटर ड्रेन 30–60 s'},{n:5,i:'🫧',en:'Air-assisted flush 20–60 s',hi:'एयर-असिस्टेड फ्लश 20–60 s'}]},shot:'Rows 3 to 5 highlight; a green loop arrow "Repeat service cycle".',en:'Air cleaning, 30 to 60 seconds. Water drain, 30 to 60 seconds. Air-assisted flush, 20 to 60 seconds. Then the cycle repeats.',hi:'एयर क्लीनिंग, 30 से 60 सेकंड। वॉटर ड्रेन, 30 से 60 सेकंड। एयर-असिस्टेड फ्लश, 20 से 60 सेकंड। फिर साइकल दोहराता है।'},
  {v:{k:'board',items:[{i:'⏱️',en:'Illustrative ranges, not setpoints',hi:'उदाहरण रेंज, सेटपॉइंट नहीं'},{i:'📘',en:'Confirm with approved procedure',hi:'अप्रूव्ड प्रोसीजर से मिलाएँ'}]},shot:'Footnote highlighted: illustrative planning ranges; subtitle "confirm all settings against the approved membrane procedure".',en:'These times are illustrative planning ranges, not validated setpoints. Confirm all settings against the approved membrane procedure.',hi:'ये समय सिर्फ़ उदाहरण की प्लानिंग रेंज हैं, वैलिडेटेड सेटपॉइंट नहीं। सभी सेटिंग अप्रूव्ड मेम्ब्रेन प्रोसीजर से मिलाएँ।'},
  {v:{k:'board',items:[{i:'🔧',en:'Count time after valve moves',hi:'वाल्व हिलने के बाद समय गिनें'},{i:'🌀',en:'Air steps only where fitted, approved',hi:'एयर स्टेप सिर्फ़ जहाँ लगे और अप्रूव्ड'}]},shot:'Valve finishes turning, then a stopwatch starts; asterisk note "air steps only where fitted and approved".',en:'Count the time after the valve movement is complete. Air steps are used only where fitted and approved.',hi:'वाल्व पूरा हिलने के बाद समय गिनें। एयर स्टेप सिर्फ़ वहीं जहाँ लगे हों और अप्रूव्ड हों।'},
  {v:{k:'cards',items:[{i:'📏',title:{en:'Flow setting',hi:'फ्लो सेटिंग'},en:'From design flux and membrane area',hi:'डिज़ाइन फ्लक्स और मेम्ब्रेन एरिया से',tone:'ok'}]},shot:'Green "Flow setting" panel.',en:'Flow setting: set the flow from the design flux and membrane area.',hi:'फ्लो सेटिंग: डिज़ाइन फ्लक्स और मेम्ब्रेन एरिया से फ्लो सेट करें।'},
  {v:{k:'formula',title:'Flow (m³/h)',num:'Flux (LMH) × Area (m²)',den:{en:'1000',hi:'1000'}},shot:'Flow formula card.',en:'Flow in cubic metres per hour equals flux in LMH, times area in square metres, divided by 1000.',hi:'फ्लो घन मीटर प्रति घंटा = फ्लक्स LMH, गुणा एरिया वर्ग मीटर, भाग 1000।'},
  {v:{k:'board',items:[{i:'💧',en:'Filtration: feed pump ON',hi:'फ़िल्ट्रेशन: फ़ीड पंप ON'},{i:'🚿',en:'Forward flush: product isolated',hi:'फ़ॉरवर्ड फ्लश: प्रोडक्ट बंद'}]},shot:'Equipment logic column: filtration and forward flush rows; pump icon lights ON.',en:'Equipment logic. Filtration: feed pump on, feed and product paths open. Forward flush: feed pump on, flush outlet open, product isolated.',hi:'इक्विपमेंट लॉजिक। फ़िल्ट्रेशन: फ़ीड पंप चालू, फ़ीड और प्रोडक्ट रास्ते खुले। फ़ॉरवर्ड फ्लश: फ़ीड पंप चालू, फ्लश आउटलेट खुला, प्रोडक्ट बंद।'},
  {v:{k:'board',items:[{i:'🌀',en:'Air cleaning: air ON',hi:'एयर क्लीनिंग: हवा ON'},{i:'🔧',en:'Drain: pumps OFF',hi:'ड्रेन: पंप OFF'}]},shot:'Air cleaning and drain rows: blower icon ON, pump icons OFF, drain valve open.',en:'Air cleaning: air supply on, approved vent or outlet path open. Drain: feed and cleaning pumps off, drain path open.',hi:'एयर क्लीनिंग: हवा चालू, अप्रूव्ड वेंट या आउटलेट रास्ता खुला। ड्रेन: फ़ीड और क्लीनिंग पंप बंद, ड्रेन रास्ता खुला।'},
  {v:{k:'board',items:[{i:'⚗️',en:'Chemical: cleaning + dosing pump ON',hi:'केमिकल: क्लीनिंग + डोज़िंग पंप ON'},{i:'⏱️',en:'Soak: all OFF',hi:'सोक: सब OFF'},{i:'📘',en:'Valves: approved P&ID',hi:'वाल्व: अप्रूव्ड P&ID'}]},shot:'Chemical injection and soak rows: dosing pump ON then OFF, clock for the soak; note "valve states depend on the approved P&ID".',en:'Chemical injection: cleaning pump and the selected dosing pump on, product isolated. Soak: dosing and circulation off. Valve states depend on the approved P&ID.',hi:'केमिकल इंजेक्शन: क्लीनिंग पंप और चुना हुआ डोज़िंग पंप चालू, प्रोडक्ट बंद। सोक: डोज़िंग और सर्कुलेशन बंद। वाल्व की स्थिति अप्रूव्ड P&ID पर निर्भर है।'},
  {v:{k:'steps',items:[{n:1,i:'🌀',en:'Air cleaning 30–60 s',hi:'एयर क्लीनिंग 30–60 s'},{n:2,i:'🚿',en:'Drain 30–60 s',hi:'ड्रेन 30–60 s'},{n:3,i:'🫧',en:'Air-assisted flush 20–60 s',hi:'एयर-असिस्टेड फ्लश 20–60 s'}]},shot:'Chemical cleaning table, rows 1 to 3 highlight.',en:'Chemical cleaning sequence. Air cleaning, 30 to 60 seconds. Drain, 30 to 60 seconds. Air-assisted flush, 20 to 60 seconds.',hi:'केमिकल क्लीनिंग सीक्वेंस। एयर क्लीनिंग, 30 से 60 सेकंड। ड्रेन, 30 से 60 सेकंड। एयर-असिस्टेड फ्लश, 20 से 60 सेकंड।'},
  {v:{k:'steps',items:[{n:4,i:'🚿',en:'Forward flush 10–30 s',hi:'फ़ॉरवर्ड फ्लश 10–30 s'},{n:5,i:'⚗️',en:'Chemical injection 300–600 s',hi:'केमिकल इंजेक्शन 300–600 s'}]},shot:'Rows 4 and 5 highlight: forward flush, chemical injection with the dosing pump running.',en:'Forward flush, 10 to 30 seconds. Selected chemical injection, 300 to 600 seconds.',hi:'फ़ॉरवर्ड फ्लश, 10 से 30 सेकंड। चुने हुए केमिकल का इंजेक्शन, 300 से 600 सेकंड।'},
  {v:{k:'steps',items:[{n:6,i:'⏱️',en:'Static soak 150–300 s',hi:'स्टैटिक सोक 150–300 s'},{n:7,i:'🌀',en:'Injection with air 150–300 s',hi:'हवा के साथ इंजेक्शन 150–300 s'},{n:8,i:'🚿',en:'Spent solution drain 30–60 s',hi:'पुराना घोल ड्रेन 30–60 s'}]},shot:'Rows 6 to 8 highlight: clock for the soak, air bubbles with chemical, spent solution draining.',en:'Static soak, 150 to 300 seconds. Injection with air, 150 to 300 seconds. Spent solution drain, 30 to 60 seconds.',hi:'स्टैटिक सोक, 150 से 300 सेकंड। हवा के साथ इंजेक्शन, 150 से 300 सेकंड। पुराने घोल का ड्रेन, 30 से 60 सेकंड।'},
  {v:{k:'steps',items:[{n:9,i:'🔍',en:'Rinse, verify residuals 300–600 s',hi:'रिंस, रेज़िड्यूअल जाँच 300–600 s'}]},shot:'Row 9 highlights: rinse water tested for residuals; note "set cleaning frequency, chemical dose and pH for the selected membrane".',en:'Rinse and verify residuals, 300 to 600 seconds. Set the cleaning frequency, chemical dose and pH for the selected membrane.',hi:'रिंस और रेज़िड्यूअल की जाँच, 300 से 600 सेकंड। चुनी हुई मेम्ब्रेन के लिए क्लीनिंग फ्रीक्वेंसी, केमिकल डोज़ और pH सेट करें।'},
  {v:{k:'cards',items:[{i:'⚠️',title:{en:'Separate chemical stages',hi:'केमिकल स्टेज अलग रखें'},en:'Hypo stage first, verify chlorine removal, then acid',hi:'पहले हाइपो स्टेज, क्लोरीन हटना जाँचें, फिर एसिड',tone:'warn'}]},shot:'Orange warning card "Separate chemical stages"; chlorine test before the acid can.',en:'Keep chemical stages separate. Complete the hypochlorite stage and verify chlorine removal before any acid stage.',hi:'केमिकल स्टेज अलग रखें। हाइपोक्लोराइट स्टेज पूरा करें और क्लोरीन हट गया यह जाँचें, उसके बाद ही एसिड स्टेज।'},
  {v:{k:'cards',items:[{i:'🔁',title:{en:'Acid stage, if required',hi:'एसिड स्टेज, ज़रूरत पर'},en:'Repeat injection, soak, drain, rinse',hi:'इंजेक्शन, सोक, ड्रेन, रिंस दोहराएँ',tone:'warn'},{i:'🛑',title:{en:'Never mix acid and hypochlorite',hi:'एसिड और हाइपोक्लोराइट कभी न मिलाएँ'},en:'Fully drain and rinse between stages',hi:'स्टेज के बीच पूरा ड्रेन और रिंस',tone:'bad'}]},shot:'Acid stage loop: injection, soak, drain, rinse; red card with hypo can and acid can separated by a no-mix sign.',en:'Repeat the approved injection, soak, drain and rinse steps for acid, if required. Never mix acid and hypochlorite. Fully drain and rinse between chemical stages.',hi:'ज़रूरत हो तो एसिड के लिए अप्रूव्ड इंजेक्शन, सोक, ड्रेन और रिंस स्टेप दोहराएँ। एसिड और हाइपोक्लोराइट कभी न मिलाएँ। स्टेज के बीच पूरा ड्रेन और रिंस करें।'}],
 activity:{type:'calc',prompt:{en:'Set the flow. Design flux 40 LMH, membrane area 250 m². Calculate the flow.',hi:'फ्लो सेट करें। डिज़ाइन फ्लक्स 40 LMH, मेम्ब्रेन एरिया 250 m²। फ्लो का हिसाब करें।'},fields:[{id:'flux',label:'Flux (LMH)',val:40,step:1},{id:'area',label:{en:'Area (m²)',hi:'एरिया (m²)'},val:250,step:10}],expr:'flux*area/1000',unit:'m³/h',name:'Flow'},
 remember:{en:'Times are illustrative. Never mix acid and hypochlorite. Drain and rinse between stages.',hi:'समय सिर्फ़ उदाहरण हैं। एसिड और हाइपोक्लोराइट कभी न मिलाओ। स्टेज के बीच ड्रेन और रिंस करो।'}},

/* 6 ─ Shutdown preservation */
{id:'ch4-shutdown',cat:'lab',em:'🛑',title:{en:'Shutdown: keep membranes wet',hi:'शटडाउन: मेम्ब्रेन गीली रखें'},
 lines:[
  {v:{k:'board',items:[{i:'🧼',en:'Clean before shutdown',hi:'शटडाउन से पहले सफ़ाई'},{i:'💧',en:'Keep modules completely filled',hi:'मॉड्यूल पूरे भरे रखें'},{i:'🦠',en:'Prevent microbial growth',hi:'बैक्टीरिया न पनपने दें'}]},shot:'UF modules full of water with closed valves; banner "Keep membranes wet throughout shutdown".',en:'When the UF stops, keep the membranes wet throughout the shutdown. Three rules: clean before shutdown, keep the modules completely filled, and prevent microbial growth.',hi:'जब UF बंद हो, पूरे शटडाउन में मेम्ब्रेन गीली रखें। तीन नियम: शटडाउन से पहले सफ़ाई करें, मॉड्यूल पूरे भरे रखें, और बैक्टीरिया न पनपने दें।'},
  {v:{k:'cards',items:[{i:'⏱️',title:{en:'Short: up to 48 hours',hi:'छोटा: 48 घंटे तक'},en:'Rinse with clean UF filtrate, fill, isolate',hi:'साफ़ UF फ़िल्ट्रेट से रिंस, भरें, आइसोलेट',tone:'ok'}]},shot:'Clock showing 48 hours; filtrate rinse; valves closed on a full module.',en:'Short shutdown, up to 48 hours: rinse with clean UF filtrate. Disinfect wastewater-service modules if approved. Isolate after filling. Prevent drainage and air entry.',hi:'छोटा शटडाउन, 48 घंटे तक: साफ़ UF फ़िल्ट्रेट से रिंस करें। वेस्टवॉटर सर्विस वाले मॉड्यूल अप्रूव्ड हो तो डिसइन्फ़ेक्ट करें। भरने के बाद आइसोलेट करें। पानी निकलने और हवा घुसने से रोकें।'},
  {v:{k:'cards',items:[{i:'📅',title:{en:'Intermediate: over 2 to 7 days',hi:'इंटरमीडिएट: 2 से ज़्यादा, 7 दिन तक'},en:'Keep wet, inspect for leaks',hi:'गीला रखें, लीक देखें',tone:'warn'}]},shot:'Calendar 2 to 7 days; leak inspection on a wet module.',en:'Intermediate shutdown, more than 2 days and up to 7 days: keep the modules wet and inspect for leaks.',hi:'इंटरमीडिएट शटडाउन, 2 दिन से ज़्यादा और 7 दिन तक: मॉड्यूल गीले रखें और लीक देखें।'},
  {v:{k:'board',items:[{i:'🔄',en:'Refresh or rinse on approved schedule',hi:'अप्रूव्ड शेड्यूल पर रिफ्रेश या रिंस'},{i:'🧪',en:'Example: daily 30–60 min, 2 mg/L free chlorine',hi:'उदाहरण: रोज़ 30–60 मिनट, 2 mg/L फ्री क्लोरीन'}]},shot:'Daily rinse timer 30 to 60 minutes; chlorine label 2 mg/L; asterisk "illustrative".',en:'Refresh or rinse using the approved schedule. Example: a daily rinse for 30 to 60 minutes at 2 mg/L free chlorine.',hi:'अप्रूव्ड शेड्यूल से रिफ्रेश या रिंस करें। उदाहरण: रोज़ 30 से 60 मिनट, 2 mg/L फ्री क्लोरीन से रिंस।'},
  {v:{k:'cards',items:[{i:'🧴',title:{en:'Long: over 7 to 90 days',hi:'लंबा: 7 से ज़्यादा, 90 दिन तक'},en:'Clean, disinfect, rinse before preservation',hi:'प्रिज़र्वेशन से पहले सफ़ाई, डिसइन्फ़ेक्ट, रिंस',tone:'warn'}]},shot:'Calendar 7 to 90 days; clean, disinfect and rinse icons before preservation.',en:'Long shutdown, more than 7 days and up to 90 days: clean, disinfect and rinse before preservation.',hi:'लंबा शटडाउन, 7 दिन से ज़्यादा और 90 दिन तक: प्रिज़र्वेशन से पहले सफ़ाई, डिसइन्फ़ेक्ट और रिंस करें।'},
  {v:{k:'board',items:[{i:'🧴',en:'Approved preservative, seal, check leaks',hi:'अप्रूव्ड प्रिज़र्वेटिव, सील, लीक जाँच'},{i:'🧪',en:'Example: 1% NaHSO3, pH 4–6',hi:'उदाहरण: 1% NaHSO3, pH 4–6'}]},shot:'Preservative can "1% sodium bisulfite, pH 4 to 6"; module sealed and leak-checked.',en:'Fill with an approved preservative, seal and check for leaks. Example: 1 percent sodium bisulfite, pH 4 to 6.',hi:'अप्रूव्ड प्रिज़र्वेटिव भरें, सील करें और लीक जाँचें। उदाहरण: 1 प्रतिशत सोडियम बाइसल्फ़ाइट, pH 4 से 6।'},
  {v:{k:'board',items:[{i:'📅',en:'Check monthly',hi:'हर महीने जाँचें'},{i:'📉',en:'Replace example: pH below 3',hi:'बदलने का उदाहरण: pH 3 से नीचे'}]},shot:'Monthly calendar tick; pH meter reading below 3 with a "replace" arrow.',en:'Check monthly. Example replacement trigger: pH below 3.',hi:'हर महीने जाँचें। बदलने का उदाहरण ट्रिगर: pH 3 से नीचे।'},
  {v:{k:'cards',items:[{i:'📘',title:{en:'Extended: over 90 days',hi:'बहुत लंबा: 90 दिन से ज़्यादा'},en:'Supplier storage instructions, verify before restart',hi:'सप्लायर के स्टोरेज निर्देश, रीस्टार्ट से पहले जाँच',tone:'bad'}]},shot:'Calendar 90 plus days; supplier instruction sheet; restart checks on the skid.',en:'Extended shutdown, more than 90 days: obtain the membrane supplier storage instructions. Maintain the prescribed monitoring and renewal schedule. Inspect, rinse and verify performance before restart.',hi:'बहुत लंबा शटडाउन, 90 दिन से ज़्यादा: मेम्ब्रेन सप्लायर से स्टोरेज निर्देश लें। बताया गया मॉनिटरिंग और रिन्यूअल शेड्यूल बनाए रखें। रीस्टार्ट से पहले जाँच, रिंस और परफ़ॉर्मेंस वेरिफ़ाई करें।'},
  {v:{k:'board',items:[{i:'💧',en:'Rinse water ≤0.1 NTU example',hi:'रिंस पानी ≤0.1 NTU उदाहरण'},{i:'🏋️',en:'Full modules are heavy',hi:'भरे मॉड्यूल भारी होते हैं'}]},shot:'Filtrate quality drop with 0.1 NTU; lifting equipment beside a water-filled module.',en:'Filtrate quality: use supplier-approved rinse water, for example turbidity 0.1 NTU or less. Handling: water-filled modules are heavy, use suitable lifting equipment.',hi:'फ़िल्ट्रेट क्वालिटी: सप्लायर-अप्रूव्ड रिंस पानी लें, उदाहरण टर्बिडिटी 0.1 NTU या कम। हैंडलिंग: पानी भरे मॉड्यूल भारी होते हैं, सही लिफ्टिंग उपकरण इस्तेमाल करें।'},
  {v:{k:'board',items:[{i:'🚿',en:'Restart: flush preservative to waste',hi:'रीस्टार्ट: प्रिज़र्वेटिव वेस्ट में फ्लश'},{i:'🔍',en:'Verify rinse quality and performance',hi:'रिंस क्वालिटी और परफ़ॉर्मेंस जाँचें'}]},shot:'Restart: preservative flushed to an approved waste route; rinse sample tested; performance checked.',en:'Restart: flush the preservative to an approved waste route, then verify rinse quality and membrane performance.',hi:'रीस्टार्ट: प्रिज़र्वेटिव अप्रूव्ड वेस्ट रूट में फ्लश करें, फिर रिंस क्वालिटी और मेम्ब्रेन परफ़ॉर्मेंस जाँचें।'},
  {v:{k:'board',items:[{i:'📘',en:'Illustrative values',hi:'उदाहरण वैल्यू'},{i:'📞',en:'Confirm with membrane supplier',hi:'मेम्ब्रेन सप्लायर से कन्फ़र्म'}]},shot:'Footnote "illustrative values from the supplied procedure, confirm with the membrane supplier".',en:'These values are illustrative, from the supplied procedure. Confirm chemical compatibility, concentration and duration with the membrane supplier.',hi:'ये वैल्यू सिर्फ़ उदाहरण हैं, दिए गए प्रोसीजर से। केमिकल की अनुकूलता, कंसन्ट्रेशन और अवधि मेम्ब्रेन सप्लायर से कन्फ़र्म करें।'},
  {v:{k:'cards',items:[{i:'🛑',title:{en:'Never let membranes dry',hi:'मेम्ब्रेन कभी सूखने न दें'},en:'Wet throughout shutdown',hi:'पूरे शटडाउन में गीली',tone:'bad'},{i:'⚠️',title:{en:'Never mix hypochlorite',hi:'हाइपोक्लोराइट कभी न मिलाएँ'},en:'Not with acid, not with bisulfite',hi:'न एसिड से, न बाइसल्फ़ाइट से',tone:'bad'}]},shot:'Two red warning cards.',en:'Never allow membranes to dry. Never mix hypochlorite with acid or bisulfite.',hi:'मेम्ब्रेन कभी सूखने न दें। हाइपोक्लोराइट को एसिड या बाइसल्फ़ाइट के साथ कभी न मिलाएँ।'}],
 activity:{type:'match',prompt:{en:'Match the shutdown length with what you do.',hi:'शटडाउन की अवधि को सही काम से जोड़ें।'},pairs:[{l:{i:'⏱️',en:'Up to 48 hours',hi:'48 घंटे तक'},r:{i:'💧',en:'Rinse with UF filtrate, fill and isolate',hi:'UF फ़िल्ट्रेट से रिंस, भरें और आइसोलेट'}},{l:{i:'📅',en:'7 to 90 days',hi:'7 से 90 दिन'},r:{i:'🧴',en:'Approved preservative, check monthly',hi:'अप्रूव्ड प्रिज़र्वेटिव, हर महीने जाँच'}},{l:{i:'📘',en:'More than 90 days',hi:'90 दिन से ज़्यादा'},r:{i:'📞',en:'Get supplier storage instructions',hi:'सप्लायर से स्टोरेज निर्देश लें'}}]},
 remember:{en:'Never let membranes dry. Never mix hypo with acid or bisulfite.',hi:'मेम्ब्रेन कभी सूखने न दो। हाइपो को एसिड या बाइसल्फ़ाइट से कभी न मिलाओ।'}},

/* 7 ─ CIP procedure */
{id:'ch4-cip',cat:'lab',em:'🧼',title:{en:'CIP: chemical cleaning in place',hi:'CIP: जगह पर केमिकल क्लीनिंग'},
 lines:[
  {v:{k:'cards',items:[{i:'🔧',title:{en:'Step 1: prepare and pre-rinse',hi:'स्टेप 1: तैयारी और प्री-रिंस'},en:'Complete normal cleaning, isolate UF',hi:'नॉर्मल क्लीनिंग पूरी, UF आइसोलेट',tone:'ok'}]},shot:'Speech bubble "Never mix acid and hypochlorite"; step 1: UF skid isolated for CIP.',en:'CIP means chemical cleaning in place. Step 1, prepare and pre-rinse: complete normal cleaning and isolate the UF for CIP.',hi:'CIP मतलब जगह पर ही केमिकल सफ़ाई। स्टेप 1, तैयारी और प्री-रिंस: नॉर्मल क्लीनिंग पूरी करें और CIP के लिए UF आइसोलेट करें।'},
  {v:{k:'board',items:[{i:'🚿',en:'Drain, flush ~10 min',hi:'ड्रेन, फ्लश ~10 मिनट'},{i:'🌡️',en:'Permeate 35–40 °C, 10 min',hi:'परमिएट 35–40 °C, 10 मिनट'}]},shot:'Drain open; clean water flush timer 10 minutes; warm permeate circulating from the CIP tank.',en:'Drain, then flush with clean water for about 10 minutes. Circulate permeate at 35 to 40 degrees Celsius for 10 minutes, then drain.',hi:'ड्रेन करें, फिर साफ़ पानी से लगभग 10 मिनट फ्लश करें। परमिएट 35 से 40 डिग्री पर 10 मिनट सर्कुलेट करें, फिर ड्रेन करें।'},
  {v:{k:'board',items:[{i:'🔩',en:'Set CIP valve path',hi:'CIP वाल्व पाथ सेट'}]},shot:'Valves turned to the purple CIP flow path on the P&ID.',en:'Set the valves to the approved CIP flow path.',hi:'वाल्व अप्रूव्ड CIP फ्लो पाथ पर सेट करें।'},
  {v:{k:'board',items:[{i:'🧪',en:'NaOCl 500–1,000 ppm free chlorine',hi:'NaOCl 500–1,000 ppm फ्री क्लोरीन'},{i:'💧',en:'RO permeate, pH ≤10',hi:'RO परमिएट, pH ≤10'}]},shot:'Step 2: NaOCl can; RO permeate label; pH meter.',en:'Step 2, hypochlorite clean: sodium hypochlorite at 500 to 1000 ppm as free chlorine. RO permeate is preferred, approved pH 10 or below.',hi:'स्टेप 2, हाइपोक्लोराइट क्लीन: सोडियम हाइपोक्लोराइट 500 से 1000 ppm फ्री क्लोरीन के रूप में। RO परमिएट बेहतर है, अप्रूव्ड pH 10 या कम।'},
  {v:{k:'board',items:[{i:'🔄',en:'45 min → soak 30 → 45 min',hi:'45 मिनट → सोक 30 → 45 मिनट'},{i:'📟',en:'Check pH, free chlorine',hi:'pH, फ्री क्लोरीन चेक'},{i:'🔁',en:'Replace dirty solution',hi:'गंदा घोल बदलें'}]},shot:'Recirculation 45 minutes, soak timer 30 minutes, recirculation 45 minutes; pH and chlorine test; dirty solution replaced.',en:'Recirculate 45 minutes, soak 30 minutes, recirculate 45 minutes. Check pH and free chlorine. Replace dirty solution.',hi:'45 मिनट रीसर्कुलेट, 30 मिनट सोक, फिर 45 मिनट रीसर्कुलेट। pH और फ्री क्लोरीन चेक करें। गंदा घोल बदल दें।'},
  {v:{k:'board',items:[{i:'🚿',en:'Drain to approved waste',hi:'अप्रूव्ड वेस्ट में ड्रेन'},{i:'💧',en:'Rinse with clean permeate',hi:'साफ़ परमिएट से रिंस'}]},shot:'Step 3: spent hypo drained to waste; clean permeate rinse in the approved direction.',en:'Step 3, drain and intermediate rinse: drain to approved waste handling. Rinse with clean permeate using the approved flush directions.',hi:'स्टेप 3, ड्रेन और बीच का रिंस: अप्रूव्ड वेस्ट हैंडलिंग में ड्रेन करें। अप्रूव्ड फ्लश दिशा में साफ़ परमिएट से रिंस करें।'},
  {v:{k:'board',items:[{i:'🔍',en:'Verify chlorine removed',hi:'क्लोरीन हटा यह जाँचें'},{i:'🛑',en:'Never mix acid and hypo',hi:'एसिड और हाइपो कभी न मिलाएँ',bad:true}]},shot:'Rinse water tested for chlorine before the acid can is opened; red no-mix sign.',en:'Verify chlorine removal before adding acid. Never mix acid and hypochlorite.',hi:'एसिड डालने से पहले क्लोरीन हट गया यह जाँचें। एसिड और हाइपोक्लोराइट कभी न मिलाएँ।'},
  {v:{k:'board',items:[{i:'🧫',en:'Citric acid 1–2%, pH 2–3',hi:'सिट्रिक एसिड 1–2%, pH 2–3'},{i:'📘',en:'With OEM approval',hi:'OEM की मंज़ूरी से'}]},shot:'Step 4: citric acid can; OEM approval stamp.',en:'Step 4, acid clean, only if required: citric acid 1 to 2 percent, pH 2 to 3, with OEM approval.',hi:'स्टेप 4, एसिड क्लीन, सिर्फ़ ज़रूरत पर: सिट्रिक एसिड 1 से 2 प्रतिशत, pH 2 से 3, OEM की मंज़ूरी से।'},
  {v:{k:'board',items:[{i:'🔄',en:'45 min → soak 30 → 45 min',hi:'45 मिनट → सोक 30 → 45 मिनट'},{i:'🌡️',en:'Check pH, temperature',hi:'pH, तापमान चेक'},{i:'🚿',en:'Drain, rinse with permeate',hi:'ड्रेन, परमिएट से रिंस'}]},shot:'Recirculation, soak, recirculation; pH and thermometer check; drain and permeate rinse.',en:'Recirculate 45 minutes, soak 30 minutes, recirculate 45 minutes. Check pH and temperature. Renew dirty solution. Drain and rinse with clean permeate.',hi:'45 मिनट रीसर्कुलेट, 30 मिनट सोक, फिर 45 मिनट रीसर्कुलेट। pH और तापमान चेक करें। गंदा घोल बदलें। ड्रेन करें और साफ़ परमिएट से रिंस करें।'},
  {v:{k:'board',items:[{i:'💧',en:'Rinse to pH 6–8',hi:'pH 6–8 तक रिंस'},{i:'🛑',en:'Never neutralize inside modules',hi:'मॉड्यूल के अंदर न्यूट्रलाइज़ नहीं',bad:true}]},shot:'Step 5: rinse until pH 6 to 8; red cross over neutralizing inside the modules.',en:'Step 5, final rinse and restart: rinse to pH 6 to 8 and acceptable chemical residuals. Never neutralize chemicals inside the modules.',hi:'स्टेप 5, फ़ाइनल रिंस और रीस्टार्ट: pH 6 से 8 और ठीक केमिकल रेज़िड्यूअल तक रिंस करें। मॉड्यूल के अंदर केमिकल कभी न्यूट्रलाइज़ न करें।'},
  {v:{k:'board',items:[{i:'🔩',en:'Restore service valves',hi:'सर्विस वाल्व वापस करें'},{i:'📈',en:'Restart gradually, record',hi:'धीरे रीस्टार्ट, रिकॉर्ड'}]},shot:'Valves back to service; flow rising slowly; flow, TMP and cleaning result written in the log.',en:'Restore the service valves and restart gradually. Record flow, TMP and cleaning performance.',hi:'सर्विस वाल्व वापस सेट करें और धीरे-धीरे रीस्टार्ट करें। फ्लो, TMP और क्लीनिंग परफ़ॉर्मेंस रिकॉर्ड करें।'},
  {v:{k:'range',label:'CIP solution temperature',unit:'°C',min:0,max:50,value:35,zones:[{to:30,c:'warn',en:'Below 30',hi:'30 से कम'},{to:40,c:'ok',en:'30 to 40',hi:'30 से 40'},{to:50,c:'bad',en:'Above 40: not allowed',hi:'40 से ऊपर: मना'}]},shot:'Thermometer 30 to 40 °C with "Maximum 40 °C (104 °F)"; flux 30 to 40 L/m²·h on a card.',en:'Step 6, CIP settings: flux 30 to 40 litres per square metre per hour. Solution temperature 30 to 40 degrees Celsius, maximum 40 degrees.',hi:'स्टेप 6, CIP सेटिंग: फ्लक्स 30 से 40 लीटर प्रति वर्ग मीटर प्रति घंटा। घोल का तापमान 30 से 40 डिग्री सेल्सियस, ज़्यादा से ज़्यादा 40 डिग्री।'},
  {v:{k:'board',items:[{i:'📟',en:'Filtrate pressure <10 psi (0.69 bar)',hi:'फ़िल्ट्रेट प्रेशर <10 psi (0.69 bar)'},{i:'📞',en:'Indicative: confirm with supplier',hi:'इंडिकेटिव: सप्लायर से कन्फ़र्म'}]},shot:'Pressure gauge below 10 psi; footnote "indicative settings from supplied procedure, confirm with membrane supplier".',en:'Filtrate pressure below 10 psi, that is 0.69 bar. These are indicative settings. Confirm with the membrane supplier.',hi:'फ़िल्ट्रेट प्रेशर 10 psi से कम, यानी 0.69 bar। ये इंडिकेटिव सेटिंग हैं। मेम्ब्रेन सप्लायर से कन्फ़र्म करें।'}],
 activity:{type:'choice',prompt:{en:'The hypochlorite clean is finished. What do you do before the acid clean?',hi:'हाइपोक्लोराइट क्लीन पूरा हो गया। एसिड क्लीन से पहले आप क्या करेंगे?'},options:[{i:'🚿',en:'Drain, rinse with permeate, verify chlorine is removed',hi:'ड्रेन, परमिएट से रिंस, क्लोरीन हटा यह जाँचो',ok:true},{i:'⚗️',en:'Add acid into the same solution',hi:'उसी घोल में एसिड डालो',ok:false},{i:'🧪',en:'Neutralize the chlorine inside the modules',hi:'मॉड्यूल के अंदर क्लोरीन न्यूट्रलाइज़ करो',ok:false}]},
 remember:{en:'Hypo first. Drain, rinse, verify no chlorine. Then acid. Maximum 40 °C.',hi:'पहले हाइपो। ड्रेन, रिंस, क्लोरीन न हो यह जाँचो। फिर एसिड। ज़्यादा से ज़्यादा 40 °C।'}},

/* 8 ─ Log sheet and TMP trend (part 1) */
{id:'ch4-log',cat:'field',em:'📒',title:{en:'Log sheet and TMP trend (part 1)',hi:'लॉग शीट और TMP ट्रेंड (भाग 1)'},
 lines:[
  {v:{k:'board',items:[{i:'📒',en:'Date, site, shift, operator',hi:'तारीख, साइट, शिफ़्ट, ऑपरेटर'},{i:'⏱️',en:'Every 4 hours',hi:'हर 4 घंटे'},{i:'🔄',en:'Twice per 8-hour shift',hi:'8 घंटे की शिफ़्ट में दो बार'}]},shot:'Log sheet header: Date, Site / UF Unit, Shift, Operator; clock showing a 4-hour interval.',en:'Every UF unit has an operational log sheet. Write the date, site, shift and your name. Log readings every 4 hours, that is twice per 8-hour shift.',hi:'हर UF यूनिट की एक ऑपरेशनल लॉग शीट होती है। तारीख, साइट, शिफ़्ट और अपना नाम लिखें। हर 4 घंटे रीडिंग लॉग करें, यानी 8 घंटे की शिफ़्ट में दो बार।'},
  {v:{k:'board',items:[{i:'🔄',en:'Time, cycle or mode',hi:'समय, साइकल या मोड'},{i:'📟',en:'Pressure: feed, reject, product, TMP',hi:'प्रेशर: फ़ीड, रिजेक्ट, प्रोडक्ट, TMP'}]},shot:'Routine readings table: Time, Cycle / Mode and the Pressure (bar) columns highlight.',en:'Routine readings: time and cycle or mode. Pressure in bar: feed, reject, product and TMP.',hi:'रूटीन रीडिंग: समय और साइकल या मोड। प्रेशर bar में: फ़ीड, रिजेक्ट, प्रोडक्ट और TMP।'},
  {v:{k:'board',items:[{i:'📏',en:'Flow: feed, product, reject',hi:'फ्लो: फ़ीड, प्रोडक्ट, रिजेक्ट'},{i:'🥛',en:'Turbidity: feed, product',hi:'टर्बिडिटी: फ़ीड, प्रोडक्ट'},{i:'📝',en:'Remarks',hi:'रिमार्क्स'}]},shot:'Flow (m³/h), Turbidity (NTU) and Remarks columns highlight.',en:'Flow in cubic metres per hour: feed, product and reject. Turbidity in NTU: feed and product. And remarks.',hi:'फ्लो घन मीटर प्रति घंटा में: फ़ीड, प्रोडक्ट और रिजेक्ट। टर्बिडिटी NTU में: फ़ीड और प्रोडक्ट। और रिमार्क्स।'},
  {v:{k:'board',items:[{i:'🔄',en:'Log every backwash, CEB, CIP',hi:'हर बैकवॉश, CEB, CIP लॉग'}]},shot:'Backwash / CEB / CIP event log header.',en:'Event log: log every backwash, CEB and CIP event.',hi:'इवेंट लॉग: हर बैकवॉश, CEB और CIP इवेंट लॉग करें।'},
  {v:{k:'board',items:[{i:'📏',en:'Cleaning flow and pressure',hi:'क्लीनिंग फ्लो और प्रेशर'},{i:'🌀',en:'Air flow and pressure where fitted',hi:'जहाँ लगा हो एयर फ्लो और प्रेशर'},{i:'⚗️',en:'Chemical, pH, duration in seconds',hi:'केमिकल, pH, अवधि सेकंड में'},{i:'📟',en:'TMP before and after',hi:'TMP पहले और बाद'}]},shot:'Event log row filling in: cleaning flow, air flow, chemical and pH, duration, TMP before and after.',en:'Write cleaning flow and pressure, air flow and pressure where fitted, chemical and pH, duration in seconds, and TMP before and after.',hi:'क्लीनिंग फ्लो और प्रेशर, जहाँ लगा हो एयर फ्लो और प्रेशर, केमिकल और pH, अवधि सेकंड में, और TMP पहले और बाद में लिखें।'},
  {v:{k:'board',items:[{i:'🔍',en:'SDI each 8-hour shift',hi:'हर 8 घंटे की शिफ़्ट में SDI'},{i:'🧱',en:'Especially before RO',hi:'खासकर RO से पहले'}]},shot:'SDI test kit in front of the RO skid; "Additional monitoring" box.',en:'Record SDI each 8-hour shift where specified, especially before RO.',hi:'जहाँ बताया हो, हर 8 घंटे की शिफ़्ट में SDI रिकॉर्ड करें, खासकर RO से पहले।'},
  {v:{k:'board',items:[{i:'🧪',en:'TSS, pH, conductivity',hi:'TSS, pH, कंडक्टिविटी'},{i:'📅',en:'Suggested weekly',hi:'सुझाव: हर हफ़्ते'}]},shot:'Periodic water quality tests table: first row, TSS, pH, conductivity, feed / product.',en:'Periodic water quality tests, suggested weekly: TSS, pH and conductivity on feed and product.',hi:'समय-समय पर पानी की क्वालिटी टेस्ट, सुझाव हर हफ़्ते: फ़ीड और प्रोडक्ट पर TSS, pH और कंडक्टिविटी।'},
  {v:{k:'board',items:[{i:'🧫',en:'Alkalinity, hardness, oil and grease',hi:'अल्कलिनिटी, हार्डनेस, तेल और ग्रीस'},{i:'📈',en:'COD, BOD, TOC',hi:'COD, BOD, TOC'}]},shot:'Rows 2 and 3 of the table highlight with their sample points.',en:'Alkalinity, hardness, oil and grease on feed, and on product if required. COD, BOD and TOC on feed and product where relevant.',hi:'फ़ीड पर अल्कलिनिटी, हार्डनेस, तेल और ग्रीस, ज़रूरत हो तो प्रोडक्ट पर भी। जहाँ ज़रूरी हो, फ़ीड और प्रोडक्ट पर COD, BOD और TOC।'}],
 activity:{type:'choice',prompt:{en:'Which events must you write in the event log?',hi:'इवेंट लॉग में कौन से इवेंट लिखने ज़रूरी हैं?'},options:[{i:'🔄',en:'Every backwash, CEB and CIP event',hi:'हर बैकवॉश, CEB और CIP इवेंट',ok:true},{i:'🧼',en:'Only CIP events',hi:'सिर्फ़ CIP इवेंट',ok:false},{i:'⏱️',en:'Only the first backwash of the shift',hi:'सिर्फ़ शिफ़्ट का पहला बैकवॉश',ok:false}]},
 remember:{en:'Log every 4 hours. Log every backwash, CEB and CIP event.',hi:'हर 4 घंटे लॉग करो। हर बैकवॉश, CEB और CIP इवेंट लॉग करो।'}},

/* 9 ─ Log sheet and TMP trend (part 2) */
{id:'ch4-log-b',cat:'field',em:'📒',title:{en:'Log sheet and TMP trend (part 2)',hi:'लॉग शीट और TMP ट्रेंड (भाग 2)'},
 lines:[
  {v:{k:'formula',title:'TMP (bar)',num:'(Feed pressure + Reject pressure) ÷ 2 − Product pressure',den:''},shot:'Formula card TMP = (Feed + Reject) ÷ 2 − Product.',en:'How the numbers connect. TMP equals feed pressure plus reject pressure, divided by 2, minus product pressure.',hi:'नंबर कैसे जुड़ते हैं। TMP = फ़ीड प्रेशर जमा रिजेक्ट प्रेशर, भाग 2, माइनस प्रोडक्ट प्रेशर।'},
  {v:{k:'formula',title:'TMP at 08:00 (bar)',num:'(1.20 + 1.00) ÷ 2 − 0.20 = 0.90',den:''},shot:'The 08:00 row highlighted; numbers drop into the formula.',en:'Example at 08:00: 1.20 plus 1.00, divided by 2, minus 0.20, equals 0.90 bar.',hi:'08:00 का उदाहरण: 1.20 जमा 1.00, भाग 2, माइनस 0.20, बराबर 0.90 bar।'},
  {v:{k:'formula',title:'Flow balance (m³/h)',num:'Feed = Product + Reject',den:'',note:{en:'12.0 = 10.0 + 2.0',hi:'12.0 = 10.0 + 2.0'}},shot:'Flow balance arrows: feed 12.0 splits into product 10.0 and reject 2.0.',en:'Flow balance: feed flow equals product flow plus reject flow. 12.0 equals 10.0 plus 2.0 cubic metres per hour.',hi:'फ्लो बैलेंस: फ़ीड फ्लो = प्रोडक्ट फ्लो जमा रिजेक्ट फ्लो। 12.0 = 10.0 जमा 2.0 घन मीटर प्रति घंटा।'},
  {v:{k:'formula',title:'Recovery (%)',num:'Product flow ÷ Feed flow × 100',den:'',note:{en:'10.0 ÷ 12.0 × 100 = 83.3%',hi:'10.0 ÷ 12.0 × 100 = 83.3%'}},shot:'Recovery card: 10.0 ÷ 12.0 × 100 = 83.3 percent.',en:'Example recovery: 10.0 divided by 12.0, times 100, equals 83.3 percent.',hi:'उदाहरण रिकवरी: 10.0 भाग 12.0, गुणा 100, बराबर 83.3 प्रतिशत।'},
  {v:{k:'cards',items:[{i:'🕗',title:{en:'08:00',hi:'08:00'},en:'TMP 0.90 bar',hi:'TMP 0.90 bar',tone:'ok'},{i:'🕛',title:{en:'12:00',hi:'12:00'},en:'TMP 1.00 bar',hi:'TMP 1.00 bar',tone:'ok'},{i:'🕓',title:{en:'16:00',hi:'16:00'},en:'TMP 1.10 bar',hi:'TMP 1.10 bar',tone:'warn'}]},shot:'Three rows of the example log; TMP column 0.90, 1.00, 1.10 highlights.',en:'Worked example, same day. At 08:00 TMP is 0.90 bar, at 12:00 it is 1.00, at 16:00 it is 1.10.',hi:'उदाहरण, एक ही दिन। 08:00 पर TMP 0.90 bar, 12:00 पर 1.00, 16:00 पर 1.10।'},
  {v:{k:'board',items:[{i:'📏',en:'Feed flow 12.0 steady',hi:'फ़ीड फ्लो 12.0 स्थिर'},{i:'📏',en:'Product flow 10.0 steady',hi:'प्रोडक्ट फ्लो 10.0 स्थिर'},{i:'📈',en:'Feed turbidity 8.0 → 12.0 NTU',hi:'फ़ीड टर्बिडिटी 8.0 → 12.0 NTU'},{i:'💧',en:'Product turbidity 0.05 → 0.07 NTU',hi:'प्रोडक्ट टर्बिडिटी 0.05 → 0.07 NTU'}]},shot:'Flow columns stay constant; feed turbidity column rises; product turbidity stays near 0.05.',en:'Feed flow stays 12.0 and product flow 10.0. Feed turbidity rises from 8.0 to 12.0 NTU, product stays 0.05 to 0.07 NTU.',hi:'फ़ीड फ्लो 12.0 और प्रोडक्ट फ्लो 10.0 पर स्थिर। फ़ीड टर्बिडिटी 8.0 से 12.0 NTU तक बढ़ी, प्रोडक्ट 0.05 से 0.07 NTU पर।'},
  {v:{k:'cards',items:[{i:'📈',title:{en:'TMP rising at constant flow',hi:'एक जैसे फ्लो पर TMP बढ़ रहा'},en:'May mean increasing membrane resistance',hi:'मेम्ब्रेन रेज़िस्टेंस बढ़ रहा हो सकता है',tone:'warn'}]},shot:'Speech bubble "Watch trends, not just one reading"; TMP line rising on a chart.',en:'TMP rising at constant flow may mean increasing membrane resistance. Watch trends, not just one reading.',hi:'एक जैसे फ्लो पर TMP बढ़ना मतलब मेम्ब्रेन का रेज़िस्टेंस बढ़ रहा हो सकता है। ट्रेंड देखें, सिर्फ़ एक रीडिंग नहीं।'},
  {v:{k:'cards',items:[{i:'🔄',title:{en:'Backwash 60 s',hi:'बैकवॉश 60 s'},en:'TMP 1.10 → 0.92 bar: cleaning helped',hi:'TMP 1.10 → 0.92 bar: सफ़ाई से फ़ायदा',tone:'ok'}]},shot:'Cleaning event row: backwash 60 seconds, TMP before 1.10, after 0.92, "TMP decreased".',en:'Cleaning event: a 60-second backwash. TMP before 1.10 bar, after 0.92 bar. TMP fell, so the cleaning helped.',hi:'क्लीनिंग इवेंट: 60 सेकंड का बैकवॉश। TMP पहले 1.10 bar, बाद में 0.92 bar। TMP गिरा, मतलब सफ़ाई से फ़ायदा हुआ।'},
  {v:{k:'board',items:[{i:'🌡️',en:'Compare at similar flow and temperature',hi:'एक जैसे फ्लो और तापमान पर तुलना'},{i:'⏱️',en:'Log every 4 hours',hi:'हर 4 घंटे लॉग'},{i:'📟',en:'TMP before and after cleaning',hi:'सफ़ाई से पहले और बाद TMP'}]},shot:'Note "Compare before / after at similar flow and temperature"; operator action list, first two items.',en:'Compare before and after at similar flow and temperature. Your job: log readings every 4 hours, and record TMP before and after cleaning.',hi:'एक जैसे फ्लो और तापमान पर पहले-बाद की तुलना करें। आपका काम: हर 4 घंटे रीडिंग लॉग करें, और सफ़ाई से पहले और बाद TMP लिखें।'},
  {v:{k:'board',items:[{i:'🥛',en:'Filtrate turbidity vs site target',hi:'फ़िल्ट्रेट टर्बिडिटी बनाम साइट टारगेट'},{i:'🔍',en:'Investigate abnormal trends, alarms',hi:'असामान्य ट्रेंड, अलार्म की जाँच'},{i:'📒',en:'Record accurately, report trends',hi:'सही लिखें, ट्रेंड की रिपोर्ट'}]},shot:'Action list items three and four; speech bubble "Record readings accurately. Report abnormal trends."',en:'Compare filtrate turbidity with the site target. Investigate abnormal trends or alarms. Record readings accurately and report abnormal trends.',hi:'फ़िल्ट्रेट टर्बिडिटी को साइट टारगेट से मिलाएँ। असामान्य ट्रेंड या अलार्म की जाँच करें। रीडिंग सही लिखें और असामान्य ट्रेंड की रिपोर्ट करें।'}],
 activity:{type:'calc',prompt:{en:'Calculate TMP from the 16:00 readings.',hi:'16:00 की रीडिंग से TMP का हिसाब करें।'},fields:[{id:'f',label:{en:'Feed pressure (bar)',hi:'फ़ीड प्रेशर (bar)'},val:1.4,step:0.05},{id:'r',label:{en:'Reject pressure (bar)',hi:'रिजेक्ट प्रेशर (bar)'},val:1.2,step:0.05},{id:'p',label:{en:'Product pressure (bar)',hi:'प्रोडक्ट प्रेशर (bar)'},val:0.2,step:0.05}],expr:'(f+r)/2-p',unit:'bar',name:'TMP'},
 remember:{en:'TMP = (Feed + Reject) ÷ 2 − Product. Log every 4 hours. Watch the trend.',hi:'TMP = (फ़ीड + रिजेक्ट) ÷ 2 − प्रोडक्ट। हर 4 घंटे लॉग करो। ट्रेंड देखो।'}},

/* 10 ─ Safety */
{id:'ch4-safety',cat:'field',em:'🧤',title:{en:'Safety with chemicals',hi:'केमिकल के साथ सुरक्षा'},
 lines:[
  {v:{k:'cards',items:[{i:'📘',title:{en:'Read the SDS first',hi:'पहले SDS पढ़ें'},en:'SDS or MSDS for every chemical',hi:'हर केमिकल का SDS या MSDS',tone:'ok'}]},shot:'Speech bubble "Read the SDS before handling chemicals"; SDS folder.',en:'Read the SDS before handling any chemical. Review the SDS or MSDS for every chemical.',hi:'कोई भी केमिकल छूने से पहले SDS पढ़ें। हर केमिकल का SDS या MSDS देखें।'},
  {v:{k:'board',items:[{i:'🧤',en:'Chemical-resistant gloves',hi:'केमिकल-रेज़िस्टेंट दस्ताने'},{i:'🥽',en:'Goggles, face shield',hi:'चश्मा, फ़ेस शील्ड'},{i:'🥼',en:'Protective clothing',hi:'सुरक्षा कपड़े'},{i:'🏷️',en:'Labelled containers',hi:'लेबल वाले कंटेनर'},{i:'🌬️',en:'Ventilation',hi:'हवादार जगह'}]},shot:'Gloves, goggles, face shield and coverall on a rack; labelled drums; open window.',en:'Wear chemical-resistant gloves, goggles and protective clothing, and a face shield where there is splash risk. Use labelled containers and suitable ventilation.',hi:'केमिकल-रेज़िस्टेंट दस्ताने, चश्मा और सुरक्षा कपड़े पहनें, छींटे का खतरा हो तो फ़ेस शील्ड भी। लेबल वाले कंटेनर और हवादार जगह इस्तेमाल करें।'},
  {v:{k:'cards',items:[{i:'🛑',title:{en:'Never mix hypo with acid',hi:'हाइपो को एसिड से कभी न मिलाएँ'},en:'Toxic chlorine gas may form',hi:'ज़हरीली क्लोरीन गैस बन सकती है',tone:'bad'},{i:'🚿',title:{en:'Drain and rinse between',hi:'बीच में ड्रेन और रिंस'},en:'Between incompatible chemicals',hi:'असंगत केमिकल के बीच',tone:'warn'},{i:'✅',title:{en:'Approved chemicals only',hi:'सिर्फ़ अप्रूव्ड केमिकल'},en:'Membrane-approved',hi:'मेम्ब्रेन-अप्रूव्ड',tone:'ok'}]},shot:'NaOCl can and HCl can with a red no-mix sign between them.',en:'Keep chemicals separate. Never mix hypochlorite with acids: toxic chlorine gas may form. Drain and rinse between incompatible chemicals. Use only membrane-approved chemicals.',hi:'केमिकल अलग रखें। हाइपोक्लोराइट को एसिड के साथ कभी न मिलाएँ: ज़हरीली क्लोरीन गैस बन सकती है। असंगत केमिकल के बीच ड्रेन और रिंस करें। सिर्फ़ मेम्ब्रेन-अप्रूव्ड केमिकल इस्तेमाल करें।'},
  {v:{k:'board',items:[{i:'🔒',en:'Stop and lock out',hi:'बंद करें और लॉक आउट'},{i:'📟',en:'Release pressure first',hi:'पहले प्रेशर छोड़ें'}]},shot:'Valve with a red lock-out tag; pressure gauge falling to zero before a module is opened.',en:'Isolate and depressurize. Stop and lock out equipment before maintenance. Release pressure before opening modules or piping.',hi:'आइसोलेट और डीप्रेशराइज़ करें। मेंटेनेंस से पहले उपकरण बंद करके लॉक आउट करें। मॉड्यूल या पाइप खोलने से पहले प्रेशर छोड़ें।'},
  {v:{k:'board',items:[{i:'🔩',en:'CIP valves: approved path',hi:'CIP वाल्व: अप्रूव्ड पाथ'},{i:'🛑',en:'Never pump against closed valves',hi:'बंद वाल्व पर पंप न चलाएँ',bad:true}]},shot:'CIP valves set on the P&ID path; red cross over a pump running into a closed valve.',en:'Set the CIP valves to the approved flow path. Never pump against closed valves.',hi:'CIP वाल्व अप्रूव्ड फ्लो पाथ पर सेट करें। बंद वाल्व के खिलाफ़ कभी पंप न चलाएँ।'},
  {v:{k:'board',items:[{i:'🚿',en:'Drain preservative, flush',hi:'प्रिज़र्वेटिव निकालें, फ्लश'},{i:'🧺',en:'First rinse to approved waste',hi:'पहला रिंस अप्रूव्ड वेस्ट में'}]},shot:'Rinse water running to a waste channel with the sign "Rinse water to waste".',en:'Rinse before use. Drain the preservative and flush before start-up. Divert the initial rinse water to approved waste handling.',hi:'इस्तेमाल से पहले रिंस करें। स्टार्ट-अप से पहले प्रिज़र्वेटिव निकालें और फ्लश करें। शुरू का रिंस पानी अप्रूव्ड वेस्ट हैंडलिंग में भेजें।'},
  {v:{k:'board',items:[{i:'🧪',en:'Check pH and residuals',hi:'pH और रेज़िड्यूअल जाँचें'}]},shot:'pH meter and residual test on the filtrate before the valve to service opens.',en:'Verify acceptable pH and chemical residuals before using the filtrate.',hi:'फ़िल्ट्रेट इस्तेमाल करने से पहले pH और केमिकल रेज़िड्यूअल ठीक हैं यह जाँचें।'},
  {v:{k:'board',items:[{i:'🧪',en:'pH limit',hi:'pH लिमिट'},{i:'🧫',en:'Chlorine limit',hi:'क्लोरीन लिमिट'},{i:'📟',en:'Pressure limit',hi:'प्रेशर लिमिट'},{i:'🌡️',en:'Temperature limit',hi:'तापमान लिमिट'}]},shot:'Protect the membrane panel: limits card for pH, chlorine, pressure and temperature.',en:'Protect the membrane. Follow the approved pH, chlorine, pressure and temperature limits.',hi:'मेम्ब्रेन बचाएँ। अप्रूव्ड pH, क्लोरीन, प्रेशर और तापमान की लिमिट फ़ॉलो करें।'},
  {v:{k:'range',label:'Membrane temperature',unit:'°C',min:0,max:50,value:35,zones:[{to:40,c:'ok',en:'Up to 40 °C',hi:'40 °C तक'},{to:50,c:'bad',en:'Above 40: not allowed',hi:'40 से ऊपर: मना'}]},shot:'Thermometer with "Max 40 °C (104 °F)" beside a membrane module; red cross over neutralizing inside the module.',en:'The supplied Q-SEP procedure allows a maximum of 40 degrees Celsius, that is 104 Fahrenheit. Avoid sudden temperature changes. Never neutralize chemicals inside the modules.',hi:'दिए गए Q-SEP प्रोसीजर में ज़्यादा से ज़्यादा 40 डिग्री सेल्सियस, यानी 104 फ़ारेनहाइट। तापमान अचानक न बदलें। मॉड्यूल के अंदर केमिकल कभी न्यूट्रलाइज़ न करें।'},
  {v:{k:'board',items:[{i:'👁️',en:'Eyewash accessible',hi:'आईवॉश पास में'},{i:'🚿',en:'Emergency shower accessible',hi:'इमरजेंसी शावर पास में'}]},shot:'Emergency eyewash and shower station with green signs.',en:'Spills and emergencies. Keep the eyewash and emergency shower accessible.',hi:'स्पिल और इमरजेंसी। आईवॉश और इमरजेंसी शावर तक पहुँच खुली रखें।'},
  {v:{k:'board',items:[{i:'🩹',en:'Exposure: SDS first aid, doctor',hi:'संपर्क: SDS फ़र्स्ट एड, डॉक्टर'},{i:'🏃',en:'Fumes or big spill: withdraw, alert',hi:'धुआँ या बड़ा स्पिल: हटें, बताएँ'}]},shot:'Operator rinses at the eyewash and calls a doctor; another steps back from fumes and alerts responders.',en:'For exposure, follow the SDS first aid and seek medical assistance. For fumes or a major spill, withdraw and alert trained responders.',hi:'केमिकल लग जाए तो SDS का फ़र्स्ट एड फ़ॉलो करें और डॉक्टर की मदद लें। धुआँ या बड़ा स्पिल हो तो वहाँ से हटें और ट्रेंड रिस्पॉन्डर को बताएँ।'},
  {v:{k:'board',items:[{i:'📒',en:'Keep SDS and chemical records',hi:'SDS और केमिकल रिकॉर्ड रखें'},{i:'♻️',en:'Dispose via approved site waste system',hi:'अप्रूव्ड साइट वेस्ट सिस्टम से निपटान'}]},shot:'SDS folder on the wall; spent solution drum going to the site waste system.',en:'Keep the SDS and chemical records available. Dispose of preservative and spent cleaning solutions through the approved site waste system.',hi:'SDS और केमिकल रिकॉर्ड उपलब्ध रखें। प्रिज़र्वेटिव और इस्तेमाल हुआ क्लीनिंग घोल अप्रूव्ड साइट वेस्ट सिस्टम से ही निपटाएँ।'},
  {v:{k:'board',items:[{i:'📘',en:'Limits are membrane-specific: check manual',hi:'लिमिट हर मेम्ब्रेन की अलग: मैनुअल देखें'},{i:'🛡️',en:'Follow SDS, SOP, supplier limits',hi:'SDS, SOP, सप्लायर लिमिट फ़ॉलो'}]},shot:'Footnote "temperature and chemical limits are membrane-specific"; bottom banner "Protect people and membranes"; Ritu gives a thumbs up.',en:'Temperature and chemical limits are membrane-specific, so confirm the approved manual. Protect people and membranes: follow the SDS, the site SOP and the membrane supplier limits.',hi:'तापमान और केमिकल की लिमिट हर मेम्ब्रेन की अलग होती है, इसलिए अप्रूव्ड मैनुअल देखें। लोगों और मेम्ब्रेन की सुरक्षा करें: SDS, साइट SOP और मेम्ब्रेन सप्लायर की लिमिट फ़ॉलो करें।'}],
 activity:{type:'multi',prompt:{en:'Before you handle CIP chemicals, tap everything you must do.',hi:'CIP केमिकल संभालने से पहले जो-जो ज़रूरी है, सब टैप करें।'},options:[{i:'📘',en:'Read the SDS',hi:'SDS पढ़ें',ok:true},{i:'🧤',en:'Wear gloves and goggles',hi:'दस्ताने और चश्मा पहनें',ok:true},{i:'⚗️',en:'Mix hypo and acid to save time',hi:'समय बचाने के लिए हाइपो और एसिड मिलाएँ',ok:false},{i:'🔒',en:'Lock out and release pressure',hi:'लॉक आउट करें और प्रेशर छोड़ें',ok:true},{i:'🔩',en:'Pump against closed valves',hi:'बंद वाल्व पर पंप चलाएँ',ok:false},{i:'👁️',en:'Check the eyewash is accessible',hi:'आईवॉश तक पहुँच देखें',ok:true}]},
 remember:{en:'Read the SDS. Never mix hypo and acid. Lock out and release pressure first.',hi:'SDS पढ़ो। हाइपो और एसिड कभी न मिलाओ। पहले लॉक आउट, प्रेशर छोड़ो।'}},

/* 11 ─ Quiz */
{id:'ch4-quiz',cat:'quiz',em:'🏆',title:{en:'Final quiz',hi:'फ़ाइनल क्विज़'},
 lines:[{v:{k:'trophy'},shot:'Trophy and badge; presenter gives thumbs up.',en:'Nine quick questions. Tap the right answer. Let us see what you remember!',hi:'नौ छोटे सवाल। सही जवाब टैप करें। देखें आपको क्या याद है!'}],
 questions:[
  {q:{en:'What passes through the UF membrane?',hi:'UF मेम्ब्रेन से क्या निकल जाता है?'},o:[{i:'💧',en:'Water and dissolved salts',hi:'पानी और घुले हुए नमक',ok:true},{i:'🦠',en:'Bacteria',hi:'बैक्टीरिया'},{i:'🟤',en:'Suspended solids',hi:'सस्पेंडेड सॉलिड्स'}]},
  {q:{en:'What is the feed pH limit for UF?',hi:'UF के लिए फ़ीड pH की लिमिट क्या है?'},o:[{i:'🧪',en:'5 to 9',hi:'5 से 9',ok:true},{i:'🧪',en:'2 to 4',hi:'2 से 4'},{i:'🧪',en:'10 to 12',hi:'10 से 12'}]},
  {q:{en:'What is the feed turbidity limit?',hi:'फ़ीड टर्बिडिटी की लिमिट क्या है?'},o:[{i:'🥛',en:'Up to 100 NTU',hi:'100 NTU तक',ok:true},{i:'🥛',en:'Up to 1000 NTU',hi:'1000 NTU तक'},{i:'🥛',en:'Up to 1 NTU',hi:'1 NTU तक'}]},
  {q:{en:'How often do you log routine UF readings?',hi:'रूटीन UF रीडिंग कितनी बार लॉग करते हैं?'},o:[{i:'⏱️',en:'Every 4 hours',hi:'हर 4 घंटे',ok:true},{i:'📅',en:'Once a week',hi:'हफ़्ते में एक बार'},{i:'📅',en:'Once a month',hi:'महीने में एक बार'}]},
  {q:{en:'Feed 1.30, reject 1.10, product 0.20 bar. TMP is?',hi:'फ़ीड 1.30, रिजेक्ट 1.10, प्रोडक्ट 0.20 bar। TMP कितना?'},o:[{i:'📟',en:'1.00 bar',hi:'1.00 bar',ok:true},{i:'📟',en:'2.40 bar',hi:'2.40 bar'},{i:'📟',en:'0.20 bar',hi:'0.20 bar'}]},
  {q:{en:'TMP rises while flow stays the same. What may it mean?',hi:'फ्लो वही है पर TMP बढ़ रहा है। इसका क्या मतलब हो सकता है?'},o:[{i:'📈',en:'Membrane resistance is increasing',hi:'मेम्ब्रेन का रेज़िस्टेंस बढ़ रहा है',ok:true},{i:'✨',en:'The membrane is getting cleaner',hi:'मेम्ब्रेन और साफ़ हो रही है'},{i:'😴',en:'Nothing, ignore it',hi:'कुछ नहीं, छोड़ दो'}]},
  {q:{en:'In CIP, what must you do before the acid stage?',hi:'CIP में एसिड स्टेज से पहले क्या ज़रूरी है?'},o:[{i:'🚿',en:'Drain, rinse and verify chlorine removal',hi:'ड्रेन, रिंस और क्लोरीन हटना जाँचो',ok:true},{i:'⚗️',en:'Add acid to the hypo solution',hi:'हाइपो घोल में एसिड डालो'},{i:'🌡️',en:'Heat the solution above 40 °C',hi:'घोल 40 °C से ऊपर गरम करो'}]},
  {q:{en:'During a shutdown, the membranes must be?',hi:'शटडाउन के दौरान मेम्ब्रेन कैसी रहनी चाहिए?'},o:[{i:'💧',en:'Kept wet and filled',hi:'गीली और भरी हुई',ok:true},{i:'☀️',en:'Dried in the sun',hi:'धूप में सुखाई हुई'},{i:'🌬️',en:'Drained and open to air',hi:'खाली और हवा में खुली'}]},

  $$('.opt',body).forEach(b=>b.onclick=()=>{ if(b.dataset.side==='l'){ $$('.opt[data-side="l"]',body).forEach(x=>x.classList.remove('on')); b.classList.add('on'); sel=+b.dataset.i; return } if(sel===null){ Speech.say(t('tapPair'), cur()); return } const i=+b.dataset.i; const lb=$(`.opt[data-side="l"][data-i="${sel}"]`,body); if(i===sel){ b.classList.add('right'); b.disabled=true; lb.classList.remove('on'); lb.classList.add('right'); lb.disabled=true; sel=null; done++; if(done===n) feedback(true, t('allRight')); else Speech.say(t('correct'), cur()) } else { b.classList.add('wrong'); setTimeout(()=>b.classList.remove('wrong'),600); feedback(false) } }) },
 calc(act, body){ const F={ tss:v=>(v.w2-v.w1)*1000/v.vol, bod:v=>(v.do1-v.do2)*v.df };
  body.innerHTML = `<div class="calc">${act.fields.map(f=>`<label class="field"><span>${esc(L(f.label))}</span><input type="number" inputmode="decimal" id="f_${f.id}" value="${f.val}" step="${f.step||'any'}"></label>`).join('')}<div class="actbtns"><button class="btn primary" id="btnCalc">🧮 ${esc(t('calc'))}</button></div><div class="calcout" id="calcout" hidden></div><p class="hint">${esc(t('tryNumbers'))}</p></div>`;
  let first=true;
  $('#btnCalc',body).onclick=()=>{ const v={}; let bad=false; act.fields.forEach(f=>{ const x=parseFloat($('#f_'+f.id,body).value); if(!isFinite(x)) bad=true; v[f.id]=x }); if(bad) return; const r = act.expr ? safeExpr(act.expr, v) : (F[act.fn] ? F[act.fn](v) : NaN); if(!isFinite(r)) return; const val=Math.round(r*10)/10; const out=$('#calcout',body); out.hidden=false; out.innerHTML=`<span class="res">${esc(act.name)} = ${val} ${esc(act.unit||'')}</span>`; if(first){ first=false; feedback(true, `${act.name} = ${val} ${act.unit||''}`, t('correct')) } else Speech.say(t('correct'), cur()) } },
 slider(act, body){ body.innerHTML = `<div class="sliderbox"><div id="tankbox">${SV.tank({value:2.2,range:true})}</div><label class="rng"><span>${esc(t('moveSlider'))}</span><input type="range" id="dorng" min="0" max="5" step="0.1" value="2.2" aria-label="DO"></label></div><div class="opts">${act.options.map((o,i)=>optBtn(o,i)).join('')}</div>`;
  $('#dorng',body).oninput=e=>{ $('#tankbox',body).innerHTML=SV.tank({value:+e.target.value,range:true}) }; singleChoice(act, body, act.options) },
 settle(act, body){ body.innerHTML = `<div class="settlebox"><div class="cylbig" id="cylbig">${SV.cyl({sludge:1,mixed:true},210)}</div><div class="timer" id="stimer">0 ${esc(t('minutes'))}</div><div class="actbtns"><button class="btn primary" id="btnStart">▶ ${esc(t('startTest'))}</button></div></div><div class="opts" id="settleopts" hidden>${act.options.map((o,i)=>optBtn(o,i)).join('')}</div>`;
  $('#btnStart',body).onclick=()=>{ const btn=$('#btnStart',body); btn.disabled=true; Speech.say(t('watching'), cur()); const t0=performance.now(), dur=5000; const box=$('#cylbig',body); const tm=$('#stimer',body);
   const tick=()=>{ const p=Math.min(1,(performance.now()-t0)/dur); const e=1-Math.pow(1-p,2); const sl=1-0.7*e; box.innerHTML=SV.cyl({sludge:sl},210); tm.textContent=`${Math.round(p*30)} ${t('minutes')}`; if(p<1) requestAnimationFrame(tick); else { $('#settleopts',body).hidden=false; btn.parentNode.hidden=true; Speech.say(L(act.prompt), cur()) } };
   requestAnimationFrame(tick) };
  singleChoice(act, $('#settleopts',body), act.options) },
 spot(act, body){ body.innerHTML = `<p class="hint">${esc(t('tapOil'))}</p><div class="spotbox">${SV.oil({spot:true})}</div>`;
  $$('.hot',body).forEach(h=>h.addEventListener('click',()=>{ if(h.dataset.ok==='1'){ h.classList.add('right'); $$('.hot',body).forEach(x=>x.style.pointerEvents='none'); feedback(true) } else { h.classList.add('wrong'); setTimeout(()=>h.classList.remove('wrong'),600); feedback(false) } })) }
};
function startActivity(){ const ls=LS()[state.scene]; state.phase='act'; state.paused=false; if(ls.questions){ startQuiz(); return }
 const act=ls.activity; const box=$('#act'); box.hidden=false; $('#stage').hidden=true; $('#done').hidden=true;
 if(!act || !ACT[act.type]){ activityDone(); return }
 box.innerHTML = `<div class="acthead"><span class="chip turn">✋ ${esc(t('yourTurn'))}</span><h3>${esc(L(act.prompt))}</h3></div><div class="actbody" id="actbody"></div><div class="fb" id="fb" hidden></div>`;
 setCaption(L(act.prompt)); try{ ACT[act.type](act, $('#actbody',box)) }catch(e){ activityDone(); return } updateControls(); updateProgress(); Speech.say(L(act.prompt), cur());
}
function nextLabel(){ return state.scene+1 < LS().length ? t('next') : t('backLib') }
function nextScene(){ if(state.scene+1 < LS().length) openScene(state.scene+1); else openChapter(state.chapter) }
function activityDone(){ const ls=LS()[state.scene]; state.phase='done'; markDone(ls.id); const d=$('#done'); d.hidden=false; $('#act').hidden=true;
 const rem = ls.remember ? L(ls.remember) : '';
 d.innerHTML = `${rem?`<div class="rem"><span class="chip rem">💡 ${esc(t('remember'))}</span><p>${esc(rem)}</p></div>`:''}<div class="donebtns"><span class="chip ok">✓ ${esc(t('sceneDone'))}</span><button class="btn primary big" id="btnNext">${esc(nextLabel())} ›</button></div>`;
 $('#btnNext').onclick=nextScene; if(rem) setCaption(rem); updateControls(); updateProgress(); if(rem) Speech.say(rem, cur());
}
/* ---- quiz ---- */
function startQuiz(){ state.q=0; state.scoreN=0; state.phase='act'; renderQ() }
function renderQ(){ const ls=LS()[state.scene]; const n=ls.questions.length; if(state.q>=n){ quizEnd(); return } const q=ls.questions[state.q]; const box=$('#act'); box.hidden=false; $('#stage').hidden=true; $('#done').hidden=true;
 box.innerHTML = `<div class="acthead"><span class="chip turn">${esc(t('question'))} ${state.q+1} / ${n}</span><h3>${esc(L(q.q))}</h3></div><div class="actbody"><div class="opts">${q.o.map((o,i)=>optBtn(o,i)).join('')}</div></div><div class="fb" id="fb" hidden></div>`;
 let answered=false;
 $$('.opt',box).forEach(b=>b.onclick=()=>{ if(answered) return; answered=true; const o=q.o[+b.dataset.i]; $$('.opt',box).forEach(x=>x.disabled=true); if(o.ok){ b.classList.add('right'); state.scoreN++ } else { b.classList.add('wrong'); const r=q.o.findIndex(x=>x.ok); if(r>=0) $$('.opt',box)[r].classList.add('right') } const fb=$('#fb',box); fb.hidden=false; fb.className='fb '+(o.ok?'good':'bad'); fb.textContent=o.ok?t('correct'):t('wrong'); Speech.say(fb.textContent, cur(), ()=>{ state.q++; renderQ() }) });
 setCaption(L(q.q)); updateControls(); updateProgress(); Speech.say(L(q.q), cur());
}
function quizEnd(){ const ch=CH(); const ls=LS()[state.scene]; const n=ls.questions.length; const s=state.scoreN; const pass = s>=Math.ceil(n*0.7); if(state.best[ch.id]==null || s>state.best[ch.id]){ state.best[ch.id]=s; save('wt_best',state.best) } markDone(ls.id); state.phase='done';
 const d=$('#done'); $('#act').hidden=true; $('#stage').hidden=true; d.hidden=false; let date=''; try{ date=new Date().toLocaleDateString(langInfo(cur()).tts,{day:'2-digit',month:'short',year:'numeric'}) }catch(e){ date=new Date().toDateString() }
 d.innerHTML = `<div class="result ${pass?'pass':'fail'}"><span class="big">${pass?'🏅':'💪'}</span><div class="scoreline">${esc(t('score'))}: <b>${s} / ${n}</b></div><h3>${esc(pass?t('badge'):t('fail'))}</h3><p class="hint">${esc(t('chapter'))} ${esc(ch.num)} · ${esc(L(ch.title))}</p>${pass?`<p class="cert">${esc(t('showSup'))}<br><small>${esc(t('date'))}: ${esc(date)}</small></p>`:''}<div class="donebtns"><button class="btn" id="btnRetry">↻ ${esc(t('retryQuiz'))}</button><button class="btn primary" id="btnHome2">${esc(t('backLib'))} ›</button></div></div>`;
 $('#btnRetry').onclick=startQuiz; $('#btnHome2').onclick=goLibrary; const scoreSay = cur()==='hi' ? `${n} में से ${s}` : `${s} / ${n}`; setCaption(`${pass?t('pass'):t('fail')} ${t('score')}: ${scoreSay}`); updateControls(); updateProgress(); Speech.say(pass?t('pass'):t('fail'), cur());
}

/* ============ Production script tab ============ */
const ACTNAME = {order:'tap the steps in order',multi:'tap all that apply',choice:'tap the right answer',classify:'sort readings into Low / OK / High',slider:'explore the DO slider, then answer',settle:'run the settling animation, then pick a cylinder',match:'match observation to action',calc:'enter numbers and calculate',spot:'tap the oil on the tank image'};
function scriptText(ch, lang){ const out=[]; const X = s => (typeof s==='string') ? s : (s[lang]!==undefined ? s[lang] : (Packs.tr(lang, s.en) || s.en)); out.push(`CHAPTER ${ch.num} — ${X(ch.title)}`); ch.lessons.forEach((l,i)=>{ out.push(`SCENE ${i+1} — ${X(l.title)} [${UI.en[l.cat]}]`); l.lines.forEach((ln,j)=>{ out.push(`  ${i+1}.${j+1}  VISUAL: ${ln.shot||''}`); out.push(`       SAY: ${X(ln)}`) }); if(l.questions){ out.push(`  CHECKPOINT (quiz):`); l.questions.forEach(q=>out.push(`       Q: ${X(q.q)}  →  ${q.o.filter(o=>o.ok).map(o=>X(o)).join(', ')}`)) } else if(l.activity){ out.push(`  CHECKPOINT (${ACTNAME[l.activity.type]||l.activity.type}): ${X(l.activity.prompt)}`) } if(l.remember) out.push(`  REMEMBER CARD: ${X(l.remember)}`); out.push('') }); return out.join('\n') }
function renderScript(){ const s=$('#script'); const ci = Math.max(0, Math.min(CHAPTERS.length-1, state.scriptCh)); const ch=CHAPTERS[ci]; const other = (cur()!=='en' && cur()!=='hi') ? cur() : null;
 const card = (title, icon, items) => `<div class="bcard"><h3><span class="em">${icon}</span>${esc(title)}</h3><ul>${items.map(x=>`<li>${esc(x)}</li>`).join('')}</ul></div>`;
 const pipeline = `<div class="pipeline"><div class="pstep"><span class="em">🧠</span><b>Claude</b><small>Script, visuals, checkpoints, translations, this module</small></div><span class="parrow">›</span><div class="pstep"><span class="em">🗣️</span><b>Voice (Sarvam Bulbul v3, "ritu")</b><small>Every line recorded per language</small></div><span class="parrow">›</span><div class="pstep"><span class="em">🧑‍🔧</span><b>Avatar agent</b><small>Renders Ritu per shot to the recorded track</small></div><span class="parrow">›</span><div class="pstep"><span class="em">📱</span><b>Delivery</b><small>GitHub Pages, LMS, WhatsApp, toolbox talk</small></div></div>`;
 const chsel = `<div class="chsel">${CHAPTERS.map((c,i)=>`<button class="btn${i===ci?' primary':''}" data-i="${i}">${esc(t('chapter'))} ${esc(c.num)}</button>`).join('')}</div>`;
 const tr = (s)=> other ? (Packs.tr(other, s.en) || '') : '';
 const rows = ch.lessons.map((l,i)=>{ const shots=l.lines.map((ln,j)=>`<tr><td class="n">${i+1}.${j+1}</td><td class="shot">${esc(ln.shot||'')}</td><td class="en">${esc(ln.en)}</td><td class="hi">${esc(ln.hi)}</td>${other?`<td class="hi">${esc(tr(ln))}</td>`:''}</tr>`).join('');
  const cp = l.questions ? `<tr class="cp"><td class="n">✋</td><td class="shot">Checkpoint: quiz, ${l.questions.length} questions, 70% to pass</td><td class="en">${l.questions.map(q=>esc(q.q.en)).join('<br>')}</td><td class="hi">${l.questions.map(q=>esc(q.q.hi)).join('<br>')}</td>${other?`<td class="hi">${l.questions.map(q=>esc(tr(q.q))).join('<br>')}</td>`:''}</tr>` : (l.activity ? `<tr class="cp"><td class="n">✋</td><td class="shot">Checkpoint: ${esc(ACTNAME[l.activity.type]||l.activity.type)}</td><td class="en">${esc(l.activity.prompt.en)}</td><td class="hi">${esc(l.activity.prompt.hi)}</td>${other?`<td class="hi">${esc(tr(l.activity.prompt))}</td>`:''}</tr>` : '');
  const rem = l.remember ? `<tr class="rem"><td class="n">💡</td><td class="shot">Remember card, end slate, 3 s</td><td class="en">${esc(l.remember.en)}</td><td class="hi">${esc(l.remember.hi)}</td>${other?`<td class="hi">${esc(tr(l.remember))}</td>`:''}</tr>` : '';
  const words = l.lines.reduce((a,ln)=>a+ln.en.split(/\s+/).length,0); const secs = Math.round(words/110*60);
  return `<details class="sc"${i===0?' open':''}><summary><span class="num">${i+1}</span><span class="em">${l.em}</span><span class="ttl">${esc(l.title.en)} <span class="hiTtl">· ${esc(l.title.hi)}</span></span><span class="tag ${l.cat}">${esc(UI.en[l.cat])}</span><span class="dur">${l.lines.length} shots · ~${secs} s narration</span></summary><div class="tw"><table><thead><tr><th>Shot</th><th>Visual / B-roll for the avatar agent</th><th>Narration · English</th><th>Narration · हिंदी (timing master)</th>${other?`<th>Narration · ${esc(langInfo(other).native)}</th>`:''}</tr></thead><tbody>${shots}${cp}${rem}</tbody></table></div></details>` }).join('');
 s.innerHTML = `<section class="brief"><div class="briefhead"><p class="eyebrow">Production pack</p><h1>Avatar video scripts and localization brief</h1><p class="lead">Every scene below is what the Learn tab plays. Hand the shot list to the avatar agent and reuse the recorded Ritu tracks as the voice. Translations for the other nine languages are in the i18n packs and shown here when that language is selected.</p></div>${pipeline}<div class="bgrid">${card('Avatar agent brief','🧑‍🔧',BRIEF.avatar)}${card('Localization agent brief','🌐',BRIEF.localization)}${card('Running it on site','🏭',BRIEF.onsite)}</div></section><section class="scenes"><div class="scenehead"><h2>${esc(t('scriptFor'))} ${esc(t('chapter'))} ${esc(ch.num)} · ${esc(ch.title.en)}</h2><div class="copybtns"><button class="btn" id="cpEn">⧉ ${esc(UI.en.copyEn)}</button><button class="btn" id="cpHi">⧉ ${esc(UI.en.copyHi)}</button>${other?`<button class="btn" id="cpOther">⧉ Copy ${esc(langInfo(other).name)}</button>`:''}</div></div>${chsel}<div id="cpmsg" class="hint" hidden></div><textarea id="cpfallback" class="cpfallback" hidden readonly></textarea>${rows}</section>`;
 $$('.chsel .btn',s).forEach(b=>b.onclick=()=>{ state.scriptCh=+b.dataset.i; renderScript(); window.scrollTo(0, $('.scenes').offsetTop-80) });
 const doCopy = lang => { const txt=scriptText(ch, lang); const msg=$('#cpmsg'); const fb=$('#cpfallback'); const ok=()=>{ msg.hidden=false; msg.textContent=UI.en.copied; fb.hidden=true; setTimeout(()=>{ msg.hidden=true },2500) }; const fail=()=>{ msg.hidden=false; msg.textContent=UI.en.fallbackCopy; fb.hidden=false; fb.value=txt; fb.focus(); fb.select() }; try{ if(navigator.clipboard && navigator.clipboard.writeText){ navigator.clipboard.writeText(txt).then(ok, fail) } else fail() }catch(e){ fail() } };
 $('#cpEn').onclick=()=>doCopy('en'); $('#cpHi').onclick=()=>doCopy('hi'); const co=$('#cpOther'); if(co) co.onclick=()=>doCopy(other);
}

/* ============ Init ============ */
function init(){ Speech.init(); AudioBank.init(); $$('.avwrap').forEach(a=>{ a.innerHTML=SV.avatar() }); renderChrome(); bindControls();
 ['touchend','click'].forEach(ev=>document.addEventListener(ev, ()=>AudioBank.unlock(), {once:true, capture:true}));
 const start = ()=>{ const h=(location.hash||'').replace('#',''); const ci=CHAPTERS.findIndex(c=>c.id===h); if(ci>=0){ state.chapter=ci; state.phase='chapter'; renderChapter() } else renderLibrary() };
 if(state.lang && !Packs.has(state.lang)){ Packs.load(state.lang).then(start) } else start();
 window.addEventListener('hashchange',()=>{ const h=(location.hash||'').replace('#',''); const ci=CHAPTERS.findIndex(c=>c.id===h); if(ci>=0 && ci!==state.chapter) openChapter(ci); else if(!h && state.phase!=='library') goLibrary() });
}
if(document.readyState==='loading') document.addEventListener('DOMContentLoaded', init); else init();
})();

</script>
</body></html>
